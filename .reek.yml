# Reek configuration — keeps the signal high on a small Rails app.
# Reek runs advisory-only in CI (the `code_quality` job in
# .github/workflows/ci.yml), on changed files. These overrides silence
# Rails-idiomatic patterns that aren't real smells; the value is catching
# genuine god-objects / over-long methods in new code.
detectors:
  IrresponsibleModule:
    enabled: false        # don't demand a descriptive comment on every class/module
  TooManyStatements:
    max_statements: 8     # controller actions run a few lines; reek's default is 5
    exclude:
      - Walkthrough::Yellow   # data builders (e.g. compute_best_catches) assemble one
                              # cohesive result in a linear pass; see the data-source note.
  NestedIterators:
    exclude:
      - Walkthrough::Yellow   # iterating locations -> encounters, and transform_values
                              # -> map over the manifest, are inherent 2-deep passes in a
                              # data source, not a control-flow smell.
  TooManyInstanceVariables:
    max_instance_variables: 7
    exclude:
      - PagesController   # the landing action assembles cohesive page state (hero,
                          # features, cities, roadmap...) — a view-model for one
                          # template, not a god object.
  TooManyConstants:
    exclude:
      - LandingData       # single source of truth for the page's demo content;
                          # each constant is a distinct cohesive section, not a
                          # god object.
      - Walkthrough::Yellow   # data source: dex names, leg defs, sprite maps —
                              # each a distinct lookup table, not a god object.
      - Walkthrough::Evolutions   # the five stone names, the row table transcribed
                                  # from evos_moves.asm, and the three indexes built
                                  # off it. All one cohesive lookup.
      - Walkthrough        # the namespace itself: a handful of small shared tables the
                           # Data structs below read (map categories, method unlock stops,
                           # the encounter-section order). Each belongs to the module rather
                           # than to any one struct, so there is nowhere better to put them.
  UncommunicativeVariableName:
    accept:
      - i                 # plain loop index in the grid/box builders
      - l                 # plain element var in the legs/locations finders
      - x                 # a map point is (x, y); anything longer reads worse
      - y
    exclude:
      - Walkthrough::Yellow   # see the data-builder note below
  # Walkthrough::Yellow is a pure data source (like LandingData): terse builders
  # whose positional args map 1:1 to Data struct fields, named for the game's own
  # routes (route_1/2/22) and steps (n). Not real smells in a data-entry DSL.
  LongParameterList:
    exclude:
      - Walkthrough::Yellow
      - Walkthrough::Challenge  # every builder derives one slice of a page's plan from the
                                # same four facts (the game, the leg, the species already on
                                # the page, the roster owed by now). Collapsing them into a
                                # context object would only rename the same four.
      - Walkthrough::Location   # Data.define cannot declare default values, so this
                                # initialize is a defaults shim that forwards to super.
                                # Its keywords are the optional subset of the struct's
                                # own members, not a call signature; collapsing them
                                # would force all 17 fields at every call site.
      - Walkthrough::AreaMap    # same defaults shim: a drawn floor is optional almost throughout
                                # (a map borrowed by another stop has a title, a maze or a boulder
                                # floor has a route and the kind of line it is), so the keywords
                                # are the struct's own optional members rather than a call
                                # signature to collapse.
      - Walkthrough::CatchPanel # same defaults shim: a Safari explainer panel tabulates whichever
                                # of steps/calc/items/flee/cards it happens to have, so the
                                # keywords are the struct's own optional members. Naming them all
                                # at three call sites is the alternative, not an improvement.
      - Walkthrough::Place      # same defaults shim: its keywords are the place's own
                                # optional members, each defaulting to "the game says nothing
                                # about this", so a caller states only the facts it has.
      - Walkthrough::Encounter  # same defaults shim: a plain wild card states none of the gift
                                # keywords (who hands it over, what unlocks it, which badge the
                                # game gates it behind), so each is an optional member the common
                                # case omits, not a call signature.
      - Walkthrough::Trainer    # same defaults shim: a roster card states none of the authored
                                # keywords (a curated note, a hand-set pin letter), and a boss met
                                # in a scripted scene has no floor in the game's roster, so each is
                                # an optional member the other case omits.
      - Walkthrough::MapMarker  # same defaults shim: its keywords are the marker's own
                                # optional members (key/glyph/edge/lane/note), each named
                                # so a caller can omit it, not a call signature.
      - Walkthrough::Step       # same defaults shim: a plain beat names no pins, sits on no
                                # particular map, shows no dex screen and walks no stretch of a
                                # drawn route, so each keyword is an optional member the common
                                # case omits.
      - Walkthrough::BestCatch  # same defaults shim: a sole appearance states no runner-up and
                                # a ranked one states no only/armed_only flag, so every keyword
                                # is an optional member the other case omits.
      - Walkthrough::MartItem   # same defaults shim: an item states only the facts it has
                                # (a TM its number/move/type, a pick its rec note), each
                                # keyword the struct's own optional member.
      - Walkthrough::Mart       # same defaults shim: a town counter states none of the
                                # department-store keywords (floors, a rooftop trade section,
                                # its own buy note), so each is an optional member the plain
                                # case omits, not a call signature.
      - ApplicationHelper#progress_slot  # `kind:` is which set of ticks the slot counts, and it
                                # defaults to the one every caller but the rooftop trades wants.
                                # An optional switch on a two-argument helper, not a clump.
      - Walkthrough::MartFloor  # same defaults shim: a store floor omits what it lacks
                                # (a note, a gift, trades), so its keywords are the floor's
                                # own optional members, not a call signature.
      - Walkthrough::Trivia     # same defaults shim: a section states only the pieces it has,
                                # since one carries artwork and another a screenshot, one names
                                # the pin its prose points at and another names none, and only
                                # one so far has a rule loud enough to warn about.
  BooleanParameter:
    exclude:
      - Walkthrough::Yellow   # `tip:` is an optional flag in the encounter builder
      - Walkthrough::BestCatch   # `tie:` / `only:` describe the record, they steer nothing;
                                 # same defaults shim as Walkthrough::Location below.
      - Walkthrough::MartItem    # `rec:` describes the item (is it a flagged pick), it steers
                                 # nothing; same record-describing flag as BestCatch above.
      - Walkthrough::Location#initialize   # `gym_finale:` describes the stop (does its gym close
                                           # the whole leg, or sit inside this band), it steers
                                           # nothing here; same defaults shim as BestCatch, and
                                           # the same shim already excluded under LongParameterList.
      - Assets::R2Uploader#call   # `force:` is an intended optional switch on the upload API
                                  # (re-send everything vs only changed), defaulting off.
      - Walkthrough::LeagueMember#initialize   # `numeral_right:` describes the plate (does its
                                               # roman numeral read better on the far side of the
                                               # stage), it steers nothing here; same defaults
                                               # shim as Location#initialize above.
  DataClump:
    exclude:
      - Walkthrough   # Data.define cannot declare defaults, so a struct with optional members
                      # needs an initialize that names them and forwards **rest. Item,
                      # HiddenItem and Trainer are all tickable, so all three shims carry
                      # `tick:`; that shared keyword is the struct's own member, not an
                      # argument list crying out to be an object.
  ControlParameter:
    exclude:
      - Walkthrough::Yellow
      - Walkthrough::Location#initialize   # `title` steers no branch: it is the struct's own
                                           # optional member, defaulting to the stop's `name`
                                           # when a caller states no separate page title. Same
                                           # defaults shim already excluded under
                                           # LongParameterList and BooleanParameter.
      - Walkthrough::Challenge   # `dex` in the encounter finders is the value being looked up,
                                 # not a flag steering a branch; every one of them is a query
                                 # over the game's tables.
      - Assets::R2Uploader#call   # `force` is a caller-facing switch on the upload API (re-send
                                  # every image vs only the changed ones), an intended option, not
                                  # a hidden flag threaded through to pick a private branch.
  UncommunicativeMethodName:
    exclude:
      - Walkthrough::Yellow
  UncommunicativeParameterName:
    exclude:
      - Walkthrough::Yellow
  UtilityFunction:
    enabled: false        # stateless helpers/mappers are normal in Rails
  FeatureEnvy:
    enabled: false        # attribute mappers legitimately lean on a param
  NilCheck:
    enabled: false        # `return if x.nil?` guard clauses are idiomatic Ruby
  DuplicateMethodCall:
    enabled: false        # noisy on view/controller idioms
  MissingSafeMethod:
    enabled: false        # bang methods wrap AR update!/save! (no non-raising twin)
  InstanceVariableAssumption:
    enabled: false        # Rails action methods (`def home; @x = ...`) pass state to
                          # the template — reek's "assumes too much" lint is
                          # structurally wrong for every controller action.

exclude_paths:
  - bin
  - config
  - db
  - tmp
  - vendor
