    yellow:
      marquee:
        - "PALLET → CAMPEÃO"
        - "ROTA DE CAPTURAR TUDO"
        - "DESAFIO OAK EMBUTIDO"
        - "CADA PARADA DE KANTO"
      hero:
        badge: "GEN 1 · KANTO · GUIA 01"
        lead: "Um guia sem enrolação, de capturar tudo, por toda Kanto. Só o que fazer para avançar, e exatamente quais Pokémon dá para capturar em cada passo, marcados direto na sua dex."
      modes:
        eyebrow: "RASTREADORES DE DESAFIO · EXTRAS"
        h2: "Rastreadores de desafio para te ajudar nessa jornada"
        lead: "Duas maneiras divertidas de completar sua Pokédex, andando junto com o guia. Os dois começam desligados. Ligue um e ele acrescenta as próprias quantidades de captura e prazos em cada página de parada; deixe os dois desligados e você tem um guia comum. Os dois só acompanham o que dá para obter em um cartucho só, nada que precise de troca."
        living:
          title: "Capture um de cada espécie, e guarde"
          source_name: "Bulbapedia · Living Pokédex"
          body_html: "O registro na dex não basta: o Pokémon precisa continuar vivo em uma caixa. Essa é a parte <b>living</b>. Evoluir também não resolve: um Rattata que virou Raticate deixa a vaga do Rattata vazia, então você precisa de um de cada, lado a lado."
          example: "Duas capturas, não uma evolução. O mesmo para cada ramo de cada linha."
          stop_pages_html: "<b>Nas páginas de parada:</b> cada local ganha uma quantidade de captura por espécie, na fila onde a taxa de encontro é melhor, e um controle de caixa para as linhas que dá para completar ali."
          species_tag: "O QUE CONTA COMO ESPÉCIE"
          species_body_html: "Em gerações posteriores uma living dex também pode pedir cada gênero, forma ou variante regional. Yellow não tem nada disso: sem diferença de gênero, sem formas alternativas, sem regionais. <b>Um por espécie</b> é a regra inteira aqui, e as outras opções ficam desligadas."
        oak:
          title: "Registre tudo antes do próximo ginásio"
          source_name: "Bulbagarden · Challenge Runs"
          body_html: "Uma regra de ritmo: tudo que estiver ao alcance precisa estar <b>registrado</b> antes de você pegar a insígnia. Isso quer dizer cada captura, e cada evolução que dá para alcançar subindo de nível. Evoluções por pedra e por troca esperam a insígnia que as libera."
          stop_pages_html: "<b>Nas páginas de parada:</b> cada local lista o que ainda deve registro nessa janela, e quais famílias ficam travadas até uma insígnia posterior."
          queue_tag: "EXEMPLO · TUDO QUE SE DEVE ANTES DO BROCK"
          queue_note: "Seu inicial, sete capturas entre as Rotas 1, 2 e 22 e a floresta, e as evoluções que elas alimentam, incluindo a famosa maratona do Pidgeot. Metapod e Pidgeotto valem dos dois jeitos: capture selvagens na floresta, ou evolua até eles. Nidoking e Nidoqueen esperam a Moon Stone no Mt. Moon. Raichu nunca vem: Yellow não tem Pikachu selvagem e seu inicial recusa a Thunder Stone, então ele é só por troca, e a gente só acompanha o que um cartucho sozinho consegue."
      route:
        h2: "Pallet Town → Indigo Plateau"
        lead: "Siga na ordem. Cada parada abre sua própria página com listas de captura, treinadores, itens e mapas de itens ocultos."
      specials:
        eyebrow: "ESPECIAIS · FORA DA LINHA PRINCIPAL"
        h2: "Glitches e páginas extras"
        lead: "Desvios opcionais que não pertencem a uma parada só. Leia os avisos antes de tentar um."
      legs:
        leg_01:
          lead: "O trecho inicial de Kanto. Sua cidade natal e a primeira grama selvagem."
        leg_02:
          lead: "As tarefas de Viridian e as rotas ao redor dela, até o portão da Viridian Forest."
        leg_03:
          lead: "A Boulder Badge do Brock e a subida a leste rumo ao Mt. Moon."
        leg_04:
          lead: "Do Mt. Moon até Cerulean, subindo as rotas da Nugget Bridge até a cabana do Bill, e então de volta para a Misty."
        leg_05:
          lead: "Ao sul de Cerulean até Vermilion City e o Lt. Surge, pelo atalho do Underground Path."
        leg_06:
          lead: "O trecho de grama a leste de Vermilion, levando à boca da Diglett's Cave."
        leg_07:
          lead: "A leste e ao sul de Cerulean rumo ao labirinto escuro do Rock Tunnel."
        leg_08:
          lead: "Do Rock Tunnel a Lavender, depois a oeste até a loja de departamentos de Celadon e o ginásio da Erika."
        leg_09:
          lead: "As rotas de pesca ao sul até Fuchsia, depois a Safari Zone antes do ginásio do Koga."
        leg_10:
          lead: "Descendo a Cycling Road e entrando em Saffron pela Sabrina. Depois de libertar a Silph Co."
        leg_11:
          lead: "O mar aberto ao sul de Fuchsia, rumo às Seafoam Islands."
        leg_12:
          lead: "Os fósseis de Cinnabar e a chave da Pokémon Mansion, depois a Insígnia Volcano do Blaine."
        leg_13:
          lead: "De volta a Viridian, cujo ginásio enfim abriu, pelo Giovanni e a insígnia final."
        leg_14:
          lead: "A estrada com portões de insígnia até a Pokémon League e a Victory Road."
      mew_glitch:
        meta_title: "O Glitch do Mew · Guia de %{game}"
        crumb_cerulean: "CERULEAN"
        crumb_here: "GLITCH DO MEW"
        spares:
          eyebrow: "NÃO DERROTE"
          reminder:
            label: "CAÇANDO MEW?"
            text: "Não derrote estes quatro treinadores. Veja a lista abaixo. ↓"
          title: "Quatro treinadores para deixar de pé"
          standing_label: "AINDA DE PÉ"
          intro: "Você não pode rodar o glitch do Mew até capturar um Abra na Rota 5, bem depois daqui. Continue jogando enquanto isso, mas deixe estes quatro em paz. Cada um é uma peça do glitch, e derrotar qualquer um custa essa etapa."
          state:
            beat: "EU DERROTEI"
            undo: "↺ DESFAZER"
            standing: "ainda de pé ✓"
            lost: "perdido. essa etapa do glitch se foi"
          workaround_tag: "SOLUÇÃO"
          workaround: "Já derrotou um? Só um save anterior o traz de volta. Trazer por troca um Abra que saiba Teleport de outro cartucho pula a espera da Rota 5 por completo."
          cta: "POR QUE CADA UM IMPORTA ▶"
          trainers:
            grass-jr:
              name: "O treinador na grama"
              role: "INICIA O GLITCH"
              where: "Na grama alta da Rota 24, a oeste da Nugget Bridge. Chegue à grama pelo norte para que ele nunca te veja."
            swimmer:
              name: "Primeiro treinador na água"
              role: "DEFINE O NÍVEL DO MEW"
              where: "Ginásio de Cerulean, o primeiro treinador na água à direita. É no Shellder dele que você usa Growl."
            misty:
              name: "Misty"
              role: "BLOQUEIA O SWIMMER"
              where: "A líder do Ginásio de Cerulean. Derrote-a e o Swimmer atrás dela fica fora de alcance para o glitch."
            slowpoke:
              name: "O garoto do Slowpoke"
              role: "SEGUNDO MEW"
              where: "Perto do início da Rota 25, o Youngster com o Slowpoke solitário. Só precisa se você quiser um segundo Mew."
        hero:
          back: "◀ CERULEAN CITY"
          tag: "ESPECIAL · GLITCH"
          game: "POKÉMON YELLOW"
          title_html: "O glitch do <span class=\"pn-mew-hero__word\" data-text=\"Mew\">Mew</span>"
          lead: "Capture o #151 usando apenas um Abra selvagem, o Botão START segurado e um Treinador que nunca chega a batalhar com você. Cerulean City é o lugar limpo mais cedo para fazer isso, antes da Misty, e quase não custa nada."
          card_no: "◈ Nº 151"
          card_species: "NOVA ESPÉCIE"
          art_alt: "Mew, arte de Ken Sugimori"
          credit: "arte de Ken Sugimori · © Nintendo / Creatures / Game Freak"
          card_name: "Mew"
          card_meta: "PSÍQUICO · Nv 7 por padrão"
        facts:
          where:
            label: "ONDE"
            value: "CERULEAN / RT 24"
          earliest:
            label: "MAIS CEDO EM"
            value: "PRÉ-MISTY"
          level:
            label: "NÍVEL DO MEW"
            value: "Nv 7 (1–13)"
          risk:
            label: "RISCO"
            value: "1 NPC PERDIDO"
        short:
          eyebrow: "EM RESUMO · O TRUQUE INTEIRO EM 5 LINHAS"
          h2: "Como funciona"
          lead: "Você interrompe a aproximação de um Treinador com o menu START, dá Teleport no meio do gatilho e deixa outra batalha gravar seus dados no encontro que o jogo ainda te deve. Volte andando e o valor que sobrou aparece como Mew."
        tldr:
          "1":
            title: "Prepare um Treinador"
            text: "Entre no campo de visão do Treinador no mato da Rota 24 segurando START."
          "2":
            title: "Saia de Teleport"
            text: "O Abra te leva para Cerulean antes que ele consiga andar até você. A batalha dele fica na fila."
          "3":
            title: "Quebre os botões"
            text: "Seu menu e o A/B param de responder. Esperado: o jogo está no meio de um encontro."
          "4":
            title: "Lute contra um substituto"
            text: "Vença o Swimmer do Ginásio. O estágio de Ataque do último Pokémon dele vira o nível do Mew."
          "5":
            title: "Volte andando"
            text: "Entre de novo na Rota 24, feche o menu que abre sozinho e o Mew aparece."
        warn:
          badge: "LEIA PRIMEIRO"
          title: "Este glitch apaga um NPC, e é inofensivo."
          lead: "O jogo captura o Mew como se fosse um encontro único do mapa, tipo o Snorlax, então quando a batalha acaba ele tenta apagar o sprite do mapa de onde acha que o Mew veio, para você não lutar de novo. Não existe esse sprite, e nada verifica isso, então o jogo apaga um sprite de uma área por onde você passou antes. Siga a rota abaixo e essa baixa é uma conhecida e inofensiva."
          lose:
            label: "O QUE VOCÊ PERDE"
            text: "O policial que guarda a casa assaltada em Cerulean. Yellow te obriga a passar pelo Bill na Rota 25 para pegar um Abra, então quando você consegue fazer isso o policial já está de plantão, e o glitch então o remove de vez. Puramente cosmético: seu jogo apenas fica com um policial a menos."
          keep:
            label: "MANTENHA SÓ ESSE"
            text: "Qual sprite morre depende de onde você está quando o Mew aparece. Viaje só de Cerulean para a Rota 24 (ou Cerulean para 24 para 25 para 24). Entre em qualquer outra área entre o Teleport e o encontro e o jogo pode apagar um objeto de lá, um que pode importar."
          workaround:
            badge: "SEM ATALHO"
            text: "Trazer por troca um Abra com Teleport te deixa fazer o glitch antes do Bill, mas nunca fica sem perdas: o jogo sempre esconde o sprite que fica logo depois da lista da Rota 24 na memória. Depois do Bill é o policial inofensivo; antes, a baixa é um objeto diferente e menos previsível. Siga a rota e aceite o policial."
          deep_html: "// aprofundamento sobre qual objeto morre e por quê: <a href=\"https://archives.glitchcity.info/forums/board-107/thread-7490/page-0.html\" target=\"_blank\" rel=\"noreferrer\">TheZZAZZGlitch no glitchcity</a>"
        prereq:
          eyebrow: "ANTES DE COMEÇAR"
          h2: "Deixe estes quatro Treinadores de pé"
          lead: "Cada um é combustível para o glitch. Vença qualquer um cedo demais e você perde o gatilho daquela etapa."
        untouched:
          trigger:
            name: "Jr. Trainer♂"
            where: "No mato a oeste da Ponte Nugget, Rota 24."
            role: "O GATILHO"
          swimmer:
            name: "Swimmer"
            where: "Primeiro Treinador na água, lado direito do Ginásio de Cerulean."
            role: "NÍVEL DO MEW"
          misty:
            name: "Misty"
            where: "Líder do Ginásio de Cerulean. Ela bloqueia o Swimmer se você vencê-la primeiro."
            role: "DEIXE ESPERANDO"
          youngster:
            name: "Youngster"
            where: "O Youngster com o Slowpoke solitário na Rota 25."
            role: "SEGUNDO MEW"
        pack:
          label: "LISTA DA MOCHILA"
          abra:
            name: "Um Abra que saiba Teleport"
            note: "Rota 5, a Abra selvagem mais próxima, depois do Bill."
          balls:
            name: "Poké Balls, bastante"
            note: "A taxa de captura do Mew é baixa e Cerulean não vende nada melhor."
        sleepers:
          label: "OPCIONAL · MAS FAÇA"
          lead: "Traga algo com um golpe de sono. Qualquer um destes aprende um por nível e é capturável até Cerulean."
        moves:
          sleep_powder: "Sleep Powder"
          sing: "Sing"
        steps:
          eyebrow: "O GLITCH · PASSO A PASSO"
          h2: "Método de Cerulean, do início à captura"
          lead: "Três fases. Salve antes da segunda: se um passo der errado, resetar é mais barato que um travamento."
        phases:
          setup:
            label: "FASE 1 · PREPARO"
            title: "Limpe o tabuleiro"
            meta: "Ponte Nugget + um Abra"
            steps:
              route24:
                title: "Suba para a Rota 24"
                text: "Saia de Cerulean pelo norte e vença seu rival se ainda não venceu. Fique fora do mato alto a oeste."
              bridge:
                title: "Limpe a Ponte Nugget, todos os seis"
                text: "Vença os cinco Treinadores da ponte e o Rocket no fim. Não encoste no Jr. Trainer♂ parado no mato à esquerda da ponte."
                tag: "NÃO VENÇA"
                note_label: "POR QUÊ"
                note: "Aquele Treinador no mato é o glitch inteiro. Se ele sumir, seu Mew também."
              youngster:
                title: "Vá para a Rota 25, poupe o garoto do Slowpoke"
                text: "Atravesse a Ponte Nugget até a Rota 25 e siga rumo ao Bill. Perto do início há um Youngster com um único Slowpoke. Passe reto por ele."
                tag: "SEGUNDO MEW"
                note_label: "POR QUÊ"
                note: "Só importa se você quiser um segundo Mew depois. Aquele garoto do Slowpoke é a batalha substituta de uma nova rodada, então vencê-lo agora custa o bis até você resetar."
              abra:
                title: "Consiga um Abra com Teleport"
                text: "Não há Abra selvagem antes do Bill, então chegue até ele primeiro, depois capture um Abra no mato da Rota 5. Volte para Cerulean quando ele souber Teleport."
                tag: "A LONGA ESPERA"
                note_label: "CUSTO"
                note: "Conhecer o Bill é o que deixa aquele policial visível, e perdível. Leia o aviso acima."
          glitch:
            label: "FASE 2 · O GLITCH"
            title: "Quebre o encontro"
            meta: "Salve antes desta fase"
            steps:
              center:
                title: "Salve, depois cure em Cerulean"
                text: "Salve o jogo. Depois use o Centro Pokémon de Cerulean para o Teleport te trazer de volta aqui."
              lineup:
                title: "Alinhe com o Treinador no mato"
                text: "Alinhe-se na coluna do Jr. Trainer♂ na Rota 24, ao norte o bastante para o sprite dele ficar logo abaixo da borda inferior da tela. Um passo ao sul te colocaria no campo de visão dele."
                note_label: "CONFIRA"
                note: "Ele precisa estar fora da tela. Na tela, ele simplesmente vem até você e batalha normalmente."
              start:
                title: "Desça segurando START"
                text: "Segure o Botão START enquanto pisa no campo de visão dele. O menu abre no mesmo quadro em que o ponto de exclamação aparece."
                tag: "TIMING"
              teleport:
                title: "Dê Teleport com o Abra"
                text: "No menu, escolha POKéMON, depois Abra, depois Teleport. Você teleporta para Cerulean antes que ele dê um passo."
                note_label: "ESPERADO"
                note: "Seu menu e os Botões A/B agora não fazem nada fora de um PC. Nada quebrou, continue andando."
              swimmer:
                title: "Vença o Swimmer no Ginásio"
                text: "Vá direto ao Ginásio de Cerulean e batalhe o Treinador da direita. Chegue de modo que ele nade pelo menos um tile em sua direção, depois vença o Horsea e o Shellder Nv 16 dele."
                tag: "RISCO DE TRAVAR"
                note_label: "CUIDADO"
                note: "Se ele não se mexer antes da batalha começar, o jogo trava. Nunca fale com ele pelo lado direito."
          catch:
            label: "FASE 3 · CAPTURA"
            title: "Conheça o Nº 151"
            meta: "Sem desvios na volta"
            steps:
              return:
                title: "Volte direto para a Rota 24"
                text: "Saia do Ginásio e suba para o norte de Cerulean. Não entre em nenhuma outra área: cada desvio arrisca apagar algo dela."
                tag: "SEM DESVIOS"
              encounter:
                title: "Feche o menu que abre sozinho"
                text: "No instante em que você entra na Rota 24 o menu abre sozinho. Aperte B. Um Mew Nv 7 aparece."
              catch:
                title: "Coloque para dormir, depois arremesse"
                text: "Reduza o HP, aplique um golpe de sono e comece a arremessar. A taxa de captura do Mew é ruim e Cerulean só vende Poké Balls, então leve vinte e tenha paciência."
                note_label: "NÍVEL"
                note: "Quer um nível diferente? Use Growl no Shellder na fase 2 antes, veja a calculadora abaixo."
        calc:
          eyebrow: "CALCULADORA DE NÍVEL"
          h2: "Escolha o Mew que você quer"
          lead: "O nível do Mew é lido do estágio de Ataque do último Pokémon que você batalhou. O jogo guarda os estágios como 1–13 em vez de -6 a +6, então um oponente intacto dá Nv 7. Cada Growl que você acerta naquele Shellder (ou Slowpoke) baixa o Mew um nível."
          caption: "ESTÁGIO DE ATAQUE DO ÚLTIMO OPONENTE"
          spawns: "SEU MEW APARECE EM"
          lv_label: "Nv"
          recipe:
            untouched: "> oponente intacto, nenhum golpe de status usado"
            growl: "> acerte %{n}× Growl no último oponente"
            growl_underflow: "> acerte %{n}× Growl no último oponente, depois faça underflow para o Nv 100"
            raised:
              one: "> o Ataque do oponente precisa estar elevado %{count} estágio, raro na prática"
              other: "> o Ataque do oponente precisa estar elevado %{count} estágios, raro na prática"
          internal: "// valor interno %{value} = estágio %{stage} → nível %{level}"
          lv100:
            label: "A ROTA DO NV 100"
            text: "Acerte seis Growls para capturar um Mew Nv 1, depois rode o glitch de underflow de experiência nele para saltar direto ao Nv 100. Deixe um espaço livre na equipe: sacar um Mew Nv 1 do PC trava o jogo. Ele não aprende nada por nível depois, o que quase não importa: o Mew pode aprender todos os TMs do jogo."
          vc:
            label: "VIRTUAL CONSOLE · LEGITIMIDADE"
            text: "O Poké Transporter só aceita um Mew que pareça o do evento do Virtual Console. Isso significa Treinador Original GF (ou ゲーフリ) e ID de Treinador 22796."
            ot_label: "NOME OT"
            tid_label: "ID DO TREINADOR"
            foot: "Você pode se chamar GF no começo; o ID é aleatório, então bater com ele exige manipulação de RNG, cheats ou muitos resets. O Mew do evento também tem 15 de IV em tudo, agradável mas irrelevante para o Transporter."
        second:
          eyebrow: "BIS · SEGUNDO MEW"
          h2: "Repita com o garoto do Slowpoke"
          note: "SALVE PRIMEIRO · MESMO TREINADOR DO MATO"
          lead: "O Jr. Trainer♂ no mato pode iniciar o glitch quantas vezes você quiser. Troque o Swimmer do Ginásio pelo Youngster com o Slowpoke solitário na Rota 25 e você ganha outro Mew."
          "1":
            title: "Limpe a Rota 25 em parte"
            text: "Vença Treinadores pela Rota 25 até conseguir alcançar o Youngster com o Slowpoke solitário. Deixe-o de pé."
          "2":
            title: "Salve"
            text: "Você já tem um Mew. Salve antes de arriscar qualquer coisa."
          "3":
            title: "Acione o Treinador do mato de novo"
            text: "Mesma jogada de antes: entre no campo de visão do Jr. Trainer♂ na Rota 24 segurando START."
          "4":
            title: "Teleporte para Cerulean"
            text: "O Abra te leva para casa e seus botões morrem de novo."
          "5":
            title: "Batalhe o garoto do Slowpoke"
            text: "Vá até ele na Rota 25 e garanta que ele dê pelo menos um passo em sua direção, ou o jogo trava. O estágio de Ataque do Slowpoke dele define o nível."
          "6":
            title: "De volta à Rota 24"
            text: "Volte andando, aperte B no menu que abre sozinho e capture o Mew número dois."
        after:
          art_alt: "Red com Mew, arte de Ken Sugimori"
          art_tag: "Nº 151 · REGISTRADO"
          eyebrow: "POSFÁCIO"
          h2: "Um Pokémon que o jogo nunca quis te dar"
          text: "Este é um sabor do glitch Trainer-Fly, que pode produzir qualquer Pokémon do jogo. A dupla de Cerulean é só a mais cedo e mais segura. Existem outras configurações, com mais partes móveis e mais formas de perder um NPC. Capture o Mew aqui e sua dex fica completa sem um único ticket de evento."
          back: "◀ VOLTAR A CERULEAN"
          credit: "arte de Ken Sugimori · © Nintendo / Creatures / Game Freak"
        teaser:
          tag: "OPCIONAL · GLITCH"
          window: "JANELA MAIS CEDO DO JOGO"
          title_html: "Quer o <span class=\"pn-mew-teaser__word\" data-text=\"Mew\">Mew</span>? Não vença este Ginásio ainda."
          lead: "O Mew normalmente só vem de eventos, e Cerulean é o primeiro lugar onde você pode fazer o famoso glitch do Mew para conseguir um no jogo. Você vai precisar avançar quase toda a Rota 24 antes; a gente te lembra quando chegar lá. Se quiser, deixe o Swimmer e a Misty de pé por enquanto."
          cta: "GUIA COMPLETO DO GLITCH DO MEW ▶"
          meta: "~15 min · custa um NPC de fundo"
        index:
          kind: "GLITCH"
          where: "CERULEAN · ANTES DA MISTY"
          name: "O Glitch do Mew"
          note: "Capture o #151 no jogo. Passos completos, avisos e uma calculadora de nível."
      pikachu_friendship:
        eyebrow: "MECÂNICA · SÓ NO YELLOW"
        title: "Como funciona a amizade do Pikachu"
        show: "MOSTRAR"
        hide: "OCULTAR"
        lead_html: "O Pikachu inicial do Yellow carrega um valor de amizade oculto de <b>0 a 255</b>. Ele começa em <b>90</b> e muda conforme você joga. Quanto mais sobe, menos vale cada ação, então os ganhos baratos são mais baratos cedo."
        meter_start: "INÍCIO"
        meter_goal: "BULBASAUR"
        table_label: "MUDANÇA DE AMIZADE POR VALOR ATUAL"
        col_action: "AÇÃO"
        band_lo: "0–99"
        band_mid: "100–199"
        band_hi: "200–255"
        rows:
          levelup: "Pikachu sobe de nível na sua equipe"
          hp_item: "Usar um item que cura HP no Pikachu, mesmo com HP cheio"
          x_item: "Usar um item X no Pikachu em batalha"
          gym_leader: "Desafiar um Líder de Ginásio com Pikachu na equipe"
          tm_hm: "Ensinar um HM ou TM ao Pikachu"
          walking: "Andar 256 passos com Pikachu na equipe (50% de chance)"
          deposit: "Depositar o Pikachu no PC"
          faint: "Pikachu desmaia em batalha"
          poison_faint: "Pikachu desmaia fora de batalha por dano de veneno"
          careless: "Pikachu desmaia contra um oponente 30+ níveis acima"
          trade: "Pikachu é trocado com outro jogador"
        potion:
          title: "O TRUQUE DA POTION"
          text_html: "Um item que cura HP conta <b>mesmo quando não faz nada</b>. Use uma Potion num Pikachu com HP cheio e a amizade sobe do mesmo jeito. Compre um monte no Mart e vá tocando de 90 até 147 em poucos minutos."
        why:
          title: "POR QUE IMPORTA"
          text_html: "Na maior parte é novidade: o humor do Pikachu só muda a carinha dele no mapa. O único ganho real é aqui em Cerulean, onde a Melanie só entrega o Bulbasaur com <b>147 ou mais</b>. Mantenha o Pikachu fora do PC até lá."
      locations:
        pallet_town:
          note: "Pegue o Pikachu com o Prof. Oak. Sem grama selvagem aqui."
          intro: "O lar. Pegue seu parceiro Pikachu, resolva a primeira batalha de rival e siga ao norte."
          trivia:
            title: "Esta batalha decide o Eevee do seu rival"
            intro: "O resultado desta batalha, mais uma revanche opcional na Rota 22, define em qual evolução o Eevee do seu rival se transforma. Jogue como quiser, mas aqui está a receita de cada uma."
            note: "// A revanche da Rota 22 só importa se você vencer aqui primeiro; se perder, vira Vaporeon de qualquer jeito."
            cards:
              vaporeon:
                this: "Perca esta batalha"
                rt22: "Resultado da Rota 22 ignorado"
              jolteon:
                this: "Vença esta batalha"
                rt22: "Vença também a batalha da Rota 22"
              flareon:
                this: "Vença esta batalha"
                rt22: "Pule a batalha da Rota 22"
          steps:
            "1":
              title: "Retire a Potion grátis"
              text: "No seu quarto no andar de cima, cheque a PC e retire a Potion grátis, depois desça e saia pela porta da frente."
              items:
                potion: "Quarto de cima, dentro da PC."
            "2":
              title: "Pegue o Pikachu com o Oak"
              text: "Vá até a saída norte. No instante em que pisa na grama da Rota 1, o Oak te para e te leva de volta ao laboratório, onde te dá o Pikachu. Daí em diante ele anda ao seu lado, em vez de ficar na Ball."
            "3":
              title: "Vença seu rival"
              text_html: "O Blue pega um Eevee e te enfrenta no laboratório. Ele é Nv 5 com Tackle e Tail Whip; lidere com o Pikachu e use ThunderShock. Vença por <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dólar\"></span><span class=\"pn-money-value__n\">175</span></span>. Atenção: esse resultado é metade do que define <a href=\"%{href}\">em qual evolução o Eevee dele vira</a>, então escolha o desfecho de propósito."
            "4":
              title: "Siga ao norte para a Rota 1"
              text: "Saia de Pallet pela saída norte para a Rota 1, seguindo rumo a Viridian City."
          tips:
            pikachu: "Seu parceiro obrigatório e o único Pikachu do jogo. Ele recusa a Thunder Stone, então continua Pikachu."
        route_1:
          note: "Primeiro trecho de grama. Pidgey e Rattata."
          intro: "A estradinha ao norte até Viridian. Sua primeira grama selvagem. Suba o nível do Pikachu no caminho."
          steps:
            "1":
              title: "Varra a grama alta"
              text: "Vá ao norte pela grama alta, batalhando Pidgey e Rattata selvagens para subir o nível do Pikachu. Você ainda não tem Poké Balls, então só batalhe por enquanto; dá para capturar um Pidgey e um Rattata na volta, depois de comprar Balls na loja de Viridian."
            "2":
              title: "Pegue a Potion grátis"
              text: "Perto da saída sul (Pallet), um homem parado ao lado da placa sai para demonstrar a loja e te dá uma Potion grátis. Pegue e siga ao norte."
              items:
                potion: "Com o homem ao lado da placa perto da saída sul (Pallet)."
            "3":
              title: "Entre em Viridian City"
              text: "Continue ao norte até Viridian City. Mais tarde, na volta, pule os desníveis do lado leste para evitar a grama no caminho de retorno."
          tips:
            pidgey: "Por toda a Rota 1. Um Normal/Voador confiável que evolui até Pidgeot."
            rattata: "Rápido e comum. Evolui para Raticate, um bom atacante inicial."
        viridian_city:
          mart:
            blurb: "O primeiro Mart do jogo. Só começa a vender depois que você entrega o Oak's Parcel vindo de Pallet Town."
            buy: "Compre um punhado de Poké Balls para as Rotas 1–2 e a Viridian Forest. Antidote cobre o Poison Sting da linha do Weedle."
          note: "Tutorial de captura, Oak's Parcel, estoque de Poké Balls."
          intro: "A cidade de passagem. Sem grama selvagem. Faça as tarefas, compre Poké Balls e siga para a Rota 2."
          later:
            tm42:
              where: "O Pescador que entrega o TM42 (Dream Eater) fica numa faixa cercada no canto sudoeste, isolada por uma árvore cortável e pelo laguinho. Você não consegue chegar até ele na primeira passagem."
              after: "Corte a árvore com o HM01 Cut (do S.S. Anne, em Vermilion), ou use Surf com o HM03. O Cut vem primeiro."
          missable:
            title: "Cinco Poké Balls grátis"
            body_html: "O Oak te dá <b>cinco Poké Balls</b> se você vencer o rival da Rota 22 sem carregar <b>nenhuma</b> e tendo capturado <b>só o Pikachu</b>. É pouca coisa, mas se quiser, deixe a loja para depois dessa luta."
            tip: "O Pikachu entra sozinho contra o Spearow e o Eevee dele, então pegue alguns níveis no mato da Rota 22 antes."
          steps:
            "1":
              title: "Cure e pegue o Oak's Parcel"
              text: "Cure no Centro Pokémon no canto superior esquerdo, se precisar, depois entre na loja logo a nordeste. Fale com o atendente no balcão e ele entrega o Oak's Parcel para levar de volta ao sul."
              items:
                oaks_parcel: "Com o atendente da loja em Viridian; entregue ao Oak em Pallet Town."
            "2":
              title: "Entregue o Oak's Parcel"
              text: "Leve o Parcel ao sul, ao laboratorio do Oak em Pallet Town. Entregue a ele e enfim ele te da a Pokédex, a ferramenta que registra cada Pokémon que você ve e captura."
              items:
                pokedex: "Dada pelo Prof. Oak quando você entrega o Oak's Parcel; registra cada Pokémon que você vê e captura."
            "3":
              title: "Pegue o Town Map"
              text: "Enquanto está em Pallet pela Pokédex, entre na casa do Blue logo a leste. A irmã dele, a Daisy, está perto da mesa; fale com ela e ela te dá o Town Map, que mostra cada rota e cidade de Kanto."
              items:
                town_map: "Com a Daisy, irmã do Blue, na casa logo a leste da sua em Pallet Town."
            "4":
              title: "Abasteca na loja"
              text: "Volte a pe para Viridian. Agora que a loja esta vendendo, compre um monte de Poke Balls e algumas Potions e Antidotes para a Rota 22, a Rota 2 e a Viridian Forest. Se preferir pegar as cinco Poke Balls gratis do Oak, deixe as balls para depois da batalha de rival na Rota 22 (veja a nota de perdivel)."
            "5":
              title: "Veja a demonstracao de captura"
              text: "O velho na estrada ao norte ja acordou. Fale com ele e assista a demonstracao de captura; quando ela termina, ele sai do caminho e a passagem ao norte enfim abre."
            "6":
              title: "Pegue a Potion escondida perto da saida norte"
              text: "Com o caminho aberto, suba até a saída norte, no topo da cidade. Uma árvore solitária ao lado do caminho de saída esconde uma Potion. Aperte A ao lado dela; nada aparece na tela."
              hidden:
                potion: "A árvore solitária ao lado do caminho da saída norte, no topo da cidade. Aperte A; nada aparece na tela."
            "7":
              title: "Pule o Ginasio e siga a oeste para a Rota 22"
              text: "O Ginasio de Viridian, no nordeste, fica trancado ate você ter as outras sete insignias, entao deixe para o fim do jogo. Pegue a saida oeste para a Rota 22, pelas melhores capturas contra o Brock e sua próxima batalha de rival; de la você volta por Viridian e sobe para a Rota 2."
        route_22:
          note: "Rota oeste opcional. Nidoran♀/♂, Mankey, Spearow. Mais a primeira batalha de rival."
          intro: "Um desvio curto a oeste de Viridian. O melhor lugar para capturar respostas ao Brock antes da floresta."
          steps:
            "1":
              title: "Atravesse a grama"
              text: "Vá a oeste de Viridian até a grama. Capture Nidoran♂/♀ e Mankey aqui. Eles vencem os tipos Pedra do Brock."
            "2":
              title: "Vença o rival"
              text_html: "O Blue te desafia perto da água com Spearow (Nv 9) e Eevee (Nv 8). Vença por <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dólar\"></span><span class=\"pn-money-value__n\">280</span></span>. Esta é a outra metade da <a href=\"%{href}\">receita do Eevee</a>: se você venceu em Pallet, vencer aqui trava o Jolteon e pular esta luta trava o Flareon."
            "3":
              title: "Opcional: as cinco Poké Balls do Oak"
              text_html: "Ainda sem nenhuma Poké Ball e só com o Pikachu capturado? Volte ao Laboratório do Oak em Pallet Town e fale com ele para ganhar <b>cinco Poké Balls</b>. Veja a <a href=\"#missable-poke-balls\">nota de perdível</a>."
            "4":
              title: "Volte para Viridian"
              text: "O portão da Liga mais a oeste fica bloqueado até você ter todas as insígnias. Volte ao leste e suba para a Rota 2."
          tips:
            nidoranf: "Capture uma. Sua linha (Nidoqueen) é forte e cobre o Brock com golpes de Terra."
            nidoranm: "Aprende Low Kick cedo e evolui para Nidoking. Uma das melhores respostas ao Brock."
            mankey: "Low Kick é super-eficaz nos tipos Pedra do Brock. Pegue um."
            rattata: "Preenchimento comum aqui. Evolui para Raticate."
            spearow: "Normal/Voador cedo; evolui para Fearow. Agressivo e fácil de achar."
          oak:
            nidoranf: "Sua linha chega a Nidoqueen. Registre a base uma vez."
            nidoranm: "Evolui para Nidoking e ajuda contra o Brock. Registre um."
            mankey: "Único lugar fácil por um tempo. Pegue para o Brock."
            spearow: "Normal/Voador cedo, evolui para Fearow."
        route_2:
          note: "Trecho curto até a floresta. Pidgey, Rattata e Nidoran."
          intro: "Nesta passagem você só anda pela faixa oeste até o portão da floresta, com as mesmas capturas de antes mais Nidoran selvagem. A Route 2 é bem maior que isso: sua metade leste fica trancada atrás de árvores que precisam de Cut, então os marcadores do lado leste do mapa (a Moon Stone e o HP Up, o HM05 Flash, a troca do Mr. Mime e a saída norte da Diglett's Cave) só ficam acessíveis quando você tiver Cut, ou voltando pela Diglett's Cave a partir de Vermilion."
          later:
            moon_stone:
              where: "Uma Poké Ball no fundo do terreno cercado de árvores no lado leste da Route 2. As árvores cortáveis isolam toda a metade leste na primeira passagem, então você ainda não chega lá."
              after: "Volte com o HM01 Cut (do S.S. Anne, em Vermilion) para cortar a árvore, ou entre por esse lado pela saída norte da Diglett's Cave assim que chegar a Vermilion."
            hp_up:
              where: "Uma segunda Poké Ball logo ao norte da Moon Stone, no mesmo terreno leste bloqueado por Cut. As duas ficam atrás da mesma parede de árvores cortáveis."
              after: "Mesma ida: leve o HM01 Cut de volta à Route 2, ou chegue por esse lado pela Diglett's Cave a partir de Vermilion."
            flash:
              where: "O Assistente do Prof. Carvalho entrega o HM05 Flash dentro do portão da Route 2, no mesmo lado leste bloqueado por Cut. Ele só dá quando você tiver capturado pelo menos 10 tipos de Pokémon (a contagem na Pokédex, não quantos você tem)."
              after: "Chegue ao portão com o HM01 Cut (ou subindo pela Diglett's Cave a partir de Vermilion) e tenha 10 espécies capturadas. É o Flash que ilumina a Rock Tunnel mais tarde, então vale o desvio."
          trades:
            mr_mime:
              npc: "CIENTISTA"
              title: "Mr. Mime"
              where: "A casa de troca na Rota 2"
              note: "Yellow não tem Mr. Mime selvagem, então esta troca é o único jeito de obtê-lo. Você precisa de um Clefairy extra do Monte da Lua, então a maioria volta aqui depois."
          steps:
            "1":
              title: "Atravesse a grama sul"
              text: "Suba ao norte pela grama curta a partir da borda de Viridian City. Capture um Nidoran selvagem aqui se pulou a Rota 22, e registre um Pidgey ou Rattata para a dex enquanto passa."
            "2":
              title: "Entre na Viridian Forest"
              text: "Siga a faixa oeste até o portão da floresta no topo e entre direto. Tudo no lado leste cercado de árvores (a Moon Stone, o HP Up, o HM05 Flash e a troca do Mr. Mime) fica trancado até você ter Cut, então siga em frente."
          tips:
            pidgey: "O mesmo voador confiável da Rota 1 se você ainda precisar de um."
            rattata: "Comum de novo. Pule se já capturou um."
            nidoranf: "Uma segunda chance de Nidoran♀ se pulou a Rota 22."
            nidoranm: "Uma segunda chance de Nidoran♂. Pegue para a luta contra o Brock."
          oak:
            pidgey: "Comum na grama daqui, e a esta altura você já tem Poké Balls. Registre um; evolui até Pidgeot."
            rattata: "Por toda a Rota 2. Pegue um para a dex; evolui para Raticate."
        viridian_forest:
          note: "Paraíso dos Inseto. Caterpie, Metapod, Pidgey. Itens ocultos dentro. Sem Pikachu selvagem no Yellow."
          intro: "O labirinto de árvores entre a Rota 2 e Pewter. Varra a grama, pegue os itens ocultos e capture um Caterpie para o Brock."
          steps:
            "1":
              title: "Entre pelo portão da Rota 2"
              text: "Entre pelo portão sul. A grama alta preenche todo o labirinto, sua única chance de Caterpie, Metapod e Pidgey. Uma Lass e alguns Bug Catchers esperam nas árvores para XP fácil do Pikachu."
            "2":
              title: "Cheque a árvore isolada"
              text: "Logo depois do portão sul há uma única árvore. Chegue ao lado dela, olhe para o quadrado da árvore e aperte A para um Antidote oculto."
              hidden:
                antidote: "Ao pé da árvore isolada, logo depois do portão sul. Olhe para o quadrado e aperte A. Nada aparece na tela."
            "3":
              title: "Saqueie o beco a noroeste"
              text: "Vá a noroeste até o beco de grama sem saída, vencendo a Lass no caminho para XP fácil. Uma Poké Ball está no chão junto à parede oeste, bem no fim do caminho."
              items:
                pok-ball: "No fim do beco de grama sem saída, junto à parede oeste, a noroeste do portão sul."
            "4":
              title: "Pegue a Potion central"
              text: "Serpenteie de volta ao meio do labirinto. Uma Potion espera numa ball logo a noroeste da placa que fala em usar Antidote contra veneno."
              items:
                potion-12-29: "No centro da floresta, numa ball logo a noroeste da placa de Antidote."
            "5":
              title: "Varra o nordeste"
              text: "Suba até o canto nordeste, limpando os Bug Catchers para mais XP do Pikachu. Pegue a Potion numa ball logo a noroeste da placa Trainer Tips."
              items:
                potion-25-11: "A nordeste da floresta, logo a noroeste da placa Trainer Tips."
            "6":
              title: "Vasculhe a parede oeste"
              text: "Volte à parede oeste rumo à saída norte. Um quadrado a oeste do Bug Catcher de lá, fique no quadrado logo abaixo, olhe para cima e aperte A para uma Potion oculta."
              hidden:
                potion: "Um quadrado a oeste do Bug Catcher na parede oeste (parte alta da floresta). Fique no quadrado logo abaixo, olhe para cima e aperte A. Nada aparece na tela."
            "7":
              title: "Saia para Pewter City"
              text: "Capture um Caterpie ou Metapod antes de ir; o Butterfree aprende Confusion, uma resposta rara e boa ao Brock. Saia pelo portão norte para a Rota 2 e então para Pewter City."
          tips:
            caterpie: "Por toda a grama. Evolui rápido para Butterfree, cujo Confusion machuca o Brock."
            metapod: "Ou só evolua seu Caterpie no Nv 7. Mais barato que caçar o spawn de 25%."
            pidgey: "Comum aqui também se ainda precisar de um para a dex."
            pidgeotto: "Um spawn raro de 1%. Um voador evoluído de graça se tiver paciência."
          oak:
            caterpie: "A nova família da floresta. Evolui para Butterfree. Registre a base uma vez."
        pewter_city:
          mart:
            blurb: "Logo ao lado do Centro Pokémon. Reabasteça aqui antes do Mt. Moon, uma caverna longa e sem lojas."
            buy: "Poké Balls para os Clefairy do Mt. Moon e algumas Potions. Um Escape Rope te tira de lá se você se perder."
          gym:
            intro: "Um ginásio curto e reto, sem quebra-cabeça. Vença o Jr. Trainer solitário na entrada e depois o Brock no fundo. O Geodude (Nv 10) e o Onix (Nv 12) dele ignoram o Pikachu por completo, então lidere com Low Kick do Mankey, um Nidoran ou Confusion do Butterfree. Quando o Onix usar Bide, pare de atacar por dois turnos ou ele devolve todo o dano acumulado de uma vez."
          note: "Brock. O primeiro Ginásio. Tipos Pedra; Elétrico não faz nada."
          intro: "A primeira cidade com Ginásio. Cure, prepare um atacante não-Elétrico e pegue a Boulder Badge com o Brock."
          steps:
            "1":
              title: "Cure, prepare e entre no Ginásio"
              text: "Cure no Centro Pokémon e compre Potions no Mart. Pikachu nao faz nada contra Pedra, entao lidere com Mankey, um Nidoran ou Butterfree, depois entre no Ginásio no lado oeste."
            "2":
              title: "Siga para leste ate a Rota 3"
              text: "Com a Insígnia Boulder, o garoto que bloqueia a saída leste sai do caminho. Siga para leste na Rota 3 rumo a Mt. Moon."
          trivia:
            title: "Jigglypuff faz seu Pikachu dormir"
            intro: "Um Jigglypuff fica encostado na parede dentro do Centro Pokémon de Pewter City. Fale com ele e ele solta a cantiga \"Puu pupuu!\": se o seu Pikachu estiver andando atrás de você, a canção apaga ele na hora e ele para de te seguir, igualzinho a ser posto para dormir numa batalha."
            note: "Só acontece quando o Pikachu é seu parceiro te seguindo e está sem nenhuma condição de status. Fora isso, o Jigglypuff apenas canta. Uma piscadela para como o golpe Sing dele funciona numa batalha de verdade."
        route_3:
          note: "A subida até o Mt. Moon. Spearow, Sandshrew e Mankey."
          intro: "O corredor de treinadores a leste de Pewter. Pegue um tipo Terra para as cavernas e cure no centro do Mt. Moon."
          steps:
            "1":
              title: "Suba a rota lutando"
              text: "Vá a leste de Pewter, limpando os Bug Catchers, Youngsters e Lasses conforme sobe."
            "2":
              title: "Varra a grama"
              text: "Capture Spearow, Sandshrew ou Mankey na grama. Sandshrew e Mankey ajudam nas cavernas; depois siga a rota até o fim, no Centro Pokémon do Mt. Moon, na Route 4."
          oak:
            sandshrew: "Tipo Terra, evolui para Sandslash. Útil nas cavernas à frente."
        route_4_mt_moon:
          note: "A entrada do Mt. Moon: cure e entre na caverna."
          intro: "A ponta oeste da Route 4, onde a Rota 3 encontra o Centro Pokémon do Mt. Moon. Cure, resolva o que faltar e entre na caverna. A metade leste da Route 4 e seus itens vêm depois que você atravessa."
          steps:
            "1":
              title: "Cure no Centro Pokémon do Mt. Moon"
              text: "Saia da Rota 3 para a ponta oeste da Route 4 e cure no Centro Pokémon do Mt. Moon perto da boca da caverna. É a última parada antes da caverna, então recupere tudo e compre Poke Balls."
            "2":
              title: "Entre no Mt. Moon"
              text: "Entre no Mt. Moon pela porta ao lado do centro. Você sai na metade leste da Route 4, coberta no próximo trecho."
          trivia:
            title: "O homem que vende um Magikarp"
            intro: "Dentro do Centro Pokémon do Mt. Moon um homem vende um Magikarp por ¥500. Sozinho ele só usa Splash, mas evolui para Gyarados, um verdadeiro monstro. Comprar aqui vale a pena se você quer começar a treiná-lo imediatamente, já que chegar até o Gyarados leva um bom tempo."
            note: "Se você só precisa dele para a Pokédex, não tem pressa: dá para pescar Magikarp depois com o Old Rod, então pode esperar e economizar. Ele vende um único Magikarp nível 5 e não dá reembolso."
        mt_moon:
          note: "Travessia de caverna. Zubat, Geodude, Clefairy rara e um fóssil."
          intro: "Uma caverna escura cheia de Rockets. Pegue a Moon Stone, escolha um fóssil e siga até Cerulean."
          steps:
            "1":
              title: "Entre em Mt. Moon pela Rota 4"
              text: "Entre pela ponta oeste da Rota 4, bem ao lado do Centro Pokémon, no escuro do 1F. Zubat e Geodude infestam a rocha, entao mantenha um lider descansado; um Clefairy de 1% e um Paras de 5% sao os premios que valem a cacada."
            "2":
              title: "Pegue a Potion perto da entrada"
              text: "A poucos passos da entrada, no centro-sul do 1F, uma Potion esta numa bola logo a leste de onde você entrou. Pegue-a antes de se espalhar pela caverna."
              items:
                potion-20-33: "Centro-sul do 1F, logo a leste da entrada da Rota 4."
            "3":
              title: "Va ao sudeste pelo Rare Candy"
              text: "Siga a parede inferior ate o canto sudeste, onde um Rare Candy espera numa bola. Um nível gratis para o Pokémon que quiser."
              items:
                rare-candy: "Canto sudeste do 1F, junto a parede inferior."
            "4":
              title: "Pegue o Escape Rope na parede leste"
              text: "Logo ao norte do Rare Candy, encostado na parede leste, um Escape Rope esta numa bola. Util se a caverna consumir suas Potions antes de você achar a saida."
              items:
                escape-rope: "Parede leste do 1F, logo ao norte do Rare Candy."
            "5":
              title: "Atravesse ao sudoeste pelo TM12"
              text: "Volte para o oeste pela parte de baixo ate o canto sudoeste, onde o TM12 (Water Gun) descansa numa bola. Um golpe de Agua barato para quem puder aprender."
              items:
                tm-water-gun: "Canto sudoeste do 1F."
            "6":
              title: "Suba a parede oeste por uma segunda Potion"
              text: "Suba pela parede mais a oeste ate uma segunda Potion numa bola, mais ou menos na metade da altura. Pegue-a a caminho do canto de cima."
              items:
                potion-2-20: "Junto a parede mais a oeste do 1F, na metade da altura."
            "7":
              title: "Pegue a Moon Stone no noroeste"
              text: "No canto superior esquerdo do 1F, uma Moon Stone esta numa bola. Ela evolui Clefairy, Nidorina, Nidorino e mais, entao guarde e nunca venda. A escada para baixo fica logo ao lado."
              items:
                moon-stone: "Canto superior esquerdo (noroeste) do 1F."
            "8":
              title: "Desca pelo labirinto ate o B2F"
              text: "Desca pela escada do noroeste ate o B1F, um curto labirinto de ligacao sem itens, e entao pegue a próxima escada ate o B2F, onde os Rockets se entrincheiraram. Limpe os Grunts pelo caminho."
            "9":
              title: "Pegue o HP Up no B2F"
              text: "No centro-sul do B2F, um HP Up descansa numa bola. Ele aumenta permanentemente o HP de um Pokémon, entao guarde para um favorito."
              items:
                hp-up: "Centro-sul do B2F."
            "10":
              title: "Ache a Moon Stone oculta"
              text: "Uma segunda Moon Stone se esconde entre as pedras no meio do B2F. Encare a rocha logo ao sul da escada ao atravessar e aperte A; nada aparece na tela, mas ela cai na sua mochila."
              hidden:
                moon-stone: "Centro do B2F, na rocha logo ao sul da escada. Aperte A; nada aparece na tela."
            "11":
              title: "Pegue o TM01 no nordeste"
              text: "La no nordeste do B2F, o TM01 (Mega Punch) esta numa bola. Um golpe Normal pesado para um atacante fisico."
              items:
                tm-mega-punch: "Nordeste do B2F."
            "12":
              title: "Revire a rocha ao lado do TM01 pelo Ether"
              text: "Um Ether esta guardado dentro da pedra grande bem ao lado do TM01, no nordeste do B2F. Encare a rocha e aperte A; nada aparece na tela, mas o Ether e seu."
              hidden:
                ether: "Nordeste do B2F, na pedra ao lado do TM01. Aperte A; nada aparece na tela."
            "13":
              title: "Vença o Super Nerd, escolha um fóssil"
              text: "Perto dos fósseis ao norte, o último Super Nerd reivindica os dois e batalha com você por eles. Vença-o e escolha UM fóssil: Dome (vira Kabuto) ou Helix (vira Omanyte). Ele fica com o que você deixar, então esse se perde para sempre."
              items:
                fossil: "Escolha Dome (Kabuto) ou Helix (Omanyte) com o Super Nerd depois de vencê-lo. Reviva em Pokémon depois no Laboratório de Cinnabar; o outro se perde para sempre."
            "14":
              title: "Suba de volta para a Rota 4"
              text: "Com o fóssil em mãos, siga para a escada do noroeste de volta ao B1F. Na saída, a Jessie & James da Team Rocket bloqueiam a passagem, então vença a dupla e pegue a saída nordeste na metade leste da Rota 4, que desce rumo a Cerulean City."
          tips:
            clefairy: "Um spawn de 1% na caverna. Pegue um, e uma Moon Stone o torna Clefable."
          oak:
            clefairy: "Captura rara da caverna. Evolua com uma Moon Stone em Clefable."
            geodude: "Por toda a rocha. Evolui para Graveler, depois Golem por troca."
        route_4:
          note: "Descida curta até Cerulean. Mesma grama da Rota 3."
          intro: "O desnível do Mt. Moon até Cerulean City. Rapidinho."
          steps:
            "1":
              title: "Saia do Mt. Moon"
              text: "Você sai na ponta oeste da Rota 4, bem ao lado do Centro Pokémon do Mt. Moon, na boca da caverna. Cure ali se pulou o de dentro, depois siga a leste pelo platô alto rumo a Cerulean."
            "2":
              title: "Ache a Great Ball oculta"
              text: "Mais ou menos na metade do topo da rota, uma Great Ball está enterrada no chão aberto, encostada na parede norte. Fique no tile logo abaixo dela e aperte A virado para cima. Nada aparece na tela."
              hidden:
                great-ball: "Enterrada contra a parede do topo, perto do meio da rota. Fique um tile ao sul dela, vire para cima e aperte A. Nada aparece na tela."
            "3":
              title: "Pegue o TM04 (Whirlwind)"
              text: "Mais a leste pelo platô, uma Poké Ball fica no aberto com uma Lass patrulhando bem ao lado. Ande sobre ela para pegar o TM04, Whirlwind."
              items:
                tm-whirlwind: "Uma Poké Ball no platô, na metade leste da rota, logo a oeste da Lass. Ande sobre ela."
            "4":
              title: "Desça para Cerulean City"
              text: "Passado o TM, pule os desníveis. Eles levam a leste e despejam direto do outro lado, em Cerulean City."
          trainers:
            lass:
              note: "Você não consegue alcançar esta Lass na passagem. Ela fica na ponta leste do platô superior da Rota 4, e os desníveis de mão única te jogam em Cerulean antes de chegar até ela. Anote para uma volta mais tarde."
        cerulean_city:
          mart:
            blurb: "O Mart de Cerulean acrescenta Repel à prateleira, útil nas rotas cheias de treinadores até o Bill."
            buy: "Poké Balls para as Rotas 24–25 e um Repel ou dois para andar pelo mato em paz."
          gym:
            intro: "Um Swimmer, uma Jr. Trainer e chão livre, depois a Misty. O Staryu (Nv 18) e o Starmie (Nv 21) dela batem forte com golpes de Água, e o Recover do Starmie arrasta a luta, então feche rápido com um atacante Elétrico ou Grama. O ThunderShock do Pikachu é ideal."
            notes:
              swimmer: "NÃO vença este Treinador se você planeja fazer o glitch do Mew. O estágio de Ataque do Shellder dele define o nível do Mew."
              misty: "Vencer a Misty tranca o Swimmer atrás dela. Deixe-a de pé até depois da sua corrida do Mew."
          note: "Ginásio da Misty. Cascade Badge. E um Bulbasaur grátis."
          intro: "Uma cidade de ginásio aquático. Limpe a cidade, percorra as rotas ao norte até o Bill e volte para a Misty no fim. Se o Pikachu gostar de você, ainda tem um Bulbasaur grátis aqui."
          steps:
            "1":
              title: "Cure e abasteça"
              text: "Chegando da Rota 4, cure no Centro e abasteça no Mart. Deixe o Ginásio quieto por enquanto: tudo ao norte da cidade vale a pena antes, e a Misty fecha esta etapa."
            "2":
              title: "Pegue o Rare Candy escondido"
              text: "Um nível de graça, largado no chão aberto. Um Rare Candy está enterrado em um tile aberto perto do topo da cidade. Alinhe-se no quadrado logo abaixo dele e aperte A. Nada aparece na tela."
              hidden:
                rare_candy: "Em um tile aberto perto do topo da cidade. Fique logo abaixo dele e aperte A, nada aparece na tela."
            "3":
              title: "Pegue os extras e siga ao norte"
              text: "Pegue o Bulbasaur grátis na casa da Melanie se a amizade do Pikachu estiver alta. A casa assaltada perto do norte fica lacrada até mais tarde; quando a oficial sair, persiga o ladrão pelos fundos dela pelo TM28 (Dig). Depois siga ao norte para a Nugget Bridge (Rota 24)."
              items:
                bicycle: "Na Bike Shop, quando você troca o Bike Voucher que ganha em Vermilion. Você volta pra pegar, e nunca mais anda a pé."
            "4":
              title: "Desça de volta para a Misty"
              text: "Com o S.S. Ticket do Bill na mochila, volte ao sul pela Nugget Bridge até Cerulean. Cure no Centro, reponha as Poké Balls que as rotas consumiram e entre no Ginásio. Lidere com Pikachu ou um tipo Grama contra a equipe de Água da Misty."
          tips:
            bulbasaur: "Grátis na casa da Melanie quando o Pikachu está feliz. Evolui até Venusaur."
          oak:
            bulbasaur: "Presente grátis da casa da Melanie → Venusaur. Um basta."
          gifts:
            bulbasaur:
              from: "DA CASA DA MELANIE"
              unlock: "Amizade do Pikachu 147 ou mais"
        route_24:
          note: "Nugget Bridge. Oddish, Bellsprout e um Charmander grátis."
          intro: "Seu rival primeiro, depois cinco treinadores em sequência e um Rocket. E um Charmander grátis no fim."
          steps:
            "1":
              title: "Vença seu rival"
              text: "Saia de Cerulean para o norte e pise na Nugget Bridge. O Blue te embosca logo no pé da ponte, antes de qualquer treinador dela. Vença a equipe dele (liderada por Eevee) e siga subindo a ponte."
            "2":
              title: "Atravesse a Nugget Bridge"
              text: "Suba a ponte e enfrente os cinco treinadores em fila, depois o Rocket Grunt esperando no topo. Ele te entrega um Nugget e pede para você entrar na Team Rocket. RECUSE, e ele também te enfrenta."
            "3":
              title: "Pegue o Charmander grátis"
              text: "Na colina de grama depois da ponte, um garoto está pronto para te dar um Charmander grátis (Nv 10). Fale com ele e pegue: uma linha de Fogo forte até Charizard, e ótima contra a Erika depois."
            "4":
              title: "Pegue o TM45 (Thunder Wave)"
              text: "Alguns passos a leste do garoto, uma Poke Ball descansa na grama do alto: TM45, Thunder Wave. Chegue nela e pegue, um jeito barato de paralisar qualquer Pokémon que você queira capturar."
              items:
                tm-thunder-wave: "Na grama no topo da rota, alguns passos a leste do garoto do Charmander."
            "5":
              title: "Siga a leste para a Rota 25"
              text: "Com o Charmander e o TM na mão, siga o caminho a leste da colina até a Rota 25, a estrada que leva à cabana do Bill."
          tips:
            charmander: "Grátis do garoto aqui. Uma linha de Fogo forte até Charizard, e ótima contra a Erika depois."
          oak:
            charmander: "Presente grátis → Charizard. Pegue para a dex e para o ginásio de grama da Erika."
            oddish: "Comum na grama. Evolui para Vileplume com uma Leaf Stone."
            bellsprout: "A outra captura de 30% na grama. Evolui para Victreebel com uma Leaf Stone."
          gifts:
            charmander:
              from: "DO GAROTO NO ALTO"
        route_25:
          note: "A casa do Bill. Mesma grama da Rota 24."
          intro: "O caminho até a cabana do Bill. Solte-o da máquina para ganhar o ticket do S.S. Anne."
          steps:
            "1":
              title: "Chegue pela Nugget Bridge"
              text: "Entre pelo oeste, saindo do topo da Nugget Bridge na Rota 24. A trilha segue a leste até a Sea Cottage do Bill, repleta de Hikers, Youngsters e Cooltrainers. Vasculhe a grama e capture um Venonat se ainda precisar."
            "2":
              title: "Vasculhe a cerca oeste"
              text: "Poucos passos após a entrada oeste, encoste na borda de cima da rota. Vire para cima e aperte A contra a cerca para um Elixir oculto. Nada aparece na tela."
              hidden:
                elixir: "Borda norte perto da entrada oeste, logo após a Rota 24. Vire para cima e aperte A."
            "3":
              title: "Pegue o TM19 no labirinto"
              text: "Serpenteie pelo labirinto cercado no meio da rota, passando pelos Youngsters e pelo Jr. Trainer. A Poke Ball guardada no canto nordeste tem o TM19 (Seismic Toss)."
              items:
                tm-seismic-toss: "Canto nordeste do labirinto cercado, no meio da rota."
            "4":
              title: "Revise a grama perto da cabana"
              text: "Na reta final a leste, um pouco a oeste da porta da Sea Cottage do Bill e na mesma fileira, alinhe-se no tile logo abaixo e vire para cima apertando A para um Ether oculto. Nada aparece na tela."
              hidden:
                ether: "Extremo leste, a oeste da porta da cabana, na fileira dela. Fique um tile ao sul e aperte A para cima."
            "5":
              title: "Solte o Bill"
              text: "Entre na Sea Cottage no extremo leste e use a máquina do Bill para desfundi-lo. Ele te dá o S.S. Ticket. Volte a Vermilion via Cerulean."
              items:
                s_s_ticket: "Com o Bill, depois de libertá-lo da máquina na Sea Cottage. Sua passagem para o S.S. Anne em Vermilion."
          oak:
            venonat: "Uma captura Inseto/Veneno → Venomoth. Registre a base uma vez."
        route_5:
          note: "Ao sul até Vermilion. Pidgey, Rattata e Abra raro."
          intro: "Um trecho curto ao sul de Cerulean. Capture um Abra aqui. Vira um dos melhores Pokémon do jogo."
          trades:
            machoke:
              npc: "MENINA"
              title: "Machoke"
              where: "A casa do Túnel Subterrâneo no norte da Rota 5"
              note: "Um Machoke totalmente evoluído por um Cubone, e Pokémon trocados ganham mais XP. Cubone vem da Torre Pokémon, então é outra volta para depois."
          steps:
            "1":
              title: "Vá ao sul"
              text: "Saia de Cerulean ao sul; deixe um Pokémon na Day Care se quiser subir o nível."
            "2":
              title: "Pegue o Underground Path"
              text: "Os portões de Saffron estão bloqueados, então entre no prédio do Underground Path e túnele ao sul até a Rota 6. Um Full Restore e um X Special ocultos ficam pelo chão do túnel."
          oak:
            abra: "Capture rápido (ele só usa Teleport). Evolui para Kadabra, depois Alakazam por troca."
        route_6:
          note: "Até Vermilion. Mesma grama da Rota 5, mais pesca."
          intro: "O último trecho até Vermilion City. Pesque no lago assim que pegar um caniço."
          steps:
            "1":
              title: "Saia do Underground Path"
              text: "Emerja no norte e siga ao sul passando pelos treinadores."
            "2":
              title: "Entre em Vermilion"
              text: "Continue ao sul até Vermilion City."
        vermilion_city:
          mart:
            blurb: "Agora com Super Potions. Abasteça antes do S.S. Anne e do ginásio do Lt. Surge."
            buy: "Super Potions te levam pelo S.S. Anne. Repel mantém a Diglett's Cave calma na saída."
          gym:
            intro: "A porta até o Lt. Surge fica trancada por dois interruptores escondidos nas latas de lixo. Ache os dois e depois encare o Raichu solitário do Surge (Nv 28), que bate forte na equipe toda e pode paralisar. Um tipo Terra usando Dig o anula com facilidade, então leve Diglett, Sandshrew ou a linha do Nidoran."
            puzzle:
              "1": "Revise as latas de lixo ao longo das paredes para achar o primeiro interruptor. A posicao dele e aleatoria a cada visita."
              "2": "O segundo interruptor fica sempre numa lata vizinha a primeira, acima, abaixo, a esquerda ou a direita. Se errar, os dois reiniciam, entao cheque as vizinhas."
              "3": "Com os dois interruptores ativados, a porta ate Lt. Surge abre. Leve um tipo Terra para anular a equipe Eletrica dele."
          note: "Lt. Surge. Thunder Badge. Squirtle grátis depois."
          intro: "Uma cidade portuária com ginásio-quebra-cabeça. Suba no S.S. Anne primeiro pelo Cut, depois encare o Surge."
          steps:
            "1":
              title: "Pegue os itens"
              text: "Cure no Centro Pokémon, depois pegue o Bike Voucher no Pokémon Fan Club e o Old Rod com o Fishing Guru no lado oeste da cidade."
              items:
                bike_voucher: "Com o presidente do Pokémon Fan Club, no lado oeste da cidade. Troque por uma Bicycle na Bike Shop de Cerulean."
                old_rod: "Com o Fishing Guru na casa do lado oeste da cidade. Pesca Magikarp em qualquer lugar."
            "2":
              title: "Procure o Max Ether no vão entre os prédios"
              text: "Logo ao norte da porta da Pokémon Trade House, um vão estreito sobe entre dois prédios até a água do porto. Um Max Ether escondido fica no topo desse vão. Fique na praça abaixo dele, vire para cima em direção ao vão e aperte A. Nada aparece na tela."
              hidden:
                max-ether: "No topo do vão entre os dois prédios ao norte da porta da Trade House, encostado na água. Vire para cima a partir da praça e aperte A. Nada aparece."
            "3":
              title: "Entre no S.S. Anne pelo Cut"
              text: "A arvore do ginasio precisa do HM01 Cut. Entre no navio na doca sul, limpe as cabines e cure o Capitao enjoado para receber o Cut antes de desafiar Surge."
            "4":
              title: "Pegue o Squirtle gratis"
              text: "Apos a Insignia Thunder, a Oficial Jenny te da um Squirtle gratis. Depois siga para leste ate a Rota 11 e a Diglett's Cave."
          tips:
            squirtle: "Grátis da Officer Jenny depois da Thunder Badge. O terceiro starter de Kanto, evolui para Blastoise."
          oak:
            squirtle: "Presente grátis depois da insígnia → Blastoise. O último dos três starters."
          gifts:
            squirtle:
              from: "DA OFFICER JENNY"
              unlock: "Vença o Lt. Surge pela Thunder Badge"
        ss_anne:
          note: "O transatlântico de luxo. HM01 Cut e uma luta de rival."
          intro: "Um navio de uma vez só. Varra os itens, vença seu rival e pegue o Cut antes que ele parta para sempre."
          steps:
            "1":
              title: "Limpe as cabines por itens"
              text: "Embarque na doca sul. As cabines do B1F têm uma Max Potion, um Ether e o TM44 (Rest); no 1F pegue o TM08 (Body Slam) e cheque a lata de lixo mais distante da cozinha por uma Great Ball oculta. No 2F, duas cabines dão um Max Ether e um Rare Candy. Batalhe os Sailors e Gentlemen enquanto varre."
            "2":
              title: "Vença seu rival"
              text: "O Blue te embosca perto da escada da popa no 2F, logo antes da sala do capitão (Spearow Nv 19, Rattata Nv 16, Sandshrew Nv 18, Eevee Nv 20)."
            "3":
              title: "Pegue o HM01 Cut"
              text: "Cure o Capitão enjoado na cabine da popa; ele te entrega o HM01 Cut e o TM24 (Thunderbolt). Ensine Cut, depois desembarque. No instante em que você sai, o navio parte de vez, então pegue tudo antes."
              items:
                hm01_cut: "Com o Capitão na cabine da popa do S.S. Anne, depois de curar o enjoo dele. Ensina Cut para as arvorezinhas."
        route_11:
          note: "A leste de Vermilion. Pidgey, Rattata e Drowzee."
          intro: "Uma rota larga de grama a leste de Vermilion, com um atalho de caverna rumo a Pewter."
          trades:
            dugtrio:
              npc: "GAROTO"
              title: "Dugtrio"
              where: "No andar de cima do portão da Rota 11"
              note: "Te dá um Dugtrio para pular o spawn de 5% na Caverna Diglett, e a troca ainda o deixa com XP turbinado."
          steps:
            "1":
              title: "Saia de Vermilion"
              text: "Saia a leste de Vermilion para a grama larga da Rota 11. A boca da Diglett's Cave fica bem aqui no oeste, marcada pela placa, seu atalho rumo a Pewter para depois."
            "2":
              title: "Lute a leste"
              text: "Avance a leste pela grama, limpando os Gamblers, Youngsters e Engineers no caminho, e capture um Drowzee para um Hypno forte cedo."
            "3":
              title: "Vasculhe perto do portão leste"
              text: "Logo antes do portão leste ha um Escape Rope oculto. Pare no tile de grama a alguns quadrados a noroeste da porta do portão, olhe para cima e aperte A. Nada aparece na tela."
              hidden:
                escape-rope: "Um tile a oeste e tres ao norte da porta do portão leste, na grama. Fique abaixo dele, olhe para cima e aperte A. Nada aparece na tela."
            "4":
              title: "Pegue o Itemfinder"
              text: "No portão leste, fale com o Assistente do Oak pelo Itemfinder (ele so entrega quando você ja capturou 30+ especies). No andar de cima, um Garoto troca um Dugtrio turbinado pelo seu Diglett."
              items:
                itemfinder: "Com o Assistente do Oak na casa do portão leste, depois de capturar 30+ espécies. Aponta itens escondidos por perto."
            "5":
              title: "Pegue o atalho da Diglett's Cave"
              text: "Volte a oeste ate a boca da Diglett's Cave e entre, atravessando por baixo das montanhas num atalho rapido rumo a Pewter."
          oak:
            drowzee: "A captura notável da rota → Hypno, um Psíquico forte cedo."
        digletts_cave:
          note: "Um túnel-atalho. Diglett e Dugtrio raro."
          intro: "Uma caverna de um túnel só, cheia de Diglett. Ótima para pegar um Dugtrio e atalhar até Pewter."
          steps:
            "1":
              title: "Entre pela Rota 11"
              text: "Pegue a entrada sul perto do oeste da Rota 11 e siga o único túnel."
            "2":
              title: "Saia rumo a Pewter"
              text: "Capture um Diglett ou o raro Dugtrio, depois saia ao norte na Rota 2 abaixo de Pewter."
          oak:
            diglett: "Por toda parte aqui → Dugtrio, um tipo Terra rápido. Pegue a base."
        route_9:
          note: "A leste até Rock Tunnel. Ninho de Nidoran."
          intro: "Uma rota longa de grama a leste de Cerulean, cheia das duas linhas de Nidoran."
          steps:
            "1":
              title: "Corte a entrada de Cerulean"
              text: "A Rota 9 sai a leste de Cerulean, barrada só por uma árvore que você corta na borda da cidade. Pise na grama alta, onde as duas linhas de Nidoran fervilham sob seus pés."
            "2":
              title: "Desça pelo TM30 Teleport"
              text: "Logo após a entrada, desça ao sul até a depressão a sudoeste. A Poke Ball na grama baixa é o TM30, Teleport, encaixada ao lado do primeiro Hiker."
              items:
                tm-teleport: "Depressão a sudoeste logo após a entrada de Cerulean, na grama baixa perto do primeiro Hiker."
            "3":
              title: "Cheque a árvore solitária"
              text: "Volte ao norte até a árvore solitária na grama a noroeste, logo acima da primeira Jr. Trainer. Fique no quadrado a leste dela e aperte A por um Ether oculto. Nada aparece na tela."
              hidden:
                ether: "A árvore solitária na grama a noroeste, ao norte da primeira Jr. Trainer; aperte A pelo lado leste dela."
            "4":
              title: "Avance a leste até a Rota 10"
              text: "Com os dois tesouros no bolso, siga a leste pela grama alta, trocando golpes com os Bug Catchers, Jr. Trainers e Hikers espalhados pela crista. O caminho emenda direto na Rota 10 e na porta do Rock Tunnel."
        route_10:
          note: "A porta do Rock Tunnel. Magnemite por toda parte."
          intro: "Uma rota curta ao redor da boca norte do Rock Tunnel. Magnemite domina a grama."
          steps:
            "1":
              title: "Cure no Centro"
              text: "Chegue da Rota 9 à parte alta da Rota 10 e entre no Centro Pokémon ao lado da boca norte do Rock Tunnel. Recupere-se, porque a caverna adiante é longa e escuríssima."
            "2":
              title: "Capture um Magnemite"
              text: "Varra a grama perto da boca norte por Magnemite e o raro Machop, e derrote a Jr Trainer que patrulha logo abaixo do Centro."
            "3":
              title: "Pegue a Super Potion escondida"
              text: "Um tile à direita da entrada norte do Rock Tunnel, aperte A no quadrado vazio ao lado da boca para uma Super Potion escondida. Nada aparece na tela."
              hidden:
                super-potion: "Um tile a leste da boca norte do Rock Tunnel; aperte A virado à direita. Nada aparece na tela."
            "4":
              title: "Entre no Rock Tunnel"
              text: "Ensine HM05 Flash a um Pokémon primeiro, depois entre pela boca norte do túnel."
            "5":
              title: "Cace o Max Ether escondido"
              text: "Saindo pela boca sul do Rock Tunnel na parte baixa da Rota 10, caminhe alguns tiles a leste pela trilha e aperte A virado ao norte para um Max Ether escondido. Nada aparece na tela."
              hidden:
                max-ether: "A leste da boca sul do Rock Tunnel, na parte baixa da Rota 10; aperte A virado para cima. Nada aparece na tela."
            "6":
              title: "Desça para Lavender Town"
              text: "Limpe os Hikers e o Pokémaniac na parte baixa da Rota 10, depois caminhe ao sul até Lavender Town."
          oak:
            magnemite: "Uma captura de 50% na grama aqui → Magneton. Cobertura Elétrica para o túnel escuro."
        rock_tunnel:
          note: "Caverna escuríssima. Precisa de Flash."
          intro: "Um labirinto de dois andares que fica preto sem Flash. Onix, Machop e Geodude vivem dentro."
          steps:
            "1":
              title: "Use Flash"
              text: "Ensine HM05 Flash (Assistente do Prof. Carvalho no portão da Rota 2) antes de entrar e ilumine cada tela lá dentro."
            "2":
              title: "Desça e suba"
              text: "Pegue as escadas até o B1F, cruze pelos Hikers e suba de volta ao 1F do outro lado."
            "3":
              title: "Saia para Lavender"
              text: "Saia pela boca sul na Rota 10 de baixo e entre em Lavender Town."
          oak:
            machop: "Comum na caverna → Machoke, depois Machamp por troca. Um Lutador forte."
            onix: "Só aparece no B1F. Uma captura Rocha/Terra robusta que vale a caçada."
        lavender_town:
          mart:
            blurb: "O Mart de Lavender já traz Great Balls e Revives, equipamento para a Pokémon Tower ao lado."
            buy: "Great Balls para a linha do Gastly na Tower e alguns Revives. Super Repel reduz os fantasmas."
          note: "A cidade fantasma. A Pokémon Tower se ergue."
          intro: "Uma cidade quieta à sombra da Pokémon Tower. Você vai precisar do Silph Scope antes de limpá-la."
          steps:
            "1":
              title: "Tente a Torre"
              text: "Entre na Pokémon Tower. Você encontra um fantasma invencível no 6F e ainda não passa."
            "2":
              title: "Desvie pelo Silph Scope"
              text: "Vá a oeste pela Rota 8 até Celadon e destrua o Rocket Hideout pelo Silph Scope."
            "3":
              title: "Volte pelo Poké Flute"
              text: "Volte, limpe a Torre e solte o Mr. Fuji. Ele dá o Poké Flute para acordar os Snorlax dorminhocos."
        route_8:
          note: "A oeste até Celadon. Pidgey, Abra, Jigglypuff."
          intro: "A estrada de Lavender rumo a Saffron e Celadon. Mais uma chance de Abra."
          steps:
            "1":
              title: "Vá a oeste"
              text: "Limpe a Lass, o Gambler e o Super Nerd rumo ao portão leste de Saffron."
            "2":
              title: "Pegue o Underground Path"
              text: "Os guardas de Saffron querem uma bebida. Pule-os túnelando a oeste sob a cidade até a Rota 7."
        route_7:
          note: "Rota-portão até Celadon. Pidgey e Abra."
          intro: "Um conector minúsculo entre Saffron e Celadon. Entra e sai."
          steps:
            "1":
              title: "Cruze até Celadon"
              text: "Emerja do Underground Path e caminhe a oeste."
            "2":
              title: "Entre em Celadon"
              text: "Passe pelo portão até Celadon City."
        celadon_city:
          store:
            blurb: "A maior loja de Kanto: seis andares de Poké Balls, TMs, pedras de evolução, vitaminas e bebidas de máquina. Pegue o elevador para qualquer andar e veja o que ele vende e por quanto."
            floors:
              "1F":
                name: "Balcão de Serviço"
                motto: '"Encontre o que precisar na Celadon Dept. Store!"'
                note: "Recepção e o quadro da loja. O entregador do Poké Mart espera aqui depois que você limpa o Rocket Hideout. Nada para comprar neste andar, então pegue o elevador."
              "2F":
                name: "Mercado do Treinador"
                motto: '"Itens de primeira para treinadores!"'
                rec:
                  great_ball: "Melhora barata na taxa de captura, compre um estoque para as rotas do meio do jogo."
                  super_potion: "Sua cura principal até as Hyper Potions aparecerem."
                  take_down: "STAB físico confiável para muitos Pokémon do começo."
              "3F":
                name: "Loja de Video Game"
                motto: '"Video games em exibição, e uma TM grátis."'
                note: "Sem balcão de vendas, mas o homem atrás da mesa te dá uma TM de graça."
                gift_desc: "Ensina Counter: devolve o dobro do dano de um golpe físico. Uma boa resposta a atacantes Normal e Lutador."
              "4F":
                name: "Presentes do Sábio"
                motto: '"Especial de evolução: todas as pedras em estoque!"'
                rec:
                  water_stone: "A única loja de Water Stone de Kanto. Evolua seu Eevee em Vaporeon aqui."
              "5F":
                name: "Farmácia"
                motto: '"Deixe seu Pokémon no máximo."'
              "ROOF":
                name: "Praça da Cobertura"
                motto: '"Máquinas de bebida e uma criança com muita sede."'
                note: "Compre uma de cada bebida para a garota sedenta e ela troca cada uma por uma TM. Pegue uma Fresh Water extra para os guardas do portão de Saffron enquanto está aqui."
                rec:
                  fresh_water: "Troque uma com a garota pela TM13 Ice Beam."
                  soda_pop: "Troque uma pela TM48 Rock Slide."
                  lemonade: "Troque uma pela TM49 Tri Attack."
          gym:
            intro: "Um jardim de arvorezinhas escondendo vários treinadores, depois a Erika. O Tangela (Nv 30), o Weepinbell (Nv 32) e o Gloom (Nv 32) dela caem para Fogo, Voador, Psíquico ou Gelo, então lidere com um desses e carregue curas de status para o Sleep Powder e o Stun Spore deles. Corte as arvorezinhas para chegar mais rápido nela."
          note: "Ginásio da Erika. Rainbow Badge. Loja, Eevee e o Game Corner."
          intro: "A cidade grande. Compre na loja de departamentos, pegue um Eevee, vença a Erika e assalte o Rocket Game Corner."
          steps:
            "1":
              title: "Chegue pela Route 7"
              text: "Entre pelo portão da Route 7, no lado leste de Celadon, onde a maior cidade de Kanto se abre: uma loja de departamentos de seis andares, um Game Corner e o ginásio de Grama da Erika. Cure seu time no Centro Pokémon logo adiante antes de começar."
            "2":
              title: "Vasculhe as árvores do nordeste"
              text: "Antes de entrar na cidade, suba pela grama alta que corre ao longo da borda leste, até o canto nordeste. Fique no topo da faixa, um tile abaixo da árvore solitária, olhe para cima e aperte A para um PP Up escondido. Nada aparece na tela, então confie no lugar."
              hidden:
                pp-up: "No topo da faixa de grama alta do extremo leste, na árvore que fecha a ponta norte (a sudeste do Centro Pokémon). Olhe para cima e aperte A; nada aparece."
            "3":
              title: "Compre na Dept. Store"
              text: "Vá até a loja de departamentos de seis andares, no lado oeste. Pegue o TM18 (Counter) grátis com o atendente no 3F. Compre três bebidas nas máquinas do terraço e dê à garota lá em cima por TM13 (Ice Beam), TM48 (Rock Slide) e TM49 (Tri Attack). Compre pedras de evolução no 4F, e guarde uma bebida extra para os guardas de Saffron."
            "4":
              title: "Pegue o Eevee, depois o Ginásio"
              text: "Pegue o Eevee de presente no último andar da Celadon Mansion (atrás do Centro Pokémon) e a Coin Case com o homem no restaurante, depois entre no Ginásio atrás das árvores. Fogo, Voador ou Psíquico vence a Grama e Veneno da Erika; corte as arvorezinhas de dentro para pular o labirinto."
              items:
                coin_case: "Com o homem caído no restaurante de Celadon, ao sul do Game Corner. Guarda as fichas que você ganha nos caça-níqueis."
            "5":
              title: "Vá ao Game Corner"
              text: "Ganhe fichas por prêmios como Porygon e Vulpix, depois ache o interruptor no pôster para entrar no Esconderijo Rocket."
          tips:
            eevee: "Grátis no Condominiums. Evolua com uma pedra em Vaporeon, Jolteon ou Flareon."
            porygon: "O único Porygon do jogo. 9999 fichas do Game Corner, e não há outro jeito."
            vulpix: "Só por troca na natureza no Yellow. O Game Corner (1000 fichas) é sua fonte fácil."
          oak:
            eevee: "Presente → um entre Vaporeon / Jolteon / Flareon. Registre a base uma vez."
            porygon: "Exclusivo do Game Corner. O único Porygon que você terá. Pegue um."
          gifts:
            eevee:
              from: "DO TELHADO DA MANSÃO"
        rocket_hideout:
          note: "A base da Team Rocket. Pegue o Silph Scope."
          intro: "O labirinto sob o Game Corner. Deslize pelas placas giratórias, vença o Giovanni e pegue o Silph Scope."
          steps:
            "1":
              title: "Abra a escada"
              text: "No Game Corner de Celadon, um homem de preto vigia o pôster solitário na parede norte. Vença ele, aperte o botão escondido atrás do pôster e a escada para o B1F se abre."
            "2":
              title: "Deslize pelas placas giratórias"
              text: "O B1F é forrado de placas de seta que te lançam em linha reta até uma parede ou placa de parada te segurar, então alinhe cada giro antes de pisar. Rocket Grunts patrulham os pontos de parada. Use as placas para varrer os item balls espalhados pelo andar."
            "3":
              title: "Deslize a oeste pelo Escape Rope"
              text: "Gire até a metade oeste do B1F, onde um Escape Rope está num ball. Guarde ele agora; pode te tirar direto do esconderijo se o labirinto te vencer."
              items:
                escape-rope: "Metade oeste do B1F. Pise no ball na grade (11,14)."
            "4":
              title: "Pegue a Hyper Potion"
              text: "Logo a sudoeste do Escape Rope, outro ball guarda uma Hyper Potion. Pegue para uma boa cura de 200 HP para levar às batalhas contra os grunts lá embaixo."
              items:
                hyper-potion: "Lado oeste do B1F, uma fileira a sudoeste do ball do Escape Rope."
            "5":
              title: "Procure o PP Up oculto"
              text: "De volta ao centro do B1F, perto de onde você entrou, fique na casa (20,15) e aperte A virado para leste. Um PP Up oculto está enterrado na casa ao seu lado, mesmo que nada apareça na tela."
              hidden:
                pp-up: "Centro do B1F. Aperte A virado para leste em (20,15). Nada aparece na tela."
            "6":
              title: "Desça a escada para o B2F"
              text: "Gire de volta ao canto nordeste do B1F e desça a escada para o B2F, o próximo anel do labirinto giratório."
            "7":
              title: "Pegue o Nugget"
              text: "Perto do meio do B2F um ball guarda um Nugget, uma pepita cara que vende por uma boa grana em qualquer loja. Alinhe as placas e chegue nele pelo oeste."
              items:
                nugget: "Centro do B2F, no ball na grade (16,8)."
            "8":
              title: "Pegue o TM07 (Horn Drill)"
              text: "Deslize para a faixa oeste do B2F pelo TM07, Horn Drill, um golpe de nocaute imediato que só acerta em alvos mais lentos. Pegue o ball e guarde o TM."
              items:
                tm-horn-drill: "Lado oeste do B2F, no ball na grade (6,12)."
            "9":
              title: "Pegue a Moon Stone"
              text: "No canto extremo noroeste do B2F fica uma Moon Stone, a pedra de evolução de Nidoran, Clefairy e Jigglypuff. Ela se esconde fácil colada na parede, então faça a viagem até ela."
              items:
                moon-stone: "Canto extremo noroeste do B2F, no ball na grade (1,11)."
            "10":
              title: "Pegue a Super Potion"
              text: "Lá no sudoeste do B2F, mais um ball guarda uma Super Potion. Pegue antes de deixar o andar."
              items:
                super-potion: "Sudoeste do B2F, no ball na grade (3,21)."
            "11":
              title: "Desça para o B3F"
              text: "Volte ao norte do B2F e desça a escada para o B3F. Os Rockets aqui batem um pouco mais forte, então mantenha seu líder saudável."
            "12":
              title: "Pegue o Rare Candy"
              text: "Um Rare Candy descansa num ball perto do meio do B3F. Um nível de graça para qualquer Pokémon; guarde para o que você quiser empurrar por cima de uma evolução ou um ginásio."
              items:
                rare-candy: "Centro do B3F, no ball na grade (20,14)."
            "13":
              title: "Pegue o TM10 (Double-Edge)"
              text: "No lado leste do B3F, um ball guarda o TM10, Double-Edge, um golpe Normal pesado que devolve um quarto do dano em recuo sobre você. Pegue ele."
              items:
                tm-double-edge: "Lado leste do B3F, no ball na grade (26,17)."
            "14":
              title: "Procure o Nugget oculto"
              text: "Uma casa a leste do ball do Double-Edge, fique em (27,18) e aperte A virado para cima. Um segundo Nugget oculto está enterrado ali mesmo, sem nada aparecer na tela. Dois Nuggets deste esconderijo é uma boa bolada."
              hidden:
                nugget: "Borda leste do B3F, uma casa a leste do ball do TM10. Aperte A virado para cima em (27,18). Nada aparece na tela."
            "15":
              title: "Desça para o B4F"
              text: "Desça a última escada para o B4F, o fundo do esconderijo. Giovanni está em algum lugar aqui embaixo, mas um elevador trancado separa você do escritório dele."
            "16":
              title: "Pegue a Lift Key na sala do grunt"
              text: "Na sala noroeste do B4F, um Rocket Grunt solitário guarda um ball. Vença ele e pegue a Lift Key, a chave que enfim liga o elevador até o escritório do Giovanni."
              items:
                lift-key: "Sala noroeste do B4F, no ball na grade (10,2), ao lado do Rocket Grunt."
            "17":
              title: "Pegue o TM02 (Razor Wind)"
              text: "Duas casas ao sul da Lift Key, na mesma sala noroeste, um ball guarda o TM02, Razor Wind, um golpe Normal de dois turnos. Pegue enquanto está por aqui."
              items:
                tm-razor-wind: "Sala noroeste do B4F, no ball na grade (9,4), logo ao sul do ball da Lift Key."
            "18":
              title: "Pegue o HP Up"
              text: "Ainda na metade oeste do B4F, um pouco ao sul da sala da Lift Key, um ball guarda um HP Up. Um aumento permanente de HP para um Pokémon; pegue ele."
              items:
                hp-up: "Oeste do B4F, no ball na grade (10,12), ao sul da sala da Lift Key."
            "19":
              title: "Pegue o Iron"
              text: "Lá no sul do B4F, um ball guarda um Iron, a vitamina que aumenta a Defesa de forma permanente. Deslize pelas placas até ele antes de ir ao elevador."
              items:
                iron: "Sul do B4F, no ball na grade (12,20)."
            "20":
              title: "Pegue o elevador até o Giovanni"
              text: "Com a Lift Key, atravesse até o elevador no leste do B4F e use ele. Ele te leva ao corredor selado onde Jessie & James bloqueiam a passagem. Limpe a dupla e siga rumo ao escritório lá em cima."
            "21":
              title: "Vença o Giovanni"
              text: "No topo do corredor está o próprio Giovanni: Onix (Nv 25), Rhyhorn (Nv 24) e Persian (Nv 29). Água ou Grama derrete os dois primeiros, e qualquer coisa rápida resolve o Persian. Ele cai, e o ball atrás dele agora é seu."
            "22":
              title: "Pegue o Silph Scope"
              text: "Com o Giovanni fora do caminho, avance e pegue o ball na casa que ele guardava. Dentro está o Silph Scope, o aparelho que revela os fantasmas que assombram a Pokémon Tower em Lavender Town."
              items:
                silph-scope: "Topo do corredor do Giovanni, nordeste do B4F, no ball na grade (25,2)."
            "23":
              title: "Procure a Super Potion oculta"
              text: "Mais uma casa ao norte do Silph Scope, bem no topo do corredor, fique na casa do Silph Scope e aperte A virado para cima. Uma Super Potion oculta está guardada na casa acima, sem nada aparecer na tela."
              hidden:
                super-potion: "Bem no topo do corredor do Giovanni. Fique na casa do Silph Scope (25,2) e aperte A virado para cima. Nada aparece na tela."
            "24":
              title: "Saia rumo à Pokémon Tower"
              text: "É o esconderijo inteiro varrido. Use um Escape Rope ou pegue o elevador de volta ao B1F e siga para Lavender Town: o Silph Scope libera a Pokémon Tower a seguir."
        pokemon_tower:
          note: "A torre assombrada de Lavender. Fantasmas e o Poké Flute."
          intro: "Suba a torre com o Silph Scope para revelar os fantasmas, vencer seu rival e soltar o Mr. Fuji."
          steps:
            "1":
              title: "Suba com o Silph Scope"
              text: "Entre vindo de Lavender Town e comece a subir. Com o Silph Scope ativo, os Gastly, Haunter e Cubone selvagens que assombram cada andar finalmente tomam forma, então dá pra batalhar em vez de tatear no escuro."
            "2":
              title: "Vença seu rival no 2F"
              text: "O Blue te embosca ao atravessar o segundo andar, com a equipe por volta do Nv 25. O Eevee dele já evoluiu conforme o histórico que você marcou nas batalhas anteriores, então comece com um counter pra forma que ele tomou e suba pela escada oeste."
            "3":
              title: "Pegue o Escape Rope no 3F"
              text: "No terceiro andar, uma ball solitária espera colada na parede de cima, bem no centro. Suba até ela pra pegar um Escape Rope, sua saída na hora se os fantasmas te desgastarem."
              items:
                escape-rope: "Centro-topo do 3F, contra a parede norte; aproxime por baixo."
            "4":
              title: "Pegue o Elixir no 4F"
              text: "No quarto andar, a primeira de três balls fica perto do meio da sala. Chegue por ela pela direita pra levar um Elixir, que recarrega o PP de todos os golpes de uma vez."
              items:
                elixir: "Centro do 4F, aproximado pela direita."
            "5":
              title: "Desça pro HP Up"
              text: "Logo abaixo do Elixir, encostada na parede de baixo, uma segunda ball guarda um HP Up, um aumento permanente no HP máximo de um Pokémon. Alcance pela esquerda."
              items:
                hp-up: "Borda sul do 4F, logo abaixo do Elixir."
            "6":
              title: "Embolse o Awakening"
              text: "Alguns passos a oeste pela fileira do meio, a última ball do 4F é um Awakening, uma cura na hora pra Sleep e útil contra os fantasmas sonolentos da Torre. Depois siga pra escada oeste."
              items:
                awakening: "Centro-oeste do 4F, a oeste do Elixir, perto da escada de subida."
            "7":
              title: "Tateie o Elixir oculto no 5F"
              text: "Chegando ao quinto andar pela escada oeste, entre um ou dois tiles e vire pra baixo. Aperte A no tile vazio logo à sua frente pra achar um Elixir oculto; nada aparece na tela, mas ele cai na sua bag."
              hidden:
                elixir: "Logo a sudeste da escada oeste do 5F. Aperte A virado pra baixo no tile vazio; nenhuma ball aparece."
            "8":
              title: "Garanta o Nugget"
              text: "Um pouco mais adentro do quinto andar, uma ball fica embaixo, no lado oeste. Pegue pela direita pra levar um Nugget, que vale um bom bolo de dinheiro em qualquer loja."
              items:
                nugget: "Área oeste-sul do 5F, alguns tiles depois do Elixir oculto; aproxime pela direita."
            "9":
              title: "Fisgue o Rare Candy no 6F"
              text: "O prêmio do sexto andar fica lá no lado oeste, perto do topo. Suba até ele pra pegar um Rare Candy, um nível na hora pro Pokémon que mais precisar."
              items:
                rare-candy: "Lado oeste do 6F, mais pro topo; aproxime por baixo."
            "10":
              title: "Pegue o X Accuracy"
              text: "De volta pro sudeste, a última ball da Torre é um X Accuracy, um item de batalha que afia seus próximos golpes. Daqui é um pulo até a escada que o fantasma guarda."
              items:
                x-accuracy: "Sudeste do 6F; aproxime pela direita."
            "11":
              title: "Limpe o Marowak fantasma"
              text: "Um Marowak fantasma Nv 30 fica sobre a escada de subida, de luto entre os túmulos. O Silph Scope deixa você vê-lo e enfrentá-lo, então derrube-o pra abrir caminho. Ele nunca pode ser capturado, só posto pra descansar."
            "12":
              title: "Solte o Mr. Fuji no 7F"
              text: "No topo, a Jessie & James da Equipe Rocket bloqueiam o caminho até o Mr. Fuji. Vença a dupla e fale com o velho pra libertá-lo. Ele te entrega o Poké Flute, que acorda os Snorlax dorminhocos das Rotas 12 e 16."
              items:
                poke_flute: "Com o Mr. Fuji no topo da torre, depois que o Marowak fantasma descansa. Acorda o Snorlax que bloqueia as Rotas 12 e 16."
          tips:
            gastly: "A única linha de Gengar do jogo. Evolua Gastly para Haunter, depois Gengar por troca."
          oak:
            gastly: "Andares cheios de fantasmas → Haunter, depois Gengar por troca. A única linha do jogo."
            cubone: "Uma captura rara da Torre → Marowak, um tipo Terra forte."
        route_12:
          note: "Silence Bridge. Oddish, Bellsprout e um Snorlax."
          intro: "Uma longa ponte de pesca bloqueada por um Snorlax dorminhoco. Acorde-o com o Poké Flute para passar."
          steps:
            "1":
              title: "Desça de Lavender Town"
              text: "Entre na Rota 12 pelo norte, vindo direto de Lavender Town. Esta é a Silence Bridge, uma longa ponte de pesca sobre água aberta. Entre no portão lá em cima e suba ao 2F para pegar de graça o TM39 (Swift) com a garota dos binóculos, depois desça pelo trecho ao sul, batalhando os Fishermen espalhados pela metade norte."
            "2":
              title: "Acorde o Snorlax"
              text: "No meio da ponte, um Snorlax Nv 30 bloqueia o único caminho. Toque o Poke Flute (do Mr. Fuji em Lavender Town) para acordá-lo, depois batalhe ou nocauteie para abrir a passagem ao sul. É um de apenas dois Snorlax do jogo, então jogue algumas balls se quiser a captura."
            "3":
              title: "Vasculhe o beco oeste"
              text: "Logo depois do Snorlax, siga a estreita ponte de terra a oeste ate um beco sem saida murado. Fique no piso mais a oeste e aperte A virado para leste para um Hyper Potion oculto. Nada aparece na tela."
              hidden:
                hyper-potion: "O beco sem saida no extremo oeste da ponte de terra do Snorlax. Vire para leste no piso mais a oeste e aperte A. Nada aparece na tela."
            "4":
              title: "Desca pela ponte"
              text: "Continue ao sul pela ponte, enfrentando o Rocker e o ultimo Fisherman conforme o caminho permitir. Entre na casa do Fishing Guru pelo caminho para pegar o Super Rod, a melhor vara do jogo."
              items:
                super_rod: "Com o Fishing Guru na casa no meio da Silence Bridge. A melhor vara, pesca a maior variedade de Pokémon de Água."
            "5":
              title: "Pegue o Iron no beco"
              text: "Perto do extremo sul, logo após o ultimo Fisherman, uma Poke Ball fica num beco murado do lado oeste. Entre e pegue o Iron, que aumenta permanentemente a Defesa de um Pokémon."
              items:
                iron: "Beco do lado oeste perto da saida sul, ao lado do Fisherman do sul. A Poke Ball encostada na parede."
            "6":
              title: "Siga para a Rota 13"
              text: "Limpe o ultimo Jr. Trainer e atravesse a grama alta la embaixo (Oddish, Bellsprout e o raro Farfetch'd) ate a saida sul para a Rota 13."
          tips:
            farfetchd: "Uma captura rara de 5% na grama. O único Farfetch'd selvagem por perto."
            snorlax: "Um de apenas dois Snorlax do jogo. Uma parede Nv 30. Faça dormir ou paralise, e jogue balls."
          oak:
            slowpoke: "Surfe a água por Slowpoke → Slowbro, um Água/Psíquico robusto."
            farfetchd: "O pato raro da grama. Pegue o único Farfetch'd selvagem aqui."
        route_13:
          note: "Labirinto de desníveis ao sul. Oddish, Bellsprout, Ditto."
          intro: "Um labirinto sinuoso de cercas e desníveis. Fique atento a um Ditto selvagem."
          steps:
            "1":
              title: "Desca serpenteando da Rota 12"
              text: "A Rota 13 e um ziguezague de cercas e desniveis que descem da Rota 12. Siga o caminho enquanto ele serpenteia a oeste e ao sul, limpando os Bird Keepers, o par de Beauties e o Biker solitario, e observe a grama por um Ditto selvagem que Transforma no que enfrenta."
            "2":
              title: "Descubra o Calcium perto da placa"
              text: "Ao longo da cerca sul, um quadrado a leste da primeira placa Trainer Tips, um Calcium se esconde na grama. Fique no tile a leste dele, vire para oeste e aperte A para pega-lo. Nada aparece na tela, entao confie no bip do Itemfinder."
              hidden:
                calcium: "Cerca sul, um tile a leste da primeira placa Trainer Tips. Vire para oeste e aperte A; nada aparece na tela."
            "3":
              title: "Desenterre o PP Up do canto"
              text: "Siga a cerca ate o canto sudoeste, o ultimo trecho antes da passagem para a Rota 14. Um PP Up esta enterrado ali. Alinhe-se no quadrado logo acima dele, vire para baixo e aperte A. Nada aparece na tela."
              hidden:
                pp-up: "Canto sudoeste, o tile de baixo perto da saida para a Rota 14. Fique acima dele, vire para baixo e aperte A; nada aparece na tela."
            "4":
              title: "Saia a oeste para a Rota 14"
              text: "Com os dois reforcos de status no bolso, desca pelo ultimo trecho de desniveis e saia a oeste para a Rota 14."
          tips:
            ditto: "Uma captura de 5% que Transforma no que enfrenta. Útil para a dex."
          oak:
            ditto: "Capture a bolha que Transforma aqui. Divertida e útil para breeding em gerações futuras."
        route_14:
          note: "Fileira de bikers e aves. Oddish, Bellsprout, Venonat."
          intro: "Uma longa diagonal de Bird Keepers e Bikers. Um Venomoth raro voa por aqui."
          steps:
            "1":
              title: "Corte pelos desníveis"
              text: "Lute com os Bird Keepers em cima e os Bikers embaixo. Um tipo Elétrico ou Psíquico varre os dois."
            "2":
              title: "Siga para a Rota 15"
              text: "Siga os desníveis a sudoeste até a Rota 15."
        route_15:
          note: "A oeste até Fuchsia. Oddish, Bellsprout, Venonat."
          intro: "O último trecho até Fuchsia, por um campo cercado de treinadores."
          steps:
            "1":
              title: "Cruze o campo cercado"
              text: "Entre em Route 15 pela cancela de Route 14, a leste, e siga para oeste pelo campo cercado. Uma dupla fileira de Bird Keepers, Beauties, Bikers e Jr. Trainers lota a pista, então recupere o HP antes de encarar."
              items:
                exp_all: "Com o Assistente do Oak no 2F da cancela, depois de capturar 50 espécies. Divide o EXP das lutas com todo o time."
            "2":
              title: "Pegue o TM20 Rage no canto noroeste"
              text: "Perto do fim oeste do campo, corte para o norte, saindo da pista principal. Uma Poke Ball encravada no canto noroeste guarda o TM20 Rage, logo antes da cancela para Fuchsia."
              items:
                tm-rage: "Canto noroeste da rota, na fileira de cima, a leste da cancela de Fuchsia."
            "3":
              title: "Entre em Fuchsia"
              text: "Volte para a pista principal e atravesse a oeste pela cancela até Fuchsia City."
        fuchsia_city:
          mart:
            blurb: "Fuchsia vende Ultra Balls e Hyper Potions, o kit para a Safari Zone e o ginásio do Koga."
            buy: "Ultra Balls aumentam suas chances nas capturas raras. Hyper Potions e um Revive te levam contra o Koga."
          gym:
            intro: "O chão do ginásio é um labirinto de paredes invisíveis. Vá tateando, vencendo os Jugglers e Tamers lá dentro, e depois enfrente o Koga. Os três Venonat (Nv 44, 46, 48) e o Venomoth (Nv 50) dele apostam em Toxic e Double Team, então leve um atacante Psíquico rápido e carregue Antidotes."
            puzzle:
              "1": "A sala toda e bloqueada por paredes invisiveis. Ande pelo espaco aberto ate esbarrar numa, depois siga ao longo dela para achar as passagens."
              "2": "Serpenteie para cima e ao redor das barreiras rumo ao topo da sala, pegando cada treinador opcional conforme o caminho permitir."
              "3": "A ultima abertura leva a Koga. Leve um atacante Psiquico ou Terra e carregue Antidotos para o Toxic dele."
          note: "Ginásio do Koga. Soul Badge. Safari Zone ao lado."
          intro: "Lar da Safari Zone. Pegue Surf e Strength na Safari primeiro, depois feche a etapa no Koga."
          steps:
            "1":
              title: "Cure e reabasteça"
              text: "Chegue pela Rota 15, cure no Centro e abasteça no Mart. Deixe o Ginásio para depois: a Safari Zone guarda o HM03 Surf e os Gold Teeth, e o Koga fecha esta etapa."
            "2":
              title: "Pesque no lago do Warden"
              text: "Use o Super Rod no lago para um Gyarados selvagem, uma captura exclusiva do Yellow aqui."
              items:
                good_rod: "Com o pescador na casinha perto da cancela oeste. Pesca melhor que o Old Rod."
            "3":
              title: "Explore a Safari Zone"
              text: "Siga ao norte para a Safari Zone pelo HM03 Surf e os Gold Teeth."
            "4":
              title: "Troque pelo Strength, depois encare o Koga"
              text: "Devolva os Gold Teeth ao Warden pelo HM04 Strength e pegue o Rare Candy la dentro depois de te-lo. Depois cure, reabasteça e tateie pelo labirinto de paredes invisíveis do ginásio. Leve um tipo Psíquico ou Fogo rapido e Antídotos para o Toxic do Koga."
              items:
                hm04_strength: "Com o Warden da Safari Zone, depois de devolver os Gold Teeth. Ensina Strength para empurrar pedras."
          tips:
            gyarados: "Super Rod no lago do Warden por um Gyarados selvagem. Sem grind de Magikarp."
          oak:
            gyarados: "Pesque um direto do lago do Warden. Um atalho raro do Yellow para Gyarados."
        safari_zone:
          note: "Parque de captura de 500 passos. Scyther, Pinsir, Chansey, Dratini e mais."
          intro: "Pague, pegue 30 Safari Balls e capture os mais raros do jogo. Além do HM03 Surf e do Gold Teeth."
          steps:
            "1":
              title: "Pague a entrada no portão"
              text: "Pague 500 no portão da Safari Zone por 30 Safari Balls e um relógio de 500 passos. Nenhum treinador espera lá dentro, e Poké Balls comuns, HMs e desmaios ficam todos fora de jogo até você sair, então o passeio é seu para percorrer à vontade."
            "2":
              title: "Entre e aprenda as regras"
              text: "Suba para a Área Central. Jogue Bait para congelar um Pokémon no lugar ou Rock para baixar a resistência de captura (ao custo de ele fugir mais cedo), e lembre que nada em que você joga uma ball pode ser enfraquecido antes. Varra as quatro áreas por Scyther, Pinsir, Kangaskhan, Tauros, Chansey e Tangela, e use o Super Rod nos lagos por Dratini enquanto dá a volta."
            "3":
              title: "Pegue o Nugget"
              text: "Reto pelo meio da Área Central, na grama ao norte da entrada, há uma ball solitária com um Nugget. Guarde para vender por bons 5000 depois."
              items:
                nugget: "Área Central, subindo pelo meio ao norte do portão."
            "4":
              title: "Cruze para a Área 1 pelo TM37"
              text: "Saia da Área Central pela borda leste para a Área 1 (Leste), chegando ao canto sudoeste. Avance rumo ao meio do campo, onde uma ball espera com o TM37 Egg Bomb."
              items:
                tm-egg-bomb: "Área 1 (Leste), no centro do mapa."
            "5":
              title: "Varra o leste pelo Carbos"
              text: "Siga para a direita rumo às árvores do leste e pegue a ball de Carbos, um aumento permanente de Velocidade para um do seu time."
              items:
                carbos: "Área 1 (Leste), a leste do centro."
            "6":
              title: "Pegue o Full Restore"
              text: "Alguns tiles ao norte do Carbos há outra ball com um Full Restore, uma cura total com status que vale guardar para lutas difíceis."
              items:
                full-restore: "Área 1 (Leste), logo ao norte do Carbos."
            "7":
              title: "Volte pela Max Potion"
              text: "Atravesse o topo da área de volta ao extremo oeste, onde uma ball perto da saída norte guarda uma Max Potion. Pegue e escape pelo canto noroeste para a Área 2."
              items:
                max-potion-3-7: "Área 1 (Leste), extremo oeste perto da saída norte."
            "8":
              title: "Suba a Área 2 pelo Protein"
              text: "Você chega à Área 2 (Norte) pelo canto sudeste. Suba até a parede do topo, onde uma ball encostada na cerca guarda um Protein, um aumento permanente de Especial."
              items:
                protein: "Área 2 (Norte), encostado na parede do topo."
            "9":
              title: "Pegue o TM40 na descida"
              text: "Desça e vá à esquerda do Protein e pegue a ball com o TM40 Skull Bash. Daqui, siga para o canto sudoeste para cruzar à Área 3."
              items:
                tm-skull-bash: "Área 2 (Norte), centro-superior abaixo da parede do topo."
            "10":
              title: "Entre na Área 3 e ache o Gold Teeth"
              text: "Você desce na Área 3 (Oeste) pela borda de cima, onde fica a Secret House. Vá para o oeste pela faixa superior e pegue a ball com o Gold Teeth, a dentadura perdida do Warden."
              items:
                gold-teeth: "Área 3 (Oeste), centro-superior do mapa."
            "11":
              title: "Pegue o TM32 Double Team"
              text: "Continue para o oeste pela mesma linha e pegue a ball com o TM32 Double Team antes de o terreno abrir rumo à Secret House."
              items:
                tm-double-team: "Área 3 (Oeste), canto superior esquerdo, a oeste do Gold Teeth."
            "12":
              title: "Procure o Revive escondido"
              text: "Alguns tiles a oeste da ball do TM32, pare e aperte A virado para cima no trecho de chão vazio. Nada aparece na tela, mas você guarda um Revive escondido."
              hidden:
                revive: "Área 3 (Oeste), dois tiles a oeste da ball do TM32; aperte A virado para cima, nada aparece."
            "13":
              title: "Pegue o HM03 Surf na Secret House"
              text: "Entre na Secret House no canto superior esquerdo. O velho lá dentro te dá o HM03 Surf, o motivo inteiro de vir até aqui. Ensine depois e metade da água do mapa se abre."
              items:
                hm03_surf: "Com o velho na Secret House, no canto da Área 3 da Safari Zone. Ensina Surf pela água aberta."
            "14":
              title: "Desça ao sul por outra Max Potion"
              text: "Saia da casa e siga o lado oeste até o fundo da área, onde outra ball guarda uma Max Potion."
              items:
                max-potion-8-20: "Área 3 (Oeste), canto inferior esquerdo perto da parede de baixo."
            "15":
              title: "Corte a leste pelo Max Revive"
              text: "Vá para o leste pelo campo inferior e pegue a ball com um Max Revive, o último prêmio antes da saída."
              items:
                max-revive: "Área 3 (Oeste), centro-inferior do mapa."
            "16":
              title: "Dê a volta e pague o Warden"
              text: "Escape pela borda leste da Área 3 para a Área Central e desça de volta pelo portão. Antes de esquecer, use o Super Rod nos lagos por Dratini, e em Fuchsia entregue o Gold Teeth ao Warden, que troca por HM04 Strength."
          tips:
            scyther: "Um dos dois grandes brutamontes Inseto do Yellow, aqui junto do Pinsir. Isca, depois Safari Balls."
            pinsir: "O Yellow deixa capturar Pinsir e Scyther na Safari. Pegue este também."
            kangaskhan: "Um Normal raro, só na Safari. Isca-e-ball paciente ou nada."
            chansey: "1% e fujão, mas um prêmio enorme de EXP. Guarde umas balls para ele."
            dratini: "O único Dratini fácil. Super Rod nos lagos da Safari pela linha de Dragonite."
          oak:
            scyther: "Brutamontes exclusivo da Safari. Pegue um. Não há outra fonte fácil."
            pinsir: "O outro inseto da Safari. O Yellow deixa ficar com Pinsir e Scyther."
            dratini: "Super Rod nos lagos → Dragonair → Dragonite. Sua chance confiável."
            kangaskhan: "Raro e só na Safari. Garanta um para a dex enquanto está aqui."
        route_16:
          note: "O topo da Cycling Road. Doduo e um Snorlax."
          intro: "O portão norte da Cycling Road, bloqueado por um segundo Snorlax. O Fly fica escondido por perto."
          steps:
            "1":
              title: "Pegue o HM02 Fly"
              text: "Corte a árvore a noroeste para chegar à casa e pegar o HM02 Fly."
              items:
                hm02_fly: "Com a garota na casa no topo da Rota 16, depois de uma árvore de Cut. Ensina Fly entre cidades."
            "2":
              title: "Acorde o Snorlax"
              text: "Toque o Poké Flute no Snorlax do caminho (Nv 30) e batalhe para liberar o portão."
            "3":
              title: "Suba na Cycling Road"
              text: "Pedale pela bike pelo portão norte até a Rota 17."
          tips:
            snorlax: "O segundo e último Snorlax. A mesma parede Nv 30. Faça dormir, depois jogue balls."
          oak:
            doduo: "A captura comum da rota → Dodrio, um Normal/Voador rápido."
            snorlax: "O último dos dois Snorlax. Acorde com o Poké Flute e capture agora."
        route_17:
          note: "Cycling Road. Doduo, Ponyta, Fearow."
          intro: "Uma descida de bike de mão única cheia de Bikers. Ponyta galopa nas faixas de grama."
          steps:
            "1":
              title: "Desça de bike pela Cycling Road"
              text: "Entre pelo portão norte e monte a bike; a Cycling Road não dá para cruzar a pé. Desça a ladeira de mão única, parando nas faixas de grama por uma chance de Ponyta enquanto vence os Bikers e Cue Balls que ladeiam a descida."
            "2":
              title: "Vasculhe a faixa do topo"
              text: "Logo depois do portão norte, a ladeira se abre no primeiro trecho. Cole na faixa leste e aperte A no ladrilho vazio ali por um Rare Candy oculto; nada aparece na tela."
              hidden:
                rare-candy: "Faixa leste, perto do topo junto ao portão norte. Aperte A no ladrilho vazio; nada surge."
            "3":
              title: "Revire o trecho central"
              text: "A cerca de um terço da descida, vá para o centro-esquerda da pista. Aperte A no ladrilho comum ali para desenterrar um Full Restore oculto; nada aparece na tela."
              hidden:
                full-restore: "Centro-esquerda da pista, mais ou menos um terço abaixo. Aperte A no ladrilho vazio; nada surge."
            "4":
              title: "Cheque a cerca leste"
              text: "Perto da placa de Dicas de Treinador, vire para a beira leste da pista. Aperte A junto ao ladrilho da cerca por um PP Up oculto; nada aparece na tela."
              hidden:
                pp-up: "Beira leste, na altura da placa de Dicas de Treinador. Aperte A no ladrilho da cerca; nada surge."
            "5":
              title: "Vasculhe a faixa oeste"
              text: "Mais abaixo, vá para a faixa oeste perto dos Bikers que guardam este trecho. Aperte A no ladrilho vazio ali por um Max Revive oculto; nada aparece na tela."
              hidden:
                max-revive: "Faixa oeste, terço inferior da pista. Aperte A no ladrilho vazio; nada surge."
            "6":
              title: "Cave perto do fim"
              text: "Perto do pé da ladeira, antes da placa de fim da Cycling Road, pare no centro-esquerda e aperte A por um Max Elixir oculto; nada aparece na tela."
              hidden:
                max-elixir: "Centro-esquerda, perto do fim junto à placa de fim da Cycling Road. Aperte A; nada surge."
            "7":
              title: "Saia para a Rota 18"
              text: "No pé da ladeira, passando a placa de fim da Cycling Road, atravesse o portão sul até a Rota 18."
          oak:
            ponyta: "Uma captura de fogo na grama → Rapidash. Um dos poucos tipos Fogo do Yellow."
        route_18:
          note: "A leste até Fuchsia. Spearow, Rattata, Doduo."
          intro: "Um trecho curto de Bird Keepers ligando a Cycling Road a Fuchsia."
          trades:
            parasect:
              npc: "COZINHEIRO"
              title: "Parasect"
              where: "No andar de cima do portão da Rota 18"
              note: "Um Parasect pronto que sobe de nível rápido pelo bônus de XP de troca. Tangela é uma captura na Zona Safári."
          steps:
            "1":
              title: "Cruze a leste"
              text: "Vença os três Bird Keepers pela estreita faixa de terra."
            "2":
              title: "Entre em Fuchsia"
              text: "Continue a leste até Fuchsia City."
        saffron_city:
          mart:
            blurb: "O Mart de Saffron tem Max Repel e Full Heal, aberto assim que a Equipe Rocket deixa a cidade."
            buy: "Hyper Potions e um Full Heal te preparam para a Sabrina. Max Repel torna os andares da Silph Co. suportáveis."
          gym:
            intro: "Plataformas de teletransporte te levam pelo ginásio num circuito fixo. Pegue as plataformas certas para chegar à Sabrina, cujos Abra, Kadabra e Alakazam (todos Nv 50) batem como um caminhão. Psíquico não tem contra de verdade na 1a geração, então suba de nível ou lidere com um forte atacante Inseto como Pinsir ou Scyther."
            puzzle:
              "1": "Pise numa plataforma de teletransporte e ela te joga para outra sala. Cada sala tem um treinador e duas plataformas: uma volta, a outra avanca."
              "2": "A linha mais rápida: da entrada pegue a plataforma sudeste, depois a noroeste, depois a sudoeste, e a sudoeste de novo. Cada salto te deixa em cima de um treinador para vencer, e essa sequência te leva à sala da Sabrina."
              "3": "O ultimo teletransporte te deixa ao lado de Sabrina. Psiquico nao tem contra na 1a geracao, entao suba de nível ou lidere com um forte atacante Inseto."
          note: "Ginásio da Sabrina. Marsh Badge. Silph Co. e o Dojo."
          intro: "Uma cidade central tomada pela Rocket. Liberte a Silph Co., vença a Sabrina e ganhe um lutador no Dojo."
          steps:
            "1":
              title: "Suborne os guardas"
              text: "Leve uma bebida da Dept. Store de Celadon para passar por cada portao bloqueado da cidade."
            "2":
              title: "Liberte a Silph Co. primeiro"
              text: "O ginasio fica trancado ate você limpar a Silph Co. tomada pela Rocket (veja Silph Co.), depois entre e resolva o labirinto de plataformas de teletransporte ate Sabrina."
            "3":
              title: "Reivindique um lutador"
              text: "Vença o Karate Master no Fighting Dojo para levar um Hitmonlee ou Hitmonchan gratis."
          oak:
            hitmonlee: "Grátis do Dojo. Escolha Hitmonlee ou Hitmonchan (só um)."
        silph_co:
          note: "Tomada da HQ da Rocket. Lapras e a Master Ball."
          intro: "Um labirinto de 11 andares com teletransporte. Pegue a Card Key, resgate a Lapras e vença o Giovanni pela Master Ball."
          steps:
            "1":
              title: "Entre na torre tomada pela Rocket"
              text: "A Equipe Rocket tomou todos os onze andares da Silph Co., um emaranhado de placas de teletransporte de mao unica e portas de Card Key. Sua primeira missao e subir ate o 5F pela Card Key, que destranca todas as salas de itens seladas, e entao avancar ate o topo."
            "2":
              title: "Varra o 3F pela Hyper Potion"
              text: "No terceiro andar, uma Poke Ball fica numa sala um pouco a oeste do centro. Pegue a Hyper Potion junto a parede norte dessa sala."
              items:
                hyper-potion: "3F, sala a oeste do centro; a bola fica perto da parede norte."
            "3":
              title: "Pegue o Max Revive"
              text: "Tres Poke Balls ficam juntas no canto inferior esquerdo do 4F. A mais ao norte guarda o Max Revive."
              items:
                max-revive: "4F, aglomerado inferior esquerdo, a bola mais ao norte das tres."
            "4":
              title: "Pegue o Escape Rope"
              text: "Logo a sudeste do Max Revive, a bola do meio do trio guarda um Escape Rope."
              items:
                escape-rope: "4F, logo a sudeste do Max Revive."
            "5":
              title: "Pegue o Full Heal"
              text: "A terceira bola do trio, encaixada no sudoeste, guarda um Full Heal."
              items:
                full-heal: "4F, canto sudoeste do mesmo trio de bolas."
            "6":
              title: "Tome a Card Key"
              text: "No canto sudeste do 5F, passando pelo cientista e suas pranchetas de Relatorio Pokémon, uma Poke Ball guarda a Card Key. Ela abre todas as portas trancadas do predio, entao pegue-a antes de tudo."
              items:
                card-key: "5F, canto sudeste, passando pelas pranchetas."
            "7":
              title: "Pegue a Protein"
              text: "Na sala superior esquerda do 5F, uma Poke Ball solitaria guarda a Protein."
              items:
                protein: "5F, sala superior esquerda."
            "8":
              title: "Pegue o TM Take Down"
              text: "La embaixo, no canto inferior esquerdo do 5F, fica o TM Take Down."
              items:
                tm-take-down: "5F, canto inferior esquerdo."
            "9":
              title: "Sinta o Elixir oculto"
              text: "Ao longo da parede norte do 5F, perto do centro, aperte A num quadrado vazio para um Elixir oculto. Nada aparece na tela."
              hidden:
                elixir: "5F, parede norte perto do centro; aperte A virado para cima. Nada aparece na tela."
            "10":
              title: "Pegue o HP Up"
              text: "No canto inferior esquerdo do 6F, uma Poke Ball guarda o HP Up."
              items:
                hp-up: "6F, canto inferior esquerdo."
            "11":
              title: "Pegue o X Accuracy"
              text: "Logo ao sul do HP Up, no canto do 6F, fica um X Accuracy."
              items:
                x-accuracy: "6F, canto inferior esquerdo, logo ao sul do HP Up."
            "12":
              title: "Resgate a Lapras e enfrente seu rival"
              text: "No 7F, um funcionario da Silph libertado te da uma Lapras, a unica do jogo e um tanque Agua/Gelo excelente. Seu rival te embosca aqui perto do elevador, entao cure-se antes de falar com o funcionario."
            "13":
              title: "Pegue o Calcium"
              text: "Junto a parede esquerda do 7F, logo abaixo de onde o rival aparece, uma Poke Ball guarda o Calcium."
              items:
                calcium: "7F, parede esquerda, logo ao sul do ponto do rival."
            "14":
              title: "Pegue o TM Swords Dance"
              text: "Do outro lado do andar, na lateral direita do 7F, fica o TM Swords Dance."
              items:
                tm-swords-dance: "7F, lateral direita."
            "15":
              title: "Sinta a Max Potion oculta"
              text: "O 9F tem uma enfermeira no canto inferior esquerdo. Fique no canto ao lado dela e aperte A para uma Max Potion oculta. Nada aparece na tela."
              hidden:
                max-potion: "9F, canto inferior esquerdo perto da enfermeira; aperte A virado para cima. Nada aparece na tela."
            "16":
              title: "Pegue o TM Earthquake"
              text: "No bolsao inferior esquerdo do 10F fica o TM Earthquake, um dos melhores TMs do jogo."
              items:
                tm-earthquake: "10F, bolsao inferior esquerdo."
            "17":
              title: "Pegue o Rare Candy"
              text: "Logo a sudeste do TM Earthquake, uma Poke Ball guarda um Rare Candy."
              items:
                rare-candy: "10F, logo a sudeste do TM Earthquake."
            "18":
              title: "Pegue o Carbos"
              text: "No topo do mesmo bolsao inferior esquerdo do 10F fica o Carbos."
              items:
                carbos: "10F, topo do bolsao inferior esquerdo."
            "19":
              title: "Venca o Giovanni no 11F"
              text: "Suba ate o 11F e enfrente o Giovanni (Nidorino Nv 37, Rhyhorn Nv 37, Persian Nv 35, Nidoqueen Nv 41). Golpes de Terra como Dig e Earthquake resolvem a luta. Vence-lo quebra a tomada."
            "20":
              title: "Pegue a Master Ball"
              text: "Fale com o presidente da Silph no escritorio dele pela Master Ball. Guarde-a para um lendario como Articuno, Zapdos, Moltres ou Mewtwo."
          tips:
            lapras: "A única Lapras do jogo. Um tanque Água/Gelo excelente. Não perca no 7F."
          oak:
            lapras: "Grátis no 7F → um ótimo tanque Água/Gelo. A única Lapras do jogo."
          gifts:
            lapras:
              from: "DE UM FUNCIONÁRIO DA SILPH"
        route_19:
          note: "Rota aquática ao sul de Fuchsia. Precisa de Surf."
          intro: "Mar aberto ao sul de Fuchsia, cheio de Tentacool e Swimmers. Precisa de Surf."
          steps:
            "1":
              title: "Surfe para fora"
              text: "Surfe ao sul de Fuchsia, pescando ou batalhando os Swimmers e Beauties."
            "2":
              title: "Siga para a Rota 20"
              text: "Continue até a praia que leva a oeste para a Rota 20."
        route_20:
          note: "Rota aquática até Seafoam. Tentacool, Staryu, Shellder."
          intro: "O canal até as Seafoam Islands. O único caminho a oeste rumo a Cinnabar."
          steps:
            "1":
              title: "Surfe a oeste"
              text: "Limpe os Swimmers na metade leste enquanto surfa a oeste."
            "2":
              title: "Entre em Seafoam"
              text: "Mergulhe na caverna das Seafoam Islands no meio da rota."
        seafoam_islands:
          note: "Caverna com quebra-cabeça de pedras. Articuno selvagem dentro."
          intro: "Uma caverna cheia de correntes. Empurre pedras com Strength para conter a água, depois capture o Articuno."
          steps:
            "1":
              title: "Entre com Surf e Strength"
              text: "Chegue surfando pela Rota 20 e entre na caverna. Você precisa dos dois HMs aqui: Surf para cruzar as correntes de água e Strength para empurrar as pedras que as contêm. Seel, Slowpoke, Shellder e Krabby selvagens rondam os andares."
            "2":
              title: "Contenha as correntes descendo"
              text: "Desça pelo 1F e pelo B1F empurrando cada pedra nos buracos das correntes para a água abaixo parar de correr. Cada corrente contida abre mais um trecho de Surf, levando você firme até o B2F."
            "3":
              title: "Embolse o Nugget oculto"
              text: "No B2F, cruze até o chão aberto da caverna no centro-baixo do andar. Pare um quadrado a oeste de um azulejo comum e aperte A virado para leste para um Nugget oculto, que rende uma boa grana em qualquer Mart."
              hidden:
                nugget: "B2F, no chão aberto do centro-baixo. Vire para leste e aperte A. Nada aparece na tela."
            "4":
              title: "Desenterre o Max Elixir"
              text: "Descendo ao B3F, vá até o amontoado de pedras no canto sudoeste. Logo ao sul delas, aperte A virado para o norte no chão nu para um Max Elixir oculto, que recarrega todo o PP de todos os golpes de um Pokémon."
              hidden:
                max-elixir: "B3F, canto sudoeste logo abaixo das pedras. Vire para o norte e aperte A. Nada aparece na tela."
            "5":
              title: "Capture o Articuno"
              text: "O B4F abre na câmara do Articuno. Surfe até o pássaro de Gelo adormecido no canto noroeste (Nv 50) e salve antes de tocá-lo. Faça-o dormir ou paralise, depois use a Master Ball ou uma boa sequência de Ultra Balls."
            "6":
              title: "Varra o Ultra Ball do canto"
              text: "Antes de subir de volta, varra o canto sudeste extremo do B4F. Ao lado das pedras ali, aperte A virado para o sul para um Ultra Ball oculto e reabasteça seu estoque de captura."
              hidden:
                ultra-ball: "B4F, canto sudeste extremo ao lado das pedras. Vire para o sul e aperte A. Nada aparece na tela."
            "7":
              title: "Saia rumo a Cinnabar"
              text: "Com o Articuno capturado e os bolsos cheios, saia pela boca oeste da caverna no mar aberto e surfe ao sul até Cinnabar Island."
          tips:
            articuno: "Um lendário Nv 50 de uma vez só. Salve antes, faça dormir/paralise, e use a Master Ball ou muitas Ultra Balls."
          oak:
            seel: "Uma captura de caverna → Dewgong, um sólido Água/Gelo. Pegue a base."
            articuno: "O lendário de Gelo de Seafoam. Só uma chance. Capture agora."
        power_plant:
          note: "Desvio opcional de Surf. Mons Elétricos, um Muk raro e o Zapdos."
          intro: "Uma usina abandonada saindo da Rota 10, acessível só com Surf. Tipos Elétrico e Veneno vagam pelos andares, e o lendário Zapdos espera lá no fundo."
          steps:
            "1":
              title: "Surfe da Rota 10"
              text: "Com o Surf, surfe pela agua ao sul da entrada do Rock Tunnel na Rota 10 ate a porta solitaria da usina e entre. Os andares fervilham de tipos Eletrico e Veneno selvagens, entao leve Repels se so quer o loot e o Zapdos. Aviso: muitos dos item balls espalhados aqui sao Voltorb ou Electrode disfarcados que ganham vida e atacam assim que você tenta pegar um."
            "2":
              title: "Pegue o Carbos na parede oeste"
              text: "Suba pelo lado esquerdo a partir da porta. Encostado na parede oeste, na parte baixa da usina, ha um item ball de verdade: um Carbos para aumentar a Velocidade de um Pokémon. Pegue de frente para leste."
              items:
                carbos: "Encostado na parede oeste, na parte baixa da usina. De frente para leste para pegar."
            "3":
              title: "Cutuque o primeiro item falso"
              text: "Suba o corredor acima do nicho do Carbos. O ball esperando no centro-esquerdo e seu primeiro Voltorb disfarcado (Nv 40); toque nele e ele desperta para uma batalha. Registre para a dex e siga."
            "4":
              title: "Atravesse para a sala centro-sul"
              text: "Serpenteie a leste e para baixo ate o meio da usina. Um ball fica na sala centro-sul, e e outro Voltorb (Nv 40) fingindo de morto. Encare a luta ou passe direto."
            "5":
              title: "Cutuque o ball logo abaixo"
              text: "Um pequeno passo a leste e para baixo ha mais um ball falso, um Voltorb (Nv 40) no centro-baixo. Mesmo disfarce, mesmo choque ao tocar."
            "6":
              title: "Pegue o TM33 Reflect"
              text: "Desca para a ampla sala sul. Bem no centro ha um ball de verdade com o TM33 (Reflect), que reduz pela metade o dano fisico recebido por alguns turnos. Pegue de frente para norte."
              items:
                tm-reflect: "Centro da sala sul. De frente para norte para pegar."
            "7":
              title: "Cheque o ball na parede sul"
              text: "Logo a leste do TM, encostado na parede sul, ha outro ball. E um Voltorb (Nv 40) disfarcado, entao fique de frente para leste e espere briga."
            "8":
              title: "Pegue o TM25 Thunder"
              text: "A leste do centro na sala sul espera um ball de verdade com o TM25 (Thunder), o golpe Eletrico de 110 de poder simbolo da usina. Pegue de frente para leste."
              items:
                tm-thunder: "Sala sul, a leste do centro. De frente para leste para pegar."
            "9":
              title: "Varra o canto sudeste"
              text: "Va ate o canto sudeste distante pelo ultimo ball aqui embaixo. Outro disfarce de Voltorb (Nv 40); pegue de frente para oeste e depois volte para cima."
            "10":
              title: "Tateie o Max Elixir oculto"
              text: "De volta ao meio da usina, fique no chao aberto e aperte A no quadrado logo a oeste, um quadrado a leste do pequeno bloco de parede. Um Max Elixir oculto esta ali mesmo sem nada aparecer na tela."
              hidden:
                max-elixir: "Bem no centro da usina, um quadrado a leste do bloco de parede. Aperte A de frente para oeste; nada aparece na tela."
            "11":
              title: "Desperte o ball Electrode"
              text: "Um ball fica no centro da usina, mas este e um disfarce mais duro: um Electrode (Nv 43). Pegue de frente para sul e prepare-se para um possivel Selfdestruct."
            "12":
              title: "Cheque o ball centro-leste"
              text: "Um pouco a leste ha mais um ball, um Voltorb (Nv 40) disfarcado. Pegue de frente para oeste antes de subir rumo ao topo da usina."
            "13":
              title: "Pegue o HP Up la em cima"
              text: "Suba pelo lado leste e siga a fileira do topo. A direita do centro ha um ball de verdade com um HP Up para elevar o HP maximo de um Pokémon. Pegue de frente para norte."
              items:
                hp-up: "Fileira do topo, a direita do centro. De frente para norte para pegar."
            "14":
              title: "Fisgue o Rare Candy"
              text: "No canto superior direito espera um ball de verdade com um Rare Candy, um nível gratis para qualquer Pokémon. Pegue de frente para oeste."
              items:
                rare-candy: "Canto superior direito. De frente para oeste para pegar."
            "15":
              title: "Desperte o ultimo Electrode"
              text: "Varra de volta a oeste pelo topo. No centro-superior esta o segundo disfarce de Electrode (Nv 43); pegue de frente para leste e prepare-se para outro Selfdestruct."
            "16":
              title: "Tateie o PP Up oculto"
              text: "Perto do topo esquerdo, va ate a parede norte a esquerda do centro e aperte A de frente para norte. Um PP Up oculto fica encostado na parede, invisivel ate cair na sua mochila."
              hidden:
                pp-up: "Encostado na parede norte, a esquerda do centro. Aperte A de frente para norte; nada aparece na tela."
            "17":
              title: "Capture o Zapdos"
              text: "Desca ate o canto noroeste distante, perto da porta oeste da usina, onde o Zapdos (Nv 50) descansa. Salve antes, enfraqueca com Rocha ou Gelo, faca dormir ou paralise, depois jogue Ultra Balls ou a Master Ball. Você so tem uma chance."
            "18":
              title: "Surfe de volta para a Rota 10"
              text: "Com o Zapdos capturado e a usina saqueada, saia pela porta sul e surfe de volta para a Rota 10. Daqui e seguir rumo ao Rock Tunnel e Lavender Town."
          tips:
            zapdos: "O lendário Elétrico, um Nv 50 estático de uma vez só. Salve antes de tocar nele, depois faça dormir ou paralise e capture."
          oak:
            zapdos: "A ave Elétrica da Power Plant. Só uma chance. Capture enquanto está aqui."
            voltorb: "Por todos os andares (e disfarçado de itens) → Electrode. Pegue um para a dex."
        cinnabar_island:
          mart:
            blurb: "O Mart da ilha traz a prateleira completa do fim de jogo: Ultra Balls, Hyper Potions e Full Heals."
            buy: "Ultra Balls para os spawns raros da Mansion, além de Hyper Potions e Revives para os tipos fogo do Blaine."
          gym:
            intro: "Portas trancadas bloqueiam o caminho até o Blaine, cada uma aberta ao acertar um quiz ou vencer o treinador atrás dela. O Ninetales (Nv 48), o Rapidash (Nv 50) e o Arcanine (Nv 54) dele batem forte e rápido, então leve um atacante de Água, Pedra ou Terra e carregue Burn Heals."
            puzzle:
              "1": "Cada porta faz uma pergunta de sim ou não sobre Pokémon. Acerte e ela abre; erre e você batalha o treinador atrás dela, o que também a abre."
              "2": "Se preferir não chutar, as respostas na ordem são sim, não, não, não, sim, não. Ou pule os quizzes e lute contra todos os treinadores; as portas abrem de qualquer jeito e os dois caminhos chegam ao fundo."
              "3": "A última porta se abre para o Blaine. Um único golpe forte de Água, Pedra ou Terra derruba o Ninetales, o Rapidash e o Arcanine dele num piscar."
          note: "Ginásio do Blaine. Volcano Badge. Laboratório de fósseis."
          intro: "Uma ilha vulcânica. Reviva seus fósseis no lab, pegue a Secret Key na Mansão, depois vença o Blaine."
          trades:
            muk:
              npc: "CIENTISTA"
              title: "Muk"
              where: "A sala dos fósseis do Laboratório Pokémon"
              note: "Um Muk de nível alto sem grinding. Kangaskhan é uma captura na Zona Safári."
            rhydon:
              npc: "VELHINHO"
              title: "Rhydon"
              where: "A sala de trocas do Laboratório Pokémon"
              note: "Um Rhydon trocado chega forte e ganha XP turbinado."
            dewgong:
              npc: "BELDADE"
              title: "Dewgong"
              where: "A sala de trocas do Laboratório Pokémon"
              note: "Dewgong por um Growlithe, com o bônus de XP de troca. Growlithe aparece na Mansão Pokémon ao lado."
          steps:
            "1":
              title: "Limpe a Mansao primeiro"
              text: "O ginasio de Blaine esta trancado. Atravesse a rua ate a Pokémon Mansion e pegue a Secret Key."
            "2":
              title: "Entregue um fossil, depois o Ginásio"
              text: "Da um fossil ao cientista no Lab, depois abra o ginasio com a Secret Key e resolva as portas de quiz ate Blaine. Agua, Terra ou Pedra derrete a equipe de Fogo dele."
            "3":
              title: "Pegue seu fossil e siga em frente"
              text: "Volte ao Lab depois pelo Pokémon fossil revivido, depois use Surf rumo a ultima insígnia."
          tips:
            omanyte: "Reviva o Helix Fossil aqui → Omanyte, depois Omastar. Um Rocha/Água só assim."
            kabuto: "Reviva o Dome Fossil → Kabuto, depois Kabutops. A outra linha de fóssil."
            aerodactyl: "Reviva o Old Amber (museu de Pewter) → Aerodactyl, um raro Rocha/Voador."
          oak:
            omanyte: "Reviva o fóssil que escolheu no Mt. Moon. Helix → Omanyte."
            kabuto: "Dome Fossil → Kabuto. Só dá para reviver o fóssil que você guardou."
            aerodactyl: "Old Amber do museu de Pewter → Aerodactyl. Registre o único espécime."
        pokemon_mansion:
          note: "Mansão incendiada. Tipos Fogo e a Secret Key."
          intro: "Um labirinto de botões-estátua cheio de Fogo e Veneno. Ache a Secret Key no B1F."
          steps:
            "1":
              title: "Entre na mansão incendiada"
              text: "Atravesse da praia de Cinnabar para dentro da mansão carbonizada. Lá dentro é um labirinto de caminhos barrados, cada um trancado até você apertar o botão oculto dentro de uma estátua próxima, e os andares fervilham de Fogo e Veneno (Vulpix, Growlithe selvagens e o raro Magmar). O prêmio é a Secret Key dois andares abaixo, no B1F, então suba apertando botões e depois desça de volta."
            "2":
              title: "Pegue o Carbos no 1F"
              text: "Logo na entrada, varra o lado leste do andar térreo. O Carbos (uma vitamina de Velocidade) está numa bola no lado leste, logo ao sul do Scientist que você enfrenta na subida."
              items:
                carbos: "Lado leste do 1F, ao sul do treinador Scientist."
            "3":
              title: "Vasculhe os pilares do 1F por uma Moon Stone"
              text: "Perto dos pilares na parte centro-oeste do 1F, aperte A no piso vazio para achar uma Moon Stone oculta (evolui Nidorina, Nidorino, Clefairy e Jigglypuff). Nada aparece na tela, então confie no tile."
              hidden:
                moon-stone: "Centro-oeste do 1F, no chão ao lado dos pilares. Aperte A; nada fica visível."
            "4":
              title: "Pegue o Escape Rope ao norte"
              text: "Siga o caminho aberto até a parede norte do 1F, onde um Escape Rope espera numa bola. É uma saída instantânea da mansão para usar depois, então guarde-o antes de subir as escadas."
              items:
                escape-rope: "Borda norte do 1F, ao centro-norte."
            "5":
              title: "Aperte os botões e suba ao 2F"
              text: "Aperte A nas estátuas para acionar os botões ocultos, baixando as barreiras que bloqueiam a escada oeste, depois suba as escadas até o 2F."
            "6":
              title: "Atravesse o 2F pelo Calcium"
              text: "No 2F, avance para o leste passando pelo Burglar que anda de um lado para o outro até a parede do fundo. O Calcium (uma vitamina Especial) está numa bola no canto nordeste. Aperte o botão-estátua do 2F enquanto está aqui e suba ao 3F."
              items:
                calcium: "Canto nordeste do 2F."
            "7":
              title: "Varra o 3F a leste pelo Iron"
              text: "No andar de cima você encara um Burglar e um Scientist. Avance para o lado nordeste, passando o Scientist, e abra a bola pelo Iron (uma vitamina de Defesa)."
              items:
                iron: "Área nordeste do 3F, passando o Scientist."
            "8":
              title: "Pegue o Max Potion no sudoeste do 3F"
              text: "Volte pelo 3F até o extremo sudoeste e pegue o Max Potion na bola encostada na parede oeste (cura total de HP)."
              items:
                max-potion: "Canto sudoeste do 3F, encostado na parede oeste."
            "9":
              title: "Cheque a parede oeste por um Max Revive oculto"
              text: "Suba pela parede oeste a partir desse Max Potion e aperte A no piso vazio perto do meio da altura para desenterrar um Max Revive oculto (revive com HP e PP cheios). Nada aparece na tela, então confie no lugar."
              hidden:
                max-revive: "Parede oeste do 3F, um trecho ao norte do Max Potion. Aperte A; nada aparece."
            "10":
              title: "Volte descendo até o B1F"
              text: "Com os botões de cima acionados, a barreira até a escada do subsolo no 1F finalmente abre. Refaça o caminho descendo pelo 3F e 2F até o 1F, depois desça a escada recém-liberada no sudeste até o B1F."
            "11":
              title: "Pegue o TM14 Blizzard perto da escada do B1F"
              text: "Você chega no sudeste do B1F. Logo a sudoeste da escada, abra a bola pelo TM14 (Blizzard), um golpe de Gelo de primeira para ensinar a um tipo Água forte."
              items:
                tm-blizzard: "Sudeste do B1F, logo a sudoeste da escada de entrada."
            "12":
              title: "Atravesse até o Full Restore no sudoeste"
              text: "Serpenteie para o oeste pela base do subsolo até o canto sudoeste, onde um Full Restore (cura total de HP mais status) está numa bola."
              items:
                full-restore: "Canto sudoeste do B1F."
            "13":
              title: "Pegue a Secret Key"
              text: "Suba até a pequena câmara central e abra a bola com a Secret Key. É o motivo de toda a visita: ela destranca o ginásio do Blaine do outro lado da rua, em Cinnabar Island."
              items:
                secret-key: "Sala centro-oeste do B1F, ao norte do Full Restore."
            "14":
              title: "Desenterre um Rare Candy oculto no canto noroeste"
              text: "No noroeste dessa mesma sala, aperte A contra o piso do canto para achar um Rare Candy oculto (um nível de graça). Nada aparece na tela, então cheque o tile vazio."
              hidden:
                rare-candy: "Canto noroeste da sala da Secret Key no B1F. Aperte A; nada fica visível."
            "15":
              title: "Pegue o TM22 SolarBeam no noroeste"
              text: "Continue ao norte a partir desse canto até a bola com o TM22 (SolarBeam), o golpe de Grama mais forte do jogo."
              items:
                tm-solarbeam: "Noroeste do B1F, ao norte do canto do Rare Candy oculto."
            "16":
              title: "Pegue o último Rare Candy lá em cima"
              text: "Logo a leste pela parede norte, abra a última bola por um segundo Rare Candy. Guarde-os para empurrar um favorito de nível lento além de uma evolução teimosa, depois volte à escada."
              items:
                rare-candy: "Borda norte do B1F, ao centro, a leste do TM22."
            "17":
              title: "Saia e atravesse até o ginásio do Blaine"
              text: "Com a Secret Key em mãos e o subsolo limpo, use o Escape Rope (ou saia andando) de volta a Cinnabar Island. Atravesse a rua e destranque o ginásio do Blaine pela Volcano Badge."
          tips:
            vulpix: "O Yellow põe Vulpix e Growlithe aqui. Um Vulpix selvagem fácil, enfim."
            growlithe: "O outro cão de Fogo, na mesma mansão → Arcanine com uma Fire Stone."
            magmar: "Uma captura rara de Fogo nos andares inferiores. Uma das poucas fontes de Magmar."
          oak:
            vulpix: "Selvagem aqui no Yellow (senão só por troca) → Ninetales. Pegue um."
            growlithe: "Também selvagem aqui → Arcanine com uma Fire Stone. Registre a base."
            magmar: "Uma captura rara da mansão. Um atacante de Fogo forte. Garanta um."
        route_21:
          note: "Rota aquática de volta a Pallet. Pesca e um trecho de grama perto de Pallet."
          intro: "A rota marítima entre Cinnabar e Pallet. Surfe e pesque nela na volta para Viridian pela última insígnia; um pequeno trecho de grama perto de Pallet tem capturas em terra."
          steps:
            "1":
              title: "Surfe ao norte rumo a Pallet"
              text: "De Cinnabar, surfe ao norte pelo canal, limpando os Swimmers no caminho. Tentacool enche o mar aberto."
            "2":
              title: "Pesque e varra a grama"
              text: "Use o Super Rod na água por Magikarp, Goldeen, Shellder e Staryu, depois cheque o trecho de grama logo ao sul de Pallet por Pidgey e Rattata, mais Pidgeotto e Raticate selvagens. Chegue em Pallet e suba para Viridian pela Earth Badge."
          tips:
            magikarp: "Pesque um aqui e suba até o Nv 20; ele vira Gyarados, um dos tipos Água mais fortes do jogo."
            goldeen: "Uma captura confiável de Super Rod → Seaking. Um lugar fácil para registrar a linha."
          oak:
            magikarp: "Super Rod aqui → Gyarados. Fraco agora, monstruoso depois de evoluir."
            goldeen: "Pesque um → Seaking. Registre a base já que está pescando mesmo."
        viridian_gym:
          gym:
            intro: "O último ginásio de Kanto, um labirinto de plataformas giratórias com oito treinadores. O Giovanni espera no topo com Dugtrio (Nv 50), Persian (Nv 53), Nidoqueen (Nv 53), Nidoking (Nv 55) e Rhydon (Nv 55). O Fissure do Dugtrio e o Horn Drill do Rhydon são nocautes de um golpe, então seja mais rápido que eles e leve Água, Grama ou Gelo."
            puzzle:
              "1": "As plataformas giratorias te lançam em linha reta ate você bater numa de parada. Planeje cada lançamento para parar onde alcance o próximo treinador."
              "2": "Vença treinadores para abrir o caminho ao norte, depois use as giratorias para o norte e o oeste, corrigindo sua linha a cada parada rumo a Giovanni."
              "3": "As giratorias finais te deixam diante de Giovanni. Cuidado com os nocautes de um golpe de Fissure e Horn Drill e lidere com um atacante rapido de Agua ou Gelo."
          note: "Ginásio do Giovanni. Earth Badge. A 8ª insígnia."
          intro: "O ginásio final de Kanto, de volta em Viridian. Vença o time Terra do Giovanni pela última insígnia."
          steps:
            "1":
              title: "Prepare e entre no Ginásio"
              text: "Reabasteça Potions e Revives antes de entrar, porque não há cura entre os oito treinadores. Entre pelo sul, passando pelo Gym Guide, e o piso vira um labirinto de plataformas giratórias que te lançam em linha reta até você bater numa plataforma de parada."
            "2":
              title: "Pegue o Revive"
              text: "Uma Poke Ball fica no lado leste do labirinto, direto ao norte pela coluna da entrada sul. Use as giratórias para se alinhar com ela e guarde o Revive grátis antes de subir rumo a Giovanni."
              items:
                revive: "Lado leste, direto ao norte da porta sul, mais ou menos na metade do ginásio."
            "3":
              title: "Suba até Giovanni pelas giratórias"
              text: "Vença os treinadores para abrir o caminho ao norte, depois corrija seu lançamento a cada plataforma de parada enquanto sobe ao norte e ao oeste. Giovanni espera no topo com seu time Terra; cuidado com o Fissure do Dugtrio e o Horn Drill do Rhydon, lidere rápido com Água, Grama ou Gelo e pegue a Earth Badge, a sua oitava."
            "4":
              title: "Rumo a Victory Road"
              text: "Com a Insígnia Earth e as oito em mãos, saia do ginásio e volte à Rota 22, depois avance para o oeste na Victory Road."
        victory_road:
          note: "O portão da Liga. Quebra-cabeças de pedra e Moltres."
          intro: "Um labirinto de pedras de três andares que exige as 8 insígnias e Strength. Moltres pousa lá dentro."
          steps:
            "1":
              title: "Entre com Strength na mao"
              text: "A Victory Road so abre para um treinador com as 8 insignias. Traga Strength para as pedras, mais Surf e Flash para enxergar e atravessar o escuro. Entre pelo norte da Route 23; a caverna sobe por tres andares, e cada um e travado por uma pedra que você empurra sobre um botao do chao para baixar a barreira."
            "2":
              title: "Pegue o Rare Candy"
              text: "Suba da entrada ate a camara superior do 1F. Uma Poke Ball na saliencia norte guarda um Rare Candy, um nível gratis para qualquer parceiro."
              items:
                rare-candy: "1F, saliencia norte da camara superior, um pouco a oeste do centro."
            "3":
              title: "Pegue o TM43 Sky Attack"
              text: "Alguns tiles a leste, colada na parede de cima, outra bola guarda o TM43 Sky Attack, um golpe Voador pesado de dois turnos."
              items:
                tm-sky-attack: "1F, colada na parede de cima, poucos passos a leste do Rare Candy."
            "4":
              title: "Suba a escada para o 2F"
              text: "Com o 1F limpo, va ate a escada do noroeste e suba ao segundo andar, o labirinto central onde o Moltres pousa."
            "5":
              title: "Ache a Ultra Ball escondida"
              text: "Chegue ao 2F e va ate a saliencia noroeste. Pressione A no quadrado vazio ali para uma Ultra Ball escondida; nada aparece na tela, entao confie no ponto."
              hidden:
                ultra-ball: "2F, saliencia noroeste. Pressione A no tile vazio; nenhum item aparece."
            "6":
              title: "Pegue o Guard Spec."
              text: "Logo abaixo da parede de cima, perto do centro do 2F, uma bola guarda um Guard Spec., que bloqueia quedas de atributo por alguns turnos."
              items:
                guard-spec: "2F, centro-norte, colado na parede de cima."
            "7":
              title: "Capture o Moltres"
              text: "A oeste do centro, o Moltres (Nv 50) esta pousado na rocha. Salve antes, enfraqueca com Agua, Eletrico ou Rocha, faca dormir ou paralise, depois jogue Ultra Balls. Você tem so uma chance."
            "8":
              title: "Pegue o TM05 Mega Kick"
              text: "Desca ao centro-sul do 2F, onde uma bola guarda o TM05 Mega Kick, um golpe Normal forte."
              items:
                tm-mega-kick: "2F, centro-sul do andar."
            "9":
              title: "Guarde o Full Heal"
              text: "Atravesse para leste pelo meio do 2F ate uma bola com um Full Heal, que cura qualquer condicao de status."
              items:
                full-heal: "2F, meio do andar, a leste do centro."
            "10":
              title: "Vasculhe o Full Restore escondido"
              text: "Siga rumo as escadas do leste e pressione A no quadrado vazio ali para um Full Restore escondido. Nada aparece na tela, entao revista o tile exato."
              hidden:
                full-restore: "2F, extremo leste, perto das escadas de saida. Pressione A no tile vazio; nenhum item aparece."
            "11":
              title: "Pegue o TM17 Submission"
              text: "No canto nordeste do 2F, uma bola guarda o TM17 Submission, um golpe Lutador com recuo."
              items:
                tm-submission: "2F, canto nordeste."
            "12":
              title: "Suba ao 3F"
              text: "Pegue a escada leste ate o 3F e seu quebra-cabeca de quatro pedras. Empurre as pedras sobre os botoes para abrir o caminho aos dois ultimos premios."
            "13":
              title: "Pegue o Max Revive"
              text: "Perto de onde você chega no 3F, no lado leste, uma bola guarda um Max Revive, que revive por completo um Pokémon desmaiado."
              items:
                max-revive: "3F, lado leste, perto das escadas de subida."
            "14":
              title: "Pegue o TM47 Explosion"
              text: "Trabalhe as pedras para oeste pelo 3F ate a bola distante, o TM47 Explosion, o golpe Normal de tiro unico mais forte do jogo."
              items:
                tm-explosion: "3F, extremo oeste."
            "15":
              title: "Parta para o Indigo Plateau"
              text: "Com todos os premios coletados e o Moltres capturado, volte ao 2F e saia pela porta leste rumo a entrada do Indigo Plateau."
          tips:
            moltres: "O lendário de Fogo da Victory Road. Um Nv 50 de uma vez só. Salve antes, depois enfraqueça e capture."
          oak:
            moltres: "A ave de Fogo pousada na Victory Road. Só uma chance. Capture ao passar."
        route_23:
          note: "Checkpoints de insígnias até a Liga. Grama de nível alto."
          intro: "A estrada com portões até a Liga. Cada guarda checa uma insígnia. Os selvagens aqui são fortes."
          steps:
            "1":
              title: "Entre pelo portão da Rota 22"
              text: "Entre pelo sul, saindo do portão da Rota 22. Sete guaritas guardam a estrada até a Liga, e cada uma só abre se você tiver a insígnia certa, então você precisa das 8 antes que a Rota 23 deixe você passar. A grama aqui é de nível alto, com Ditto, Sandslash e Nidos de nível 33 a 45, então mantenha as curas em dia."
            "2":
              title: "Vasculhe a ilhota no meio do canal"
              text: "Depois dos guardas de baixo a estrada abre num canal largo, então surfe ao norte por ele. Uma pequena ilhota seca quebra a água entre os dois Swimmers. Suba nela e aperte A virado para o norte para achar um Max Ether escondido. Nada aparece na tela."
              hidden:
                max-ether: "Na pequena ilhota seca no meio da água, entre os dois Swimmers. Aperte A virado para o norte. Nada aparece na tela."
            "3":
              title: "Varra o canto nordeste"
              text: "Surfe até a margem norte e corte para leste pela grama, entrando no bolsão do canto. Vá até a parede mais distante e aperte A contra a borda leste para pegar uma Ultra Ball escondida. Nada aparece na tela."
              hidden:
                ultra-ball: "No canto nordeste do bolsão de grama logo depois da água, colado na parede leste. Aperte A virado para o leste. Nada aparece na tela."
            "4":
              title: "Revire a clareira do topo"
              text: "Suba pelo labirinto de terra até a clareira gramada perto do extremo norte. Fique na grama e aperte A contra a parede de rocha a oeste para desenterrar um Full Restore escondido. Nada aparece na tela."
              hidden:
                full-restore: "Na grama perto do topo da rota, um quadrado a leste da parede de rocha. Aperte A virado para o oeste. Nada aparece na tela."
            "5":
              title: "Entre na Victory Road"
              text: "Siga pelo lado oeste para cima, passe pelo último guarda e atravesse o portão no topo até a Victory Road, a última caverna antes da Liga Pokémon."
        indigo_plateau:
          note: "A Pokémon League. Elite dos Quatro e o Campeão Blue."
          intro: "As cinco batalhas finais, uma após a outra, sem cura entre as salas. Abasteça antes."
          steps:
            "1":
              title: "Abasteça"
              text: "Cure e compre Full Restores, curas de status e Ultra Balls no saguão antes de entrar."
            "2":
              title: "Vença a Elite dos Quatro"
              text: "Lorelei (Gelo/Água), Bruno (Lutador/Rocha), Agatha (Fantasma/Veneno), Lance (Dragão). Acerte cada um com sua fraqueza."
            "3":
              title: "Vença o Campeão Blue"
              text: "Seu rival começa com Sandslash (Nv 61) e usa Alakazam, Exeggutor, um Magneton ou Cloyster, Ninetales, e a Eeveelution que o Eevee dele virou (Nv 65). O Alakazam tem Recover, então quebre-o com golpes físicos. Vença para entrar no Hall da Fama."
        cerulean_cave:
          note: "Masmorra pós-jogo. Os selvagens mais fortes. E o Mewtwo."
          intro: "Liberada após virar Campeão. Os Pokémon selvagens mais fortes de Kanto, com o Mewtwo esperando no fundo."
          steps:
            "1":
              title: "Surfe para dentro da caverna"
              text: "Depois do Hall da Fama, surfe a noroeste pela água a partir de Cerulean City e entre pela boca da caverna. Você chega no 1F, na câmara sul alagada, cercado pelos selvagens mais fortes de Kanto (Nv 45-65: Rhydon, Chansey, Ditto, Kadabra e mais)."
            "2":
              title: "Surfe até o canto alagado"
              text: "Da lagoa da entrada, surfe para leste até o canto extremo e pegue o Rare Candy parado sozinho na água, na borda sudeste da caverna."
              items:
                rare-candy-29-16: "Canto sudeste do 1F, na água além da lagoa da entrada. Surfe até ele."
            "3":
              title: "Suba pela saliência leste"
              text: "Siga a parede leste para o norte, saindo da água até a saliência, e pegue o Max Revive na borda direita do 1F."
              items:
                max-revive-29-9: "Borda direita (leste) do 1F, na saliência logo ao norte do canto alagado."
            "4":
              title: "Tateie perto da escada central"
              text: "Avance até o meio do 1F, à escada que sobe na câmara central. Aperte A no chão duas casas ao norte dessa escada para achar um PP Up escondido. Nada aparece na tela."
              hidden:
                pp-up-18-7: "Centro do 1F, duas casas ao norte da escada central que sobe. Aperte A; nada aparece na tela."
            "5":
              title: "Chegue à prateleira norte"
              text: "Suba do centro até o topo do 1F e pegue a Ultra Ball encostada na parede norte, perto do meio."
              items:
                ultra-ball-18-3: "Centro-norte do 1F, encostada na parede norte."
            "6":
              title: "Varra o lado oeste"
              text: "Cruze para o lado esquerdo do 1F e pegue o Max Elixir na câmara centro-oeste, perto das escadas inferiores."
              items:
                max-elixir-7-11: "Centro-oeste do 1F, perto das escadas inferiores da esquerda."
            "7":
              title: "Suba para o 2F"
              text: "Pegue uma das escadas que sobem até o 2F, um labirinto de rocha seca, sem nenhuma água. Serpenteie pelos corredores para pegar mais quatro prêmios."
            "8":
              title: "Vá até a parede oeste"
              text: "Siga os corredores até a borda esquerda do 2F e pegue o Rare Candy encostado na parede oeste."
              items:
                rare-candy-0-11: "Borda esquerda (oeste) do 2F, na altura do meio, contra a parede."
            "9":
              title: "Pegue a bola central"
              text: "Volte ao meio do 2F e pegue a Ultra Ball parada no corredor central."
              items:
                ultra-ball-16-7: "Centro do 2F, no corredor do meio."
            "10":
              title: "Vasculhe logo abaixo"
              text: "Desça ao sul pela mesma coluna da Ultra Ball central, até o labirinto de baixo, e aperte A no chão para achar um PP Up escondido. Nada aparece na tela."
              hidden:
                pp-up-16-13: "Centro-sul do 2F, reto abaixo da Ultra Ball central. Aperte A; nada aparece na tela."
            "11":
              title: "Pegue a saliência do meio"
              text: "Logo a leste do ponto escondido, pegue o Max Revive na parte centro-baixa do 2F."
              items:
                max-revive-19-11: "Centro-baixo do 2F, logo a leste do PP Up escondido."
            "12":
              title: "Limpe a câmara leste"
              text: "Serpenteie até o lado direito do 2F e pegue o Full Restore perto da parede leste."
              items:
                full-restore: "Lado direito (leste) do 2F, perto da parede leste."
            "13":
              title: "Desça para o B1F"
              text: "Volte para o 1F e vá até a escada da ponta esquerda, na borda oeste, que desce para o B1F, o andar mais fundo onde o Mewtwo espera. Você chega no lado oeste."
            "14":
              title: "Varra o recanto sudoeste"
              text: "Do ponto de chegada, desça para o sudoeste e pegue a Ultra Ball na borda esquerda, logo acima da água do fundo."
              items:
                ultra-ball-2-13: "Sudoeste do B1F, na borda esquerda, logo acima da água do fundo."
            "15":
              title: "Pegue o vizinho"
              text: "Uma casa a leste dessa Ultra Ball está um Max Revive. Pegue-o também."
              items:
                max-revive-3-13: "Sudoeste do B1F, uma casa a leste da Ultra Ball."
            "16":
              title: "Sonde a margem sul"
              text: "Um pouco a leste pelo fundo do B1F, aperte A no chão na beira da água para achar um PP Up escondido. Nada aparece na tela."
              hidden:
                pp-up-8-14: "Borda sul do B1F, algumas casas a leste do Max Revive, na beira da água. Aperte A; nada aparece na tela."
            "17":
              title: "Chegue ao centro-norte"
              text: "Suba e cruze o meio do B1F até o centro-norte e pegue o Max Elixir ali, perto da parede de cima."
              items:
                max-elixir-15-3: "Centro-norte do B1F, perto da parede de cima."
            "18":
              title: "Encurrale a bola do nordeste"
              text: "Continue até o canto superior direito do B1F e pegue a última Ultra Ball contra a parede norte."
              items:
                ultra-ball-26-1: "Canto superior direito (nordeste) do B1F, contra a parede norte."
            "19":
              title: "Salve antes do Mewtwo"
              text: "Desça até a massa de terra do sudeste e surfe pela água em direção à plataforma do Mewtwo. Antes de pisar nela, salve o jogo: você tem uma única chance nesse lendário Nv 70."
            "20":
              title: "Capture o Mewtwo"
              text: "O Mewtwo está no coração da ilha do sudeste. É Nv 70 e abusa de Recover, então faça-o dormir ou paralise, deixe-o baixo, e jogue a Master Ball, ou encare com uma pilha grande de Ultra Balls."
          tips:
            mewtwo: "O Pokémon mais forte do jogo, um Nv 70 estático. A Master Ball foi feita para isso. Ou faça dormir e reze."
          oak:
            mewtwo: "O lendário pós-jogo no fundo da caverna. Guarde a Master Ball para ele."
            chansey: "Bem mais comum aqui que na Safari. Uma ótima captura de EXP no fundo da caverna."
