            some: "O resto dessa segunda metade não é entregue a ninguém. A experiência de status some junto."
            none: "Com um lutador só, a cópia tem o mesmo tamanho da metade que falta, então o bolo inteiro é distribuído."
        verdict:
          solo: "Um lutador só é o único caso que o código acerta, porque a fatia que ele copia é exatamente metade do bolo. Comece com o Pokémon que você quer treinar, não troque, e a reserva pega carona de graça."
          switch: "Uma única troca custa um quarto da batalha, e custa de novo a cada nocaute pelo resto da luta."
          crowd: "Com essa quantidade em campo, a fatia copiada virou um fiapo e a maior parte da experiência não vai para lugar nenhum. Guarde o item no PC antes de batalhas assim."
        trivia:
          off_switch:
            tag: "SEM BOTÃO DE DESLIGAR"
            title: "O PC é o interruptor"
            text: "Ele funciona só por estar na mochila, sem opção no menu. Guardá-lo no PC é o único jeito de parar o efeito."
          one_only:
            tag: "UM POR CARTUCHO"
            title: "Dá para jogar fora para sempre"
            text: "O jogo deixa você descartá-lo como qualquer item comum, e nenhum caminho legítimo entrega um segundo."
          stat_exp:
            tag: "EXPERIÊNCIA DE STATUS"
            title: "A barra também é o seu status"
            text: "A mesma divisão pela metade roda sobre os cinco status base, então a stat exp se reparte igual ao bolo acima. Mesmo no melhor caso, um lutador sozinho com o item guarda 58,3% do que teria ganho sem ele, e isso são pontos permanentes a menos nos status finais."
      badge_guide:
        eyebrow: "CURIOSIDADE · CASA DAS INSÍGNIAS"
        title: "As Insígnias de Ginásio, explicadas"
        intro: "O homem da casa a noroeste explica o que as oito insígnias fazem de verdade. Metade delas aumenta um atributo de todo Pokémon que você mandar para o campo, a outra metade eleva o nível máximo dos Pokémon trocados. As cinco primeiras também liberam um movimento de campo."
        key_boost: "AUMENTO DE ATRIBUTO"
        key_obey: "LIMITE DE OBEDIÊNCIA"
        tag_boost: "AUMENTO"
        tag_obey: "OBEDECE"
        tag_field: "CAMPO"
        field_none: "Nenhum"
        obey: "Trocados até o Nv %{level}"
        boost:
          attack: "Aumenta o Ataque"
          defense: "Aumenta a Defesa"
          speed: "Aumenta a Velocidade"
          special: "Aumenta o Especial"
        rules:
          tag: "REGRAS QUE O YELLOW NUNCA CONTA"
          sub: "Quatro coisas que o homem das insígnias não menciona."
          boost:
            label: "O AUMENTO"
            title: "O aumento é de cerca de 12,5%"
            text: "Vale só em batalha, e para todo Pokémon que você mandar para o campo, não apenas o que ganhou a insígnia."
          stacking:
            label: "O ACÚMULO"
            title: "Ele acumula sem querer"
            text: "O jogo reaplica o aumento sempre que um atributo é recalculado, então cada X Attack ou Growl soma mais 12,5%. Batalhas longas inflam seus números muito além do previsto."
          caps:
            label: "OS LIMITES"
            title: "Limite só para os trocados"
            text: "Trocas dentro do jogo contam. O que você capturou obedece em qualquer nível, por menos insígnias que você tenha."
          field_moves:
            label: "OS MOVIMENTOS"
            title: "A HM não basta"
            text: "Movimentos de campo também exigem a insígnia certa. Escolha Cut no menu sem a Insígnia Cascade e o jogo responde 'No! A new BADGE is required.'"
      fossil_wait:
        tag: "LABORATÓRIO DE CINNABAR"
        title: "Dois passos. É essa a espera inteira."
        intro: "Entregue um fóssil ao cientista da sala dos fundos do Laboratório Pokémon e ele avisa que vai demorar. Não vai. Nada conta minutos, batalhas ou passos: a revivência é uma marca que a própria ilha limpa no instante em que você põe o pé na rua. Saia pela porta da frente, entre de novo, e a pedra já é um Pokémon de Nv 30."
        head: "PASSOS · SAIR E VOLTAR"
        quote: "\"I take a little time! You go for walk a little while!\""
        steps:
          "1":
            title: "Saia pela porta da frente."
            text: "Atravessar o saguão e pisar um quadrado no capacho já basta. Você não precisa ir a mais lugar nenhum da ilha."
          "2":
            title: "Volte direto para dentro."
            text: "Pisar na rua é o que conclui a revivência. Fale com ele de novo e ele entrega o Pokémon no Nv 30. Ele guarda um fóssil por vez, então cada um pede a própria saída e volta."
        facts:
          flag: "Entregar o fóssil acende um bit no save. Pisar na ilha é o que o vira para pronto."
          box: "Não precisa de espaço na equipe. Com seis Pokémon com você, o revivido vai direto para a caixa."
          standing: "Ficar parado e falar com ele de novo não faz nada, e o saguão também não. Você tem que chegar à rua."
          detour: "Andar pela ilha, curar ou salvar no meio do caminho também não muda nada."
        note: "Mesmo truque em FireRed e LeafGreen: um quadrado para fora, um para dentro. Let's Go finalmente revive o fóssil na hora."
      surf_pikachu:
        eyebrow: "CURIOSIDADE · A CASA DA PRAIA"
        title_html: "Pikachu <span class=\"pn-sp__hl\">Surfista</span>"
        lead: "A porta no extremo norte desta rota esconde um minigame inteiro atrás de um Pokémon que o cartucho não consegue produzir. O Pikachu nunca aprende Surf aqui: nem por TM, nem por HM, nem na lista de nível. Mesmo assim, Yellow guarda um sprite de prancha pronto para o mapa e uma casa de praia esperando quem aparecer em cima de uma."
        chips:
          house: "ROTA 19 · CASA DA PRAIA"
          stadium: "PRECISA DE POKÉMON STADIUM"
          reward: "SEM PRÊMIO, PURA NOVIDADE"
        art_caption: "A Game Freak desenhou a prancha e depois trancou tudo atrás de um acessório de Nintendo 64."
        sprite:
          label: "SPRITE NO MAPA"
          text: "Surfe em qualquer canto de Kanto nesse Pikachu e ele anda na própria prancha. Qualquer outro Pokémon carregando você usa o sprite comum de mar, então a prancha é a única coisa que toda essa empreitada põe na tela."
          shots:
            board: "Na prancha"
            other: "Qualquer outro surfista"
        beach:
          tag: "MINIGAME"
          title: "A Praia do Pikachu"
          text: "A casa fica na areia no topo da rota, a um passo da água. Entre com um Pikachu surfista no time, fale com o Surfin' Dude, diga que sim, e ele te põe em cima de uma onda."
          caption: "Esquerda e direita giram o Pikachu na crista da onda. Caia reto ou você capota."
        scoring:
          label: "PONTUAÇÃO · RADNESS"
          note: "A pontuação final é o HP que sobrou quando você chega à praia mais a radness acumulada. Tempo no ar aumenta a velocidade e uma aterrissagem limpa a mantém, enquanto uma queda te devolve à velocidade em que começou. Não há prêmio: o Hi-Score fica na máquina da parede do fundo, e uma Game Boy Printer imprime o resultado."
        scores:
          one:
            label: "1 GIRO"
            note: "Qualquer giro simples na crista."
          two:
            label: "2 GIROS"
            note: "O número maior é girar um para cada lado."
          three:
            label: "3+ GIROS"
            note: "De novo o maior mistura frente e costas. O medidor para aqui."
          hp:
            label: "HP"
            note: "Um relógio, não uma barra de vida. Cai um ponto a cada quadro lá fora."
        stadium:
          tag: "CAMINHO LEGÍTIMO"
          console: "NINTENDO 64"
          title: "Como pôr Surf no seu Pikachu"
          box_alt: "Capa de Pokémon Stadium para Nintendo 64"
          text_html: "Um cartucho sozinho nunca dá conta. O golpe vem de <b>Pokémon Stadium</b> no Nintendo 64, que lê o seu save pelo Transfer Pak e entrega o Surf como prêmio de torneio. É um pedido longo."
          steps:
            round_html: "Libere o <b>Round 2</b>. Isso quer dizer todas as copas, o Gym Leader Castle e o Mewtwo, tudo vencido."
            cup_html: "Entre na <b>R-2 Prime Cup, divisão Master Ball</b>, a última das quatro."
            own_html: "Escale o <b>seu próprio Pikachu, vindo do cartucho de Yellow</b>. Nada de alugado, e ele não pode já saber Surf."
            field_html: "Mande ele para a arena em <b>todas as batalhas da copa</b>, e leve a copa <b>sem continues</b>."
            award_html: "A tela de premiação mostra o Pikachu na prancha e oferece trocar o Surf por um dos golpes dele. Aceite e leve de volta para casa."
          note: "As únicas outras fontes honestas foram as distribuições oficiais de evento da época e, muito depois, um download gratuito em Pokémon Battle Revolution no Wii. O resto é aparelho de trapaça."
        vc:
          label: "VIRTUAL CONSOLE · 3DS"
          text_html: "Sem Transfer Pak e sem Stadium, a praia teria virado conteúdo morto. A versão de 3DS mudou a fechadura: leve o seu <b class=\"pn-sp__vc-hl\">Pikachu parceiro</b>, aquele que carrega o seu nome e ID, e o Surfin' Dude libera a brincadeira. O Surf em si continua fora do seu alcance."
        aside: "Chegue sem um e o Dude só avisa que os cachorros-quentes e hambúrgueres estão em promoção. Chegue com um e ele diz que não está mais sozinho, embora o Pikachu que anda pela sala nunca suba numa prancha."
      locations:
        pallet_town:
          note: "Pegue o Pikachu com o Prof. Oak. Sem grama selvagem aqui."
          intro: "Uma vila de uma rua só, com duas casas e o laboratório do Carvalho, sem nenhuma grama dentro dela. Todo treinador de Kanto começa nesta porta."
          trivia:
            title: "Esta batalha decide o Eevee do seu rival"
            intro: "O resultado desta batalha, mais uma revanche opcional na Rota 22, define em qual evolução o Eevee do seu rival se transforma. Jogue como quiser, mas aqui está a receita de cada uma."
            note: "// A revanche da Rota 22 só importa se você vencer aqui primeiro; se perder, vira Vaporeon de qualquer jeito."
            cards:
              vaporeon:
                this: "Perca esta batalha"
                rt22: "Resultado da Rota 22 ignorado"
              jolteon:
                this: "Vença esta batalha"
                rt22: "Vença também a batalha da Rota 22"
              flareon:
                this: "Vença esta batalha"
                rt22: "Pule a batalha da Rota 22"
          steps:
            "1":
              title: "Retire a Potion grátis"
              text_html: "No seu quarto no andar de cima, cheque a PC e retire a Potion grátis, depois desça e saia pela porta da frente %{home}."
              items:
                potion: "Quarto de cima, dentro da PC."
            "2":
              title: "Pegue o Pikachu com o Oak"
              text_html: "Vá até a saída norte %{north}. Ao pisar na grama da Rota 1, o Oak te para e te leva ao laboratório %{lab} para entregar o Pikachu, que anda ao seu lado em vez de ficar na Ball."
            "3":
              title: "Vença seu rival"
              text_html: "O Blue pega um Eevee e te enfrenta no laboratório: Nv 5 com Tackle e Tail Whip. Lidere com o Pikachu e use ThunderShock por <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dólar\"></span><span class=\"pn-money-value__n\">175</span></span>. Esse resultado é metade do que define <a href=\"%{href}\">em qual evolução o Eevee dele vira</a>."
            "4":
              title: "Siga ao norte para a Rota 1"
              text_html: "Saia de Pallet pela saída norte %{north} para a Rota 1, seguindo rumo a Viridian City."
          tips:
            pikachu: "Seu parceiro obrigatório e o único Pikachu do jogo. Ele recusa a Thunder Stone, então continua Pikachu."
        route_1:
          note: "Primeiro trecho de grama. Pidgey e Rattata."
          intro: "Um pulo curto ao norte até Viridian, só desníveis e grama baixa. Pidgey e Rattata são as duas únicas coisas que vivem nela."
          steps:
            "1":
              title: "Varra a grama alta"
              text: "Vá ao norte pela grama alta, batalhando Pidgey e Rattata selvagens para subir o nível do Pikachu. Você ainda não tem Poké Balls, então capture na volta, com a loja de Viridian abastecida."
            "2":
              title: "Pegue a Potion grátis"
              text_html: "Um Youngster %{man} na borda oeste da estrada trabalha no Poké Mart de Viridian. Fale com ele e ele entrega uma Potion de amostra grátis."
              items:
                potion: "Com o homem ao lado da placa perto da saída sul (Pallet)."
            "3":
              title: "Entre em Viridian City"
              text_html: "Continue ao norte %{north} até Viridian City. Mais tarde, na volta, pule os desníveis do lado leste para evitar a grama no caminho de retorno."
          tips:
            pidgey: "Por toda a Rota 1. Um Normal/Voador confiável que evolui até Pidgeot."
            rattata: "Rápido e comum. Evolui para Raticate, um bom atacante inicial."
        viridian_city:
          mart:
            blurb: "O primeiro Mart do jogo. Só começa a vender depois que você entrega o Oak's Parcel vindo de Pallet Town."
            buy: "Compre um punhado de Poké Balls para as Rotas 1–2 e a Viridian Forest. Antidote cobre o Poison Sting da linha do Weedle."
          note: "Tutorial de captura, Oak's Parcel, estoque de Poké Balls."
          intro: "Onde as estradas de Kanto se encontram: Pallet ao sul, Rota 2 ao norte, Rota 22 a oeste. O ginásio da própria cidade fica fechado até você ter as outras sete insígnias."
          later:
            tm42:
              where: "O Pescador que entrega o TM42 (Dream Eater) fica numa faixa cercada no canto sudoeste, isolada por uma árvore cortável e pelo laguinho. Você não consegue chegar até ele na primeira passagem."
              after: "Corte a árvore com o HM01 Cut (do S.S. Anne, em Vermilion). O guia passa aqui no fim do desvio da Diglett's Cave."
          missable:
            title: "Cinco Poké Balls grátis"
            body_html: "O Oak te dá <b>cinco Poké Balls</b> se você vencer o rival da Rota 22 sem carregar <b>nenhuma</b> e tendo capturado <b>só o Pikachu</b>. É pouca coisa, mas se quiser, deixe a loja para depois dessa luta."
            tip: "O Pikachu entra sozinho contra o Spearow e o Eevee dele, então pegue alguns níveis no mato da Rota 22 antes."
          steps:
            "1":
              title: "Cure e pegue o Oak's Parcel"
              text_html: "Cure no Centro Pokémon %{center} no canto superior esquerdo, se precisar, depois entre na loja %{mart} logo a nordeste. Fale com o atendente no balcão e ele entrega o Oak's Parcel para levar de volta ao sul."
              items:
                oaks_parcel: "Com o atendente da loja em Viridian; entregue ao Oak em Pallet Town."
            "2":
              title: "Entregue o Oak's Parcel"
              text: "Leve o Parcel ao sul, ao laboratorio do Oak em Pallet Town. Entregue a ele e enfim ele te da a Pokédex, a ferramenta que registra cada Pokémon que você ve e captura."
              items:
                pokedex: "Dada pelo Prof. Oak quando você entrega o Oak's Parcel; registra cada Pokémon que você vê e captura."
            "3":
              title: "Pegue o Town Map"
              text: "Enquanto está em Pallet pela Pokédex, entre na casa do Blue a leste. Fale com a irmã dele, a Daisy, e ela te dá o Town Map, que mostra cada rota e cidade de Kanto."
              items:
                town_map: "Com a Daisy, irmã do Blue, na casa logo a leste da sua em Pallet Town."
            "4":
              title: "Abasteca na loja"
              text: "Volte a Viridian e abasteça na loja: Poke Balls, Potions e Antidotes para a Rota 22, a Rota 2 e a Floresta. Para pegar as cinco grátis do Oak, compre depois do rival da Rota 22."
            "5":
              title: "Veja a demonstracao de captura"
              text: "O velho na estrada ao norte ja acordou. Fale com ele e assista a demonstracao de captura; quando ela termina, ele sai do caminho e a passagem ao norte enfim abre."
            "6":
              title: "Pegue a Potion escondida perto da saida norte"
              text_html: "Com o caminho aberto, suba até a saída norte %{north}, no topo da cidade. Uma árvore solitária ao lado do caminho de saída esconde uma Potion. Aperte A ao lado dela; nada aparece na tela."
              hidden:
                potion: "A árvore solitária ao lado do caminho da saída norte, no topo da cidade. Aperte A; nada aparece na tela."
            "7":
              title: "Pule o Ginasio e siga a oeste para a Rota 22"
              text_html: "O Ginásio %{gym} no nordeste fica trancado até você ter as outras sete insígnias, então deixe para depois. Pegue a saída oeste %{west} para a Rota 22, pelas melhores capturas contra o Brock e o próximo rival."
        route_22:
          note: "Rota oeste opcional. Nidoran♀/♂, Mankey, Spearow. Mais a primeira batalha de rival."
          intro: "Um beco sem saída a oeste de Viridian que termina no portão da Liga Pokémon. Seu rival te desafia aqui agora, e de novo na estrada para a Victory Road."
          steps:
            "1":
              title: "Atravesse a grama"
              text: "Vá a oeste de Viridian até a grama. Capture Nidoran♂/♀ e Mankey aqui. Eles vencem os tipos Pedra do Brock."
            "2":
              title: "Vença o rival"
              text_html: "O Blue te desafia perto da água com Spearow (Nv 9) e Eevee (Nv 8). Vença por <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dólar\"></span><span class=\"pn-money-value__n\">280</span></span>. Esta é a outra metade da <a href=\"%{href}\">receita do Eevee</a>: vencer aqui depois de Pallet trava o Jolteon, pular trava o Flareon."
            "3":
              title: "Opcional: as cinco Poké Balls do Oak"
              text_html: "Ainda sem nenhuma Poké Ball e só com o Pikachu capturado? Volte ao Laboratório do Oak em Pallet Town e fale com ele para ganhar <b>cinco Poké Balls</b>. Veja a <a href=\"#missable-poke-balls\">nota de perdível</a>."
            "4":
              title: "Volte para Viridian"
              text: "O portão da Liga mais a oeste fica bloqueado até você ter todas as insígnias. Volte ao leste e suba para a Rota 2."
          tips:
            nidoranf: "Capture uma. Sua linha (Nidoqueen) é forte e cobre o Brock com golpes de Terra."
            nidoranm: "Aprende Low Kick cedo e evolui para Nidoking. Uma das melhores respostas ao Brock."
            mankey: "Low Kick é super-eficaz nos tipos Pedra do Brock. Pegue um."
            rattata: "Preenchimento comum aqui. Evolui para Raticate."
            spearow: "Normal/Voador cedo; evolui para Fearow. Agressivo e fácil de achar."
          oak:
            nidoranf: "Sua linha chega a Nidoqueen. Registre a base uma vez."
            nidoranm: "Evolui para Nidoking e ajuda contra o Brock. Registre um."
            mankey: "Único lugar fácil por um tempo. Pegue para o Brock."
            spearow: "Normal/Voador cedo, evolui para Fearow."
        route_2:
          note: "Trecho curto até a floresta. Pidgey, Rattata e Nidoran."
          intro: "Um corredor longo de norte a sul, com a Viridian Forest encaixada no lado oeste. Árvores cortáveis a dividem no comprimento, então metade dos marcadores fica fora de alcance até você ter o Cut."
          later:
            moon_stone:
              where: "Uma Poké Ball no fundo do terreno cercado de árvores no lado leste da Route 2. As árvores cortáveis isolam toda a metade leste na primeira passagem, então você ainda não chega lá."
              after: "O guia volta aqui no desvio da Diglett's Cave, subindo pelo túnel a partir de Vermilion com o Cut na mochila."
            hp_up:
              where: "Uma segunda Poké Ball logo ao norte da Moon Stone, no mesmo terreno leste bloqueado por Cut. As duas ficam atrás da mesma parede de árvores cortáveis."
              after: "Mesma ida, nove quadrados acima na faixa: o desvio da Diglett's Cave, entrando pela saída norte do túnel."
            flash:
              where: "O Assistente do Prof. Carvalho entrega o HM05 Flash dentro do portão da Route 2, no mesmo lado leste bloqueado por Cut. Ele só dá quando você tiver capturado pelo menos 10 tipos de Pokémon (a contagem na Pokédex, não quantos você tem)."
              after: "Mesma ida, com 10 espécies capturadas. É o Flash que ilumina a Rock Tunnel um trecho depois, então o desvio da Diglett's Cave se paga."
          trades:
            mr_mime:
              npc: "CIENTISTA"
              title: "Mr. Mime"
              where: "A casa de troca na Rota 2"
              note: "Yellow não tem Mr. Mime selvagem, então esta troca é o único jeito de obtê-lo. O preço é um Clefairy extra do Monte da Lua, então guarde um na caixa ao passar por lá."
          steps:
            "1":
              title: "Atravesse a grama sul"
              text: "Suba ao norte pela grama curta a partir da borda de Viridian City. Capture um Nidoran selvagem aqui se pulou a Rota 22, e registre um Pidgey ou Rattata para a dex enquanto passa."
            "2":
              title: "Entre na Viridian Forest"
              text_html: "Siga a faixa oeste até o portão da floresta %{gate} e entre. O lado leste cercado de árvores, com a Moon Stone, o HP Up, o HM05 Flash e a troca do Mr. Mime, fica trancado até você ter Cut."
          tips:
            pidgey: "O mesmo voador confiável da Rota 1 se você ainda precisar de um."
            rattata: "Comum de novo. Pule se já capturou um."
            nidoranf: "Uma segunda chance de Nidoran♀ se pulou a Rota 22."
            nidoranm: "Uma segunda chance de Nidoran♂. Pegue para a luta contra o Brock."
          oak:
            pidgey: "Comum na grama daqui, e a esta altura você já tem Poké Balls. Registre um; evolui até Pidgeot."
            rattata: "Por toda a Rota 2. Pegue um para a dex; evolui para Raticate."
        viridian_forest:
          note: "Paraíso dos Inseto. Caterpie, Metapod, Pidgey. Itens ocultos dentro. Sem Pikachu selvagem no Yellow."
          intro: "Uma treliça de paredes de árvore entre a Rota 2 e Pewter, patrulhada por Bug Catchers. Caterpie vive aqui e em nenhum outro lugar, e Pikachu selvagem não vive aqui de jeito nenhum."
          steps:
            "1":
              title: "Entre pelo portão da Rota 2"
              text_html: "Entre pelo portão sul. A grama alta preenche todo o labirinto, sua única chance de Caterpie, Metapod e Pidgey. A Lass %{lass} e quatro Bug Catchers esperam nas árvores."
            "2":
              title: "Cheque a árvore isolada"
              text: "Uma árvore isolada fica logo depois do portão, com um Youngster no quadrado abaixo dela. Fique do lado oeste dela, olhe para leste e aperte A para um Antidote oculto."
              hidden:
                antidote: "A árvore isolada logo depois do portão sul. O Youngster ocupa o quadrado abaixo dela, então fique do lado oeste da árvore, olhe para leste e aperte A. Nada aparece na tela."
            "3":
              title: "Saqueie o beco sem saída a oeste"
              text: "Vá ao norte a partir da árvore, depois a oeste pela clareira e suba até o beco de grama sem saída. A Poké Ball fica lá no fim, junto à parede."
              items:
                pok-ball: "Junto à parede oeste, no fim do beco de grama sem saída, duas clareiras ao norte do portão."
            "4":
              title: "Suba pelo lado leste"
              text_html: "Volte à clareira da entrada e siga para leste; aquela abertura é a única rota norte da floresta. Suba passando pelos Bug Catchers %{low} e %{high} até uma Potion na viela estreita."
              items:
                potion-25-11: "Seis passos acima na viela de duas colunas ao norte da placa de avaliação da Pokédex, no nordeste da floresta."
            "5":
              title: "Contorne até a Potion do meio"
              text_html: "Contorne para oeste pelo topo do labirinto, passando pelo Bug Catcher %{middle}, e desça pelo caminho oeste. A Potion espera no pé de uma fresta de duas colunas nos arbustos."
              items:
                potion-12-29: "No pé da fresta de duas colunas no meio da floresta, do outro lado das árvores da placa de Antidote. Só dá para chegar pelo norte."
            "6":
              title: "Vasculhe a parede oeste"
              text_html: "Volte e siga a parede oeste para o norte. O Bug Catcher %{west} ocupa a faixa da direita; o quadrado ao lado dele esconde uma Potion. Fique abaixo, olhe para cima e aperte A."
              hidden:
                potion: "Um quadrado a oeste do Bug Catcher C na coluna da parede oeste. Fique no quadrado logo abaixo, olhe para cima e aperte A. Nada aparece na tela."
            "7":
              title: "Saia para Pewter City"
              text_html: "Capture um Caterpie ou Metapod antes de ir; o Butterfree aprende Confusion, uma resposta rara e boa ao Brock. Saia pela saída %{north} para a Rota 2 e então para Pewter City."
          tips:
            caterpie: "Por toda a grama. Evolui rápido para Butterfree, cujo Confusion machuca o Brock."
            metapod: "Um spawn de 25%, então pegar um direto é fácil. Um Caterpie também chega aqui no Nv 7."
            pidgey: "Comum aqui também se ainda precisar de um para a dex."
            pidgeotto: "Um spawn raro de 1%. Um voador evoluído de graça se tiver paciência."
          oak:
            caterpie: "A nova família da floresta. Evolui para Butterfree. Registre a base uma vez."
        pewter_city:
          mart:
            blurb: "Logo ao lado do Centro Pokémon. Reabasteça aqui antes do Mt. Moon, uma caverna longa e sem lojas."
            buy: "Poké Balls para os Clefairy do Mt. Moon e algumas Potions. Um Escape Rope te tira de lá se você se perder."
          gym:
            intro: "Um ginásio curto e reto, sem quebra-cabeça. Vença o Jr. Trainer solitário na entrada e depois o Brock no fundo. O Geodude (Nv 10) e o Onix (Nv 12) dele ignoram o Pikachu por completo, então lidere com Low Kick do Mankey, um Nidoran ou Confusion do Butterfree. Quando o Onix usar Bide, pare de atacar por dois turnos ou ele devolve todo o dano acumulado de uma vez."
          note: "Brock. O primeiro Ginásio. Tipos Pedra; Elétrico não faz nada."
          intro: "Uma cidade cinzenta de mineração ao pé do Mt. Moon, construída em torno do museu e do ginásio de pedra do Brock. Não cresce grama dentro dos muros."
          steps:
            "1":
              title: "Cure, prepare e entre no Ginásio"
              text_html: "Cure no Centro Pokémon %{center} e compre Potions no Mart %{mart}. Pikachu nao faz nada contra Pedra, entao lidere com Mankey, um Nidoran ou Butterfree, depois entre no Ginásio %{gym} no lado oeste."
            "2":
              title: "Siga para leste ate a Rota 3"
              text_html: "Com a Insígnia Boulder, o garoto que bloqueia a saída leste %{east} sai do caminho. Siga para leste na Rota 3 rumo a Mt. Moon."
          trivia:
            title: "Jigglypuff faz seu Pikachu dormir"
            intro: "Um Jigglypuff fica encostado na parede dentro do Centro Pokémon de Pewter City. Fale com ele e ele solta a cantiga \"Puu pupuu!\": se o seu Pikachu estiver andando atrás de você, a canção apaga ele na hora e ele para de te seguir, igualzinho a ser posto para dormir numa batalha."
            note: "Só acontece quando o Pikachu é seu parceiro te seguindo e está sem nenhuma condição de status. Fora isso, o Jigglypuff apenas canta. Uma piscadela para como o golpe Sing dele funciona numa batalha de verdade."
        route_3:
          note: "A subida até o Mt. Moon. Spearow, Sandshrew e Mankey."
          intro: "Uma subida estreita a leste de Pewter com oito treinadores, mais que qualquer estrada até aqui. Termina no Centro Pokémon na entrada do Mt. Moon."
          steps:
            "1":
              title: "Suba a rota lutando"
              text: "Siga a leste de Pewter e suba os desníveis, limpando os Bug Catchers, Youngsters e Lasses espalhados pela subida rumo ao Mt. Moon."
            "2":
              title: "Varra a grama"
              text_html: "Capture Spearow, Sandshrew ou Mankey na grama. Sandshrew e Mankey ajudam nas cavernas; depois siga a rota até o fim e saia na Route 4 %{north}, onde espera o Centro Pokémon do Mt. Moon."
          oak:
            sandshrew: "Tipo Terra, evolui para Sandslash. Útil nas cavernas à frente."
        route_4_mt_moon:
          note: "A entrada do Mt. Moon: cure e entre na caverna."
          intro: "A ponta oeste da Rota 4: um desnível, um Centro Pokémon e a boca do Mt. Moon. O resto da rota fica do outro lado da caverna."
          steps:
            "1":
              title: "Cure no Centro Pokémon do Mt. Moon"
              text_html: "Saia da Rota 3 para a ponta oeste da Route 4 e cure no Centro Pokémon do Mt. Moon %{center}, perto da boca da caverna. Sua última parada antes da caverna, então recupere tudo e compre Poké Balls."
            "2":
              title: "Entre no Mt. Moon"
              text_html: "Entre no Mt. Moon pela entrada %{cave}, logo ao lado do Centro. Você sai na metade leste da Route 4, coberta no próximo trecho."
          trivia:
            title: "O homem que vende um Magikarp"
            intro: "Dentro do Centro Pokémon do Mt. Moon um homem vende um Magikarp por ¥500. Sozinho ele só usa Splash, mas evolui para Gyarados, um verdadeiro monstro. Comprar aqui vale a pena se você quer começar a treiná-lo imediatamente, já que chegar até o Gyarados leva um bom tempo."
            note: "Se você só precisa dele para a Pokédex, não tem pressa: dá para pescar Magikarp depois com o Old Rod, então pode esperar e economizar. Ele vende um único Magikarp nível 5 e não dá reembolso."
        mt_moon:
          note: "Travessia de caverna. Zubat, Geodude, Clefairy rara e um fóssil."
          intro: "Três andares de rocha escura sob a Rota 4, escavados pela Equipe Rocket. Clefairy vive aqui e em nenhum outro lugar, e dois fósseis esperam no fundo para você ficar com exatamente um."
          steps:
            "1":
              title: "Siga a parede oeste até o TM12"
              text: "Siga a parede oeste até o canto sudoeste, onde uma bola guarda o TM12 Water Gun, um golpe de Água barato para quem puder aprender."
              items:
                tm-water-gun: "Canto sudoeste do 1F, seguindo a parede oeste desde a entrada."
            "2":
              title: "Continue ao norte pela parede por uma Potion"
              text: "Continue seguindo a parede oeste ao norte até uma Potion numa bola, mais ou menos na metade da subida."
              items:
                potion-2-20: "Junto à parede mais a oeste do 1F, na metade da altura."
            "3":
              title: "Desça duas escadas pelo HP Up"
              text_html: "Siga o caminho a leste até a escada %{down}, depois a escada %{lower} abaixo dela, até o B2F. Subindo o pequeno platô à sua direita está um HP Up, um aumento permanente de HP. Volte ao 1F pelo mesmo caminho."
              items:
                hp-up: "No pequeno platô do B2F, descendo direto pelas duas escadas a leste da entrada."
            "4":
              title: "Ao sul pela segunda Potion"
              text: "De volta ao 1F, siga direto ao sul. Procure no sudoeste desse bolsão uma segunda Potion numa bola."
              items:
                potion-20-33: "Centro-sul do 1F, no sudoeste do bolsão abaixo da primeira escada."
            "5":
              title: "Direto a leste até o Rare Candy"
              text: "Da Potion, siga direto a leste até um Rare Candy. Um nível grátis para o Pokémon que quiser."
              items:
                rare-candy: "Sudeste do 1F, direto a leste da segunda Potion."
            "6":
              title: "Suba a parede leste pelo Escape Rope"
              text: "Siga a parede mais a leste da caverna ao norte. Um Escape Rope está numa bola no caminho da subida."
              items:
                escape-rope: "Junto à parede mais a leste do 1F, no caminho ao norte."
            "7":
              title: "Desça as escadas do nordeste"
              text_html: "Do canto nordeste siga a oeste, depois pegue o caminho à esquerda e ao sul até a escada %{down}. Abaixo, um trecho reto do B1F segue a oeste até a escada %{lower} e desce ao B2F."
            "8":
              title: "Suba o platô pelo TM01"
              text: "Suba o pequeno platô pelo TM01 Mega Punch, um golpe Normal pesado para um atacante físico."
              items:
                tm-mega-punch: "No pequeno platô do B2F, logo depois da escada por onde você desceu."
            "9":
              title: "Examine a rocha solitária pelo Ether"
              text: "Examine a rocha solitária a leste para achar um Ether oculto; nada aparece na tela. Depois pegue as escadas de volta ao 1F."
              hidden:
                ether: "A rocha solitária a leste do TM01, no B2F. Aperte A; nada aparece na tela."
            "10":
              title: "Pegue a Moon Stone no noroeste"
              text: "Continue ao sul pelo caminho e depois suba ao noroeste. Uma Moon Stone está numa bola no canto. Nunca venda: ela evolui Clefairy, Nidorina e Nidorino."
              items:
                moon-stone: "Canto superior esquerdo (noroeste) do 1F."
            "11":
              title: "Desça as escadas do noroeste"
              text_html: "A escada %{down} fica a poucos passos a leste do canto. Pegue-a, siga o caminho curto até a escada %{lower} e desça ao B2F."
            "12":
              title: "Procure a Moon Stone no fim sem saída"
              text: "Pegue o caminho leste descendo as escadas, depois suba o outro conjunto e siga o caminho longo a oeste. Antes das escadas ao norte, um beco estreito à direita esconde uma Moon Stone na parede do fim."
              hidden:
                moon-stone: "A parede do fim do beco estreito a leste dos fósseis, no B2F. Aperte A; nada aparece na tela."
            "13":
              title: "Escolha um fóssil"
              text: "Siga ao norte até os dois fósseis na mesa do Super Nerd. O Dome fica à esquerda e vira Kabuto, o Helix à direita e vira Omanyte. Pegue UM; o outro se perde para sempre."
              items:
                fossil: "Na mesa do Super Nerd no B2F: Dome (Kabuto) é o da esquerda, Helix (Omanyte) o da direita. Reviva no Laboratório de Cinnabar depois; o outro se perde para sempre."
            "14":
              title: "Saída para a Rota 4"
              text_html: "Depois dos fósseis e a oeste, pegue a escada %{up} ao sul até o B1F, depois a saída %{out} a leste e de volta para fora, na Rota 4."
          tips:
            clefairy: "Só 1% no 1F, mas 10,5% lá no B2F. Pegue dois: uma Moon Stone transforma um em Clefable."
          oak:
            clefairy: "Captura rara da caverna. Evolua com uma Moon Stone em Clefable."
            geodude: "Por toda a rocha. Evolui para Graveler, depois Golem por troca."
        route_4:
          note: "Descida curta até Cerulean. Mesma grama da Rota 3."
          intro: "O longo desnível a leste do Mt. Moon, descendo até Cerulean em degraus de mão única. Depois de pular, o único jeito de voltar é pela caverna."
          steps:
            "1":
              title: "Saia do Mt. Moon"
              text_html: "Você sai pelo lado leste do Mt. Moon %{exit}. O Centro Pokémon fica fechado na face oeste, então a próxima cura é em Cerulean. Desça da boca da caverna e siga a leste, pegando dois itens no caminho."
            "2":
              title: "Ache a Great Ball oculta"
              text: "Mais ou menos na metade do topo da rota, uma Great Ball está enterrada no chão aberto, encostada na parede norte. Fique no tile logo abaixo dela e aperte A virado para cima. Nada aparece na tela."
              hidden:
                great-ball: "Enterrada contra a parede do topo, perto do meio da rota. Fique um tile ao sul dela, vire para cima e aperte A. Nada aparece na tela."
            "3":
              title: "Pegue o TM04 (Whirlwind)"
              text: "Mais a leste pelo platô, uma Poké Ball fica no aberto com uma Lass patrulhando bem ao lado. Ande sobre ela para pegar o TM04, Whirlwind."
              items:
                tm-whirlwind: "Uma Poké Ball no platô, na metade leste da rota, logo a oeste da Lass. Ande sobre ela."
            "4":
              title: "Desça para Cerulean City"
              text_html: "Passado o TM, pule os desníveis. Eles levam a leste e despejam direto do outro lado %{east}, em Cerulean City."
          trainers:
            lass:
              note: "Você não consegue alcançar esta Lass na passagem. Ela fica na ponta leste do platô superior da Rota 4, e os desníveis de mão única te jogam em Cerulean antes de chegar até ela. Anote para uma volta mais tarde."
        cerulean_city:
          mart:
            blurb: "O Mart de Cerulean acrescenta Repel à prateleira, útil nas rotas cheias de treinadores até o Bill."
            buy: "Poké Balls para as Rotas 24–25 e um Repel ou dois para andar pelo mato em paz."
          gym:
            intro: "Um Swimmer, uma Jr. Trainer e chão livre, depois a Misty. O Staryu (Nv 18) e o Starmie (Nv 21) dela batem forte com golpes de Água, e o Recover do Starmie arrasta a luta, então feche rápido com um atacante Elétrico ou Grama. O ThunderShock do Pikachu é ideal."
            notes:
              swimmer: "NÃO vença este Treinador se você planeja fazer o glitch do Mew. O estágio de Ataque do Shellder dele define o nível do Mew."
              misty: "Vencer a Misty tranca o Swimmer atrás dela. Deixe-a de pé até depois da sua corrida do Mew."
          note: "Ginásio da Misty. Cascade Badge. E um Bulbasaur grátis."
          intro: "Uma cidade à beira do lago, construída em torno do ginásio de água da Misty. A Equipe Rocket já arrombou a parede dos fundos de uma casa, e a loja de bicicletas só aceita voucher, nunca dinheiro."
          steps:
            "1":
              title: "Cure e abasteça"
              text_html: "Chegando da Rota 4, cure no Centro %{center} e abasteça no Mart %{mart}. Deixe o Ginásio %{gym} quieto por enquanto: tudo ao norte da cidade vale a pena antes, e a Misty fecha esta etapa."
            "2":
              title: "Pegue o Rare Candy escondido"
              text_html: "A faixa no topo da cidade é cercada. Entre na casa das insígnias %{door} do lado oeste e saia pelos fundos para pegar um Rare Candy enterrado, um nível de graça. Fique abaixo dele e aperte A virado para cima; nada aparece na tela."
              hidden:
                rare_candy: "Na faixa cercada no topo da cidade, alcançada pela casa das insígnias do lado oeste. Fique logo abaixo dele e aperte A."
            "3":
              title: "Pegue os extras e siga ao norte"
              text_html: "Pegue o Bulbasaur grátis na casa da Melanie %{house} se a amizade do Pikachu estiver alta, depois siga ao norte %{north} até a Nugget Bridge. A casa assaltada fica lacrada: a Officer Jenny só sai de lá quando o Bill te entregar o S.S. Ticket, então o TM28 Dig fica para essa volta."
              items:
                bicycle: "Na Bike Shop, quando você troca o Bike Voucher que ganha em Vermilion. Você volta pra pegar, e nunca mais anda a pé."
            "4":
              title: "Desça de volta para a Misty"
              text: "Com o S.S. Ticket do Bill na mochila, volte ao sul até Cerulean. Cure, reponha as Poké Balls e encare o Ginásio: lidere com Pikachu ou um tipo Grama contra a equipe de Água da Misty."
          tips:
            bulbasaur: "Grátis na casa da Melanie quando o Pikachu está feliz. Evolui até Venusaur."
            mew: "Nada no Yellow gera um Mew. O glitch do Trainer-Fly é o único corpo que o cartucho produz, e ele precisa do Jr. Trainer♂ da Nugget Bridge ainda de pé."
          oak:
            bulbasaur: "Presente grátis da casa da Melanie → Venusaur. Um basta."
            mew: "O glitch é o único Mew que o cartucho produz, e ele quer os treinadores de Cerulean ainda de pé. Faça antes da Misty."
          gifts:
            bulbasaur:
              from: "DA CASA DA MELANIE"
              unlock: "Amizade do Pikachu 147 ou mais"
        route_24:
          note: "Nugget Bridge. Oddish, Bellsprout e um Charmander grátis."
          intro: "A Nugget Bridge: cinco treinadores enfileirados num vão só, e o homem que espera na outra ponta te oferece emprego na Equipe Rocket."
          steps:
            "1":
              title: "Vença seu rival"
              text: "Saia de Cerulean para o norte e pise na Nugget Bridge. O Blue te embosca logo no pé da ponte, antes de qualquer treinador dela. Vença a equipe dele (liderada por Eevee) e siga subindo a ponte."
            "2":
              title: "Atravesse a Nugget Bridge"
              text: "Suba a ponte e enfrente os cinco treinadores em fila, depois o Rocket Grunt esperando no topo. Ele te entrega um Nugget e pede para você entrar na Team Rocket. RECUSE, e ele também te enfrenta."
            "3":
              title: "Pegue o Charmander grátis"
              text_html: "Na colina de grama depois da ponte, um garoto %{boy} está pronto para te dar um Charmander grátis (Nv 10). Fale com ele e pegue: uma linha de Fogo forte até Charizard, e ótima contra a Erika depois."
            "4":
              title: "Pegue o TM45 (Thunder Wave)"
              text: "Alguns passos a leste do garoto, uma Poke Ball descansa na grama do alto: TM45, Thunder Wave. Chegue nela e pegue, um jeito barato de paralisar qualquer Pokémon que você queira capturar."
              items:
                tm-thunder-wave: "Na grama no topo da rota, alguns passos a leste do garoto do Charmander."
            "5":
              title: "Siga a leste para a Rota 25"
              text_html: "Com o Charmander e o TM na mão, siga o caminho a leste da colina %{east} até a Rota 25, a estrada que leva à cabana do Bill."
          tips:
            charmander: "Grátis do garoto aqui. Uma linha de Fogo forte até Charizard, e ótima contra a Erika depois."
          oak:
            charmander: "Presente grátis → Charizard. Pegue para a dex e para o ginásio de grama da Erika."
            oddish: "Comum na grama. Evolui para Vileplume com uma Leaf Stone."
            bellsprout: "A outra captura de 30% na grama. Evolui para Victreebel com uma Leaf Stone."
          gifts:
            charmander:
              from: "DO GAROTO NO ALTO"
        route_25:
          note: "A casa do Bill. Mesma grama da Rota 24."
          intro: "O caminho arborizado do cabo até a cabana do Bill, com nove treinadores ao longo dele. O Bill está lá dentro, preso no meio do próprio teletransportador."
          steps:
            "1":
              title: "Chegue pela Nugget Bridge"
              text: "Entre pelo oeste, saindo do topo da Nugget Bridge na Rota 24. A trilha segue a leste até a Sea Cottage do Bill, repleta de Hikers, Youngsters e Cooltrainers. Vasculhe a grama e capture um Venonat se ainda precisar."
            "2":
              title: "Vasculhe a parede de pedra oeste"
              text: "Poucos passos após a entrada oeste, encoste na borda de cima da rota. Vire para cima e aperte A contra a parede de pedra para um Elixir oculto. Nada aparece na tela."
              hidden:
                elixir: "Borda norte perto da entrada oeste, logo após a Rota 24. Vire para cima e aperte A."
            "3":
              title: "Pegue o TM19 no labirinto"
              text_html: "O Jr. Trainer %{guard} tampa a única brecha para o bolsão do TM19. Puxe-o de três tiles abaixo para ele descer e liberar a passagem, depois chegue à brecha pelo oeste. Mais perto que isso e ele fica no caminho."
              items:
                tm-seismic-toss: "Bolsão nordeste do labirinto de árvores, no meio da rota. Se o Jr. Trainer continuar no caminho, corte a árvore da parede leste do bolsão."
            "4":
              title: "Revise a grama perto da cabana"
              text: "Na reta final a leste, um pouco a oeste da porta da Sea Cottage do Bill e na mesma fileira, alinhe-se no tile logo abaixo e vire para cima apertando A para um Ether oculto. Nada aparece na tela."
              hidden:
                ether: "Extremo leste, a oeste da porta da cabana, na fileira dela. Fique um tile ao sul e aperte A para cima."
            "5":
              title: "Solte o Bill"
              text_html: "Entre na Sea Cottage %{cottage} no extremo leste e use a máquina do Bill para desfundi-lo. Ele te dá o S.S. Ticket, sua entrada no S.S. Anne quando chegar a Vermilion."
              items:
                s_s_ticket: "Com o Bill, depois de libertá-lo da máquina na Sea Cottage. Sua passagem para o S.S. Anne em Vermilion."
          oak:
            venonat: "Uma captura Inseto/Veneno → Venomoth. Registre a base uma vez."
        route_5:
          note: "Ao sul até Vermilion. Pidgey, Rattata e Abra raro."
          intro: "Uma encosta curta ao sul de Cerulean com a cerca do Day-Care e a boca norte do Underground Path. O portão oeste de Saffron fica lá embaixo."
          trades:
            machoke:
              npc: "MENINA"
              title: "Machoke"
              where: "A casa do Túnel Subterrâneo no norte da Rota 5"
              note: "Um Machoke totalmente evoluído por um Cubone, e Pokémon trocados ganham mais XP. Cubone vem da Torre Pokémon, então é outra volta para depois."
          steps:
            "1":
              title: "Vá ao sul"
              text_html: "Saia de Cerulean ao sul; deixe um Pokémon na Day Care %{daycare} se quiser subir o nível."
            "2":
              title: "Pegue o Underground Path"
              text_html: "Os portões de Saffron estão bloqueados, então entre na casa do Underground Path %{path} no sul da rota. A escada lá dentro te joga no túnel para a Rota 6."
          oak:
            abra: "Capture rápido (ele só usa Teleport). Evolui para Kadabra, depois Alakazam por troca."
        underground_path:
          note: "O túnel sob Saffron. Dois itens ocultos, nada selvagem."
          intro: "Um corredor reto sob Saffron City, de quatro tiles de largura, sem treinadores e sem Pokémon selvagens. Dois itens ocultos ficam no chão, e nenhum dos dois aparece na tela."
          steps:
            "1":
              title: "Desça a escada e vá a oeste pelo Full Restore"
              text_html: "A casa da Rota 5 te deixa na escada %{in}. Dê um passo a oeste, vire para o oeste e aperte A: um Full Restore oculto, o mais cedo do jogo, todo o HP e status curado."
              hidden:
                full-restore: "Linha de cima do túnel, dois tiles a oeste da escada de entrada. Fique ao lado dele virado para o oeste e aperte A. Nada aparece na tela."
            "2":
              title: "Ao sul pelo X Special, depois saia na Rota 6"
              text_html: "Ande ao sul até oito tiles acima da escada da Rota 6, na segunda faixa da parede leste. Aperte A virado para baixo por um X Special oculto, uma batalha de Special reforçado. A escada %{out} fica logo abaixo."
              hidden:
                x-special: "Segunda faixa a partir da parede leste, sete tiles ao norte da escada que desce para a Rota 6. Fique um tile ao norte dele e aperte A virado para baixo. Nada aparece na tela."
        route_6:
          note: "Até Vermilion. Mesma grama da Rota 5, mais pesca."
          intro: "O último trecho descendo até Vermilion, terminando num lago que é a única água de Kanto onde um Psyduck morde a isca."
          steps:
            "1":
              title: "Saia do Underground Path"
              text_html: "Você surge %{path} no norte da Rota 6, no caminho que desce até Vermilion. Siga ao sul passando pelos Jr. Trainers e Bug Catchers junto às cercas."
            "2":
              title: "Entre em Vermilion"
              text_html: "Siga a estrada ao sul pela última ponte e direto %{south} até Vermilion City, onde o S.S. Anne está atracado."
        vermilion_city:
          mart:
            blurb: "Agora com Super Potions. Abasteça antes do S.S. Anne e do ginásio do Lt. Surge."
            buy: "Super Potions te levam pelo S.S. Anne. Repel mantém a Diglett's Cave calma na saída."
          gym:
            intro: "A porta até o Lt. Surge fica trancada por dois interruptores escondidos nas latas de lixo. Ache os dois e depois encare o Raichu solitário do Surge (Nv 28), que bate forte na equipe toda e pode paralisar. Um tipo Terra usando Dig o anula com facilidade, então leve Diglett, Sandshrew ou a linha do Nidoran."
            puzzle:
              "1": "Revise as latas de lixo ao longo das paredes para achar o primeiro interruptor. A posicao dele e aleatoria a cada visita."
              "2": "O segundo interruptor fica sempre numa lata vizinha a primeira, acima, abaixo, a esquerda ou a direita. Se errar, os dois reiniciam, entao cheque as vizinhas."
              "3": "Com os dois interruptores ativados, a porta ate Lt. Surge abre. Leve um tipo Terra para anular a equipe Eletrica dele."
          note: "Bike Voucher e Old Rod. O ginásio depende do Cut."
          intro: "Um porto de trabalho na costa sul de Kanto, com o cais tomado pelo S.S. Anne. Árvores cortáveis separam a praça do ginásio do resto da cidade."
          steps:
            "1":
              title: "Pegue os itens"
              text_html: "Cure no Centro Pokémon %{center}, depois pegue o Bike Voucher no Pokémon Fan Club %{club} e o Old Rod com o Fishing Guru %{guru} no lado oeste da cidade."
              items:
                bike_voucher: "Com o presidente do Pokémon Fan Club, no lado oeste da cidade. Troque por uma Bicycle na Bike Shop de Cerulean."
                old_rod: "Com o Fishing Guru na casa do lado oeste da cidade. Pesca Magikarp em qualquer lugar."
            "2":
              title: "Entre no S.S. Anne pelo Cut"
              text_html: "Árvores cortáveis fecham a praça do ginásio %{gym}, então o Surge espera. Suba no navio na doca sul %{dock} e <a href=\"%{href}\">limpe o S.S. Anne</a>: o Capitão enjoado entrega o HM01 Cut."
          later:
            max_ether:
              where: "Um Max Ether escondido fica no topo do vão entre os dois prédios ao norte da Trade House, e o único tile de onde dá para encará-lo é água aberta."
              after: "Volte com o Surf (HM03, da Safari Zone), pare no tile de água ao lado dele e aperte A. Nada aparece na tela."
          tips:
            squirtle: "Grátis da Officer Jenny depois da Thunder Badge. O terceiro starter de Kanto, evolui para Blastoise."
          oak:
            squirtle: "Presente grátis depois da insígnia → Blastoise. O último dos três starters."
          gifts:
            squirtle:
              from: "DA OFFICER JENNY"
              unlock: "Vença o Lt. Surge pela Thunder Badge"
        vermilion_city_return:
          note: "Lt. Surge. Thunder Badge. Squirtle grátis depois."
          intro: "O mesmo porto, agora sem as árvores. O Lt. Surge mantém a porta trancada atrás de dois interruptores escondidos nas latas de lixo, e o Raichu dele responde a tipos Terra com Mega Kick."
          steps:
            "1":
              title: "Corte o caminho até o ginásio"
              text_html: "Corte qualquer uma das árvores ao lado do ginásio %{gym} para abrir a praça. Lidere com um tipo Terra, se tiver um: o Thunderbolt não o acerta. Se não, volte à Diglett's Cave, no extremo oeste da Rota 11."
            "2":
              title: "Pegue o Squirtle grátis"
              text_html: "Com a Thunder Badge na mão, a Officer Jenny ao lado do ginásio te dá um Squirtle grátis. Depois siga para leste %{east} de novo e entre na Diglett's Cave, sob as montanhas."
        ss_anne:
          note: "O transatlântico de luxo. HM01 Cut e uma luta de rival."
          intro: "Um transatlântico atracado por uma visita só. Quatro conveses, dezessete treinadores e um capitão enjoado que paga uma massagem nas costas com um HM."
          steps:
            "1":
              title: "Embarque e desça direto"
              text_html: "Mostre o S.S. Ticket no cais e embarque. Siga a leste até a escada %{down} no canto e desça ao deque da tripulação. Cinco cabines seguem a oeste dali; comece pela mais próxima %{cabin}."
            "2":
              title: "Max Potion na primeira cabine"
              text: "Uma bola está encostada na parede do fundo, passando os beliches. Um Max Potion cura tudo de um Pokémon, guarde para o Surge."
              items:
                max-potion: "Junto à parede do fundo da cabine mais a leste do B1F."
            "3":
              title: "Ether duas portas adiante"
              text_html: "Siga a oeste até a cabine %{cabin}. Um Ether está no chão ao lado do beliche, dez PP de volta em um golpe."
              items:
                ether: "No chão da terceira cabine do B1F a partir do leste, ao lado da cama."
            "4":
              title: "TM44 Rest na porta seguinte"
              text_html: "A próxima porta a oeste %{cabin} guarda o TM44 Rest. Ele derruba o usuário por dois turnos e o acorda com HP cheio, uma cura grátis no aperto."
              items:
                tm-rest: "Ao lado da cama, na quarta cabine do B1F a partir do leste."
            "5":
              title: "Hyper Potion no travesseiro"
              text_html: "A última cabine %{cabin} fica na ponta oeste. Fique na cabeceira da cama e aperte A virado para o travesseiro; nada aparece na tela, mas há um Hyper Potion ali."
              hidden:
                hyper-potion: "No travesseiro da cama, na cabine mais a oeste do B1F. Aperte A de frente para ele, pela esquerda; nada aparece na tela."
            "6":
              title: "Suba e limpe o 1F da popa à proa"
              text_html: "Pegue a escada %{up} para o 1F e limpe as seis cabines de leste a oeste, começando pela popa. A segunda a partir do oeste %{cabin} guarda o TM08 Body Slam, um golpe Normal pesado que paralisa bastante."
              items:
                tm-body-slam: "No fundo da cabine do 1F, a segunda porta a partir da ponta oeste do corredor."
            "7":
              title: "Great Ball na lixeira da cozinha"
              text_html: "Siga a oeste por todo o corredor e desça pelo vão %{kitchen}. Na cozinha, a mais baixa das três lixeiras da parede leste esconde uma Great Ball."
              hidden:
                great-ball: "A mais baixa das três lixeiras na parede leste da cozinha. Aperte A de frente para ela; nada aparece na tela."
            "8":
              title: "Suba direto ao deque da proa"
              text_html: "Pegue a escada %{up} para o 2F, atravesse até %{down} e siga direto ao 3F, depois a oeste por aquele corredor e saia na proa %{deck}."
            "9":
              title: "Derrote os dois Sailors"
              text: "Dois Sailors ocupam o deque da proa, XP grátis antes do rival. Vença os dois, volte ao 2F e comece pelas cabines."
            "10":
              title: "O registro de Snorlax no 2F"
              text_html: "De volta ao corredor do 2F, a primeira cabine %{cabin} não tem itens, só um homem que te mostra o Snorlax. Falar com ele registra o bicho como visto."
              catch_at_count: "2 NO TOTAL, AMBOS LV 30"
              catch_at_html: "Capture depois na <b>Rota 12</b> ou na <b>Rota 16</b>, quando a Poké Flute for sua."
            "11":
              title: "Max Ether na porta seguinte"
              text_html: "A cabine seguinte a leste %{cabin} tem uma bola no fundo do quarto: um Max Ether, que recarrega todo o PP de um golpe."
              items:
                max-ether: "No fundo da segunda cabine do 2F a partir do oeste."
            "12":
              title: "Rare Candy duas portas adiante"
              text_html: "Pule uma porta e entre na seguinte %{cabin}. Um Rare Candy espera junto à parede oeste, um nível grátis. É o último item do navio."
              items:
                rare-candy: "Junto à parede oeste da quarta cabine do 2F a partir do oeste."
            "13":
              title: "Cure a equipe antes do rival"
              text: "Siga a leste pelo corredor e o rival aparece para a luta. Cure a equipe com itens antes: não há Centro a bordo, e essa é a última luta do navio."
            "14":
              title: "HM01 Cut com o Capitão"
              text_html: "Pegue a escada atrás dele %{stairs} até a cabine do Capitão e alivie o enjoo dele pelo HM01 Cut. Ensine o golpe e desça; o navio parte de vez. Depois siga <a href=\"%{href}\">a leste para a Rota 11</a>."
              items:
                hm01_cut: "Com o Capitão enjoado, subindo a escada atrás do rival, na popa do 2F."
        route_11:
          note: "A leste de Vermilion. Pidgey, Rattata e Drowzee."
          intro: "Um campo largo de grama a leste de Vermilion com dez treinadores espalhados. Drowzee aparece aqui e em nenhum outro lugar, e a Diglett's Cave abre na ponta oeste."
          trades:
            dugtrio:
              npc: "GAROTO"
              title: "Dugtrio"
              where: "No andar de cima do portão da Rota 11"
              note: "Ele quer um Lickitung, e o único de Yellow vive na Cerulean Cave, então essa troca é pós-jogo. Para um Dugtrio agora, evolua um Diglett no nível 26 ou capture o raro na Diglett's Cave."
          steps:
            "1":
              title: "Saia de Vermilion"
              text_html: "Saia a leste de Vermilion para a grama larga da Rota 11. A boca da Diglett's Cave %{cave} fica bem aqui no oeste. Vale a parada por um Diglett, ou o raro Dugtrio: Terra trava o Raichu do Surge."
            "2":
              title: "Lute a leste"
              text: "Avance a leste pela grama, limpando os Gamblers, Youngsters e Engineers no caminho. O Drowzee aparece só aqui no jogo inteiro, e vira um Hypno forte cedo."
            "3":
              title: "Vasculhe perto do portão leste"
              text: "Logo antes do portão leste há um Escape Rope oculto. Pare no tile de grama a alguns quadrados a noroeste da porta do portão, olhe para cima e aperte A. Nada aparece na tela."
              hidden:
                escape-rope: "Um tile a oeste e três ao norte da porta do portão leste, na grama. Fique abaixo dele, olhe para cima e aperte A. Nada aparece na tela."
            "4":
              title: "Pegue o Itemfinder"
              text_html: "No portão leste %{gate}, fale com o Assistente do Oak pelo Itemfinder (ele só entrega quando você já capturou 30+ espécies). No andar de cima, um Garoto quer um Lickitung pelo Dugtrio dele, e o único Lickitung de Yellow está na Cerulean Cave."
              items:
                itemfinder: "Com o Assistente do Oak na casa do portão leste, depois de capturar 30+ espécies. Aponta itens escondidos por perto."
            "5":
              title: "Volte para pegar a insígnia"
              text_html: "Volte a oeste %{west} para Vermilion com o tipo Terra na equipe. O <a href=\"%{href}\">Lt. Surge</a> é o próximo; o túnel sob as montanhas espera até a insígnia ser sua."
          oak:
            drowzee: "A captura notável da rota → Hypno, um Psíquico forte cedo."
        digletts_cave:
          note: "Diglett, Dugtrio raro e o desvio de Cut do outro lado."
          intro: "Um túnel único escavado sob as montanhas entre a Rota 11 e a Rota 2, fervilhando de Diglett e um Dugtrio ocasional. A porta norte dá justamente na metade da Rota 2 que o Cut mantém fechada."
          steps:
            "1":
              title: "Entre pela Rota 11"
              text_html: "Pegue a entrada sul %{south} perto do oeste da Rota 11. Um único túnel atravessa tudo, sem nenhuma ramificação."
            "2":
              title: "Capture um Diglett ou Dugtrio"
              text: "Cada passo aqui dentro pode gerar um: Diglett a 94%, Dugtrio a 6% e no Lv 29 a 31. Nenhum outro lugar de Kanto tem os dois."
            "3":
              title: "Saia na Rota 2"
              text_html: "Suba pela saída norte %{north}. Você aparece num cercado de árvores no alto da Rota 2, abaixo de Pewter, no lado que o Cut mantinha fechado."
            "4":
              title: "Troque pelo Mr. Mime"
              text_html: "A casa de troca %{house} fica alguns passos ao sul, sem precisar de Cut. O cientista lá dentro troca MILES, o Mr. Mime, por um Clefairy extra, o único de Yellow."
            "5":
              title: "Corte ao sul rumo ao portão"
              text_html: "Uma única árvore cortável fica logo abaixo da casa. Derrube-a, desça pela faixa leste e entre no portão da Rota 2 %{gate}."
            "6":
              title: "Pegue o HM05 Flash"
              text: "O Assistente do Prof. Carvalho espera lá dentro. Ele entrega o HM05 Flash quando sua Pokédex marcar 10 tipos capturados, e a Rock Tunnel é escuridão total sem ele."
              items:
                flash: "Com o Assistente do Prof. Carvalho, dentro do portão da Rota 2, quando você tiver capturado 10 tipos de Pokémon."
            "7":
              title: "Pegue o HP Up"
              text: "Saindo pela porta sul do portão, a primeira Poké Ball da faixa guarda um HP Up. Ele aumenta o HP de um Pokémon para sempre, então guarde para um titular."
              items:
                hp-up: "Primeira Poké Ball da faixa leste, alguns passos ao sul da porta de baixo do portão da Rota 2."
            "8":
              title: "Pegue a Moon Stone"
              text: "Nove quadrados mais ao sul, a segunda bola é uma Moon Stone. Ela evolui Clefairy, Jigglypuff, Nidorina ou Nidorino, e Yellow dá pouquíssimas."
              items:
                moon-stone: "Segunda Poké Ball da faixa leste, nove quadrados ao sul do HP Up."
            "9":
              title: "Corte a oeste rumo a Viridian"
              text_html: "Dois quadrados de volta ao norte, outra árvore cortável abre a parede a oeste. Corte, atravesse até a estrada principal e desça por ela %{south} até Viridian City."
            "10":
              title: "Pegue o TM42 Dream Eater"
              text_html: "Mais uma árvore cerca o terreno no canto sudoeste de Viridian. Corte e fale com o Pescador sonolento %{fisher}; ele entrega o TM42, Dream Eater."
              items:
                tm42: "Com o Pescador no terreno cercado do canto sudoeste de Viridian, passando a árvore cortável do lado leste dele."
            "11":
              title: "Corte o atalho para Pewter"
              text: "Volte pela Rota 2 e atravesse o portão, depois siga a oeste pela trilha baixa embaixo da boca da caverna. Corte a árvore no fim dela e você cai na estrada que sobe direto até Pewter, sem floresta no meio."
            "12":
              title: "Corte atrás do Museu"
              text_html: "Em Pewter, uma árvore fecha o terreno a leste do Museu. Corte, siga a pé rente à parede e entre pela porta dos fundos %{museum}, o único caminho até a sala leste."
            "13":
              title: "Pegue o Old Amber"
              text: "O cientista ao lado das vitrines de fósseis entrega o Old Amber. O laboratório de Cinnabar o revive em Aerodactyl, e é o único do jogo, então nunca venda."
              items:
                old-amber: "Com o cientista na sala leste do Museu, alcançada pela entrada dos fundos de Pewter, passando uma árvore cortável."
            "14":
              title: "Volte para Cerulean pelo Mt. Moon"
              text_html: "Saia de Pewter a leste para a Rota 3, atravesse o Mt. Moon e desça a Rota 4 até Cerulean. De lá é a leste para a <a href=\"%{href}\">Rota 9</a> e o Rock Tunnel."
          grind:
            title: "O melhor ponto de grind até agora"
            intro: "Só dois Pokémon vivem aqui embaixo, e mais nada. A 1ª geração paga experiência base vezes o nível dividido por sete, então os dois rendem mais por nocaute que qualquer outra coisa farmável tão cedo."
            formula: "exp base × nível ÷ 7"
            tips:
              diglett: "Dez de HP base, então quase qualquer golpe resolve de primeira. Só tem Dig e Growl, e Growl apenas enrola você."
              dugtrio: "Ataca primeiro com 120 de Velocidade e Elétrico não faz nada nele. Ainda são 35 de HP base, então Água, Planta ou Gelo derrubam rápido."
            steps:
              "1":
                title: "Lidere com um nível alto"
                body_html: "O Repel bloqueia tudo abaixo do primeiro slot da equipe. Diglett para no Lv 22, então um líder de pelo menos <b>Lv %{level}</b> deixa só Dugtrio."
              "2":
                title: "Borrife e caminhe"
                body_html: "Um Repel cobre 100 passos. Percorra o túnel de ponta a ponta e borrife de novo assim que a mensagem avisar que acabou."
              "3":
                title: "Garanta %{exp} por luta"
                body_html: "Todo encontro restante é um Dugtrio de Lv 29 a 31, cerca de três Diglett de experiência pelos mesmos dois turnos de trabalho."
            warn: "Não mande o PIKACHU. Dugtrio é Terrestre puro, então golpes Elétricos não fazem nada, e ele ataca primeiro."
          oak:
            diglett: "Por toda parte aqui → Dugtrio, um tipo Terra rápido. Pegue a base."
        route_9:
          note: "A leste até Rock Tunnel. Ninho de Nidoran."
          intro: "Uma rota longa de grama a leste de Cerulean, cheia das duas linhas de Nidoran. Nove treinadores seguram a crista entre aqui e o Rock Tunnel."
          steps:
            "1":
              title: "Corte a entrada de Cerulean"
              text: "A Rota 9 sai a leste de Cerulean, barrada só por uma árvore que você corta na borda da cidade. Pise na grama alta, onde as duas linhas de Nidoran fervilham sob seus pés."
            "2":
              title: "Desça pelo TM30 Teleport"
              text: "Logo após a entrada, desça ao sul até a depressão a sudoeste. A Poke Ball na grama baixa é o TM30, Teleport, encaixada ao lado do primeiro Hiker."
              items:
                tm-teleport: "Depressão a sudoeste logo após a entrada de Cerulean, na grama baixa perto do primeiro Hiker."
            "3":
              title: "Cheque a árvore solitária"
              text: "Volte ao norte até a árvore solitária na grama a noroeste, logo acima da primeira Jr. Trainer. Fique no quadrado a leste dela e aperte A por um Ether oculto. Nada aparece na tela."
              hidden:
                ether: "A árvore solitária na grama a noroeste, ao norte da primeira Jr. Trainer; aperte A pelo lado leste dela."
            "4":
              title: "Avance a leste até a Rota 10"
              text_html: "Com os dois tesouros no bolso, siga a leste pela grama alta, trocando golpes com os Bug Catchers, Jr. Trainers e Hikers espalhados pela crista. O caminho emenda direto %{east} na Rota 10 e na porta do Rock Tunnel."
        route_10:
          note: "A porta do Rock Tunnel. Magnemite por toda parte."
          intro: "A metade de cima da Rota 10, acima do Rock Tunnel: um Centro Pokémon na boca norte e Magnemite dominando a grama. A estrada para Lavender espera do outro lado da caverna."
          steps:
            "1":
              title: "Cure no Centro"
              text_html: "Chegue da Rota 9 à parte alta da Rota 10 e entre no Centro Pokémon %{center} ao lado da boca norte %{north} do Rock Tunnel. Recupere-se, porque a caverna adiante é longa e escuríssima."
            "2":
              title: "Pegue a Super Potion escondida"
              text: "Corte a árvore um tile ao sul da boca norte do Rock Tunnel e pise no toco. Aperte A virado para cima para uma Super Potion escondida; nada aparece na tela."
              hidden:
                super-potion: "Na parede ao lado da boca norte do Rock Tunnel. Corte a árvore abaixo dela, fique nesse tile e aperte A virado para cima. Nada aparece na tela."
            "3":
              title: "Anote o Power Plant para depois"
              text: "A água isola o meio da Rota 10. A porta do Power Plant e um Pokémaniac solitário ficam do outro lado, e nada te leva até lá sem Surf. Volte quando tiver."
            "4":
              title: "Entre no Rock Tunnel"
              text_html: "Ensine o HM05 Flash a um Pokémon antes de entrar: o túnel é escuro demais sem ele. Magnemite aprende Flash e é metade desta grama, então capture um se ninguém mais puder. Depois pegue a boca norte %{north}."
          trainers:
            pokemaniac:
              note: "Você ainda não alcança este Pokémaniac. Ele fica na faixa do meio da Rota 10, depois da água e ao lado da porta do Power Plant, e só o Surf te leva até ele. Anote-o para uma volta depois."
          oak:
            magnemite: "Uma captura de 50% na grama aqui → Magneton. Cobertura Elétrica para o túnel escuro."
        route_10_south:
          note: "Do lado de fora da boca sul. Hikers até embaixo."
          intro: "A Rota 10 recomeça onde o Rock Tunnel te cospe e desce direto até Lavender Town. Quatro treinadores seguram a trilha, e um Max Ether está enterrado perto da boca."
          steps:
            "1":
              title: "Cace o Max Ether escondido"
              text_html: "Saindo pela boca sul %{south} do Rock Tunnel na parte baixa da Rota 10, caminhe alguns tiles a leste pela trilha e aperte A virado ao norte para um Max Ether escondido. Nada aparece na tela."
              hidden:
                max-ether: "A leste da boca sul do Rock Tunnel, na parte baixa da Rota 10; aperte A virado para cima. Nada aparece na tela."
            "2":
              title: "Desça para Lavender Town"
              text_html: "Limpe os Hikers e o Pokémaniac na parte baixa da Rota 10, depois caminhe ao sul %{lavender} até Lavender Town."
        rock_tunnel:
          note: "Caverna escuríssima. Precisa de Flash."
          intro: "Dois andares sem luz sob a serra, com quinze treinadores dentro e nenhuma Poké Ball no chão. Sem Flash a tela fica preta."
          steps:
            "1":
              title: "Leve Flash antes de entrar"
              text: "Rock Tunnel é escuro demais sem ele. Ensine o HM05 Flash a um Pokémon antes (o Ajudante do Oak entrega no portão da Rota 2) e ilumine cada tela ao entrar pelo norte da Rota 10."
            "2":
              title: "Atravesse o 1F até a escada nordeste"
              text_html: "Da boca norte desça ao sul, corra a leste pela passagem e suba até o canto nordeste. A escada %{down} está lá. As outras duas escadas do 1F levam a um bolsão sem nada."
            "3":
              title: "Atravesse o B1F até a escada mais a oeste"
              text_html: "Você cai no sudeste. Siga a oeste pela parte de baixo, depois suba pelo lado oeste até a escada %{up} no canto superior esquerdo, e volte ao 1F por ela."
            "4":
              title: "Saia para Lavender Town"
              text: "Você emerge no lado leste do 1F, no trecho que tem a boca sul. Desça e siga a oeste até ela, saindo na parte baixa da Rota 10 e direto para Lavender Town."
          oak:
            machop: "Comum na caverna → Machoke, depois Machamp por troca. Um Lutador forte."
            onix: "Só aparece no B1F. Uma captura Rocha/Terra robusta que vale a caçada."
        lavender_town:
          mart:
            blurb: "O Mart de Lavender já traz Great Balls e Revives, equipamento para a Pokémon Tower ao lado."
            buy: "Great Balls para a linha do Gastly na Tower e alguns Revives. Super Repel reduz os fantasmas."
          note: "A cidade fantasma. A Pokémon Tower se ergue."
          intro: "A menor cidade de Kanto, e o cemitério dela. A Pokémon Tower se ergue sobre um punhado de casas, com a Equipe Rocket em algum andar."
          trivia:
            tag: "NAME RATER"
            title: "O Name Rater mora aqui"
            intro_html: "Lavender guarda o único homem de Kanto que troca o apelido de um Pokémon. A casa dele %{house} fica no lado oeste, entre a casa da menina do Cubone e o Mart. Mostre um Pokémon, ele lê o nome de volta com um veredito e deixa você digitar outro."
            note: "Não confunda com a casa dos apelidos de Viridian: aquela é uma casa de dicas com um Spearow de estimação chamado SPEARY. A troca de nome acontece aqui."
            warning:
              title: "Pokémon de troca não podem ser renomeados"
              body: "Ele confere o nome e o ID do treinador original com os seus, e um Pokémon de troca falha nos dois. Em vez de renomear, ele diz que o nome é impecável e devolve, então o nome com que ele chegou é o que ele mantém."
              specimen: "Troca da Rota 2 · Mr. Mime"
          steps:
            "1":
              title: "Tente a Torre"
              text_html: "Entre na Pokémon Tower %{tower}, no lado leste da cidade. O Blue espera a poucos passos dentro do 2F, com time perto do Lv 25. Vença-o e siga subindo, até um fantasma invencível barrar o 6F."
            "2":
              title: "Pegue a estrada a oeste"
              text_html: "Saia a oeste %{west} da cidade para a Rota 8. Leve um Pokémon que saiba Cut: o mato alto de lá fica cercado atrás de uma árvore, e o Kadabra aparece nele e em nenhum outro lugar."
        route_8:
          note: "A oeste até Celadon. Pidgey, Abra, Jigglypuff."
          intro: "A estrada a oeste de Lavender até o portão leste de Saffron, com nove treinadores nela. Kadabra selvagem aparece aqui e em nenhum outro lugar."
          steps:
            "1":
              title: "Vá a oeste"
              text_html: "Limpe a Lass, o Gambler e o Super Nerd rumo ao portão leste de Saffron %{gate}."
            "2":
              title: "Pegue o Underground Path"
              text_html: "Os guardas de Saffron querem uma bebida. Pule-os túnelando a oeste %{path} sob a cidade até a Rota 7."
        underground_path_west_east:
          note: "O segundo túnel de Saffron. Um Nugget e um Elixir no chão."
          intro: "O outro corredor sob Saffron City, indo a oeste da Rota 8 até a Rota 7. Sem treinadores, nada selvagem, e dois itens ocultos no chão que não mostram nada na tela."
          steps:
            "1":
              title: "Cole na parede de baixo rumo a oeste"
              text_html: "A escada %{in} da casa da Rota 8 deixa você na segunda faixa. Desça até a parede de baixo e siga por ela a oeste, apertando A virado para oeste lá pela metade do caminho: um Elixir oculto, PP cheio em todos os golpes."
              hidden:
                elixir: "Na parede de baixo, mais ou menos no meio do túnel. Ande pela parede a oeste e aperte A virado para oeste. Nada aparece na tela."
            "2":
              title: "Suba de novo pelo Nugget"
              text_html: "Ande nove ladrilhos a oeste e três faixas acima dali, de volta à faixa em que você entrou. Aperte A virado para oeste de novo para um Nugget oculto, ¥5000 em qualquer balcão. A escada %{out} fica abaixo."
              hidden:
                nugget: "Na faixa em que você entra, três acima da parede de baixo, perto do lado da Rota 7. Aperte A virado para oeste. Nada aparece na tela."
        route_7:
          note: "Faixa curta até Celadon. Pidgey e Abra."
          intro: "Uma tela de estrada entre Saffron e Celadon, com um trecho de mato alto na parte de cima. Sem treinadores e nada largado no chão."
          steps:
            "1":
              title: "Cruze até Celadon"
              text_html: "O mato alto ocupa a parte de cima da faixa: entre nele se ainda quiser um Pidgey, Abra ou Jigglypuff. Senão, siga direto a oeste %{west} até Celadon, a maior cidade de Kanto."
        celadon_city:
          store:
            trades:
              ice_beam: "O melhor golpe de Gelo do jogo, e pode congelar. Dê a um tipo Água e ele cobre Grama, Terra, Voador e Dragão."
              rock_slide: "Cobertura de Pedra que a maioria dos tipos Terra e Pedra aprende, e a resposta aos Voador e Inseto que riem deles."
              tri_attack: "Um golpe especial Normal sem contrapartida. Bom em Porygon, Dodrio ou Chansey, que não aprendem muito mais."
            blurb: "A maior loja de Kanto: cinco andares de Poké Balls, TMs, pedras de evolução e vitaminas, com um terraço de máquinas acima. O elevador atende do 1F ao 5F; o terraço é pela escada do 5F."
            floors:
              "1F":
                name: "Balcão de Serviço"
                motto: '"Encontre o que precisar na Celadon Dept. Store!"'
                note: "Recepção e o quadro da loja. O entregador do Poké Mart espera aqui depois que você limpa o Rocket Hideout. Nada para comprar neste andar, então pegue o elevador."
              "2F":
                name: "Mercado do Treinador"
                motto: '"Itens de primeira para treinadores!"'
                rec:
                  great_ball: "Melhora barata na taxa de captura, compre um estoque para as rotas do meio do jogo."
                  super_potion: "Sua cura principal até as Hyper Potions aparecerem."
                  take_down: "STAB físico confiável para muitos Pokémon do começo."
              "3F":
                name: "Loja de Video Game"
                motto: '"Video games em exibição, e uma TM grátis."'
                note: "Sem balcão de vendas, mas o homem atrás da mesa te dá uma TM de graça."
                gift_desc: "Ensina Counter: devolve o dobro do dano de um golpe físico. Uma boa resposta a atacantes Normal e Lutador."
              "4F":
                name: "Presentes do Sábio"
                motto: '"Especial de evolução: todas as pedras em estoque!"'
                rec:
                  poke_doll: "O único balcão de Kanto que vende uma. A Copycat de Saffron entrega o TM31 Mimic por ela, então compre a boneca agora e a TM custa só bater na porta dela."
              "5F":
                name: "Farmácia"
                motto: '"Deixe seu Pokémon no máximo."'
              "ROOF":
                name: "Praça da Cobertura"
                motto: '"Máquinas de bebida e uma criança com muita sede."'
                note: "Três máquinas de bebida e uma garota que quer o que elas vendem. Uma de cada bebida compra uma de cada TM com ela, e qualquer quarta bebida te passa pelos guardas do portão de Saffron."
                rec:
                  fresh_water: "Troque uma com a garota pela TM13 Ice Beam."
                  soda_pop: "Troque uma pela TM48 Rock Slide."
                  lemonade: "Troque uma pela TM49 Tri Attack."
          gym:
            intro: "Um jardim de arvorezinhas escondendo vários treinadores, depois a Erika. O Tangela (Nv 30), o Weepinbell (Nv 32) e o Gloom (Nv 32) dela caem para Fogo, Voador, Psíquico ou Gelo, então lidere com um desses e carregue curas de status para o Sleep Powder e o Stun Spore deles."
            needs: "A Erika e três dos sete treinadores ficam atrás de arbustos que só o Cut abre. Sem um Pokémon que o conheça, você enfrenta os outros quatro e mais nada."
          later:
            tm41:
              where: "No quintal cercado atrás da casinha ao norte do Game Corner. Um laguinho preenche a única abertura e cercas-vivas fecham os dois lados, então ninguém chega a pé."
              after: "Surfe para o norte pelo laguinho e desça ao lado dele. O HM03 sai da Casa Secreta da Safari Zone, oito paradas adiante."
          note: "Ginásio da Erika. Rainbow Badge. Loja, Eevee e o Game Corner."
          intro: "A maior cidade de Kanto: uma loja de departamentos de seis andares, o ginásio-estufa da Erika e um Game Corner com o esconderijo da Equipe Rocket embaixo."
          steps:
            "1":
              title: "Vasculhe a faixa leste por um PP Up"
              text: "Siga a rua que passa pelo Game Corner até a borda leste da cidade, depois suba a faixa de grama alta de um tile. Ela termina numa árvore: fique abaixo dela, olhe para cima e aperte A para um PP Up escondido."
              hidden:
                pp-up: "No topo da faixa de grama de um tile no extremo leste, a sudeste do Centro Pokémon, de frente para a árvore que a fecha. Olhe para cima e aperte A; nada aparece."
            "2":
              title: "Pegue o Eevee no telhado"
              text_html: "Entre pela porta dos fundos da Celadon Mansion %{mansion}, não pela da frente: só a escada de trás chega ao telhado. Três lances acima, uma casinha guarda uma Poké Ball com um Eevee de Nv 25, pronto para qualquer pedra."
            "3":
              title: "Pegue a Coin Case"
              text_html: "O restaurante %{diner} fica ao sul do fliperama. Um homem caído na mesa do fundo perdeu tudo nos caça-níqueis e te dá a Coin Case dele; sem ela o Game Corner não te vende uma ficha."
              items:
                coin_case: "Com o homem caído na mesa do fundo do restaurante de Celadon, ao sul do Game Corner. Guarda as fichas que você ganha nos caça-níqueis."
            "4":
              title: "Compre na Dept. Store"
              text_html: "Entre na loja de departamentos %{store} no lado oeste. O elevador vai do 1F ao 5F: o 4F vende as pedras de evolução e uma Poké Doll, que a Copycat de Saffron troca pelo TM31 Mimic."
            "5":
              title: "Pegue o TM18 grátis com o balconista do 3F"
              text: "O balconista atrás da mesa do 3F entrega o TM18 Counter de graça, uma vez só. Counter devolve o dobro do dano do último golpe físico que acertou quem o usa, o que responde a líderes Normal e Lutador."
              items:
                tm18_counter: "Com o balconista atrás da mesa da Loja de Video Game. Ele dá uma vez, depois só fala sobre a TM."
            "6":
              title: "Compre as bebidas do terraço e troque"
              text: "Suba até o 5F, pegue a escada para o terraço e compre quatro bebidas. A garota a oeste das máquinas troca uma por cada TM13 Ice Beam, TM48 Rock Slide e TM49 Tri Attack; a quarta é para os guardas."
            "7":
              title: "Abra Saffron com uma bebida"
              text: "Vá a leste até o portão da Rota 7 e entregue uma Fresh Water ao guarda. Qualquer uma das três bebidas serve, mas a Fresh Water é a mais barata, ¥200. Uma bebida abre os quatro portões de Saffron de vez."
            "8":
              title: "Ache o Game Corner"
              text_html: "O Game Corner %{corner} fica no meio da cidade, a algumas portas rua acima do restaurante. Entre pela porta da frente."
          tips:
            eevee: "Grátis no Condominiums. Evolua com uma pedra em Vaporeon, Jolteon ou Flareon."
          oak:
            eevee: "Presente → um entre Vaporeon / Jolteon / Flareon. Registre a base uma vez."
          gifts:
            eevee:
              from: "DO TELHADO DA MANSÃO"
        celadon_city_return:
          note: "De volta para a Erika. Rainbow Badge e o TM21 Mega Drain."
          intro: "Segunda passada por Celadon, com o esconderijo esvaziado e o Silph Scope na mochila. Só resta o ginásio-estufa na cidade, e o Fly espera uma rota a oeste."
          steps:
            "1":
              title: "Corte caminho até a estufa"
              text_html: "O Ginásio %{gym} fica no canto sudoeste da cidade. Lá dentro é um labirinto de arbustos, e o Cut é o único jeito de atravessar, então leve um Pokémon que o conheça."
            "2":
              title: "Guarde a insígnia e siga a oeste"
              text_html: "A Rainbow Badge faz Pokémon trocados obedecerem até o Nv 50 e libera Strength fora de batalha, mais o TM21 Mega Drain. Siga com o Cut no time pela estrada oeste %{west} até a Rota 16, onde o Fly espera."
        route_16_fly:
          note: "Uma rota a oeste de Celadon. HM02 Fly."
          intro: "A estrada a oeste de Celadon, com um Snorlax dormindo atravessado nela. Esta ida alcança uma coisa só depois da árvore: a casa isolada acima do portão, onde uma garota entrega o Fly."
          steps:
            "1":
              title: "Corte a árvore e atravesse até a casa"
              text_html: "Você entra vindo de Celadon %{east} pelo caminho de baixo. Corte a arvorezinha cinco passos adiante; o mato depois dela tem Doduo. Siga a oeste pelo portão %{gate}, saia pela porta oposta %{out} e chegue à casa %{house}."
            "2":
              title: "Pegue o HM02 Fly com a garota"
              text: "A garota lá dentro chama o lugar de refúgio secreto e te dá o HM02 por guardar segredo. O Fly leva você a qualquer cidade já visitada, e a Thunder Badge já libera isso."
              items:
                hm02_fly: "Com a garota na casa no topo da Rota 16, depois de uma árvore de Cut. Ensina Fly entre cidades."
            "3":
              title: "Voe direto para Lavender"
              text: "Ensine Fly para qualquer coisa com asas e use ali mesmo. A estrada ao sul fica fechada até o Poké Flute acordar o Snorlax, e a torre de Lavender é a próxima, com o Silph Scope na mochila."
        rocket_hideout:
          oak:
            porygon: "Exclusivo do Game Corner. O único Porygon que você terá. Pegue um."
          tips:
            porygon: "O único Porygon do jogo. 9999 fichas do Game Corner, e não há outro jeito."
            vulpix: "Só por troca na natureza no Yellow. O Game Corner (1000 fichas) é sua fonte fácil."
          prizes:
            note_vulpix: "O único Vulpix do Yellow. Ele nunca aparece na natureza, então este balcão é a única chance dessa vaga na dex."
            note_porygon: "O único Porygon do jogo, pelo preço mais alto da sala. Nada mais preenche essa vaga na dex."
            note_hyper_beam: "O golpe mais forte da Gen 1, e ele pula o turno de recarga por completo se derrubar o alvo."
          note: "A base da Team Rocket. Pegue o Silph Scope."
          intro: "Quatro andares de subsolo sob o Game Corner, forrados de setas que te empurram até uma parede te parar. Quem manda ali é o Giovanni."
          steps:
            "1":
              title: "Vasculhe o salão por fichas"
              text_html: "Doze montes entre as máquinas pagam 240 fichas no total, um deles 100. Aperte A em cada; nada aparece na tela. Três jogadores dão mais 50: %{guru}, %{man} e %{fisher}."
            "2":
              title: "Vença o Rocket, depois leia o pôster"
              text_html: "O Rocket %{rocket} fica na frente do pôster %{poster} da parede do fundo. Vença ele, depois aperte A nele: o interruptor atrás abre uma escada na parede à direita %{stairs}."
            "3":
              title: "Procure o PP Up oculto"
              text: "No B1F, desça o corredor entre as duas colunas de vasos de planta. Da casa ao lado do vaso inferior direito, aperte A virado para ele: um PP Up oculto, sem nada na tela."
              hidden:
                pp-up: "B1F, o vaso de baixo da coluna da direita. Fique no corredor ao lado dele, vire para leste e aperte A. Nada aparece na tela."
            "4":
              title: "Vença o Rocket a oeste e pegue o Escape Rope"
              text_html: "De volta à entrada, siga o corredor de cima a oeste até o Rocket %{west}. A sala abaixo dele guarda um Escape Rope: pegue e o labirinto lá embaixo nunca vai te prender."
              items:
                escape-rope: "Sala oeste do B1F, abaixo do primeiro Rocket. No ball ao pé das caixas, junto à parede sul da sala."
            "5":
              title: "Limpe o Rocket a leste e desça ao B2F"
              text_html: "Um segundo Rocket %{east} segura a porta do lado leste. Vença ele, volte à entrada e desça a escada da direita %{down} até o B2F."
            "6":
              title: "Contorne até o Rocket do B2F"
              text_html: "Deixe o labirinto de setas a oeste de lado. Siga o corredor contornando até o único Rocket %{rocket} deste andar, depois desça a escada %{down} logo acima dele até o B3F."
            "7":
              title: "Vença o guarda e pegue o TM10 (Double-Edge)"
              text_html: "Um Rocket %{guard} fica algumas casas abaixo da escada. Passando por ele, o caminho serpenteia pela parede leste até o TM10, Double-Edge: dano Normal pesado com um quarto de recuo em você."
              items:
                tm-double-edge: "Lado leste do B3F, na fileira de baixo da sala, ao pé do caminho estreito que desce do Rocket."
            "8":
              title: "Procure o Nugget oculto"
              text: "Uma casa a leste do ball do Double-Edge há um quadrado vazio. Fique abaixo dele, vire para cima e aperte A: um Nugget, sem nada na tela. Vende por ¥5000."
              hidden:
                nugget: "Borda leste do B3F, uma casa a leste do ball do TM10. Fique uma casa ao sul dele, vire para cima e aperte A. Nada aparece na tela."
            "9":
              title: "Deslize pelas setas até o Rare Candy"
              text: "A oeste da escada este mesmo andar vira placas de seta: cada uma te desliza na direção que aponta até uma parede ou placa de parada te segurar. Pegue a de baixo; o Rare Candy fica no nicho a leste."
              items:
                rare-candy: "Centro do B3F, no nicho de uma casa acima da fileira de baixo do labirinto. A seta para baixo te deixa três casas a oeste dele."
            "10":
              title: "Vença o Rocket a oeste e desça ao B4F"
              text_html: "Pegue a seta para cima para sair do nicho e atravesse o labirinto a oeste até o Rocket %{west}. A brecha ao sul dá a volta até a escada %{down} para o B4F."
            "11":
              title: "Pegue o HP Up"
              text: "Da escada do B4F vá um pouco ao sul, depois a oeste. Um HP Up espera na mesa ali, um aumento permanente de HP para o Pokémon que você escolher."
              items:
                hp-up: "Metade oeste do B4F, na mesa da sala a sudoeste da escada."
            "12":
              title: "Pegue o TM02 (Razor Wind)"
              text: "Volte pela escada e siga ao norte até a salinha. A oeste das mesas está o TM02, Razor Wind, um golpe Normal que carrega num turno e acerta no seguinte."
              items:
                tm-razor-wind: "Sala noroeste do B4F, a oeste das mesas."
            "13":
              title: "Vença o grunt pela Lift Key"
              text_html: "Contorne as mesas até o Rocket %{grunt} no alto da sala. Vença ele e pegue a Lift Key no ball ao lado dele: é ela que liga o elevador."
              items:
                lift-key: "Sala noroeste do B4F, no ball ao lado do Rocket."
            "14":
              title: "Suba de volta ao B2F"
              text_html: "Pegue a escada %{up} até o B3F. Pise na seta para cima, depois na segunda seta para cima a noroeste dela; da placa de parada siga a nordeste até a escada %{above} para o B2F."
            "15":
              title: "Pegue a Moon Stone"
              text: "Entre no labirinto do B2F pela mais baixa das duas setas para a esquerda. Da placa de parada, contorne um pouco ao sul até a Moon Stone, a pedra de Nidoran, Clefairy e Jigglypuff."
              items:
                moon-stone: "Canto extremo noroeste do B2F, no nicho de uma casa junto à parede oeste. Suba nele por baixo."
            "16":
              title: "Pegue o Nugget"
              text: "Volte àquela placa de parada e siga a parede norte para leste. Um Nugget está no fim do trecho, mais ¥5000 na próxima loja que você passar."
              items:
                nugget: "Lado norte do B2F, na fileira de pilastras sob o corredor de cima. Desça do corredor e dê um passo a leste."
            "17":
              title: "Pegue o TM07 (Horn Drill)"
              text: "Volte à placa de parada mais uma vez e pegue a seta para a direita logo abaixo dela. Você para ao lado do TM07, Horn Drill, um nocaute imediato que só pega alvos mais lentos."
              items:
                tm-horn-drill: "Lado oeste do B2F, no nicho abaixo da fileira em que a seta para a direita te joga. Volte duas casas a oeste e desça."
            "18":
              title: "Pegue a Super Potion"
              text: "Trabalhe as setas ao sul e a oeste até o canto extremo do labirinto. Uma Super Potion está no ball ali, 50 HP por vez."
              items:
                super-potion: "Canto sudoeste do B2F, no fim do labirinto."
            "19":
              title: "Saia a leste rumo ao B1F"
              text_html: "Daqui as setas correm para leste, para fora do labirinto. Pegue-as até o outro lado e suba a escada %{up} para o B1F."
            "20":
              title: "Percorra a sala isolada no sentido anti-horário"
              text_html: "Este canto do B1F não se liga a nada mais do andar. Desça até o trecho de baixo e vá a oeste: um Rocket %{lower} espera no meio dele."
            "21":
              title: "Pegue a Hyper Potion"
              text: "Siga a oeste, suba pelo trecho da esquerda e entre no canto superior esquerdo. Uma Hyper Potion está no ball ali, 200 HP de uma vez e a melhor cura que você tem."
              items:
                hyper-potion: "Canto superior esquerdo da sala isolada a sudoeste do B1F."
            "22":
              title: "Feche a volta no segundo Rocket"
              text_html: "Vá a leste pelo trecho de cima até o Rocket %{upper} parado nele. Vença ele e desça pelo lado direito de volta à escada %{back} para o B2F."
            "23":
              title: "Pegue o elevador até o B4F"
              text_html: "Com a Lift Key na mochila, atravesse o B2F até o elevador %{lift} do lado leste e aperte B4F. Ele te deixa do outro lado do portão."
            "24":
              title: "Jessie & James pulam no elevador"
              text: "As portas abrem em Jessie & James: Koffing, Meowth e Ekans, todos Nv 25. Terra ou Psíquico derruba a dupla venenosa num golpe cada; o Meowth só atrapalha."
            "25":
              title: "Pegue o Iron"
              text: "Vá a oeste do elevador e desça até a sala sul. Um Iron está na mesa ali, um aumento permanente de Defesa. Depois volte ao elevador."
              items:
                iron: "Sala sul do B4F, na mesa a oeste do elevador."
            "26":
              title: "Vença o Giovanni"
              text_html: "Giovanni %{giovanni} espera no alto do escritório: Onix (Nv 25), Rhyhorn (Nv 24), Persian (Nv 29). Água ou Grama derrete os dois primeiros; algo rápido resolve o Persian."
            "27":
              title: "Pegue o Silph Scope"
              text: "Pise no ball na casa atrás dele. Dentro está o Silph Scope, a única coisa que deixa os fantasmas da Pokémon Tower de Lavender sólidos o bastante para lutar."
              items:
                silph-scope: "Alto do escritório do Giovanni, nordeste do B4F, na casa que ele guardava."
            "28":
              title: "Procure atrás da máquina"
              text: "Fique na casa onde estava o ball do Silph Scope e aperte A virado para cima. Uma Super Potion oculta está enfiada na máquina acima, sem nada aparecer na tela."
              hidden:
                super-potion: "Alto do escritório do Giovanni. Fique onde estava o ball do Silph Scope, vire para cima e aperte A. Nada aparece na tela."
            "29":
              title: "Abra o portão na saída"
              text_html: "Suba de elevador %{lift} até o B1F. Um último Rocket %{last} está ao lado dele, e vencer esse abre a porta ao norte do elevador, o único caminho de volta às escadas."
            "30":
              title: "Siga para o Ginásio"
              text_html: "Ao norte pela porta, a oeste pelo corredor e suba a escada da esquerda até o salão, depois saia %{out}. Cure, compre curas de status e leve alguém com Cut ao Ginásio."
        pokemon_tower:
          note: "A torre assombrada de Lavender. Fantasmas e o Poké Flute."
          intro: "Sete andares de túmulos sobre Lavender Town, quase todos guardados por uma Channeler. Gastly assombra esta torre e nenhum outro lugar de Kanto."
          steps:
            "1":
              title: "Suba o 1F e o 2F"
              text_html: "Nada no térreo precisa de você. Pegue a escada %{up} da direita até o 2F, onde você já venceu o Blue, depois atravesse até a escada oeste %{west} e suba pro 3F."
            "2":
              title: "Comece o 3F e pegue o Escape Rope"
              text_html: "Pokémon selvagens aparecem deste andar pra cima, e só o Silph Scope os torna enfrentáveis. Siga ao norte até a primeira Channeler %{first}; dois tiles depois dela, uma ball guarda um Escape Rope. A próxima Channeler %{south} segura a fileira de baixo."
              items:
                escape-rope: "Topo do 3F, dois tiles ao norte da primeira Channeler, contra a parede norte. Aproxime por baixo."
            "3":
              title: "Limpe o 3F e suba pro 4F"
              text_html: "A última Channeler %{last} do 3F fica algumas fileiras acima dela. Vença-a e pegue a escada leste %{up} até o 4F, onde mais duas, %{near} e %{below}, esperam à esquerda da porta."
            "4":
              title: "Pegue o Elixir"
              text: "Passando pela dupla, uma ball fica solta no meio do andar. Ela guarda um Elixir, que recarrega o PP de todos os golpes de um Pokémon."
              items:
                elixir: "Meio do 4F, a oeste das duas Channelers junto à escada leste."
            "5":
              title: "Embolse o Awakening"
              text: "Alguns tiles a oeste na mesma fileira está um Awakening. Ele acorda um Pokémon de Sleep, o status que custa turnos inteiros numa subida tão longa."
              items:
                awakening: "Fileira do meio do 4F, alguns tiles a oeste do Elixir."
            "6":
              title: "Desça ao sul pelo HP Up"
              text: "Volte pra coluna do Elixir e siga direto pra baixo até o recuo na borda sul do andar. A ball ali é um HP Up, um aumento permanente no HP máximo de um Pokémon."
              items:
                hp-up: "Borda sul do 4F, no recuo logo abaixo do Elixir."
            "7":
              title: "Limpe o 4F e tateie o Elixir oculto"
              text_html: "Vença a última Channeler %{west} do 4F, no lado oeste, e pegue a escada %{up} até o 5F. Desça até o recuo murado logo abaixo, encare a parede de baixo e aperte A: um Elixir oculto, nada aparece na tela."
              hidden:
                elixir: "5F, no recuo ao sul da escada oeste. Encare a parede de baixo e aperte A. Nada aparece na tela."
            "8":
              title: "Cure de graça e limpe o topo do 5F"
              text_html: "Quatro tiles claros %{heal} no meio do andar curam sua equipe por completo, de graça e sem limite; a Channeler %{quiet} ao lado deles nunca batalha. Curado, enfrente a Channeler mais ao norte %{north}, depois a %{east} na parede leste."
            "9":
              title: "Varra o oeste pelo Nugget"
              text_html: "Atravesse de volta a oeste dos tiles de cura até a Channeler %{west}. Uma ball abaixo dela guarda um Nugget, ¥5000 em qualquer balcão, com uma última Channeler %{guard} em cima. Depois siga a leste até a escada %{up}."
              items:
                nugget: "Lado oeste do 5F, na ball logo abaixo da terceira Channeler. Aproxime pela direita."
            "10":
              title: "Chegue ao 6F e pegue o X Accuracy"
              text_html: "Uma Channeler %{first} espera à sua esquerda na chegada. Vença-a e desça até a ball atrás dela pra pegar um X Accuracy, que afia seus golpes por uma batalha."
              items:
                x-accuracy: "Sudeste do 6F, uma descida curta ao sul da primeira Channeler do andar."
            "11":
              title: "Contorne o 6F e pegue o Rare Candy"
              text_html: "Suba de volta ao norte pela Channeler %{north}, depois contorne as fileiras até a última %{across}. Logo depois dela, um Rare Candy tampa a única passagem: pegue pelo nível de graça, e pra abrir o caminho ao sul."
              items:
                rare-candy: "Lado oeste do 6F, depois da última Channeler. A ball tampa a passagem até a escada."
            "12":
              title: "Ponha o Marowak fantasma pra descansar"
              text_html: "Chegue perto da escada %{up} e um Marowak Nv 30 ataca. Só o Silph Scope o torna enfrentável. Ele tem um único golpe de ataque e cai fácil pra Água, Gelo ou Grama. Nunca pode ser capturado."
            "13":
              title: "Vença Jessie & James no 7F"
              text: "A dupla espera no topo, Nv 27 entre um Meowth, um Arbok e um Weezing. Vença os dois e o fundo da sala fica livre."
            "14":
              title: "Solte o Mr. Fuji"
              text: "Fale com o velho no topo da sala. Ele entrega o Poké Flute e te leva de volta pra casa dele em Lavender Town."
              items:
                poke_flute: "Com o Mr. Fuji no topo da torre, depois que o Marowak fantasma descansa. Acorda o Snorlax que bloqueia as Rotas 12 e 16."
            "15":
              title: "Siga ao sul para a Rota 12"
              text: "Saia de Lavender pela estrada ao sul até a Rota 12. O Poké Flute acorda o Snorlax deitado no meio do píer, e as rotas de pesca descem até Fuchsia."
          tips:
            gastly: "A única linha de Gengar do jogo. Evolua Gastly para Haunter, depois Gengar por troca."
            cubone: "Só no 5F e no 6F, e a torre é a única casa dele em Kanto. Pegue um extra: o Ricky, na casa do Underground Path da Rota 5, troca um Machoke por ele."
          oak:
            gastly: "Andares cheios de fantasmas → Haunter, depois Gengar por troca. A única linha do jogo."
            cubone: "Uma captura rara da Torre → Marowak, um tipo Terra forte."
        route_12:
          note: "Silence Bridge. Oddish, Bellsprout e um Snorlax."
          intro: "Um píer de pesca descendo a costa leste de Kanto, quase todo sobre água aberta. Um Snorlax dorme atravessado nas tábuas na metade do caminho."
          later:
            tm_pay_day:
              where: "Uma Poké Ball numa lasca de píer na metade norte da Silence Bridge. Água aberta a cerca, então nada chega ate ela a pe nesta passagem."
              after: "Volte com Surf (HM03, da Safari Zone) e reme para leste saindo das tábuas. Pay Day espalha moedas que você recolhe depois da batalha."
          steps:
            "1":
              title: "Desça de Lavender Town"
              text_html: "Entre pelo norte na Silence Bridge, uma ponte de pesca sobre água aberta. Suba ao 2F do portão %{gate} pelo TM39 Swift grátis. Leve um Pokémon com Cut e deixe o TM16 Pay Day: ele exige Surf."
              items:
                tm_swift: "Com a garota no 2F do portão da Rota 12, subindo a escada. Swift nunca erra: ignora quedas de precisão e Double Team."
            "2":
              title: "Acorde o Snorlax"
              text: "No meio, um Snorlax Nv 30 bloqueia o único caminho. Toque o Poké Flute para acordá-lo, depois batalhe ou nocauteie para abrir a passagem sul. É um de só dois no jogo, então leve balls."
            "3":
              title: "Vasculhe o beco oeste"
              text: "Logo depois do Snorlax, siga a estreita ponte de terra a oeste ate um beco sem saida murado. Fique no piso mais a oeste e aperte A virado para leste para um Hyper Potion oculto. Nada aparece na tela."
              hidden:
                hyper-potion: "O beco sem saida no extremo oeste da ponte de terra do Snorlax. Vire para leste no piso mais a oeste e aperte A. Nada aparece na tela."
            "4":
              title: "Desca pela ponte"
              text_html: "Continue ao sul pela ponte, enfrentando o Rocker e o ultimo Fisherman conforme o caminho permitir. Entre na casa do Fishing Guru %{guru} pelo Super Rod: responda SIM quando ele perguntar se você gosta de pescar."
              items:
                super_rod: "Com o Fishing Guru na casa no meio da Silence Bridge. A melhor vara, pesca a maior variedade de Pokémon de Água."
            "5":
              title: "Pegue o Iron no beco"
              text: "Perto do extremo sul, logo após o ultimo Fisherman, uma árvore cortável fecha um beco murado do lado oeste. Corte, entre e pegue o Iron, que aumenta permanentemente a Defesa de um Pokémon."
              items:
                iron: "Beco do lado oeste perto da saida sul, ao lado do Fisherman do sul. Uma árvore cortável e a única entrada."
            "6":
              title: "Siga para a Rota 13"
              text_html: "Limpe o ultimo Jr. Trainer e atravesse a grama alta la embaixo (Oddish, Bellsprout e o raro Farfetch'd) ate a saida sul %{south} para a Rota 13."
          tips:
            farfetchd: "Uma captura rara de 5% na grama. O único Farfetch'd selvagem por perto."
            snorlax: "Um de apenas dois Snorlax do jogo. Uma parede Nv 30. Faça dormir ou paralise, e jogue balls."
          oak:
            slowpoke: "Surfe a água por Slowpoke → Slowbro, um Água/Psíquico robusto."
            farfetchd: "O pato raro da grama. Pegue o único Farfetch'd selvagem aqui."
        route_13:
          note: "Labirinto de desníveis ao sul. Oddish, Bellsprout, Ditto."
          intro: "Um labirinto cercado de desníveis e arbustos ao sul do píer, com dez treinadores. Um Ditto selvagem aparece na grama dele."
          steps:
            "1":
              title: "Desca serpenteando da Rota 12"
              text: "A Rota 13 é um ziguezague de cercas e desníveis abaixo da Rota 12. Siga a oeste e ao sul, e observe a grama por um Ditto selvagem que Transforma no que enfrenta."
            "2":
              title: "Descubra o Calcium perto da placa"
              text: "Ao longo da cerca sul, um quadrado a leste da primeira placa Trainer Tips, um Calcium se esconde na grama. Fique a leste dele, vire para oeste e aperte A. Nada aparece na tela."
              hidden:
                calcium: "Cerca sul, um tile a leste da primeira placa Trainer Tips. Vire para oeste e aperte A; nada aparece na tela."
            "3":
              title: "Desenterre o PP Up do canto"
              text: "Siga a cerca até o canto sudoeste, o último trecho antes da Rota 14. Um PP Up está enterrado ali: fique no quadrado logo acima, vire para baixo e aperte A."
              hidden:
                pp-up: "Canto sudoeste, o tile de baixo perto da saida para a Rota 14. Fique acima dele, vire para baixo e aperte A; nada aparece na tela."
            "4":
              title: "Saia a oeste para a Rota 14"
              text_html: "Com os dois reforcos de status no bolso, desca pelo ultimo trecho de desniveis e saia a oeste %{west} para a Rota 14."
          tips:
          oak:
            ditto: "Capture a bolha que Transforma aqui. Divertida e útil para breeding em gerações futuras."
        route_14:
          note: "Fileira de bikers e aves. Oddish, Bellsprout, Venonat."
          intro: "Uma longa diagonal de alamedas cercadas por arbustos, trabalhada por Bird Keepers e Bikers. Venomoth voa por aqui, raro o bastante para valer um Repel."
          steps:
            "1":
              title: "Corte pelos desníveis"
              text: "Lute com os Bird Keepers em cima e os Bikers embaixo. Um tipo Elétrico ou Psíquico varre os dois."
            "2":
              title: "Siga para a Rota 15"
              text_html: "Siga os desníveis de mão única a sudoeste enquanto descem os penhascos, e siga %{west} para a Rota 15 lá embaixo."
        route_15:
          note: "A oeste até Fuchsia. Oddish, Bellsprout, Venonat."
          intro: "A última estrada até Fuchsia, um campo cercado de arbustos com dez treinadores espalhados."
          steps:
            "1":
              title: "Pegue a pista de cima pelo TM20 Rage"
              text_html: "Entre vindo de Route 14 %{east} pela pista de cima e siga a oeste, enfrentando a Jr. Trainer no caminho. Uma Poké Ball no fim guarda o TM20 Rage, que aumenta o Ataque a cada golpe sofrido."
              items:
                tm-rage: "No extremo oeste da pista de cima, na altura da cancela de Fuchsia. A pista só se entra pelo lado de Route 14: os barrancos abaixo dela só descem."
            "2":
              title: "Volte e limpe a pista de baixo"
              text: "Refaça o caminho a leste pela pista de cima, pule o barranco e trabalhe a pista de baixo da direita para a esquerda. Bikers, Beauties, Bird Keepers e Jr. Trainers ficam em duplas, então cure antes de começar."
            "3":
              title: "Pela cancela até Fuchsia"
              text_html: "Saia pela cancela %{gate} no extremo oeste. O Assistente do Oak espera no 2F dela com o Exp. All, depois de 50 espécies capturadas, e daí é direto para Fuchsia City %{west}."
              items:
                exp_all: "Com o Assistente do Oak no 2F da cancela, depois de capturar 50 espécies. Divide o EXP das lutas com todo o time."
        fuchsia_city:
          mart:
            blurb: "Fuchsia vende Ultra Balls e Hyper Potions, o kit para a Safari Zone e o ginásio do Koga."
            buy: "Ultra Balls aumentam suas chances nas capturas raras. Hyper Potions e um Revive te levam contra o Koga."
          gym:
            intro: "O chão do ginásio é um labirinto de paredes invisíveis, e o mapa desenha o único caminho por ele. Os três Venonat (Nv 44, 46, 48) e o Venomoth (Nv 50) do Koga apostam em Toxic e Double Team, então leve um atacante Psíquico rápido e carregue Antidotes."
            puzzle:
              "1": "A sala inteira é feita de paredes invisíveis. Siga a linha: a leste pelo fundo, suba a faixa livre da direita, a oeste rente ao muro do topo, depois desça pela esquerda até o Koga. Todo treinador que ela passa é opcional."
          note: "Ginásio do Koga. Soul Badge. Safari Zone ao lado."
          intro: "Uma cidade de cercas baixas em volta do portão da Safari Zone. O ginásio do Koga se esconde atrás de paredes invisíveis, e o Warden não consegue falar sem a dentadura."
          steps:
            "1":
              title: "Cure e reabasteça"
              text_html: "Chegue pela Rota 15, cure no Centro %{center} e abasteça no Mart %{mart}. Deixe o Ginásio %{gym} para depois: a Safari Zone ao lado vem antes do Koga."
            "2":
              title: "Pegue o Good Rod e pesque no lago"
              text_html: "A casa da borda leste %{rod} guarda o irmão mais velho do Fishing Guru: responda SIM e o Good Rod é seu. A porta dos fundos %{back} dá no lago cercado, então use o Super Rod ali por um Gyarados selvagem."
              items:
                good_rod: "Com o irmão mais velho do Fishing Guru, na casa da borda leste de Fuchsia. Pesca melhor que o Old Rod."
            "3":
              title: "Explore a Safari Zone"
              text_html: "Siga ao norte para a Safari Zone %{safari}. A sala de prêmios guarda o HM03 Surf, e os Gold Teeth que você acha lá dentro compram o HM04 Strength com o Warden."
          tips:
            gyarados: "Super Rod no lago cercado atrás da casa do pescador por um Gyarados selvagem. Sem grind de Magikarp."
          oak:
            gyarados: "Pesque um direto do lago atrás da casa do pescador. Sem Magikarp para criar antes."
        fuchsia_city_return:
          note: "De volta pelo Koga. Soul Badge e TM06 Toxic."
          intro: "Fuchsia de novo, com os Gold Teeth na mochila. O Warden os troca pelo Strength, e o labirinto de paredes invisíveis do Koga é a última coisa que resta na cidade."
          steps:
            "1":
              title: "Troque os Gold Teeth pelo Strength"
              text_html: "Entregue os Gold Teeth ao Warden %{warden} e ele te dá o HM04 Strength. Ensine o golpe e empurre a pedra do quarto dos fundos para pegar o Rare Candy atrás dela. O Ginásio %{gym} é o próximo."
              items:
                hm04_strength: "Com o Warden da Safari Zone, depois de devolver os Gold Teeth. Ensina Strength para empurrar pedras."
            "2":
              title: "Ensine Surf e volte para o parque"
              text_html: "A Soul Badge aumenta a Defesa e libera o Surf fora de batalha, além do TM06 Toxic. Cure no Centro %{center}, ensine o Surf e faça a <a href=\"%{href}\">segunda ida à Safari</a> pelo Nugget e pelas duas bolas que o contador cortou."
            "3":
              title: "Siga a oeste pela Cycling Road"
              text_html: "Saia da cidade pela cancela oeste %{west} para a Rota 18, depois suba a Cycling Road ao norte. Um segundo Snorlax (Nv 30) dorme atravessado no caminho lá em cima, então leve a Poké Flute. Saffron City é a próxima parada depois dele."
        safari_zone:
          note: "Parque de captura de 502 passos. Scyther, Pinsir, Chansey, Dratini e mais."
          intro: "Quatro áreas cercadas sem treinadores e sem Poké Balls comuns. A entrada dá trinta Safari Balls e exatamente 502 passos, e Kangaskhan, Tauros, Scyther, Pinsir e Dratini não vivem em outro lugar."
          steps:
            "1":
              title: "Pague a entrada no portão"
              text: "Pague ¥500 no portão por trinta Safari Balls e 502 passos, o bastante para a volta inteira se você não ficar rodando. Nada pode ser enfraquecido aqui: a Bait divide por quatro a chance de fuga mas corta pela metade a de captura, e a Rock dobra as duas."
            "2":
              title: "Vá reto a leste pela Área Central"
              text: "Uma bola sozinha no meio guarda um Nugget que vale ¥5000, mas ela fica numa ilha cercada de água e o Surf ainda está travado. Não há mais nada por aqui, então corra a leste até a Área 1."
            "3":
              title: "Suba o morro da Área 1 pelo Carbos"
              text: "Saia da Área Central pela borda leste até a Área 1 (Leste), caindo no canto sudoeste. Siga o muro de baixo a leste e pegue a primeira escada para o morro, onde uma bola guarda o Carbos, um aumento permanente de Velocidade."
              items:
                carbos: "Área 1 (Leste), no morro acima do canto sudeste."
            "4":
              title: "Vá a oeste pelo TM37"
              text: "Siga a oeste pelo morro até a próxima bola, que guarda o TM37 Egg Bomb. Um TM de chão é único, então guarde mesmo que ninguém do time queira o golpe."
              items:
                tm-egg-bomb: "Área 1 (Leste), a oeste do Carbos pelo morro."
            "5":
              title: "Atravesse a oeste pelo Max Potion"
              text: "Continue a oeste pela área até uma bola sozinha perto da saída norte, com um Max Potion, uma cura de barra cheia que vale guardar para o Koga."
              items:
                max-potion-3-7: "Área 1 (Leste), extremo oeste perto da saída norte."
            "6":
              title: "Volte a leste pelo Full Restore"
              text: "Volte a leste pelo morro por mais uma bola, um Full Restore, HP cheio e todo status limpo de uma vez. Depois corra a oeste pelo topo até a saída para a Área 2."
              items:
                full-restore: "Área 1 (Leste), no morro logo ao norte do Carbos."
            "7":
              title: "Passe as cercas pelo TM40"
              text: "Você chega na Área 2 (Norte) pela borda leste. Pegue a segunda escada para passar ao outro lado das cercas, depois suba ao norte até a bola com o TM40 Skull Bash."
              items:
                tm-skull-bash: "Área 2 (Norte), centro-superior abaixo do muro do topo."
            "8":
              title: "Suba até o Protein"
              text: "Continue subindo até o muro do topo, onde uma bola encostada na cerca guarda um Protein, um aumento permanente de Especial. Depois siga a oeste e desça tudo até a saída para a Área 3."
              items:
                protein: "Área 2 (Norte), encostada no muro do topo."
            "9":
              title: "Entre na Área 3 pelos Gold Teeth"
              text: "Você chega na Área 3 (Oeste) pela borda de cima. Desça reto até a bola com os Gold Teeth, a dentadura perdida do Warden e o motivo do Strength de Fuchsia ainda estar trancado."
              items:
                gold-teeth: "Área 3 (Oeste), abaixo da entrada norte."
            "10":
              title: "Pegue o TM32 Double Team"
              text: "Siga a oeste pela mesma linha e pegue a bola com o TM32 Double Team, um nível de evasão por uso e o golpe que o Koga vai empilhar contra você."
              items:
                tm-double-team: "Área 3 (Oeste), canto superior esquerdo, a oeste dos Gold Teeth."
            "11":
              title: "Investigue a estátua por um Revive"
              text: "Algumas casas a oeste da bola do TM32 há uma estátua. Aperte A de frente para ela; nada aparece na tela, mas você embolsa um Revive escondido."
              hidden:
                revive: "Área 3 (Oeste), na estátua a oeste da bola do TM32; aperte A de frente para ela, nada aparece."
            "12":
              title: "Pegue o HM03 Surf na Casa Secreta"
              text: "Entre na Casa Secreta no canto superior esquerdo. O velho te dá o HM03 Surf, o motivo inteiro de vir até aqui. O Surf fica travado até a Soul Badge do Koga, na volta por Fuchsia."
              items:
                hm03_surf: "Com o velho na Casa Secreta, canto extremo da Área 3 da Safari Zone. Precisa da Soul Badge do Koga para funcionar fora de batalha."
            "13":
              title: "Gaste o que sobrou do contador"
              text: "Os passos que sobrarem, gaste no mato: Scyther, Pinsir, Chansey e Tauros não vivem em outro lugar. No zero o portão te põe para fora, e as duas coisas que precisam estar na mochila são o HM03 Surf e os Gold Teeth."
            "14":
              title: "Use Surf até o Nugget"
              text: "Reto para cima a partir do portão, use Surf até a ilha da Área Central e pegue a bola que espera lá: um Nugget, que vale ¥5000 em qualquer balcão de Mart."
              items:
                nugget: "Área Central, na ilha reto para cima a partir do portão."
            "15":
              title: "Atravesse a oeste pelo Max Revive"
              text_html: "De volta em terra firme, pegue a porta oeste da Área Central %{west} direto para a Área 3. A primeira bola depois da entrada guarda um Max Revive, uma revivida completa achada no chão."
              items:
                max-revive: "Área 3 (Oeste), a poucos passos da entrada leste."
            "16":
              title: "Passe o morro pelo Max Potion"
              text: "Atravesse o morro a oeste e desça pela passagem do outro lado, onde a última bola do parque guarda um Max Potion."
              items:
                max-potion-8-20: "Área 3 (Oeste), canto inferior esquerdo perto do muro de baixo."
            "17":
              title: "Encha o resto do contador com capturas"
              text_html: "Gaste o resto do contador capturando. A Área Central é o centro de tudo: uma porta ao norte %{north} e uma a oeste %{west}, então qualquer metade fica a poucos passos do portão, e o Super Rod tira Dratini de qualquer lago."
          second_lead: "A Soul Badge do Koga libera o Surf, então ensine a um tipo Água e pague a entrada de novo. Um ¥500 e mais 502 passos limpam tudo que a primeira ida teve que deixar para trás."
          tips:
            scyther: "Um dos dois grandes brutamontes Inseto do Yellow, aqui junto do Pinsir. Isca, depois Safari Balls."
            pinsir: "O Yellow deixa capturar Pinsir e Scyther na Safari. Pegue este também."
            kangaskhan: "Um Normal raro, só na Safari. Isca-e-ball paciente ou nada."
            chansey: "1% e fujão, mas um prêmio enorme de EXP. Guarde umas balls para ele."
            dratini: "O único Dratini fácil. Super Rod nos lagos da Safari pela linha de Dragonite."
          oak:
            scyther: "Brutamontes exclusivo da Safari. Pegue um. Não há outra fonte fácil."
            pinsir: "O outro inseto da Safari. O Yellow deixa ficar com Pinsir e Scyther."
            dratini: "Super Rod nos lagos → Dragonair → Dragonite. Sua chance confiável."
            kangaskhan: "Raro e só na Safari. Garanta um para a dex enquanto está aqui."
        route_16:
          note: "O topo da Cycling Road. Doduo e um Snorlax."
          intro: "O portão norte da Cycling Road, com um segundo Snorlax dormindo na passagem. Depois dele a estrada só corre num sentido: ladeira abaixo."
          steps:
            "1":
              title: "Suba da Cycling Road"
              text_html: "Saia pela cancela do topo da estrada %{gate} para a Rota 16 %{south}. Seis pilotos ocupam a faixa a oeste de onde você sobe, então percorra ela até a casa do Fly e volte, em vez de seguir direto."
            "2":
              title: "Acorde o Snorlax e entre"
              text_html: "Um Snorlax (Nv 30) dorme atravessado no caminho junto da cancela de Celadon %{gate}. Toque a Poké Flute e enfrente-o para liberar o caminho a leste %{east}. Saffron fica uma cancela depois de Celadon, então vá a pé ou de Fly."
          tips:
            snorlax: "O segundo e último Snorlax. A mesma parede Nv 30. Faça dormir, depois jogue balls."
          oak:
            doduo: "A captura comum da rota → Dodrio, um Normal/Voador rápido."
            snorlax: "O último dos dois Snorlax. Acorde com o Poké Flute e capture agora."
        route_17:
          note: "Cycling Road. Doduo, Ponyta, Fearow."
          intro: "Cycling Road: uma subida longa que só dá para fazer de Bike, cortada ao meio por barreiras em três faixas que nunca se encontram. Dez Bikers e cinco itens escondidos ficam nela."
          steps:
            "1":
              title: "Comece a subir a Cycling Road"
              text_html: "Entre pela cancela sul %{south} e monte na Bike, já que a estrada não pode ser cruzada a pé. Duas brechas nas beiradas de baixo deixam você subir. Acima delas as barreiras dividem a estrada em três faixas, então ela é feita uma faixa por vez."
            "2":
              title: "Cave no pé da subida"
              text: "Antes das faixas se dividirem, passando a placa Cycling Road Ends, pare no centro-esquerda e aperte A por um Max Elixir escondido. Nada aparece na tela."
              hidden:
                max-elixir: "Centro-esquerda no pé da estrada, junto da placa Cycling Road Ends. Aperte A; nada aparece."
            "3":
              title: "Suba a faixa da direita"
              text: "Pegue a faixa leste primeiro e suba por ela passando pelos Bikers. Na altura da placa Trainer Tips, aperte A contra a casa da cerca por um PP Up escondido. Nada aparece na tela."
              hidden:
                pp-up: "Borda leste, na altura da placa Trainer Tips. Aperte A na casa da cerca; nada aparece."
            "4":
              title: "Volte pela faixa do meio"
              text: "Desça até o pé das barreiras e suba pela faixa central. Aperte A na casa lisa a mais ou menos um terço do topo por um Full Restore escondido. Nada aparece na tela."
              hidden:
                full-restore: "Faixa central, mais ou menos a um terço do topo. Aperte A na casa vazia; nada aparece."
            "5":
              title: "Varra a faixa oeste"
              text: "A faixa do meio termina na altura da faixa oeste, então atravesse ali e varra ela para baixo em vez de descer até o pé de novo. Aperte A ao lado dos Bikers por um Max Revive escondido. Nada aparece na tela."
              hidden:
                max-revive: "Faixa oeste, terço de baixo da estrada. Aperte A na casa vazia; nada aparece."
            "6":
              title: "Por cima das barreiras"
              text: "Suba de volta pela faixa oeste, onde as três estradas se juntam perto da cancela norte. Cole no lado leste e aperte A na casa vazia por um Rare Candy escondido. Nada aparece na tela."
              hidden:
                rare-candy: "Lado leste, perto do topo junto da cancela norte. Aperte A na casa vazia; nada aparece."
            "7":
              title: "Saia pela cancela do topo"
              text_html: "Passando a última dupla de Bikers, saia pela cancela norte %{north} para a Rota 16."
          oak:
            ponyta: "Uma captura de fogo na grama → Rapidash. Um dos poucos tipos Fogo do Yellow."
        route_18:
          note: "A leste até Fuchsia. Spearow, Rattata, Doduo."
          intro: "Um trecho curto entre o pé da Cycling Road e Fuchsia, com três Bird Keepers nele e uma guarita em cada ponta."
          trades:
            parasect:
              npc: "COZINHEIRO"
              title: "Parasect"
              where: "No andar de cima do portão da Rota 18"
              note: "Um Parasect pronto que sobe de nível rápido pelo bônus de XP de troca. Tangela é uma captura na Zona Safári."
          steps:
            "1":
              title: "Atravesse a oeste"
              text_html: "Saia pela cancela oeste de Fuchsia %{east} para a faixa estreita no pé da Cycling Road, onde a rota se aperta entre a água. Três Bird Keepers estão espalhados por ela."
            "2":
              title: "Chegue ao pé da estrada"
              text_html: "Siga a oeste pela cancela %{gate} até a base da Cycling Road %{north}. Duas brechas nas beiradas do pé dela são o que deixa você subir a pé."
        saffron_city:
          mart:
            blurb: "O Mart de Saffron tem Max Repel e Full Heal, aberto assim que a Equipe Rocket deixa a cidade."
            buy: "Hyper Potions e um Full Heal te preparam para a Sabrina. Max Repel torna os andares da Silph Co. suportáveis."
          gym:
            intro: "Plataformas de teletransporte te levam pelo ginásio num circuito fixo. Pegue as plataformas certas para chegar à Sabrina, cujos Abra, Kadabra e Alakazam (todos Nv 50) batem como um caminhão. Psíquico não tem contra de verdade na 1a geração, então suba de nível ou lidere com um forte atacante Inseto como Pinsir ou Scyther."
            puzzle:
              "1": "Nove salas fechadas ligadas só por placas de teletransporte, e o pin de cada placa diz para qual sala ela te joga. Siga as setas: um salto por sala, um treinador em cada, e a última abre a da Sabrina."
          dojo:
            intro: "Um Karate Master e quatro Black Belts, todos do tipo Lutador. Vencê-lo não dá insígnia nem TM. O que ele libera é o par de Poké Balls no fundo da sala: Hitmonlee numa, Hitmonchan na outra, e você só abre uma."
            when: "a qualquer momento em Saffron, antes ou depois da Silph"
            prize: "um de dois Pokémon Lutadores, Nv %{level}"
            steps:
              "1": "Vença os quatro Black Belts e depois o Karate Master no fundo. A sala inteira é Lutador puro, então um tipo Psíquico ou Voador atravessa tudo. Pikachu também dá conta."
              "2": "As duas Poké Balls atrás dele abrem assim que ele perde. Aperte A na que você quer: a página da Pokédex que aparece diz o que tem dentro antes de você responder sim."
            notes:
              primeape: "Um Pokémon só, cinco níveis acima do resto da sala. O Primeape dele é o golpe mais pesado que você leva antes do Mestre."
            dex_note: "Ele começa com Hitmonlee e emenda com Hitmonchan, então a luta registra os dois como vistos antes de você escolher."
            choice:
              intro: "Duas Poké Balls ficam no fundo do dojo. Nenhuma das duas espécies aparece no mato em lugar nenhum do Yellow, e o dojo entrega exatamente uma delas."
              room: "As duas ficam encostadas na parede do fundo atrás do Karate Master, uma de cada lado do centro da sala. Ande até a que você quer e aperte A; a página da Pokédex que abre diz o que tem dentro antes de você responder."
              hitmonlee: "O mais forte dos dois numa luta da 1a geração. Golpes Lutadores usam o Ataque, e 120 de Ataque com Hi Jump Kick é o maior golpe que qualquer um dos dois acerta. Cai rápido se levar troco."
              hitmonchan: "Os socos elementais são o atrativo e a armadilha: na 1a geração eles usam o Especial, e o Especial dele é 35. Mais resistente e mais divertido, claramente mais fraco. Leve porque você quer."
              rec: "Hitmonlee, se o resultado importa. Bate mais forte no resto do jogo e não precisa de TM para isso. Hitmonchan tem o melhor sprite e é o pior Pokémon."
          note: "Ginásio da Sabrina. Marsh Badge. Silph Co. e o Dojo."
          intro: "A capital de Kanto sob ocupação Rocket, um guarda em cada portão. A Silph Co. fica no centro, e a cidade tem dois salões de luta: o ginásio da Sabrina e o Dojo."
          steps:
            "1":
              title: "Limpe o Fighting Dojo"
              text_html: "Vença o Karate Master no Fighting Dojo %{dojo} e pegue um Hitmonlee ou Hitmonchan de graça. Só um dos dois, então escolha o que falta no seu time."
            "2":
              title: "Liberte a Silph Co."
              text_html: "O ginásio %{gym} fica trancado enquanto a Rocket segura a Silph Co. %{silph}, então a torre vem em seguida e a Sabrina espera a volta pela cidade."
          tips:
            hitmonlee: "De graça no dojo, e o que bate mais forte: 120 de Ataque com Hi Jump Kick. Está na bola da esquerda."
            hitmonchan: "De graça no dojo, e o que tem os socos elementais. Na 1a geração eles usam os 35 de Especial dele, então batem mais fraco do que parecem."
          gifts:
            hitmonlee:
              from: "o Karate Master"
            hitmonchan:
              from: "o Karate Master"
          oak:
            hitmonlee: "Grátis do Dojo. Escolha Hitmonlee ou Hitmonchan (só um)."
            hitmonchan: "A outra metade do prêmio do Dojo. Um save registra um dos dois; o outro vem por troca."
        saffron_city_return:
          note: "De volta pela Sabrina. Marsh Badge e TM46 Psywave."
          intro: "A Silph está livre e as portas do ginásio finalmente abriram. Os Psíquicos da Sabrina batem mais forte que tudo que você enfrentou, e o chão dela é atravessado por painéis de teleporte, não a pé."
          steps:
            "1":
              title: "Pegue a Marsh Badge"
              text_html: "O Ginásio %{gym} é a última coisa em Saffron. O Abra, o Kadabra e o Alakazam da Sabrina estão todos no Nv 50 com Psychic, então lidere com um golpe de Inseto ou com algo mais rápido que eles."
        silph_co:
          note: "Tomada da HQ da Rocket. Lapras e a Master Ball."
          intro: "Onze andares de escritórios, trinta Rockets e Giovanni no topo. O elevador pula direto para a Card Key, então cada barreira acima dela abre já na subida, sem exigir uma segunda viagem."
          steps:
            "1":
              title: "Suba de elevador até o 5F"
              text_html: "O elevador %{lift} e a escada dividem o canto nordeste. Pegue o elevador e marque 5F: a Card Key está lá em cima, e ela abre todas as barreiras do prédio."
            "2":
              title: "Ache o Elixir escondido"
              text: "Ao sair do elevador, siga para oeste pelo topo do andar até a fileira de vasos de planta. Aperte A de frente para o vaso mais à direita; nada aparece na tela."
              hidden:
                elixir: "5F, o vaso da direita na fileira a oeste do elevador. Aperte A de frente para ele; nada aparece na tela."
            "3":
              title: "Use a placa para contornar o Rocket"
              text_html: "Continue ao sul até a placa de teletransporte %{pad}, vá até o 9F e pise nela de volta na hora. Você reaparece dentro do corredor que o Rocket %{rocket} guarda, então desça um passo e encare ele."
            "4":
              title: "Pegue a Card Key"
              text_html: "Siga para leste por esse corredor até a Poké Ball no fim dele. A Card Key abre todas as barreiras dos onze andares. Depois volte ao elevador %{lift} e desça para o 2F."
              items:
                card-key: "5F, no fim leste do corredor que o Rocket bloqueava."
            "5":
              title: "Limpe o 2F de leste a oeste"
              text_html: "Ao sair do elevador, um Rocket %{first} espera a sudeste e um Scientist %{second} na sala abaixo dele. Depois siga a oeste até um Rocket %{third} entre as mesas compridas, e ao canto sudoeste por um Scientist %{fourth} atrás de uma barreira."
            "6":
              title: "Ganhe o TM36 da funcionária"
              text_html: "Direto ao norte dele, passando mais uma barreira, uma funcionária assustada %{woman} entrega o TM36 Selfdestruct. Depois pegue a escada %{up} do canto nordeste até o 3F."
              items:
                tm36-selfdestruct: "2F, com a funcionária assustada na sala selada ao norte."
            "7":
              title: "Abra caminho pelo 3F"
              text_html: "Um Rocket %{rocket} está a sudoeste da escada. Passando duas barreiras a oeste, um Scientist %{scientist} guarda a sala onde fica a única bola do andar."
            "8":
              title: "Pegue a Hyper Potion"
              text_html: "A bola está no canto nordeste da sala do Scientist e guarda uma Hyper Potion. Depois suba a escada %{up} até o 4F."
              items:
                hyper-potion: "3F, canto nordeste da sala que o Scientist guarda."
            "9":
              title: "Desça o 4F"
              text_html: "Um Rocket %{first} espera na sala ao sul da escada. A oeste dela, um corredor de um tile te deixa ao lado de um segundo Rocket %{second}, e um Scientist %{third} fica atrás de uma barreira a nordeste dele."
            "10":
              title: "Pegue o Full Heal"
              text: "Volte a esse segundo Rocket e passe pela barreira a noroeste dele. Três bolas ficam à vista; o Full Heal é a da sua esquerda ao entrar."
              items:
                full-heal: "4F, recanto oeste, a bola à sua esquerda ao entrar pelo sul."
            "11":
              title: "Guarde o Max Revive"
              text: "Dois passos ao norte, a bola mais alta das três guarda um Max Revive. Ele revive um Pokémon desmaiado com o HP cheio, e nada mais no jogo faz isso."
              items:
                max-revive: "4F, a mais ao norte das três bolas."
            "12":
              title: "Leve o Escape Rope"
              text_html: "A última bola, um passo a sudeste do Max Revive, guarda um Escape Rope. Depois volte para leste e suba a escada %{up} até o 5F."
              items:
                escape-rope: "4F, a bola do meio das três."
            "13":
              title: "Varra o 5F de leste a oeste"
              text_html: "Um Rocket %{rocket} está a sudeste da escada, e um Juggler %{juggler} a oeste das mesas de reunião na sala abaixo; a sala selada depois dele não tem nada. Depois siga a oeste pelos vasos de planta até um Scientist %{scientist}."
            "14":
              title: "Pegue a Protein"
              text: "Abra a sala a oeste do Scientist e pegue a Poké Ball solitária. A Protein aumenta o Attack de um Pokémon para sempre, então gaste com quem bate mais forte."
              items:
                protein: "5F, a sala selada a oeste do Scientist."
            "15":
              title: "Busque o TM09 Take Down"
              text_html: "Ao sul dali, passando outra barreira, está o TM09 Take Down, um golpe Normal pesado que devolve ao usuário um quarto do dano causado. Depois suba a escada %{up} até o 6F."
              items:
                tm-take-down: "5F, a sala selada no canto sudoeste."
            "16":
              title: "Contorne o 6F por fora"
              text_html: "Um Rocket %{rocket} está logo ao sul da escada. A partir dele, contorne a sala central grande indo para oeste e depois ao sul, até um Scientist %{scientist}."
            "17":
              title: "Pegue o HP Up"
              text: "Logo ao sul do Scientist, uma barreira abre para uma salinha com duas bolas. A mais próxima guarda um HP Up, um aumento permanente de HP para um Pokémon."
              items:
                hp-up: "6F, a sala selada na parede oeste, a bola mais próxima."
            "18":
              title: "Leve o X Accuracy"
              text: "A segunda bola dessa sala guarda um X Accuracy, que faz os golpes de um Pokémon acertarem pelo resto da batalha. Vale guardar para um lendário."
              items:
                x-accuracy: "6F, a mesma sala selada, a bola ao sul."
            "19":
              title: "Termine o 6F"
              text_html: "Saia da sala, vá para o sul e depois para leste até o último Rocket %{rocket} do andar. Depois volte à escada %{up} e suba para o 7F."
            "20":
              title: "Entre nas salas seladas do 7F"
              text_html: "Um Rocket %{rocket} está bem ao lado da escada. Abra a barreira ao sul dele e atravesse a sala até o canto sudeste, onde uma bola guarda o TM03 Swords Dance."
              items:
                tm-swords-dance: "7F, canto sudeste da primeira sala selada ao sul da escada."
            "21":
              title: "Atravesse o 7F até o lado oeste"
              text_html: "Mais uma barreira ao sul abre para outro Rocket %{second}. Volte pelas duas salas, vá a oeste pela fresta estreita até um Rocket %{third} e siga o caminho de um tile ao sul e a oeste até um Scientist %{fourth}."
            "22":
              title: "Pegue o Calcium"
              text_html: "Uma bola fica no canto noroeste dessa sala: Calcium, um aumento permanente de Special. Depois volte à escada %{up} e suba para o 8F."
              items:
                calcium: "7F, canto noroeste da sala oeste."
            "23":
              title: "Limpe o 8F de cima a baixo"
              text_html: "Um Rocket %{first} está junto à escada, e um segundo %{second} no corredor de baixo. A noroeste abre uma sala; a barreira a oeste não dá em nada, e o Scientist %{third} ao norte é a última luta. Escada %{up} até o 9F."
            "24":
              title: "Ache a enfermeira do 9F"
              text_html: "Desça o corredor à esquerda da escada até um Rocket %{rocket}. Depois dele, passando a barreira à esquerda, uma enfermeira %{nurse} cura sua equipe inteira de graça, quantas vezes quiser."
            "25":
              title: "Ache a Max Potion escondida"
              text: "A cama à esquerda da enfermeira esconde uma Max Potion. Fique de frente para a metade de baixo e aperte A; nada aparece na tela."
              hidden:
                max-potion: "9F, a metade de baixo da cama à esquerda da enfermeira. Aperte A de frente para ela; nada aparece na tela."
            "26":
              title: "Limpe o resto do 9F"
              text_html: "Passe a segunda barreira a oeste, logo ao norte da enfermeira, e siga ao norte pelo andar até um Rocket %{rocket}. De volta à escada, duas barreiras ao sul escondem um Scientist %{scientist}. Depois suba %{up} para o 10F."
            "27":
              title: "Desça para a sala de caixas do 10F"
              text_html: "Um Scientist %{scientist} está bem ao lado da escada, e a barreira ao sul dele não leva a nada. Desça para a sala sudoeste, onde um Rocket %{rocket} espera no alto dela."
            "28":
              title: "Pegue o Carbos"
              text: "Três bolas ficam nas frestas das caixas que enchem a sala, então contorne o bloco por fora. Desça pelo lado leste primeiro, pelo Carbos, um aumento permanente de Speed."
              items:
                carbos: "10F, sala de caixas, na fresta do lado leste."
            "29":
              title: "Guarde a Rare Candy"
              text: "Siga pelo fundo da sala até uma Rare Candy, um nível de graça para quem mais precisar. Gaste com algum Pokémon lento de treinar."
              items:
                rare-candy: "10F, sala de caixas, na fresta do lado sul."
            "30":
              title: "Pegue o TM26 Earthquake"
              text_html: "Subindo pela parede oeste na saída está o TM26 Earthquake, o melhor golpe Ground do jogo e a resposta para Giovanni. Depois escada %{up} até o 11F."
              items:
                tm-earthquake: "10F, sala de caixas, na fresta da parede oeste."
            "31":
              title: "Limpe o 11F e desça para o 3F"
              text_html: "Vá a sudeste da escada até um Rocket %{rocket}, a última luta opcional daqui. Depois pegue o elevador %{lift} até o 3F e use a placa %{pad} da sala central, a única entrada para um canto selado do 7F."
            "32":
              title: "Seu rival está esperando"
              text: "Dois passos a oeste de onde você chega ele te ataca: Fearow, Dodrio e Exeggutor perto do Nv 38, e a evolução do Eevee dele no Nv 40. Cure antes de dar esse passo."
            "33":
              title: "Pegue a Lapras de graça"
              text_html: "Com ele fora do caminho, fale com o funcionário %{man} à esquerda da sala. Ele te dá uma Lapras Nv 15, a única do jogo e um tanque Water/Ice excelente."
            "34":
              title: "Suba de placa até o 11F"
              text_html: "A outra placa %{pad}, alguns tiles a leste de onde o rival estava, leva ao 11F. Cure no 9F antes: vencer Giovanni esvazia o prédio, enfermeira inclusive."
            "35":
              title: "Jessie e James fecham o caminho"
              text: "Um passo ao sul da placa a dupla te ataca: Weezing, Arbok e Meowth, todos no Nv 31. Não dá para contornar nem para voltar antes de vencer."
            "36":
              title: "Vença Giovanni"
              text_html: "Virando a esquina e passando a última barreira, Giovanni %{giovanni} começa a luta sozinho: Nidorino, Rhyhorn, Persian e uma Nidoqueen Nv 41. Earthquake dobra em três dos quatro."
            "37":
              title: "Pegue a Master Ball"
              text_html: "Vá ao norte e fale com o presidente da Silph %{president}. A Master Ball captura qualquer coisa na primeira tentativa, e o jogo tem exatamente uma. Guarde para Mewtwo."
              items:
                master-ball: "11F, com o presidente da Silph, depois de vencer Giovanni."
            "38":
              title: "Saia da Silph"
              text_html: "Tem um PC funcionando no canto sudeste desta sala, caso sua mochila esteja cheia. Depois volte pelas placas %{back} até o 3F, desça ao 1F de elevador e saia %{out}. O ginásio da Sabrina abriu enfim: <a href=\"%{href}\">vá pegar a Marsh Badge</a>."
          tips:
            lapras: "A única Lapras do jogo. Um tanque Water/Ice excelente. Não perca ela no 7F."
          oak:
            lapras: "De graça no 7F → um ótimo tanque Water/Ice. A única Lapras que você consegue no jogo."
          gifts:
            lapras:
              from: "DE UM FUNCIONÁRIO DA SILPH"
        surf_cleanups:
          note: "Os últimos itens atrás de água, e o caminho até Zapdos."
          intro: "O HM03 está na mochila desde a Safari Zone, e três coisas em três cidades esperavam por ele. Voe entre elas e depois siga a leste de Cerulean: a Power Plant também se alcança pela água, e é a próxima parada."
          steps:
            "1":
              title: "Ache o Max Ether de Vermilion"
              text: "Voe até Vermilion e surfe no canal entre os dois prédios ao norte da Trade House. Fique de frente para o topo da fresta e aperte A; nada aparece na tela."
              hidden:
                max-ether: "Vermilion City, a água na fresta entre os prédios ao norte da Trade House. Aperte A de frente para ela; nada aparece na tela."
            "2":
              title: "Suba para a Rota 6"
              text_html: "Saia da cidade pelo portão norte %{north}. A água do outro lado é a Rota 6, e ela tem o único Psyduck do jogo: toda passagem anterior por ali foi a pé."
            "3":
              title: "Capture Psyduck e Golduck"
              text: "Psyduck nada a 94% e Golduck a 6%. Pegue um segundo Golduck se aparecer: Cinnabar troca um pelo BUFFY, o Rhydon, o único que você consegue sem criar um Rhyhorn."
            "4":
              title: "Siga para Celadon"
              text: "Voe até Celadon e vá até a casinha ao norte do Game Corner. O quintal atrás dela é cercado dos dois lados, e um laguinho preenche a única passagem."
            "5":
              title: "Pegue o TM41 Softboiled"
              text_html: "Surfe o laguinho e desça ao lado do funcionário %{man}. O TM41 Softboiled é uma cura que só a Chansey aprende, e esta é a única cópia do jogo."
              items:
                tm41: "Celadon City, o quintal cercado atrás da casa ao norte do Game Corner. Só o Surf chega até ele."
            "6":
              title: "Siga para a Silence Bridge"
              text: "Voe até Lavender e desça para a Rota 12. As tábuas correm pelo meio de água aberta, e o último item atrás do Surf fica na metade norte."
            "7":
              title: "Leve o TM16 Pay Day"
              text: "Surfe a leste das tábuas até a bola no píer isolado. O TM16 Pay Day espalha moedas que caem na sua mochila quando a batalha acaba."
              items:
                tm-pay-day: "Rota 12, o píer na metade norte da Silence Bridge, cercado de água aberta."
            "8":
              title: "Perdeu o Itemfinder? Fica uma rota a oeste"
              text_html: "A Rota 12 abre a oeste %{west} para a Rota 11, uma estrada que ficou fechada atrás do Snorlax até a Flauta. O Ajudante do Oak no portão leste entrega o Itemfinder com 30 espécies capturadas, um número que você passou faz tempo."
              items:
                itemfinder: "Portão leste da Rota 11, no andar de cima. O Ajudante do Oak entrega assim que 30 espécies estiverem registradas."
            "9":
              title: "Compre Ultra Balls para Zapdos"
              text: "A Power Plant é a próxima parada, e Zapdos espera no fundo dela: Nv 50, um encontro, uma chance. Nenhum Mart no caminho vende Ultra Balls, então voe até Fuchsia e abasteça antes."
            "10":
              title: "Saia de Cerulean para leste"
              text_html: "Depois Cerulean, e para fora pela estrada a leste %{east}. A Rota 9 precisa de Cut para atravessar e a Rota 10 depois do Rock Tunnel é toda água, então leve os dois HMs na equipe."
            "11":
              title: "Surfe até a Power Plant"
              text_html: "Surfe ao sul a partir da boca. Um Pokémaniac %{trainer} espera na outra margem, isolado da estrada, e a porta da usina %{door} fica subindo a costa a partir dele."
          oak:
            psyduck: "A água da Rota 6 é o único Psyduck do jogo, e esta é a primeira passagem que consegue chegar nela. Um basta: Golduck nada aqui também."
            golduck: "6% na mesma água, e o único Golduck selvagem que existe. Pegue um segundo se aparecer, porque Cinnabar troca um pelo BUFFY, o Rhydon."
            slowpoke: "A Silence Bridge é a primeira água com Slowpoke que você atravessa com o Surf. Um basta, com Slowbro nos mesmos tiles."
            slowbro: "6% no píer. Todo outro Slowbro fica em água que o guia atravessou antes do HM03, então este é o primeiro que dá para pegar."
        route_19:
          note: "Rota aquática ao sul de Fuchsia. Precisa de Surf."
          intro: "Mar aberto ao sul de Fuchsia, só água depois que você deixa a praia. Dez Swimmers boiam no caminho, e Tentacool é quase tudo o que morde."
          steps:
            "1":
              title: "Abasteça e surfe para fora"
              text: "Reponha as Ultra Balls no Mart de Fuchsia antes de sair e confira se o time leva Surf e Strength: as Seafoam Islands pedem os dois, e o Articuno espera lá no fundo. Depois surfe ao sul pelos Swimmers e Beauties."
            "2":
              title: "Siga para a Rota 20"
              text_html: "Siga ao sul até a praia lá embaixo, que abre a oeste %{west} para a Rota 20 e as Seafoam Islands."
        route_20:
          note: "Metade leste do canal ao sul de Fuchsia. Tentacool, Staryu, Shellder."
          intro: "O longo canal a oeste rumo a Cinnabar, com as Seafoam Islands no meio dele. Uma parede de rocha corta o mapa de cima a baixo ao lado delas, então a caverna embaixo é a única passagem."
          steps:
            "1":
              title: "Surfe a oeste"
              text: "Limpe os Swimmers espalhados pela metade leste da água enquanto surfa a oeste pelo canal rumo às ilhas."
            "2":
              title: "Entre nas ilhas"
              text_html: "As Seafoam Islands quebram a água no meio do caminho, e a caverna passa por baixo delas. Desembarque na ponta sudoeste da ilha e suba até a boca da caverna %{mouth}: o Articuno descansa lá no fundo."
        seafoam_islands:
          note: "Caverna com quebra-cabeça de pedras sob a Rota 20. Articuno selvagem dentro."
          intro: "Cinco andares de caverna marinha, nenhum treinador e correntes que levam você embora até o Strength largar uma pedra no caminho. O Articuno mora no fundo, e a boca oposta abre para Cinnabar."
          steps:
            "1":
              title: "Leve os dois HMs, e conheça o reset"
              text: "Surf cruza as correntes, Strength larga as pedras que as contêm. Entale uma na parede e nada se perde: saia do andar, volte, e as pedras voltam ao lugar. As que já caíram ficam embaixo."
            "2":
              title: "Empurre a primeira pedra no buraco"
              text_html: "Entrando pela boca oeste %{mouth}, siga a nordeste até a câmara do meio. Empurre a pedra dali um quadrado a oeste e quatro ao norte, para dentro do buraco %{hole}. Depois pise nele e caia."
            "3":
              title: "Mande a pedra descer de novo"
              text_html: "Você e a pedra caem no B1F ao lado do próximo buraco %{hole}. Empurre a pedra um quadrado a leste, para dentro dele, e pule atrás dela."
            "4":
              title: "Desça na correnteza até o B4F"
              text_html: "De novo no B2F: um quadrado a leste joga a pedra em %{hole}. Siga atrás e você cai numa água rápida demais para nadar, que leva você direto ao B4F."
            "5":
              title: "Ache o Ultra Ball oculto"
              text: "Quando a corrente soltar você, surfe a leste até a praia pequena. Aperte A virado para a rocha ao sul e um Ultra Ball oculto aparece: guarde para o pássaro que espera ao norte."
              hidden:
                ultra-ball: "B4F, a praia pequena a leste de onde a corrente deixa você. Vire para a rocha ao sul e aperte A. Nada aparece na tela."
            "6":
              title: "Atravesse o platô até a escada"
              text_html: "De volta à água, surfe ao norte e suba no platô. Siga a oeste até o extremo, depois desça ao sul para a câmara abaixo, onde a escada %{ladder} sobe ao B3F."
            "7":
              title: "Desenterre o Max Elixir"
              text: "Descendo da escada no B3F, contorne ao sul e a leste pela borda, desça ao chão de baixo e siga a oeste. Aperte A virado para a rocha solitária ali: um Max Elixir oculto, PP cheio de novo."
              hidden:
                max-elixir: "B3F, a rocha solitária no chão de baixo, abaixo das quatro pedras. Vire para leste e aperte A. Nada aparece na tela."
            "8":
              title: "Tampe o buraco da esquerda"
              text_html: "Quatro pedras e dois buracos ficam ali do seu lado. Empurre a segunda pedra da esquerda três quadrados a oeste, o que libera o caminho até a primeira; empurre essa um quadrado ao sul, no buraco %{hole}."
            "9":
              title: "Tampe o outro"
              text_html: "Agora o par da direita. Empurre a pedra da direita ao norte, para o canto, e leve a da esquerda um quadrado ao sul, dois a oeste e mais um ao sul, para dentro do segundo buraco %{hole}."
            "10":
              title: "Caia atrás das pedras"
              text: "Com os dois buracos tampados, a corrente do B4F morre, então desça por qualquer um deles. Desça antes das pedras e a água só joga você de volta no platô."
            "11":
              title: "Capture o Articuno"
              text: "Surfe ao norte pelo canal e suba no platô lá em cima. O Articuno espera no Nv 50, um encontro e só. Salve antes, faça-o dormir ou paralise, e jogue Ultra Balls."
            "12":
              title: "Suba de volta ao B3F"
              text_html: "Surfe de volta ao sul até a borda que corre a leste das pedras. Siga por ela, suba ao norte até a escada %{ladder} por onde você desceu e volte ao B3F."
            "13":
              title: "Atravesse o B3F até a outra escada"
              text_html: "No platô de novo, contorne até o sul e pegue a outra escada %{ladder} deste andar para subir ao B2F."
            "14":
              title: "Embolse o Nugget oculto"
              text: "Siga a leste pela parede sul do B2F. Aperte A virado para a rocha solitária encostada nela: um Nugget oculto, ¥5000 em qualquer Mart e nenhum outro uso."
              hidden:
                nugget: "B2F, a rocha solitária encostada na parede sul. Vire para leste e aperte A. Nada aparece na tela."
            "15":
              title: "Suba até o B1F"
              text_html: "Suba no platô logo a leste da rocha e siga ao norte pelo andar até a escada %{ladder} no meio dele, que sai no B1F."
            "16":
              title: "De volta ao 1F"
              text_html: "Desça do platô pelo sudoeste, atravesse o andar e suba no platô ao norte. A escada %{ladder} dele leva você de volta ao 1F."
            "17":
              title: "Comece a segunda pedra"
              text_html: "Ande a leste pelo topo do 1F e desça na câmara do lado leste. Empurre a pedra dali dois quadrados a oeste e um ao norte, no buraco %{hole}, e caia atrás dela."
            "18":
              title: "Passe pelo B1F"
              text_html: "Mesma rotina um andar abaixo: um quadrado a leste põe a pedra em %{hole}, e você entra logo atrás."
            "19":
              title: "E pelo B2F"
              text_html: "No B2F o último buraco %{hole} fica a oeste da pedra. Empurre um quadrado para lá, caia atrás, e a corrente do B3F fica sem nada para levar você."
            "20":
              title: "Suba pelo lado leste até o 1F"
              text_html: "Suba no platô do lado leste do B3F e pegue a escada sul %{first}. No B2F a próxima escada %{mid} fica alguns quadrados ao norte; no B1F, %{top} fica a sudoeste dela e sai no 1F."
            "21":
              title: "Saia pela boca leste"
              text_html: "A boca leste %{mouth} está bem ali. Saia no lado oposto da Rota 20, além da parede de rocha que separa as duas metades dela."
          tips:
            articuno: "Um lendário Nv 50 de uma vez só. Salve antes, faça dormir/paralise, e use a Master Ball ou muitas Ultra Balls."
          oak:
            seel: "Uma captura de caverna → Dewgong, um sólido Água/Gelo. Pegue a base."
            articuno: "O lendário de Gelo de Seafoam. Só uma chance. Capture agora."
        route_20_west:
          note: "A metade depois das ilhas. Seis Swimmers, e então Cinnabar."
          intro: "O mesmo canal do outro lado da parede de rocha, alcançado saindo da caverna e não surfando ao redor dela. Seis treinadores daqui até Cinnabar."
          steps:
            "1":
              title: "De volta à água"
              text_html: "Saindo pela boca oposta da caverna %{mouth}, desça até a beira e surfe a oeste. Uma Jr. Trainer boia logo ao lado da ilha, e mais cinco nadadores se espalham pelo canal."
            "2":
              title: "Surfe até Cinnabar"
              text_html: "Siga a oeste passando pelo último deles. O canal abre em Cinnabar Island %{west}, onde o laboratório revive fósseis e o ginásio do Blaine guarda a sétima insígnia."
        power_plant:
          note: "Desvio opcional de Surf. Mons Elétricos, um Muk raro e o Zapdos."
          intro: "Uma usina abandonada saindo da Rota 10, acessível só com Surf. Treze Poké Balls estão no chão e oito delas são Voltorb disfarçados; o Zapdos pousa no fundo."
          steps:
            "1":
              title: "Pegue o Carbos na parede oeste"
              text: "Suba pelo lado esquerdo a partir da porta. Oito das bolas destes andares são Voltorb ou Electrode que acordam e atacam, mas a que fica embaixo na parede oeste é real: um Carbos, aumento de Velocidade."
              items:
                carbos: "Encostado na parede oeste, na parte baixa da usina. De frente para leste para pegar."
            "2":
              title: "Atravesse para o salão das máquinas"
              text: "Suba o corredor acima do nicho do Carbos e siga a leste até o salão das máquinas. Todo ball no caminho é uma batalha disfarçada: dois Voltorb (Nv 40) e um Electrode (Nv 43) que pode dar Selfdestruct."
            "3":
              title: "Tateie o Max Elixir oculto"
              text: "Siga a oeste até o fim da fileira. Fique um quadrado a leste do pequeno bloco de parede e aperte A de frente para oeste. Um Max Elixir oculto está ali, sem nada aparecer na tela."
              hidden:
                max-elixir: "Bem no centro da usina, um quadrado a leste do bloco de parede. Aperte A de frente para oeste; nada aparece na tela."
            "4":
              title: "Pegue o TM33 Reflect"
              text: "Volte do salão e desça pelo lado oeste, passando por mais dois balls de Voltorb. Bem no centro da sala sul, um ball de verdade tem o TM33 (Reflect), que reduz pela metade o dano físico. Pegue de frente para norte."
              items:
                tm-reflect: "Centro da sala sul. De frente para norte para pegar."
            "5":
              title: "Pegue o TM25 Thunder"
              text: "Toque o ball logo a leste do TM, outro Voltorb, depois suba e desça para a sala de baixo. Um ball de verdade ali tem o TM25 (Thunder), o golpe de 110 de poder símbolo da usina. Pegue de frente para leste."
              items:
                tm-thunder: "Sala sul, a leste do centro. De frente para leste para pegar."
            "6":
              title: "Pegue o HP Up lá em cima"
              text: "Vá até o canto sudeste distante pelo último ball de Voltorb, depois suba pelo lado leste até a fileira do topo. À direita do centro há um ball de verdade com um HP Up, que eleva o HP máximo. Pegue de frente para norte."
              items:
                hp-up: "Fileira do topo, a direita do centro. De frente para norte para pegar."
            "7":
              title: "Fisgue o Rare Candy"
              text: "No canto superior direito espera um ball de verdade com um Rare Candy, um nível grátis para qualquer Pokémon. Pegue de frente para oeste."
              items:
                rare-candy: "Canto superior direito. De frente para oeste para pegar."
            "8":
              title: "Tateie o PP Up oculto"
              text: "Varra de volta a oeste pelo topo, pegando o segundo Electrode (Nv 43) no caminho. Perto do topo esquerdo, vá até a parede norte à esquerda do centro e aperte A de frente para norte para achar um PP Up oculto."
              hidden:
                pp-up: "Encostado na parede norte, a esquerda do centro. Aperte A de frente para norte; nada aparece na tela."
            "9":
              title: "Capture o Zapdos"
              text: "O Zapdos (Nv 50) descansa no canto noroeste distante, perto da porta oeste da usina. Salve antes, enfraqueça com Rocha ou Gelo, faça dormir ou paralise, e jogue Ultra Balls. Só há uma chance."
            "10":
              title: "Surfe de volta para a Rota 10"
              text: "Com o Zapdos capturado e a usina saqueada, saia pela porta sul e surfe de volta para a Rota 10. Depois voe até Fuchsia: a Rota 19 desce dali pela água rumo às Ilhas Seafoam."
          tips:
            electrode: "Dois dos balls disfarçados são um Electrode (Nv 43), os únicos do Yellow: ele não aparece em grama alguma. Leve um ball."
            zapdos: "O lendário Elétrico, um Nv 50 estático de uma vez só. Salve antes de tocar nele, depois faça dormir ou paralise e capture."
          oak:
            zapdos: "A ave Elétrica da Power Plant. Só uma chance. Capture enquanto está aqui."
            voltorb: "Por todos os andares (e disfarçado de itens) → Electrode. Pegue um para a dex."
        cinnabar_island:
          mart:
            blurb: "O Mart da ilha traz a prateleira completa do fim de jogo: Ultra Balls, Hyper Potions e Full Heals."
            buy: "Ultra Balls para os spawns raros da Mansion, além de Hyper Potions e Revives para os tipos fogo do Blaine."
          gym:
            intro: "Portas trancadas bloqueiam o caminho até o Blaine, cada uma aberta ao acertar um quiz ou vencer o treinador atrás dela. O Ninetales (Nv 48), o Rapidash (Nv 50) e o Arcanine (Nv 54) dele batem forte e rápido, então leve um atacante de Água, Pedra ou Terra e carregue Burn Heals."
            puzzle:
              "1": "Cada porta faz uma pergunta de sim ou não sobre Pokémon. Acerte e ela abre; erre e você batalha o treinador atrás dela, o que também a abre."
              "2": "Aqui está a resposta de cada porta, na ordem em que você as encontra. Chutar custa só a luta atrás da porta que você errar, então os dois caminhos chegam ao fundo."
              "3": "A última porta se abre para o Blaine. Um único golpe forte de Água, Pedra ou Terra derruba o Ninetales, o Rapidash e o Arcanine dele num piscar."
          note: "Ginásio do Blaine. Volcano Badge. Laboratório de fósseis."
          intro: "Uma ilha vulcânica de uma rua só: um laboratório que revive fósseis, uma mansão incendiada e um ginásio cuja chave está em algum lugar dentro dela."
          trades:
            muk:
              npc: "CIENTISTA"
              title: "Muk"
              where: "A Testing Room do Lab, o cientista lá no fundo"
              note: "Um Muk de nível alto sem grinding. Kangaskhan é uma captura na Zona Safári."
            rhydon:
              npc: "VELHINHO"
              title: "Rhydon"
              where: "A Meeting Room do Lab, o velho junto à parede oeste"
              note: "Um Rhydon trocado chega forte e ganha XP turbinado."
            dewgong:
              npc: "BELDADE"
              title: "Dewgong"
              where: "A Meeting Room do Lab, a Beauty junto ao balcão sul"
              note: "Dewgong por um Growlithe, com o bônus de XP de troca. Growlithe aparece na Mansão Pokémon ao lado."
          steps:
            "1":
              title: "Troque na Meeting Room"
              text_html: "Entre no Lab %{lab} e passe pela primeira porta. Um velho na Meeting Room troca um Rhydon pelo seu Golduck, e uma Beauty um Dewgong por um Growlithe, nenhum dos dois capturável em lugar nenhum."
            "2":
              title: "Pegue o TM35 na R-and-D Room"
              text: "Na porta seguinte, um cientista dá o TM35 de graça. É o único TM da ilha, e Metronome dispara um golpe aleatório a cada turno."
              items:
                tm-metronome: "A R-and-D Room do Lab, com o cientista encostado na parede norte. Fale com ele uma vez."
            "3":
              title: "A Testing Room: fósseis e um Muk"
              text: "A última porta. O cientista que anda por ela revive um fóssil por vez: entregue o de Mt. Moon, saia e volte, depois repita com o Old Amber. O cientista atrás troca um Muk por um Kangaskhan."
            "4":
              title: "Atravesse até a Mansion"
              text_html: "O ginásio do Blaine %{gym} está trancado e a chave fica do outro lado da rua. A Pokémon Mansion %{mansion} queimada guarda a Secret Key, e tudo na ilha depende dela."
          tips:
            omanyte: "Reviva o Helix Fossil aqui → Omanyte, depois Omastar. Um Rocha/Água só assim."
            kabuto: "Reviva o Dome Fossil → Kabuto, depois Kabutops. A outra linha de fóssil."
            aerodactyl: "Reviva o Old Amber (museu de Pewter) → Aerodactyl, um raro Rocha/Voador."
          oak:
            omanyte: "Reviva o fóssil que escolheu no Mt. Moon. Helix → Omanyte."
            kabuto: "Dome Fossil → Kabuto. Só dá para reviver o fóssil que você guardou."
            aerodactyl: "Old Amber do museu de Pewter → Aerodactyl. Registre o único espécime."
        cinnabar_island_return:
          note: "De volta pelo Blaine. Insígnia Volcano e TM38 Fire Blast."
          intro: "A ilha de novo, com a Secret Key na mão. As portas de quiz do ginásio são tudo que separa você da sétima insígnia, e a costa norte abre para a Rota 21 assim que ela for conquistada."
          steps:
            "1":
              title: "Abra o ginásio com a Secret Key"
              text_html: "A chave destranca o ginásio %{gym} do outro lado da rua. Cada porta faz uma pergunta de sim ou não, e errar é uma batalha e não um beco sem saída, então de um jeito ou de outro você chega no Blaine."
            "2":
              title: "Surfe ao norte até Pallet Town"
              text_html: "Se você deixou um fóssil no Lab %{lab}, o Pokémon dele está esperando lá. Depois saia pela costa norte %{north} rumo à Rota 21, a longa água até Pallet Town."
        pokemon_mansion:
          note: "Mansão incendiada. Tipos Fogo e a Secret Key."
          intro: "Quatro andares carbonizados ligados a um único botão que qualquer estátua do lugar aciona. A Secret Key do ginásio do Blaine está lá no fundo, e o diário que dá nome a Mew e Mewtwo está espalhado pelos andares no caminho."
          diary:
            tag: "DIÁRIO DA MANSÃO"
            title: "Quatro páginas, e o único lugar onde Mew é nomeado"
            intro: "Quatro páginas de diário estão espalhadas pelos andares da mansão. Lidas na ordem em que o labirinto leva você até elas, contam a história que o jogo nunca diz em voz alta: uma expedição na Guiana, um Pokémon batizado, um nascimento e uma criatura que a equipe não conseguiu conter. Mew não está neste prédio. O que você acha aqui é a papelada."
            card_alt: "A carta colecionável do Mew, com a linha impressa: New Species Pokémon, Length 1' 4\", Weight 9 lbs."
            art_alt: "Um diário aberto sobre uma mesa, com as páginas escritas na grafia do mundo Pokémon."
            band_kicker: "AS PÁGINAS, EM ORDEM"
            band_title: "Um livro na ficção. Quatro andares no jogo."
            note: "Nenhuma das quatro nomeia quem as escreveu. O diário é o único registro de Mewtwo em toda Kanto, e não tem assinatura."
            pages:
              jul_5:
                date: "5 DE JULHO"
                where: "2F · SALA NORTE"
                quote: "\"Guyana, South America. A new POKéMON was discovered deep in the jungle.\""
                note: "A primeira página que você passa, na sala acima do desembarque do 2F. Nenhum botão fica entre você e ela."
              jul_10:
                date: "10 DE JULHO"
                where: "2F · SUDOESTE"
                quote: "\"We christened the newly discovered POKéMON, MEW.\""
                note: "Atrás do portão que a estátua do 2F abre, o que o trajeto nunca precisa fazer. Cinco dias depois do avistamento, o nome entra no registro."
              feb_6:
                date: "6 DE FEVEREIRO"
                where: "3F · PERTO DA ESCADA"
                quote: "\"MEW gave birth. We named the newborn MEWTWO.\""
                note: "Um tile a oeste da escada do 3F que sobe do 2F e dois abaixo, lida do tile acima dela. As datas cruzam um Ano-Novo aqui: julho, julho, depois fevereiro."
              sep_1:
                date: "1 DE SETEMBRO"
                where: "B1F · ACIMA DO BURGLAR"
                quote: "\"MEWTWO is far too powerful. We have failed to curb its vicious tendencies...\""
                note: "Três tiles ao norte do Burglar, na sala onde espera o TM14. Andar mais fundo, última página, e a frase para no meio do pensamento."
          trivia:
            tag: "BOTÕES"
            title: "Um botão, dois conjuntos de portas"
            intro_html: "Toda estátua aperta o mesmo botão, e os portões estão ligados a ele em dois conjuntos: o que está aberto fecha enquanto o fechado abre. A estátua do 3F %{landing} sela a sala por onde você entrou para abrir o caminho até os buracos; a do B1F %{beds} fecha a volta para a escada para abrir a ala que guarda a Key."
            note: "O Burglar do 2F diz isso sem rodeios depois de perder: os botões abrem e fecham conjuntos alternados de portas."
          steps:
            "1":
              title: "Entre pela porta da frente"
              text_html: "Entre pela porta %{door}. Todo portão da mansão está ligado a um só botão, e as estátuas que o acionam estão espalhadas por quatro andares. A Secret Key espera lá no fundo."
            "2":
              title: "Ache a Moon Stone no salão"
              text: "Suba o salão acarpetado a partir da porta e conte cinco pilares na fileira da direita. Encare esse pilar e aperte A: uma Moon Stone oculta, sem nada aparecer na tela."
              hidden:
                moon-stone: "Salão de entrada do 1F, o quinto pilar da fileira da direita. Encare-o e aperte A. Nada aparece na tela."
            "3":
              title: "Guarde o Escape Rope ao norte"
              text: "Siga além da escada no fim do salão, suba até o corredor norte e vá para leste até a bola. O Escape Rope dela é como você sai daqui depois que a Key for sua."
              items:
                escape-rope: "Corredor norte do 1F, a leste da subida que sai do salão de entrada."
            "4":
              title: "Suba ao 3F em dois lances"
              text_html: "Volte à escada %{up} no fim do salão e suba ao 2F. Você chega ao lado de uma segunda escada %{on} e ela sobe direto ao 3F, então deixe o resto do 2F para depois."
              shots:
                "1_html": "No fim do salão, subindo a escadaria"
                "2_html": "Você chega ao lado do próximo lance, suba por ele"
            "5":
              title: "Puxe conversa para brigar com o Burglar"
              text_html: "Um Burglar %{burglar} anda um passo a sudoeste de onde você chega. Os Burglars daqui nunca desafiam de longe, então chegue perto e fale com ele: a luta só começa assim."
            "6":
              title: "Arranque um Max Revive da rocha"
              text: "A oeste da escada, uma faixa de um tile corre para o norte. Siga até o fim dela, encare a rocha do topo e aperte A: um Max Revive oculto, HP e PP cheios de novo."
              hidden:
                max-revive: "3F, no fim da faixa estreita que corre para o norte no lado oeste. Encare a rocha e aperte A. Nada aparece na tela."
            "7":
              title: "Pegue o Max Potion no canto"
              text_html: "Volte pela faixa e siga até o canto sudoeste do andar, onde uma bola guarda um Max Potion. Depois volte à escada %{down} e desça ao 2F que você pulou."
              items:
                max-potion: "Canto sudoeste do 3F, na sala abaixo da faixa estreita do oeste."
            "8":
              title: "Vença o Burglar da salinha"
              text_html: "Vá para oeste ao sair da escada e desça até a salinha no fim. Fale com o Burglar %{burglar} que espera nela, depois volte por onde entrou."
            "9":
              title: "Atravesse o 2F pelo Calcium"
              text: "Saia de volta e vá para leste pelo meio do andar, depois ao norte até o recanto no extremo nordeste. A bola no fim dele guarda um Calcium, um aumento permanente de Especial."
              items:
                calcium: "Canto nordeste do 2F, no fim do recanto curto que sai das salas do leste."
            "10":
              title: "Suba pela escada noroeste até o Iron"
              text_html: "Atravesse até a sala do canto noroeste e pegue a escada %{up} dela de volta ao 3F. Avance para leste pelas salas até uma bola à mostra: um Iron, um aumento permanente de Defesa."
              items:
                iron: "Lado leste do 3F, à mostra nas salas de cima."
            "11":
              title: "Aperte a estátua e encare o Scientist"
              text_html: "Volte duas salas até a estátua %{statue} e aperte A encarando-a: o caminho de onde você veio fecha, o de baixo abre. Um Scientist %{scientist} guarda a sala que ela abre."
            "12":
              title: "Pule no buraco da esquerda"
              text_html: "Passando o Scientist o piso cede. Dois buracos se abrem nele: o da esquerda %{hole} leva ao 1F, o da direita %{right} só ao 2F. Pegue o da esquerda e caia."
            "13":
              title: "Caia no 1F e vença o Scientist"
              text_html: "Você cai no quarto sudeste isolado do 1F, a parte que nenhuma porta daquele andar alcança. Um Scientist %{scientist} está três tiles ao sul de onde você aterrissa."
            "14":
              title: "Pegue o Carbos e desça ao B1F"
              text_html: "Ao sul dele, entre as duas fileiras de vasos, uma bola guarda um Carbos, um aumento permanente de Velocidade. A escada %{down} logo a leste dela desce ao B1F."
              items:
                carbos: "Quarto sudeste do 1F, entre as duas fileiras de vasos abaixo do Scientist."
            "15":
              title: "Pegue o TM14 (Blizzard)"
              text: "Da escada vá ao norte até o salão, siga para oeste por ele e desça para a sala de baixo. O TM14 está no canto sudeste dela: Blizzard, 120 de poder de Gelo em cinco PP."
              items:
                tm-blizzard: "Canto sudeste da sala do meio do B1F, ao lado de uma estátua."
            "16":
              title: "Aperte a estátua e vença o Burglar"
              text_html: "Uma estátua %{statue} fica bem ao lado dessa bola. Aperte A encarando-a e as portas da sala trocam: a passagem norte fecha, a oeste abre. Pegue o Burglar %{burglar} acima na saída."
            "17":
              title: "Siga a porta nova até o Full Restore"
              text: "Saia pela porta oeste e vá reto pelo corredor que ela abriu, até o fim de tudo. A bola de lá guarda um Full Restore: todo o HP de volta mais qualquer status curado."
              items:
                full-restore: "Extremo sudoeste do B1F, no fim do corredor a oeste da sala do TM14."
            "18":
              title: "Vença o último treinador e acione a estátua"
              text_html: "Volte para leste passando a escada e suba pelo portão destrancado, onde está o último treinador %{scientist} da mansão. Aperte a estátua %{statue} ao lado da primeira cama da sala acima dele: ela libera o corredor de cima para oeste."
            "19":
              title: "Desvie ao norte por um Rare Candy"
              text: "Vá para oeste por esse corredor e entre na primeira sala ao norte. Um Rare Candy está do outro lado dela, um nível de graça para o companheiro que estiver atrasado."
              items:
                rare-candy: "Lado norte do B1F, na sala que sai do corredor de cima, a leste da mesa do TM22."
            "20":
              title: "Pegue o TM22 (SolarBeam)"
              text: "Saia e vá para oeste de novo, até a sala seguinte. O TM22 está sobre a mesa de lá: SolarBeam, 120 de poder de Grama, mas gasta um turno carregando antes de acertar."
              items:
                tm-solarbeam: "Sala noroeste do B1F, sobre a mesa."
            "21":
              title: "Pegue a Secret Key"
              text: "Desça dessa sala para a de baixo, onde uma bola guarda a Secret Key. É o motivo de toda a visita: nada mais no jogo abre o ginásio do Blaine."
              items:
                secret-key: "Ala oeste do B1F, na sala abaixo da mesa do TM22."
            "22":
              title: "Desenterre um segundo Rare Candy do canto"
              text: "Antes de sair, vá ao canto noroeste dessa sala, fique um tile abaixo do quadrado do topo e aperte A virado para cima. Um segundo Rare Candy aparece, sem nada na tela."
              hidden:
                rare-candy: "Canto noroeste da sala da Secret Key no B1F. Fique um tile abaixo do quadrado do topo, vire para cima e aperte A. Nada aparece na tela."
            "23":
              title: "Saia de corda e atravesse até o Blaine"
              text: "Use aquele Escape Rope, ou Dig, e você volta a Cinnabar num segundo. Sair andando significa acionar as duas estátuas do subsolo de novo, então gaste a corda e vá ao ginásio."
          tips:
            growlithe: "O outro cão de Fogo, na mesma mansão → Arcanine com uma Fire Stone."
          oak:
            vulpix: "Selvagem aqui no Yellow (senão só por troca) → Ninetales. Pegue um."
            growlithe: "Também selvagem aqui → Arcanine com uma Fire Stone. Registre a base."
            magmar: "Uma captura rara da mansão. Um atacante de Fogo forte. Garanta um."
        route_21:
          note: "Rota aquática de volta a Pallet. Pesca e um trecho de grama perto de Pallet."
          intro: "O mar entre Cinnabar e Pallet, com nove Swimmers e Pescadores espalhados. Uma faixa de grama do lado de Pallet é a única terra firme da rota."
          steps:
            "1":
              title: "Surfe ao norte rumo a Pallet"
              text: "De Cinnabar, surfe ao norte pelo canal, limpando os Swimmers no caminho. Tentacool enche o mar aberto."
            "2":
              title: "Pesque e varra a grama"
              text: "Use o Super Rod na água por Magikarp, Goldeen, Shellder e Staryu, e cheque a grama ao sul de Pallet por Pidgey, Rattata e seus evoluídos. Depois desembarque em Pallet Town."
          tips:
            magikarp: "Pesque um aqui e suba até o Nv 20; ele vira Gyarados, um dos tipos Água mais fortes do jogo."
            goldeen: "Uma captura confiável de Super Rod → Seaking. Um lugar fácil para registrar a linha."
          oak:
            magikarp: "Super Rod aqui → Gyarados. Fraco agora, monstruoso depois de evoluir."
            goldeen: "Pesque um → Seaking. Registre a base já que está pescando mesmo."
        pallet_town_return:
          note: "Chegada pela Rota 21. Direto, ao norte rumo a Viridian."
          intro: "Onde a jornada começou, e o último ponto dela sem nada para pegar. A Rota 21 te devolve à praia sul, a uma estrada do ginásio que está trancado desde a etapa 2."
          steps:
            "1":
              title: "Voe ao norte, ou ande pela Rota 1"
              text_html: "Nada mudou na cidade. Voe direto para Viridian, ou saia pela estrada norte %{north} e suba a Rota 1 a pé. O alvo é o ginásio que ficou fechado o jogo inteiro."
        viridian_city_return:
          mart:
            blurb: "Os mesmos cinco itens que ela vendia antes da Rota 1. Quarenta paradas depois, nada foi acrescentado: este é o último balcão antes da Victory Road, e é uma prateleira de curas de status."
            buy: "Antidote cobre o Toxic da Agatha e Parlyz Heal o Thunder Wave do Dragonair do Lance. Full Restore não se vende aqui, então traga os seus de Celadon ou Fuchsia."
          note: "O ginásio enfim abre. Último balcão antes da Victory Road."
          intro: "Sete insígnias na maleta, que é exatamente o que o ginásio no canto nordeste esperava. O Centro e o Mercado são as únicas outras paradas, e ambas já foram feitas na etapa 2."
          steps:
            "1":
              title: "Cure-se e entre no Ginásio"
              text_html: "Reabasteça no Poke Center %{center} e compre o que o Mercado ainda vale, porque lá dentro não há cura. Depois entre no Ginásio %{gym} a nordeste: com sete insígnias a porta enfim abre."
        viridian_gym:
          gym:
            intro: "O último ginásio de Kanto, um labirinto de plataformas giratórias com oito treinadores. O Giovanni espera no topo com Dugtrio (Nv 50), Persian (Nv 53), Nidoqueen (Nv 53), Nidoking (Nv 55) e Rhydon (Nv 55). O Fissure do Dugtrio e o Horn Drill do Rhydon são nocautes de um golpe, então seja mais rápido que eles e leve Água, Grama ou Gelo."
          note: "Ginásio do Giovanni. Earth Badge. A 8ª insígnia."
          intro: "O ginásio que ficou fechado o jogo inteiro. Quem manda nele é o Giovanni, com oito treinadores e um piso de setas que te empurram por trajetos fixos. Os empurrões só vão num sentido e os treinadores bloqueiam os corredores, então uma ordem só limpa o andar de uma vez."
          steps:
            "1":
              title: "Deslize a oeste até o Tamer"
              text_html: "Entre pela porta e ande dois passos a oeste, depois um ao norte para a fileira de cima. A seta ali te lança seis casas a oeste; siga por essa fileira e o Tamer %{tamer} te desafia."
            "2":
              title: "Suba a parede oeste até o Blackbelt"
              text_html: "Volte para a fileira de baixo e siga até o canto oposto. Pise ao norte na seta e ela te dispara oito casas parede acima, bem na linha de visão do Blackbelt %{blackbelt}."
            "3":
              title: "Dois deslizes até a câmara central"
              text_html: "Uma fileira ao norte, depois a leste na seta que te joga corredor abaixo. Pise a leste de novo para cruzar o piso, e suba ao norte até a câmara central, onde um Cooltrainer %{cooltrainer} te vê."
            "4":
              title: "Atravesse a câmara da direita para a esquerda"
              text_html: "Suba uma fileira e siga a oeste. O Blackbelt %{blackbelt} vigia a coluna seguinte e o Tamer %{tamer} a de depois, então dois passos a oeste pegam os dois."
            "5":
              title: "Saia da câmara até o segundo Cooltrainer"
              text_html: "Suba por essa coluna, siga a leste pela parede de cima da câmara e depois suba pelo lado leste. Vire a oeste na fileira do topo e o Cooltrainer %{cooltrainer} que está nela te desafia."
            "6":
              title: "A oeste até o Blackbelt, que vem até você"
              text_html: "Suba uma fileira e vá a oeste, depois desça e siga a oeste de novo até o pé da coluna aberta. O Blackbelt %{blackbelt} no topo dela desce para lutar e fica ali, fechando a coluna atrás dele."
            "7":
              title: "De volta a leste pelo Revive"
              text: "Refaça a fileira a leste e desça pelo lado leste até o nicho na parede de cima da câmara. A bola nele guarda um Revive, a única coisa para pegar neste andar."
              items:
                revive: "O nicho no canto nordeste da câmara central. A casa abaixo da bola é uma seta de volta à entrada."
            "8":
              title: "Deslize para fora e suba a parede leste"
              text: "Pise na seta abaixo da bola e ela te devolve perto da entrada. Ande a leste até a parede do fundo e suba por ela, depois pise na seta do topo: ela te dispara a oeste pela fileira de cima."
            "9":
              title: "Pela passagem que ele abriu, a oeste até o último Cooltrainer"
              text_html: "O empurrão termina ao lado da passagem que o Blackbelt deixou. Entre por ela, siga a oeste pela fileira do topo e desça três casas até o corredor. O último Cooltrainer %{cooltrainer} está na brecha abaixo do fim dele, de costas: aperte A."
            "10":
              title: "A oeste até a sala do Giovanni"
              text_html: "Siga a oeste por esse corredor. A ponta dele é a única porta da sala do canto, e o Giovanni %{giovanni} te vê no instante em que você sobe a coluna até ele."
            "11":
              title: "Rumo à Rota 22"
              text: "Com a Insígnia Earth e as oito em mãos, saia pela porta em que entrou. A estrada a oeste da cidade é a última antes da Liga, e o Blue espera nela."
        route_22_return:
          rival_note_html: "A última vaga é a evolução que o Eevee dele virou, desenhada aqui como Jolteon; em outros saves é Flareon ou Vaporeon, e as duas vagas acima mudam junto. <a href=\"%{href}\">A receita do Eevee</a> lá na etapa 1 diz qual delas você entregou."
          note: "A estrada a oeste, e a última luta do Blue antes da Liga."
          intro: "O mesmo beco sem saída que você cruzou por Mankey e Nidoran, quarenta paradas atrás. O portão do fim agora lê sua maleta e te deixa passar, e o Blue espera na estrada em frente com seis."
          steps:
            "1":
              title: "A oeste para fora de Viridian"
              text_html: "Saia da cidade pela estrada oeste %{east} e siga a Rota 22 até a água. Não há nada para pegar aqui nem nada que valha capturar: a grama continua no Nv 2-6 da etapa 2."
            "2":
              title: "Vença o Blue, seis contra seis"
              text_html: "Ele te para na mesma pedra da primeira vez. Sandslash (Nv 47), Exeggcute (Nv 45), Kadabra (Nv 50) e a evolução do Eevee (Nv 53) são fixos; dois entre Ninetales, Cloyster e Magneton completam o time."
            "3":
              title: "Pelo portão até a Rota 23"
              text_html: "Siga a oeste até o portão %{gate}. O guarda confere as oito insígnias, e depois dele a estrada ao norte %{north} sobe para a Rota 23 e a Victory Road."
        victory_road:
          note: "O portão da Liga. Quatro botões de pedra e o Moltres."
          intro: "Três andares costurados por quatro botões de chão, cada um preso por uma pedra que você empurra até ele. Pise na Rota 23 de novo e as barreiras do 2F e do 3F voltam todas, então suba de uma vez."
          steps:
            "1":
              title: "Entre com Strength na mão"
              text_html: "A Victory Road só abre com as oito insígnias. Entre pela boca sul %{door}. Quatro botões de chão travam a subida e cada um precisa de uma pedra em cima, então traga Strength."
            "2":
              title: "Leve a primeira pedra ao botão"
              text: "Uma pedra está a noroeste da boca. Empurre para baixo até a fileira do fundo, para leste até a parede, depois para cima pelo lado leste e sobre o botão, que abaixa a barreira do planalto."
            "3":
              title: "Suba ao planalto"
              text: "Volte até onde a pedra estava e suba os degraus. Atravesse a nordeste pela passagem que o botão abriu, desça os degraus do outro lado e siga o caminho até uma segunda pedra."
            "4":
              title: "Libere o Rare Candy"
              text: "Empurre essa pedra para oeste pelo corredor e depois um empurrão ao norte, para dentro do braço curto. Isso abre o caminho até a bola da esquerda, um Rare Candy, e tranca a de cima atrás da pedra."
              items:
                rare-candy: "1F, ponta oeste do corredor de cima, livre assim que a pedra sai da faixa para o norte."
            "5":
              title: "Reinicie e pegue o TM43 Sky Attack"
              text_html: "Saia %{door} e volte, o que devolve toda pedra ao lugar de origem. Desta vez empurre um quadrado a mais para oeste, deixando o braço curto livre, e a bola no topo guarda o TM43 Sky Attack."
              items:
                tm-sky-attack: "1F, no braço curto acima do corredor de cima, livre só enquanto a pedra fica a oeste dele."
            "6":
              title: "Vença os dois Cooltrainers e suba"
              text_html: "De volta ao planalto, siga a oeste até a Cooltrainer %{first}, virada para leste. Desça os degraus ao lado dela e contorne a noroeste até o Cooltrainer %{second}; a escada %{up} além dele é a única subida do 1F."
            "7":
              title: "Chegue ao 2F e acione o segundo botão"
              text: "A escada deixa você colado na parede oeste do 2F. A pedra espera poucos passos ao sul: um empurrão a oeste, dois ao sul e dois a oeste a põem no botão e levantam a barreira acima."
            "8":
              title: "Vença o Blackbelt"
              text_html: "Volte a nordeste até os degraus e suba ao planalto, depois siga a leste pela passagem que o botão acabou de abrir. O Blackbelt %{blackbelt} está no meio dela, virado para oeste."
            "9":
              title: "Pegue o TM05 Mega Kick"
              text: "Continue a leste e desça pelo pescoço do planalto até os degraus no pé dele. Siga o corredor de baixo para oeste e suba o bolsão no fim dele pelo TM05 Mega Kick, 120 de poder com pontaria ruim."
              items:
                tm-mega-kick: "2F, no fundo do bolsão em que o corredor sul desemboca."
            "10":
              title: "Vença o Juggler do planalto"
              text_html: "Volte pelos degraus e siga a leste pelo planalto até o Juggler %{juggler}. A barreira além dele obedece a um botão fora do seu alcance por enquanto, então deixe para lá e contorne."
            "11":
              title: "Vença o Tamer e pegue o Full Heal"
              text_html: "Saia do planalto e siga o caminho de baixo a leste, contornando de volta a noroeste. Passe reto pela escada por ora e enfrente o Tamer %{tamer}; a bola ao lado dele guarda um Full Heal."
              items:
                full-heal: "2F, a um passo do Tamer, no meio do andar."
            "12":
              title: "Vença o Juggler e pegue o TM17"
              text_html: "Suba para fora do bolsão, pelo canto oeste dele e a leste pela fileira de cima até o segundo Juggler %{juggler}. Depois dele uma bola guarda o TM17 Submission, o golpe Lutador mais forte que uma TM ensina."
              items:
                tm-submission: "2F, canto nordeste, poucos passos além do segundo Juggler."
            "13":
              title: "Suba a escada até o 3F"
              text_html: "Volte até a escada %{up} por que passou reto e suba. É a primeira de quatro escadas ligando 2F e 3F, e você vai usar todas elas antes de sair."
            "14":
              title: "Vença o Cooltrainer e pegue o Max Revive"
              text_html: "Vá ao norte e a leste ao sair da escada, depois ao sul, para dentro da alcova pequena. O Cooltrainer %{cooltrainer} lá dentro guarda um Max Revive, que traz um Pokémon desmaiado de volta com HP cheio."
              items:
                max-revive: "3F, na alcova da parede leste, atrás do Cooltrainer."
            "15":
              title: "Leve a pedra longa para oeste"
              text: "Empurre a pedra ao lado da alcova só uma fileira para cima: colada na parede norte não sobra onde ficar para empurrá-la ao sul de novo. Depois a oeste pelo topo, para baixo pela fresta e até o botão."
            "16":
              title: "Pegue o TM47 Explosion"
              text: "A coluna por onde a pedra desceu segue ao sul até uma fenda de um quadrado. A bola nela guarda o TM47 Explosion, 170 de poder que corta a Defesa do alvo pela metade e desmaia o usuário."
              items:
                tm-explosion: "3F, no pé da coluna estreita do lado oeste, de um quadrado de largura."
            "17":
              title: "Desça de volta ao 2F"
              text_html: "Esse botão abre a barreira do planalto que você cruza mais tarde. Por ora pegue a escada %{down} do canto noroeste até o 2F, no canto onde o Moltres pousa."
            "18":
              title: "Vença o Pokémaniac e ache a Ultra Ball"
              text_html: "Você chega no canto noroeste do 2F. O Pokémaniac %{pokemaniac} está a poucos passos à sua direita. Pressione A de frente para a rocha solitária ao lado dele para uma Ultra Ball escondida."
              hidden:
                ultra-ball: "2F, a rocha solitária ao lado do Pokémaniac. Pressione A de frente para ela; nada aparece na tela."
            "19":
              title: "Pegue o Guard Spec."
              text: "A nordeste do Pokémaniac, colada na parede de cima, uma bola guarda um Guard Spec. Um uso bloqueia quedas de atributo pelo resto da batalha, o que vale guardar para a Lorelei."
              items:
                guard-spec: "2F, colado na parede de cima, a nordeste do canto do Pokémaniac."
            "20":
              title: "Capture o Moltres"
              text_html: "Um pouco ao sul, o Moltres %{moltres} está pousado no Nv 50. Salve antes. Enfraqueça com Água, Elétrico ou Rocha, faça dormir e jogue Ultra Balls. Você tem só uma chance."
            "21":
              title: "Volte ao 3F pela próxima Cooltrainer"
              text_html: "Suba a escada %{up} de novo. Vá a leste contornando o planalto até os degraus na ponta dele, depois volte a oeste pelo alto até a Cooltrainer %{cooltrainer}."
            "22":
              title: "Vença os dois últimos Cooltrainers"
              text_html: "Siga a oeste, desça a coluna e passe pela abertura que o terceiro botão liberou, saindo pelos degraus do oeste. O Cooltrainer %{cooltrainer} espera embaixo, com a última %{last} ao lado dele."
            "23":
              title: "Empurre a pedra pelo buraco"
              text_html: "Vá a leste pelo fundo do andar até a última pedra e empurre um quadrado a leste, para dentro do buraco %{hole}. Depois pise no buraco você mesmo e caia."
            "24":
              title: "Leve a pedra ao quarto botão"
              text: "Você cai no corredor sul do 2F com a pedra ao lado. Contorne a pedra e empurre por todo o comprimento do corredor até o oeste, sobre o último botão, que libera a barreira junto às escadas."
            "25":
              title: "Suba e cruze até a escada leste"
              text_html: "Suba os degraus até o planalto, atravesse a leste pela barreira liberada e suba a escada %{up}. No 3F caminhe ao norte até a escada %{down} e desça direto de volta ao 2F."
              shots:
                "1_html": "A leste pela barreira liberada, subindo a escada %{up}"
                "2_html": "Ao norte até a escada %{down}, descendo direto"
            "26":
              title: "Revista a rocha e saia"
              text_html: "Desça da escada e pressione A encarando a rocha ao lado dela para um Full Restore escondido, depois saia pela boca leste %{out}. Se a Liga preocupa você, a tabela selvagem do 3F é o melhor treino do Yellow."
              hidden:
                full-restore: "2F, a rocha logo a oeste da escada leste. Pressione A de frente para ela; nada aparece na tela."
          tips:
            moltres: "O lendário de Fogo da Victory Road. Um Nv 50 de uma vez só. Salve antes, depois enfraqueça e capture."
          oak:
            moltres: "A ave de Fogo pousada na Victory Road. Só uma chance. Capture ao passar."
        route_23:
          note: "Checkpoints de insígnias até a Liga. Grama de nível alto."
          intro: "A subida até a Liga cheia de portões, uma fila de postos onde cada guarda pede mais uma insígnia. Os selvagens dela são os mais fortes fora da Cerulean Cave."
          steps:
            "1":
              title: "Entre pelo portão da Rota 22"
              text_html: "Entre pelo sul %{gate}, saindo do portão da Rota 22. Sete guaritas guardam a estrada, e cada uma só abre com a insígnia certa, então você precisa das 8. A grama é de Nv 33 a 45."
            "2":
              title: "Vasculhe a ilhota no meio do canal"
              text: "Depois dos guardas de baixo a estrada abre num canal largo. Surfe ao norte até a ilhota seca entre os dois Swimmers e aperte A virado para o norte para um Max Ether escondido."
              hidden:
                max-ether: "Na pequena ilhota seca no meio da água, entre os dois Swimmers. Aperte A virado para o norte. Nada aparece na tela."
            "3":
              title: "Varra o canto nordeste"
              text: "Surfe até a margem norte e corte para leste pela grama, entrando no bolsão do canto. Vá até a parede mais distante e aperte A contra a borda leste para pegar uma Ultra Ball escondida. Nada aparece na tela."
              hidden:
                ultra-ball: "No canto nordeste do bolsão de grama logo depois da água, colado na parede leste. Aperte A virado para o leste. Nada aparece na tela."
            "4":
              title: "Revire a clareira do topo"
              text: "Suba pelo labirinto de terra até a clareira gramada perto do extremo norte. Fique na grama e aperte A contra a parede de rocha a oeste para desenterrar um Full Restore escondido. Nada aparece na tela."
              hidden:
                full-restore: "Na grama perto do topo da rota, um quadrado a leste da parede de rocha. Aperte A virado para o oeste. Nada aparece na tela."
            "5":
              title: "Entre na Victory Road"
              text_html: "Siga pelo lado oeste para cima, passe pelo último guarda e atravesse o portão no topo %{victory} até a Victory Road, a última caverna antes da Liga Pokémon."
        indigo_plateau:
          note: "A Pokémon League. Elite dos Quatro e o Campeão Blue."
          intro: "O prédio da Liga: cinco salas em fila, a Elite dos Quatro e depois o Campeão. Assim que a primeira porta fecha não há volta nem nada para curar."
          steps:
            "1":
              title: "Siga em frente"
              text: "Não há nada para resolver aqui. Vencer o treinador de uma sala abre a porta seguinte, então siga andando: Lorelei, Bruno, Agatha, Lance e então Blue. Compre e cure no saguão antes da primeira porta."
            "2":
              title: "Volte de Fly para a última caverna"
              text_html: "Os créditos abriram mais uma porta. Voe até Cerulean, retire seis Pokémon fortes com Surf e Dig entre eles e pegue <a href=\"%{href}\">o caminho de água até a Cerulean Cave</a>, onde Mewtwo espera no Nv 70."
          league:
            brief:
              level:
                label: "RECOMENDADO"
                value: "Nv 55 a 62"
                note: "Seis no time, um deles uma parede de Água ou Psíquico"
              pack:
                label: "MOCHILA"
                value: "20 Full Restores"
                note: "Mais Revives, Awakenings e Full Heals para a Agatha"
              rule:
                label: "REGRA DURA"
                value: "Sem Centro Pokémon"
                note: "Saia do corredor e cada sala que você limpou estará esperando de novo"
              cleared:
                label: "VENCIDOS"
                note: "Toque na placa quando vencer"
            members:
              lorelei:
                eyebrow: "SALA 01 · PRIMEIRA PORTA"
                heading: "Lorelei, a parede de gelo"
                rail: "GELO · SALA 01"
                kicker: "ELITE DOS QUATRO · 01"
                spread: "Nv 53 a 56 · cinco Pokémon · Água e Gelo"
                line: "Ela prefere te cansar a te derrubar. Blizzard congela 30% das vezes nesta geração, então cada turno que você passa com pouco HP na frente dela é cara ou coroa com a run inteira."
                counter: "Thunderbolt ou Thunder resolve quatro dos cinco. Guarde um golpe de Fogo para a Jynx. Não abra com um tipo Planta contra Blizzard, e cure antes de cair da metade, não depois."
                door: "Vencer a Lorelei abre a porta da sala 2."
              bruno:
                eyebrow: "SALA 02 · SEGUNDA PORTA"
                heading: "Bruno, a sala barata"
                rail: "LUTADOR · SALA 02"
                kicker: "ELITE DOS QUATRO · 02"
                spread: "Nv 53 a 58 · cinco Pokémon · Lutador e Rocha"
                line: "Três pesos pesados com dois Onix de enchimento. Esta é a sala em que você deve gastar menos itens, porque a próxima vai pedir todos eles."
                counter: "Psychic nos três lutadores, Surf ou Mega Drain nos dois Onix. Slowbro ou Starmie dão conta da sala sozinhos. Não segure o Submission do Machamp com um tipo Normal."
                door: "Vencer o Bruno abre a porta da sala 3."
              agatha:
                eyebrow: "SALA 03 · TERCEIRA PORTA"
                heading: "Agatha, a que acaba com runs"
                rail: "FANTASMA · SALA 03"
                kicker: "ELITE DOS QUATRO · 03"
                spread: "Nv 55 a 60 · cinco Pokémon · Fantasma e Veneno"
                line: "A sala que realmente acaba com runs. O Gengar de abertura usa Hypnosis e Confuse Ray, e adora botar seu time inteiro para dormir antes de causar um ponto de dano."
                counter: "Psychic pega todos os cinco por causa do tipo Veneno, e Terrestre resolve o Arbok. Golpes Normais e Lutadores não fazem nada contra Gengar e Haunter. Awakenings e Full Heals são gastos aqui."
                door: "Vencer a Agatha abre a porta da sala 4."
              lance:
                eyebrow: "SALA 04 · ÚLTIMA PORTA"
                heading: "Lance, o líder dos quatro"
                rail: "DRAGÃO · SALA 04"
                kicker: "ELITE DOS QUATRO · 04"
                spread: "Nv 56 a 62 · cinco Pokémon · Dragão no papel"
                line: "Só três dos cinco são realmente Dragões, e os dois que não são batem mais forte. O Gyarados abre, o Aerodactyl é mais rápido que quase todo time, e o Dragonite de Nv 62 fecha o corredor."
                counter: "Ice Beam nos dois Dragonair e no Dragonite, Thunderbolt no Gyarados, cobertura de Rocha ou Elétrico para o Aerodactyl. Lapras segura quase tudo aqui. Guarde dois Revives."
                door: "Vencer o Lance abre a sala do Campeão. Não há ponto de save depois dessa porta."
            champion:
              eyebrow: "SALA 05 · SALA DO CAMPEÃO"
              heading: "Blue, e ele chegou primeiro"
              ribbon: "BATALHA FINAL · 05"
              stamp: "LIGA VENCIDA ✓"
              sub: "SEIS POKÉMON · TIPOS MISTOS · SEM FRAQUEZA EM COMUM"
              line: "Ele entrou minutos antes de você. Seis Pokémon em vez de cinco, nada que você derrube com um golpe só, e três das vagas decididas lá atrás pelas suas duas primeiras batalhas contra ele."
              screen_label: "O QUE VOCÊ VÊ DE FATO"
              screen_note: "O Campeão luta com um sprite próprio, não com o que você vem vencendo desde Pallet."
              variant_label: "VARIANTE DO EEVEE · ESCOLHA A SUA"
              rules:
                jolteon: "Você enfrenta o Jolteon se venceu ele no laboratório do Oak e venceu de novo na Rota 22."
                flareon: "Você enfrenta o Flareon se venceu ele no laboratório do Oak e depois pulou ou perdeu a revanche da Rota 22."
                vaporeon: "Você enfrenta o Vaporeon se perdeu no laboratório do Oak. Aí o resultado da Rota 22 não conta para nada."
              warn_label: "LEIA ISTO"
              warn: "O Alakazam é mais rápido que quase tudo que você tem, e o ace dele está no Nv 65. Divida os itens por sala na ida: pouco no Bruno, muito na Agatha, e o que sobrar vem para cá."
              hof_label: "HALL DA FAMA"
              hof: "Vença ele e os créditos sobem. Seus seis são registrados, e então você acorda em Pallet com a Pokédex ainda incompleta."
              seal_todo: "A CADEIRA AINDA É DELE"
              seal_todo_note: "Toque para carimbar sua entrada"
              seal_done: "CAMPEÃO ✓"
              seal_done_note: "Liga vencida. Toque para desfazer."
            after:
              eyebrow: "DEPOIS DOS CRÉDITOS"
              heading: "Você zerou o jogo"
              kicker: "LIGA VENCIDA"
              title: "Parabéns, Campeão"
              lead: "O Oak entra, seus seis são fotografados no Hall da Fama, os créditos sobem e você acorda na sua própria cama em Pallet. Mas o arquivo não acabou. Kanto abre de verdade agora, e a Pokédex continua sendo o final de verdade."
              art_alt: "Red e Blue com seus times, ilustração de Ken Sugimori de 1997"
              tiles:
                open:
                  label: "AGORA ABERTO"
                  value: "Cerulean Cave, a noroeste de Cerulean City. O Mewtwo espera sozinho no último andar, no Nv 70."
                rematch:
                  label: "REVANCHES"
                  value: "A Liga reinicia toda vez que você volta voando, nos mesmos níveis. É o melhor dinheiro e a melhor experiência do jogo."
                missing:
                  label: "AINDA FALTA"
                  value: "As evoluções por troca e os exclusivos de versão. Veja no tracker o que o seu arquivo ainda deve ao Oak."
        route_4_return:
          note: "A travessia até a porta da caverna, e o último treinador de Kanto."
          intro: "A porta da caverna dá para uma faixa de areia sem nenhuma estrada até ela, então o caminho de entrada é o rio da Nugget Bridge. Essa areia segue a oeste até o único platô da Rota 4 que os desníveis nunca deixam você subir."
          steps:
            "1":
              title: "Surfe para o sul ao lado da Nugget Bridge"
              text_html: "Saia de Cerulean para o norte na Rota 24 %{south} e desvie da estrada para oeste, para a grama ao lado do rio. Desça pela coluna oeste da faixa, fora do alcance do Jr. Trainer, e use Surf na ponta."
            "2":
              title: "Desça o rio até a areia"
              text_html: "O rio corre para o sul até o lago noroeste da cidade. Acompanhe a água pela borda oeste de Cerulean e desembarque embaixo da boca da caverna %{mouth}. Deixe a porta para depois; ainda há um treinador de pé, a oeste dela."
            "3":
              title: "Vá a oeste pelo último treinador"
              text_html: "Da areia, siga a oeste e a tela rola para o platô superior da Rota 4. A Lass %{lass} parada ali é o único treinador de Kanto que os desníveis de mão única mantiveram longe de você."
            "4":
              title: "Entre pela porta da caverna"
              text_html: "Volte a leste pelo platô e desça para a areia. Com a Liga vencida o homem que guardava a porta sumiu, então entre direto na <a href=\"%{href}\">Cerulean Cave</a> %{mouth}."
        cerulean_cave:
          note: "Masmorra pós-jogo. Os selvagens mais fortes. E o Mewtwo."
          intro: "A caverna que o guarda só abre para um Campeão. Três andares com os Pokémon selvagens mais fortes de Kanto, e o Mewtwo sozinho no fundo."
          steps:
            "1":
              title: "Entre pela boca da caverna"
              text_html: "Da areia para dentro, pela boca da caverna %{mouth}. O 1F abre numa câmara sul alagada que você cruza de Surf, e os selvagens mais fortes de Kanto vivem aqui, de Nv 45 a 65."
            "2":
              title: "Surfe a oeste até a brecha norte"
              text: "Desça a saliência até a água e surfe para oeste pelo fundo do andar. Fique de olho na margem norte: uma única casa dela abre numa passagem, e é ali que você desembarca."
              shots:
                "1_html": "Descendo da saliência direto para a água"
                "2_html": "A única casa de margem que abre ao norte"
            "3":
              title: "Siga a passagem até o fim"
              text: "A passagem corre algumas casas ao norte e para. Um Max Elixir espera no fim dela, o único prêmio deste lado do 1F."
              items:
                max-elixir-7-11: "Centro-oeste do 1F, no fim da passagem de uma casa ao norte da água da entrada."
            "4":
              title: "Suba a escada oeste"
              text_html: "De volta à água, siga a oeste até o chão secar e contorne a margem até a escada %{up}. Ela sobe ao 2F, um labirinto de rocha sem nenhuma água."
            "5":
              title: "Pegue a bola do beco"
              text: "Avance a nordeste pelos corredores e vá a leste no cruzamento. A passagem termina num beco sem saída com uma Ultra Ball parada nele."
              items:
                ultra-ball-16-7: "Centro do 2F, no beco a leste do primeiro cruzamento."
            "6":
              title: "Aperte A na pedra solitária"
              text: "Volte ao cruzamento e desça pelo labirinto até uma pedra solitária ficar sozinha a leste de você. Aperte A de frente para ela e ache um PP Up escondido; nada aparece na tela."
              hidden:
                pp-up-16-13: "Centro-sul do 2F, a pedra solitária a leste do caminho. Aperte A; nada aparece na tela."
            "7":
              title: "Contorne até o Max Revive"
              text: "Pegue o caminho sudeste a partir da pedra e siga-o contornando para o norte. Ele volta por cima de você e termina num Max Revive."
              items:
                max-revive-19-11: "Centro-baixo do 2F, no alto da volta a sudeste da pedra solitária."
            "8":
              title: "Desça de volta ao 1F"
              text_html: "Passe pela pedra de novo, siga a leste enquanto o caminho contorna ao sul, e desça no cruzamento. Ele vira ao norte na escada %{down}, que leva de volta ao 1F."
            "9":
              title: "Surfe ao sul pelo Rare Candy"
              text: "Surfe na água ao sul de onde você chega e siga o canal curto até o fim. Um Rare Candy está sozinho no beco, um nível de graça para qualquer um."
              items:
                rare-candy-29-16: "Canto sudeste do 1F, na água ao sul da escada do meio. Surfe até ele."
            "10":
              title: "Tateie a pedra ao lado da escada"
              text_html: "De volta ao chão seco e reto a oeste da escada %{ladder}, uma pedra solitária bloqueia a fileira. Aperte A de frente para ela e ache um PP Up escondido; nada aparece na tela."
              hidden:
                pp-up-18-7: "Centro do 1F, a pedra solitária bem a oeste da escada do meio. Aperte A; nada aparece na tela."
            "11":
              title: "Suba os degraus até a bola norte"
              text: "Pegue os degraus logo ao norte da pedra até o platô e siga por ele até o topo do andar. Uma Ultra Ball está encostada na parede norte."
              items:
                ultra-ball-18-3: "Centro-norte do 1F, contra a parede norte do platô de cima."
            "12":
              title: "Suba pela escada do meio"
              text_html: "Desça do platô, contorne o lado oeste dele e vá ao sul, depois a leste até a escada %{up} no meio do andar. Ao 2F de novo."
            "13":
              title: "Percorra o braço leste"
              text: "Siga o caminho até o cruzamento e vá a leste. O braço corre por um bom tempo antes de acabar, e um Full Restore é o que espera no fim dele."
              items:
                full-restore: "Lado leste do 2F, no fim do longo braço leste do cruzamento."
            "14":
              title: "Contorne até a escada do canto"
              text_html: "Volte ao cruzamento e desça ao sul desta vez. O caminho vai até o canto sudeste do andar, depois vira ao norte e sobe toda a parede leste até a escada %{down}, de volta ao 1F."
            "15":
              title: "Pegue o Max Revive do canto"
              text: "Desça os degraus do platô e siga para sudeste. Um Max Revive está enfiado no canto do fim, o único prêmio deste bolsão do 1F."
              items:
                max-revive-29-9: "Borda leste do 1F, no canto a sudeste da escada nordeste."
            "16":
              title: "A oeste pelo topo do andar"
              text_html: "Volte pelo mesmo caminho, passe pelo platô e siga a oeste pelo topo do andar. O caminho corre bastante e termina na escada %{up}, ao 2F pela última vez."
            "17":
              title: "Cole na parede oeste"
              text: "Pegue o único caminho até o cruzamento, qualquer bifurcação até o próximo, depois vá a oeste até a parede oeste do andar. Um Rare Candy está na ponta sul dela."
              items:
                rare-candy-0-11: "Borda oeste do 2F, colado na parede na ponta sul dela."
            "18":
              title: "Duas descidas até o B1F"
              text_html: "Volte ao norte pela parede oeste até a escada %{down} e desça ao 1F. Você chega num beco curto com a escada %{lower} na outra ponta, e essa vai para o B1F."
              shots:
                "1_html": "Ao norte pela parede oeste até a escada %{down}"
                "2_html": "Poucos passos a oeste, e a escada %{lower} desce ao B1F"
            "19":
              title: "Contorne o topo até o Max Elixir"
              text: "Desça os degraus do platô de chegada, siga o caminho estreito contornando até o cruzamento, depois ao norte e a leste pelo topo do B1F. Um Max Elixir está no fim."
              items:
                max-elixir-15-3: "Centro-norte do B1F, na ponta leste da passagem de cima."
            "20":
              title: "Sonde o entulho à beira da água"
              text: "Volte a oeste e ao sul até a beira da água. Um pedaço de entulho aparece a leste: aperte A de frente para ele e ache um PP Up escondido. Nada aparece na tela."
              hidden:
                pp-up-8-14: "Borda sul do B1F, o entulho a leste da margem de onde você surfa. Aperte A; nada aparece na tela."
            "21":
              title: "Surfe a oeste até o platô baixo"
              text: "Surfe um pouco a oeste e suba os degraus até o platô do canto sudoeste. Duas bolas estão em cima dele, e a da esquerda é uma Ultra Ball."
              items:
                ultra-ball-2-13: "Sudoeste do B1F, no platô baixo acima da água."
              shots:
                "1_html": "A oeste pela água, depois pelos degraus acima"
                "2_html": "A esquerda das duas bolas no platô"
            "22":
              title: "Pegue o vizinho"
              text: "Uma casa a leste dessa Ultra Ball está um Max Revive. Pegue-o antes de voltar para a água."
              items:
                max-revive-3-13: "Sudoeste do B1F, uma casa a leste da Ultra Ball."
            "23":
              title: "A leste e ao norte pela última bola"
              text: "De volta à água, siga a leste e depois ao norte até pisar em terra firme de novo. Suba o platô, desça do outro lado e vá a leste no cruzamento pela última Ultra Ball."
              items:
                ultra-ball-26-1: "Canto nordeste do B1F, a leste do cruzamento depois do platô."
            "24":
              title: "Salve antes da ilha"
              text: "Volte ao cruzamento e desça ao sul por uma rota sinuosa que atravessa água. Ela termina na ilha onde o Mewtwo espera, então salve e cure antes de pisar nela."
            "25":
              title: "Capture o Mewtwo"
              text_html: "O Mewtwo %{mewtwo} está no coração da ilha do sudeste, Nv 70, e abusa de Recover. Faça-o dormir ou paralise, deixe-o baixo e jogue a Master Ball."
            "26":
              title: "Saia pela corda"
              text: "Um Escape Rope ou Dig te deixa no Centro Pokémon onde você curou por último, lá em Cerulean. Sair andando é refazer cada escada. Teleport não funciona dentro da caverna."
          tips:
            mewtwo: "O Pokémon mais forte do jogo, um Nv 70 estático. A Master Ball foi feita para isso. Ou faça dormir e reze."
            lickitung: "O andar de baixo é o único lugar do jogo com um Lickitung selvagem. Se perder aqui, a vaga na dex fica vazia."
          oak:
            mewtwo: "O lendário pós-jogo no fundo da caverna. Guarde a Master Ball para ele."
            chansey: "Bem mais comum aqui que na Safari. Uma ótima captura de EXP no fundo da caverna."
          ending:
            eyebrow: "DEPOIS DO MEWTWO · O FINAL DE VERDADE"
            heading: "Agora você zerou de verdade"
            kicker: "★ CERULEAN CAVE · B1F · A ÚLTIMA PARADA"
            title: "Parabéns, treinador"
            lead: "Oito insígnias, a Elite dos Quatro, seu rival e agora a coisa mais forte de Kanto, dormindo no fundo de uma caverna onde ninguém podia entrar. Não sobrou nada que o jogo peça de você. Daqui em diante a escolha é sua: completar o resto da Pokédex, plugar um cabo e jogar com outra pessoa, ou repetir o corredor da Liga até os seus seis chegarem ao Nv 100."
            art_alt: "Mewtwo, ilustração de Ken Sugimori"
            mew_alt: "Mew, ilustração de Ken Sugimori"
            tags:
              mewtwo: "NÃO CAPTURADO"
              mew: "AINDA FALTA"
            tiles:
              dex:
                label: "COMPLETE A DEX"
                value_html: "O único objetivo que sobrou. O mato, a água e os pontos de pesca que você pulou, o fóssil que ficou na Mansão, os dois prêmios do Game Corner. O <a href=\"%{href}\">tracker</a> lista exatamente o que o seu arquivo ainda deve ao Oak."
              cable:
                label: "CABLE CLUB"
                value: "No andar de cima de qualquer Centro Pokémon. Troque e batalhe com um segundo arquivo ou com um amigo. Machoke, Graveler, Kadabra e Haunter só evoluem por troca, então a dex não fecha sem isso."
              league:
                label: "LIGA EM LOOP"
                value_html: "Voe até <a href=\"%{href}\">Indigo Plateau</a> e os cinco encaram você de novo nos mesmos níveis, quantas vezes você quiser. A melhor experiência e o melhor dinheiro do jogo, até o Nv 100."
              mew:
                label: "O 151º"
                value_html: "Mew não tem encontro legítimo no Yellow. O único jeito de colocá-lo no seu arquivo é o <a href=\"%{href}\">glitch do Mew</a>, e ele é seguro se você seguir a ordem exata."
            label: "FIM DO GUIA"
            shot_alt: "Pikachu com chapéu de festa"
            shot_tag: "FIM"
            shot_caption: "Seu Pikachu tem opiniões sobre isso"
            plate_title: "São todas as paradas, em ordem, feitas."
            plate_text: "%{stops} paradas do seu quarto em Pallet até o fundo da Cerulean Cave. Obrigado por caminhar com a gente. Deixe o tracker aberto, ele continua contando enquanto você preenche as lacunas."
            stamp: "ARQUIVO COMPLETO"
            stamp_line: "%{game} · parada %{n} de %{total} · Cerulean Cave B1F"
