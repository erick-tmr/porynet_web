          lead: "O Mew normalmente só vem de eventos, e Cerulean é o primeiro lugar onde você pode fazer o famoso glitch do Mew para conseguir um no jogo. Você vai precisar avançar quase toda a Rota 24 antes; a gente te lembra quando chegar lá. Se quiser, deixe o Swimmer e a Misty de pé por enquanto."
