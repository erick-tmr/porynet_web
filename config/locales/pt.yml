        title_html: "O Exp. All é <span class=\"pn-xa__hl\">quebrado em silêncio</span>"
        intro: "Vale saber o que ele faz antes de carregá-lo. A Gen 1 paga a divisão em duas passagens e alimenta a segunda com as sobras da primeira, então, a menos que você mantenha um só Pokémon na luta, uma fatia de cada nocaute não vai para ninguém."
        party: "TIME"
        fighters: "EM CAMPO"
        nobody: "ninguém"
