      versions:
        yellow:
          sub: "Special Pikachu Edition"
          what: "Pikachu inicial que anda atrás de você, os três iniciais de Kanto de presente, treinadores no estilo do anime. Toda página traz os contadores do Desafio Oak e da Living Dex."
        red:
          sub: "Bulbasaur / Charmander / Squirtle"
          what: "Encontros exclusivos do Red: Ekans, Oddish, Mankey, Growlithe, Scyther, Electabuzz. Mesma espinha de rota do Yellow, lista de capturas diferente em quase toda parada."
        blue:
          sub: "Bulbasaur / Charmander / Squirtle"
          what: "O espelho do Red: Sandshrew, Vulpix, Meowth, Bellsprout, Pinsir, Magmar. As espécies só de troca também trocam de lado, então o teto de um cartucho sozinho se move junto."
        green:
          sub: "Pocket Monsters Midori · só no Japão"
          what: "Saiu ao lado do Red no Japão e nunca foi localizado. Tem sprites e tabelas de encontro próprios, então pede uma roteirização inteira, não uma nota de rodapé no Red."
        yellow-legacy:
          sub: "Patch de fã · feito sobre o Yellow"
          what: "Os 151 obteníveis em um cartucho só: evoluções por troca e exclusivos de versão viraram encontros de verdade, treinadores rebalanceados. Lista de capturas nova já a partir da Rota 1."
