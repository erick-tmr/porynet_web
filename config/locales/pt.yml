          intro: "Você não pode rodar o glitch do Mew até capturar um Abra na Rota 5, bem depois daqui. Continue jogando enquanto isso, mas deixe estes quatro em paz. Cada um é uma peça do glitch, e derrotar qualquer um custa essa etapa."
          show: "MOSTRAR OS QUATRO"
          hide: "OCULTAR OS QUATRO"
          state:
