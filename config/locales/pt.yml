        bar_label: "UM NOCAUTE · 100% DA EXPERIÊNCIA"
        legend:
          fighters:
            label: "EM CAMPO"
            any: "Metade do bolo é dividida entre os Pokémon que lutaram, e cada um deles ainda pega uma fatia do time."
          bench:
            label: "RESERVA"
            some: "A passagem do time deveria ser a outra metade. Em vez disso o jogo copia o que um lutador acabou de receber e divide isso pelo time inteiro, reserva incluída."
            none: "Ninguém está de fora, então a passagem do time só reforça os lutadores de novo. Ela ainda roda, e ainda está no tamanho errado."
          lost:
