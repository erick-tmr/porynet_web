      map_place_kind_tower: "Torre Pokémon. Os andares são um cemitério."
      map_place_kind_ship: "Uma sala dentro do S.S. Anne."
      map_place_kind_dojo: "Um dojo. Os lutadores dão um Pokémon a quem os vence."
      map_place_kind_league: "Uma sala da Liga Pokémon. Entrou, não tem volta."
      map_place_kind_hotel: "Um hotel. Ninguém se hospeda ali, é só cenário."
      map_place_kind_facility: "Um prédio em que você pode entrar."
      map_place_note_viridian_nickname: "Não é onde se troca o apelido, só uma casa-dica com um Spearow de estimação chamado SPEARY. Quem renomeia é o Avaliador de Nomes em Lavender Town."
      map_place_note_name_rater: "Aqui mora o Avaliador de Nomes. Traga qualquer Pokémon para dar um novo apelido, quantas vezes quiser."
      map_place_note_viridian_school: "A escola de treinadores de Kanto. A lousa ensina o básico, e as crianças passam dicas de captura e de criar afeto."
      map_place_note_reds_house: "A sua própria casa. A Mãe manda você procurar o Prof. Carvalho ao lado e se preocupa com os seus Pokémon; a TV passa um filme."
      map_place_note_cerulean_trashed: "A Equipe Rocket arrombou e cavou a parede dos fundos aqui, levando de quebra o TM de Dig do dono."
      map_place_note_cerulean_badge: "Um homem explica o que cada uma das suas oito insígnias faz: o bônus de status, o limite de obediência e o golpe de campo."
      map_place_note_pewter_nidoran: "A família explica os Pokémon de troca: crescem rápido, mas podem ignorar um treinador sem insígnias suficientes."
      map_place_note_pewter_speech: "Duas dicas: um Pokémon selvagem é mais fácil de capturar ferido ou dormindo, e alguns golpes só o treinador ensina."
      map_place_note_saffron_pidgey: "A amiga de correspondência da Copycat mora aqui, ao lado de um bilhete sobre o PP Up, que aumenta o PP de um golpe."
      map_place_note_vermilion_pidgey: "Um treinador manda cartas a Saffron por um Pidgey mensageiro. Só ambientação, nada para pegar."
      map_place_note_route2_trade: "Troque um Clefairy aqui por MILES, o Mr. Mime, o jeito mais fácil de registrá-lo na sua dex."
      map_place_note_vermilion_trade: "Apesar do nome, não há troca: um senhor só avisa que um golpe de HM não pode ser trocado depois de ensinado."
      map_place_note_celadon_chief: "O chefe Rocket do Game Corner se gaba dos caça-níqueis viciados; um guarda jura que o pôster de prêmios não esconde interruptor nenhum."
      map_place_note_copycats: "O térreo da casa da Copycat. Ela, e o TM Mimic que ela dá, ficam lá em cima."
      map_place_note_daycare: "O senhor da Creche cria um Pokémon para você, subindo o nível dele por uma taxa enquanto você viaja."
      map_place_note_bills_grandpa: "O avô do Bill mora aqui, com fofocas sobre o Bill e o Guarda da Safari Zone. Só ambientação."
      map_place_note_lavender_cubone: "Uma menina lamenta o Cubone cuja mãe a Equipe Rocket matou; limpe o fantasma da torre e ela confirma que ele descansou em paz."
      map_place_note_beach_house: "A Praia do Pikachu. Se o seu Pikachu souber Surf, o cara daqui abre um minigame de surfe para fazer pontos."
      map_place_note_safari_rest: "Um ponto de descanso dentro da Safari Zone: um banco e alguns caçadores exaustos comparando suas presas."
      map_place_note_game_corner: "Fileiras de caça-níqueis, e um pôster que esconde o interruptor para o esconderijo da Equipe Rocket no subsolo."
      map_place_note_game_corner_prizes: "Troque as suas fichas do Game Corner aqui por TMs de prêmio e Pokémon difíceis de achar."
      map_place_note_power_plant: "Uma usina abandonada cheia de Pokémon elétricos e Electrode disfarçados de itens; Zapdos fica lá no fundo."
      map_place_note_cinnabar_lab: "O laboratório onde os cientistas revivem os seus fósseis (Dome, Helix ou Old Amber) em Pokémon."
      map_place_note_pokemon_mansion: "A mansão incendiada. O labirinto esconde a Secret Key do Ginásio de Cinnabar e páginas de diário sobre o Mewtwo."
      map_place_note_silph_co: "A Silph Co., tomada pela Equipe Rocket. Suba lutando pelos andares até Giovanni, e a Master Ball, no topo."
      map_place_note_rocket_hideout: "A base da Equipe Rocket embaixo do Game Corner. Giovanni espera lá no fundo, guardando a Silph Scope."
      map_npc_pallet_technology: "\"A tecnologia é incrível!\" O pescador que explica o armazenamento de itens no PC, um clássico de Kanto."
      map_npc_route1_potion: "Fale com ele para ganhar uma Potion grátis, uma amostra do Mercado de Viridian. Útil antes da floresta."
      map_npc_route24_charmander: "Na colina de grama acima da ponte, este garoto te dá um Charmander grátis (Nv 10). Pegue."
      map_npc_silph_master_ball: "Derrote o Giovanni e o presidente te agradece com a Master Ball, a única do jogo."
