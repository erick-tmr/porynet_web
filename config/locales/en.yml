    yellow:
      marquee:
        - "PALLET → CHAMPION"
        - "CATCH-EVERYTHING ROUTE"
        - "OAK CHALLENGE BUILT IN"
        - "EVERY KANTO STOP"
      hero:
        badge: "GEN 1 · KANTO · WALKTHROUGH 01"
        lead: "A no-fluff, catch-everything walkthrough for all of Kanto. Just what to do to progress, plus exactly which Pokémon you can catch at every step, ticked straight into your dex."
      modes:
        eyebrow: "CHALLENGE TRACKERS · ADD-ONS"
        h2: "Challenge trackers to help you on this journey"
        lead: "Two fun ways to complete your Pokédex, riding along with the walkthrough. Both start off. Switch one on and it adds its own catch quantities and deadlines to every stop page; leave them off and you get a plain walkthrough. Both only track what's obtainable on a single cartridge, nothing that needs a trade."
        living:
          title: "Catch one of every species, and keep it"
          source_name: "Bulbapedia · Living Pokédex"
          body_html: "The dex entry isn't enough: the Pokémon has to still be alive in a box. That's the <b>living</b> part. Evolving doesn't cover it either: a Rattata that became a Raticate leaves the Rattata slot empty, so you need one of each sitting side by side."
          example: "Two catches, not one evolution. Same for every branch of every line."
          stop_pages_html: "<b>On the stop pages:</b> each location gains a catch quantity per species, queued at its best encounter rate, plus a box ledger for the lines you can fill there."
          species_tag: "WHAT COUNTS AS A SPECIES"
          species_body_html: "In later generations a living dex can also ask for each gender, form or regional variant. Yellow has none of those: no gender differences, no alternate forms, no regionals. <b>One per species</b> is the whole rule here, and the other options stay off."
        oak:
          title: "Register everything before the next gym"
          source_name: "Bulbagarden · Challenge Runs"
          body_html: "A pacing rule: everything reachable must be <b>registered</b> before you take the badge. That means every catch, plus every evolution you can level into. Stone and trade evolutions wait for the badge that unlocks them."
          stop_pages_html: "<b>On the stop pages:</b> each location lists what still owes a registration in this window, and which families are locked until a later badge."
          queue_tag: "EXAMPLE · EVERYTHING OWED BEFORE BROCK"
          queue_note: "Your starter, seven catches across Routes 1, 2 and 22 and the forest, and the evolutions they feed, including the infamous Pidgeot grind. Metapod and Pidgeotto go either way: catch them wild in the forest, or evolve into them. Nidoking and Nidoqueen wait for the Moon Stone in Mt. Moon. Raichu never comes: Yellow has no wild Pikachu and your starter refuses the Thunder Stone, so it's trade-only, and we only track what a single cartridge can do."
      route:
        h2: "Pallet Town → Indigo Plateau"
        lead: "Follow it in order. Each stop opens its own page with catch lists, trainers, items and hidden-item maps."
      specials:
        eyebrow: "SPECIALS · OFF THE MAIN LINE"
        h2: "Glitches and side pages"
        lead: "Optional detours that don't belong to a single stop. Read the warnings before you run one."
      legs:
        leg_01:
          lead: "The opening stretch of Kanto. Your home town and first wild grass."
        leg_02:
          lead: "Viridian's errands and the routes that ring it, right up to the gate of Viridian Forest."
        leg_03:
          lead: "Brock's Boulder Badge and the climb east toward Mt. Moon."
        leg_04:
          lead: "Out of Mt. Moon into Cerulean, up the Nugget Bridge routes to Bill's cottage, then back down for Misty."
        leg_05:
          lead: "South from Cerulean to Vermilion City and Lt. Surge, via the Underground Path shortcut."
        leg_06:
          lead: "Sweep the grass east of Vermilion, then double back for Lt. Surge and the Thunder Badge."
        leg_07:
          lead: "East and south from Cerulean toward the dark maze of Rock Tunnel."
        leg_08:
          lead: "Out of Rock Tunnel to Lavender, then the road west toward Celadon."
        leg_09:
          lead: "Celadon: the six-floor department store, the rooftop trades, and the arcade at the end of the street."
        leg_10:
          lead: "Back across Celadon with the hideout cleared, to cut into Erika's greenhouse and take the Rainbow Badge."
        leg_11:
          lead: "The southern fishing routes down to Fuchsia, and the errands that set the town up for the Safari Zone."
        leg_12:
          lead: "Back into Fuchsia with the Gold Teeth: trade them to the Warden for Strength, then take Koga's invisible-wall maze."
        leg_13:
          lead: "Down Cycling Road and into Saffron for Sabrina. Once Silph Co. is freed."
        leg_14:
          lead: "The open water south of Fuchsia, out toward the Seafoam Islands."
        leg_15:
          lead: "Cinnabar's fossils and the Pokémon Mansion key, then Blaine's Volcano Badge."
        leg_16:
          lead: "Back to Viridian, whose gym has finally opened, for Giovanni and the final badge."
        leg_17:
          lead: "The badge-gated road to the Pokémon League and Victory Road."
      mew_glitch:
        meta_title: "The Mew Glitch · %{game} Walkthrough"
        crumb_cerulean: "CERULEAN"
        crumb_here: "MEW GLITCH"
        spares:
          eyebrow: "DO NOT DEFEAT"
          reminder:
            label: "CHASING MEW?"
            text: "Don't beat these four Trainers. See the list below. ↓"
          title: "Four Trainers to leave standing"
          standing_label: "STILL STANDING"
          intro: "You can't run the Mew glitch until you catch an Abra on Route 5, well past this point. Keep playing in the meantime, but leave these four alone. Each one is a piece of the glitch, and beating any of them costs you that step."
          show: "SHOW THE FOUR"
          hide: "HIDE THE FOUR"
          state:
            beat: "I BEAT THEM"
            undo: "↺ UNDO"
            standing: "still standing ✓"
            lost: "lost. this step of the glitch is gone"
          workaround_tag: "WORKAROUND"
          workaround: "Already beat one? Only an earlier save brings it back. Trading in an Abra that knows Teleport from another cartridge skips the Route 5 wait entirely."
          cta: "WHY EACH ONE MATTERS ▶"
          trainers:
            grass-jr:
              name: "The grass Trainer"
              role: "STARTS THE GLITCH"
              where: "In the tall grass of Route 24, west of Nugget Bridge. Come at the grass from the north so he never spots you."
            swimmer:
              name: "First Trainer in the water"
              role: "SETS MEW'S LEVEL"
              where: "Cerulean Gym, the first Trainer in the water on the right. His Shellder is the one you Growl at."
            misty:
              name: "Misty"
              role: "BLOCKS THE SWIMMER"
              where: "The Cerulean Gym Leader. Beat her and the Swimmer behind her is out of reach for the glitch."
            slowpoke:
              name: "The Slowpoke kid"
              role: "SECOND MEW"
              where: "Near the start of Route 25, the Youngster with the lone Slowpoke. Only needed if you want a second Mew."
        hero:
          back: "◀ CERULEAN CITY"
          tag: "SPECIAL · GLITCH"
          game: "POKÉMON YELLOW"
          title_html: "The <span class=\"pn-mew-hero__word\" data-text=\"Mew\">Mew</span> glitch"
          lead: "Catch #151 with nothing but a wild Abra, a held START Button, and a Trainer who never gets to battle you. Cerulean City is the earliest clean place to pull it off, before Misty, and it costs you almost nothing."
          card_no: "◈ No. 151"
          card_species: "NEW SPECIES"
          art_alt: "Mew, art by Ken Sugimori"
          credit: "art by Ken Sugimori · © Nintendo / Creatures / Game Freak"
          card_name: "Mew"
          card_meta: "PSYCHIC · Lv 7 by default"
        facts:
          where:
            label: "WHERE"
            value: "CERULEAN / RT 24"
          earliest:
            label: "EARLIEST AT"
            value: "PRE-MISTY"
          level:
            label: "MEW LEVEL"
            value: "Lv 7 (1–13)"
          risk:
            label: "RISK"
            value: "1 NPC LOST"
        short:
          eyebrow: "IN SHORT · THE WHOLE TRICK IN 5 LINES"
          h2: "How it works"
          lead: "You interrupt a Trainer's approach with the START menu, Teleport away mid-trigger, then let a different battle write its data into the encounter the game still owes you. Walk back in and the leftover value spawns as Mew."
        tldr:
          "1":
            title: "Prime a Trainer"
            text: "Step into the grass Trainer's line of sight on Route 24 while holding START."
          "2":
            title: "Teleport out"
            text: "Abra warps you to Cerulean before he can walk over. His battle stays queued."
          "3":
            title: "Break the buttons"
            text: "Your menu and A/B stop responding. Expected: the game is mid-encounter."
          "4":
            title: "Fight a substitute"
            text: "Beat the Gym Swimmer. His last Pokémon's Attack stage becomes Mew's level."
          "5":
            title: "Walk back in"
            text: "Re-enter Route 24, close the menu that opens itself, and Mew appears."
        warn:
          badge: "READ FIRST"
          title: "This glitch deletes one NPC, and it's harmless."
          lead: "The game catches Mew as if it were a one-time overworld encounter, like Snorlax, so when the battle ends it tries to delete the map sprite it thinks Mew came from, to stop you re-fighting it. There is no such sprite, and nothing checks for that, so the game deletes a sprite from an area you passed through earlier instead. Keep to the route below and that casualty is a known, harmless one."
          lose:
            label: "WHAT YOU LOSE"
            text: "The police officer guarding the robbed house in Cerulean. Yellow makes you pass Bill on Route 25 to reach an Abra, so by the time you can run this the officer is already on duty, and the glitch then removes them for good. Purely cosmetic: your game just runs one officer short."
          keep:
            label: "KEEP IT TO THAT ONE"
            text: "Which sprite dies depends on where you stand when Mew appears. Travel only Cerulean to Route 24 (or Cerulean to 24 to 25 to 24). Step into any other area between the Teleport and the encounter and the game can delete an object from there instead, one that might matter."
          workaround:
            badge: "NO FREE PASS"
            text: "Trading in a Teleport Abra lets you run the glitch before Bill, but it never makes it lossless: the game always hides whatever sprite sits just past Route 24's list in memory. After Bill that is the harmless officer; run it earlier and the casualty is a different, less predictable object. Follow the route and take the officer."
          deep_html: "// deep dive on which object dies and why: <a href=\"https://archives.glitchcity.info/forums/board-107/thread-7490/page-0.html\" target=\"_blank\" rel=\"noreferrer\">TheZZAZZGlitch on glitchcity</a>"
        prereq:
          eyebrow: "BEFORE YOU START"
          h2: "Leave these four Trainers standing"
          lead: "Each one is fuel for the glitch. Beat any of them early and you lose that step's trigger."
        untouched:
          trigger:
            name: "Jr. Trainer♂"
            where: "In the tall grass west of Nugget Bridge, Route 24."
            role: "THE TRIGGER"
          swimmer:
            name: "Swimmer"
            where: "First Trainer in the water, right side of Cerulean Gym."
            role: "MEW'S LEVEL"
          misty:
            name: "Misty"
            where: "Cerulean Gym Leader. She blocks the Swimmer if you beat her first."
            role: "KEEP WAITING"
          youngster:
            name: "Youngster"
            where: "The Youngster with the lone Slowpoke on Route 25."
            role: "SECOND MEW"
        pack:
          label: "PACK LIST"
          abra:
            name: "An Abra that knows Teleport"
