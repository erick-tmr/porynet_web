            lost: "lost. this step of the glitch is gone"
          workaround_tag: "WORKAROUND"
          workaround: "Already beat one? Only an earlier save brings it back. Trading in an Abra that knows Teleport from another cartridge skips the Route 5 wait entirely."
          cta: "WHY EACH ONE MATTERS ▶"
          trainers:
            grass-jr:
              name: "The grass Trainer"
              role: "STARTS THE GLITCH"
              where: "In the tall grass of Route 24, west of Nugget Bridge. Come at the grass from the north so he never spots you."
            swimmer:
              name: "First Trainer in the water"
              role: "SETS MEW'S LEVEL"
              where: "Cerulean Gym, the first Trainer in the water on the right. His Shellder is the one you Growl at."
            misty:
              name: "Misty"
              role: "BLOCKS THE SWIMMER"
              where: "The Cerulean Gym Leader. Beat her and the Swimmer behind her is out of reach for the glitch."
            slowpoke:
              name: "The Slowpoke kid"
              role: "SECOND MEW"
              where: "Near the start of Route 25, the Youngster with the lone Slowpoke. Only needed if you want a second Mew."
        hero:
          back: "◀ CERULEAN CITY"
          tag: "SPECIAL · GLITCH"
          game: "POKÉMON YELLOW"
          title_html: "The <span class=\"pn-mew-hero__word\" data-text=\"Mew\">Mew</span> glitch"
          lead: "Catch #151 with nothing but a wild Abra, a held START Button, and a Trainer who never gets to battle you. Cerulean City is the earliest clean place to pull it off, before Misty, and it costs you almost nothing."
          card_no: "◈ No. 151"
          card_species: "NEW SPECIES"
          art_alt: "Mew, art by Ken Sugimori"
          credit: "art by Ken Sugimori · © Nintendo / Creatures / Game Freak"
          card_name: "Mew"
          card_meta: "PSYCHIC · Lv 7 by default"
        facts:
          where:
            label: "WHERE"
            value: "CERULEAN / RT 24"
          earliest:
            label: "EARLIEST AT"
            value: "PRE-MISTY"
          level:
            label: "MEW LEVEL"
            value: "Lv 7 (1–13)"
          risk:
            label: "RISK"
            value: "1 NPC LOST"
        short:
          eyebrow: "IN SHORT · THE WHOLE TRICK IN 5 LINES"
          h2: "How it works"
          lead: "You interrupt a Trainer's approach with the START menu, Teleport away mid-trigger, then let a different battle write its data into the encounter the game still owes you. Walk back in and the leftover value spawns as Mew."
        tldr:
          "1":
            title: "Prime a Trainer"
            text: "Step into the grass Trainer's line of sight on Route 24 while holding START."
          "2":
            title: "Teleport out"
            text: "Abra warps you to Cerulean before he can walk over. His battle stays queued."
          "3":
            title: "Break the buttons"
            text: "Your menu and A/B stop responding. Expected: the game is mid-encounter."
          "4":
            title: "Fight a substitute"
            text: "Beat the Gym Swimmer. His last Pokémon's Attack stage becomes Mew's level."
          "5":
            title: "Walk back in"
            text: "Re-enter Route 24, close the menu that opens itself, and Mew appears."
        warn:
          badge: "READ FIRST"
          title: "This glitch deletes one NPC, and it's harmless."
          lead: "The game catches Mew as if it were a one-time overworld encounter, like Snorlax, so when the battle ends it tries to delete the map sprite it thinks Mew came from, to stop you re-fighting it. There is no such sprite, and nothing checks for that, so the game deletes a sprite from an area you passed through earlier instead. Keep to the route below and that casualty is a known, harmless one."
          lose:
            label: "WHAT YOU LOSE"
            text: "The police officer guarding the robbed house in Cerulean. Yellow makes you pass Bill on Route 25 to reach an Abra, so by the time you can run this the officer is already on duty, and the glitch then removes them for good. Purely cosmetic: your game just runs one officer short."
          keep:
            label: "KEEP IT TO THAT ONE"
            text: "Which sprite dies depends on where you stand when Mew appears. Travel only Cerulean to Route 24 (or Cerulean to 24 to 25 to 24). Step into any other area between the Teleport and the encounter and the game can delete an object from there instead, one that might matter."
          workaround:
            badge: "NO FREE PASS"
            text: "Trading in a Teleport Abra lets you run the glitch before Bill, but it never makes it lossless: the game always hides whatever sprite sits just past Route 24's list in memory. After Bill that is the harmless officer; run it earlier and the casualty is a different, less predictable object. Follow the route and take the officer."
          deep_html: "// deep dive on which object dies and why: <a href=\"https://archives.glitchcity.info/forums/board-107/thread-7490/page-0.html\" target=\"_blank\" rel=\"noreferrer\">TheZZAZZGlitch on glitchcity</a>"
        prereq:
          eyebrow: "BEFORE YOU START"
          h2: "Leave these four Trainers standing"
          lead: "Each one is fuel for the glitch. Beat any of them early and you lose that step's trigger."
        untouched:
          trigger:
            name: "Jr. Trainer♂"
            where: "In the tall grass west of Nugget Bridge, Route 24."
            role: "THE TRIGGER"
          swimmer:
            name: "Swimmer"
            where: "First Trainer in the water, right side of Cerulean Gym."
            role: "MEW'S LEVEL"
          misty:
            name: "Misty"
            where: "Cerulean Gym Leader. She blocks the Swimmer if you beat her first."
            role: "KEEP WAITING"
          youngster:
            name: "Youngster"
            where: "The Youngster with the lone Slowpoke on Route 25."
            role: "SECOND MEW"
        pack:
          label: "PACK LIST"
          abra:
            name: "An Abra that knows Teleport"
            note: "Route 5, the earliest wild Abra, past Bill."
          balls:
            name: "Poké Balls, plenty"
            note: "Mew's catch rate is low and Cerulean sells nothing better."
        sleepers:
          label: "OPTIONAL · BUT DO IT"
          lead: "Bring something with a sleep move. Any of these learn one by level-up and are catchable by Cerulean."
        moves:
          sleep_powder: "Sleep Powder"
          sing: "Sing"
        steps:
          eyebrow: "THE GLITCH · STEP BY STEP"
          h2: "Cerulean method, start to catch"
          lead: "Three phases. Save before the second one: if a step goes wrong, a reset is cheaper than a soft lock."
        phases:
          setup:
            label: "PHASE 1 · SETUP"
            title: "Clear the board"
            meta: "Nugget Bridge + an Abra"
            steps:
              route24:
                title: "Head north into Route 24"
                text: "Leave Cerulean north and beat your rival if you haven't already. Stay out of the tall grass to the west."
              bridge:
                title: "Clear Nugget Bridge, all six"
                text: "Beat the five bridge Trainers and the Rocket at the end. Do not touch the Jr. Trainer♂ standing in the grass to the left of the bridge."
                tag: "DO NOT BEAT"
                note_label: "WHY"
                note: "That grass Trainer is the whole glitch. If he's gone, so is your Mew."
              youngster:
                title: "Cross to Route 25, spare the Slowpoke kid"
                text: "Head over Nugget Bridge onto Route 25 and press on toward Bill. Near the start stands a Youngster with a single Slowpoke. Walk right past him."
                tag: "SECOND MEW"
                note_label: "WHY"
                note: "Only matters if you want a second Mew later. That Slowpoke kid is the substitute battle for a repeat run, so beating him now costs you the encore until you reset."
              abra:
                title: "Get an Abra with Teleport"
                text: "There is no wild Abra before Bill, so reach him first, then catch an Abra in the grass on Route 5. Come back to Cerulean once it knows Teleport."
                tag: "THE LONG WAIT"
                note_label: "COST"
                note: "Visiting Bill is what makes that police officer visible, and losable. Read the warning above."
          glitch:
            label: "PHASE 2 · THE GLITCH"
            title: "Break the encounter"
            meta: "Save before this phase"
            steps:
              center:
                title: "Save, then heal in Cerulean"
                text: "Save your game. Then use the Cerulean Poké Center so Teleport brings you back here."
              lineup:
                title: "Line up on the grass Trainer"
                text: "Line up in the Jr. Trainer♂'s column on Route 24, far enough north that his sprite sits just off the bottom of the screen. One step south would put you in his sight."
                note_label: "CHECK"
                note: "He must be offscreen. On screen, he simply walks over and battles you normally."
              start:
                title: "Step down holding START"
                text: "Hold the START Button as you step into his line of sight. The menu opens on the same frame the exclamation mark appears."
                tag: "TIMING"
              teleport:
                title: "Teleport away with Abra"
                text: "From the menu, pick POKéMON, then Abra, then Teleport. You warp to Cerulean before he takes a step."
                note_label: "EXPECTED"
                note: "Your menu and the A/B Buttons now do nothing outside a PC. Nothing has broken, keep walking."
              swimmer:
                title: "Beat the Swimmer in the Gym"
                text: "Go straight to Cerulean Gym and battle the Trainer on the right. Approach so he swims at least one tile toward you, then beat his Lv 16 Horsea and Shellder."
                tag: "SOFT LOCK RISK"
                note_label: "CAREFUL"
                note: "If he doesn't move before the battle starts, the game locks. Never talk to him from the right-hand side."
          catch:
            label: "PHASE 3 · CATCH"
            title: "Meet No. 151"
            meta: "No detours on the way back"
            steps:
              return:
                title: "Walk straight back to Route 24"
                text: "Leave the Gym and head north out of Cerulean. Do not enter any other area: every detour risks deleting something from it."
                tag: "NO DETOURS"
              encounter:
                title: "Close the menu that opens itself"
                text: "The moment you enter Route 24 the menu pops open on its own. Press B. A Lv 7 Mew appears."
              catch:
                title: "Put it to sleep, then throw"
                text: "Whittle the HP, land a sleep move, and start throwing. Mew's catch rate is poor and Poké Balls are all Cerulean sells, so bring twenty and be patient."
                note_label: "LEVEL"
                note: "Want a different level? Growl the Shellder in phase 2 first, see the calculator below."
        calc:
          eyebrow: "LEVEL CALCULATOR"
          h2: "Pick the Mew you want"
          lead: "Mew's level is read from the Attack stat stage of the last Pokémon you battled. The game stores stages as 1–13 instead of -6 to +6, so an untouched opponent gives Lv 7. Every Growl you land on that Shellder (or Slowpoke) drops Mew one level."
          caption: "ATTACK STAT STAGE OF THE LAST OPPONENT"
          spawns: "YOUR MEW SPAWNS AT"
          lv_label: "Lv"
          recipe:
            untouched: "> untouched opponent, no stat moves used"
            growl: "> land %{n}× Growl on the last opponent"
            growl_underflow: "> land %{n}× Growl on the last opponent, then underflow it to Lv 100"
            raised:
              one: "> the opponent's Attack must be raised %{count} stage, rare in practice"
              other: "> the opponent's Attack must be raised %{count} stages, rare in practice"
          internal: "// internal value %{value} = stage %{stage} → level %{level}"
          lv100:
            label: "THE LV 100 ROUTE"
            text: "Land six Growls to catch a Lv 1 Mew, then run the experience-underflow glitch on it to shoot straight to Lv 100. Keep a free party slot: withdrawing a Lv 1 Mew from the PC soft locks the game. It learns nothing by level-up afterwards, which barely matters: Mew can learn every TM in the game."
          vc:
            label: "VIRTUAL CONSOLE · LEGITIMACY"
            text: "Poké Transporter only accepts a Mew that looks like the Virtual Console event one. That means an Original Trainer of GF (or ゲーフリ) and Trainer ID 22796."
            ot_label: "OT NAME"
            tid_label: "TRAINER ID"
            foot: "You can name yourself GF at the start; the ID is random, so matching it means RNG manipulation, cheats, or a lot of resets. The event Mew also has 15 IVs across the board, pleasant but irrelevant to Transporter."
        second:
          eyebrow: "ENCORE · SECOND MEW"
          h2: "Run it again with the Slowpoke kid"
          note: "SAVE FIRST · SAME GRASS TRAINER"
          lead: "The Jr. Trainer♂ in the grass can start the glitch as many times as you like. Swap the Gym Swimmer for the Youngster with the lone Slowpoke on Route 25 and you get another Mew."
          "1":
            title: "Clear Route 25 partway"
            text: "Beat Trainers along Route 25 until you can reach the Youngster with the lone Slowpoke. Leave him standing."
          "2":
            title: "Save"
            text: "You already have one Mew. Save before risking anything."
          "3":
            title: "Trigger the grass Trainer again"
            text: "Same move as before: step into the Jr. Trainer♂'s sight on Route 24 while holding START."
          "4":
            title: "Teleport to Cerulean"
            text: "Abra warps you home and your buttons go dead again."
          "5":
            title: "Battle the Slowpoke kid"
            text: "Walk to him on Route 25 and make sure he takes at least one step toward you, or the game soft locks. His Slowpoke's Attack stage sets the level."
          "6":
            title: "Back to Route 24"
            text: "Walk back, press B on the menu that opens itself, and catch Mew number two."
        after:
          art_alt: "Red with Mew, art by Ken Sugimori"
          art_tag: "No. 151 · REGISTERED"
          eyebrow: "AFTERWORD"
          h2: "One Pokémon the game never meant to give you"
          text: "This is one flavour of the Trainer-Fly glitch, which can produce any Pokémon in the game. The Cerulean pair are just the earliest and safest. Other setups exist, with more moving parts and more ways to lose an NPC. Catch Mew here and your dex is complete without a single event ticket."
          back: "◀ BACK TO CERULEAN"
          credit: "art by Ken Sugimori · © Nintendo / Creatures / Game Freak"
        teaser:
          tag: "OPTIONAL · GLITCH"
          window: "EARLIEST WINDOW IN THE GAME"
          title_html: "Want <span class=\"pn-mew-teaser__word\" data-text=\"Mew\">Mew</span>? Don't beat this Gym yet."
          lead: "Mew is otherwise event-only, and Cerulean is the first place you can pull the infamous Mew glitch to get one in-game. You'll need to push most of the way through Route 24 first; we'll remind you when you're there. If you want it, leave the Swimmer and Misty standing for now."
          cta: "FULL MEW GLITCH GUIDE ▶"
          meta: "~15 min · costs one background NPC"
        index:
          kind: "GLITCH"
          tag: "OPTIONAL"
          name: "The Mew Glitch"
          note: "The earliest catchable Mew, via the Cerulean Trainer-Fly. An optional side quest, not a required stop."
      pikachu_friendship:
        eyebrow: "MECHANIC · YELLOW ONLY"
        title: "How Pikachu's friendship works"
        show: "SHOW"
        hide: "HIDE"
        lead_html: "Yellow's starter Pikachu carries a hidden friendship value from <b>0 to 255</b>. It starts at <b>90</b> and moves as you play. The higher it climbs, the less each action is worth, so the cheap gains are cheapest early."
        meter_start: "START"
        meter_goal: "BULBASAUR"
        table_label: "FRIENDSHIP CHANGE BY CURRENT VALUE"
        col_action: "ACTION"
        band_lo: "0–99"
        band_mid: "100–199"
        band_hi: "200–255"
        rows:
          levelup: "Pikachu levels up while in your party"
          hp_item: "Use an HP-restoring item on Pikachu, even at full HP"
          x_item: "Use an X item on Pikachu in battle"
          gym_leader: "Challenge a Gym Leader with Pikachu in the party"
          tm_hm: "Teach Pikachu an HM or TM"
          walking: "Walk 256 steps with Pikachu in the party (50% chance)"
          deposit: "Deposit Pikachu in the PC"
          faint: "Pikachu faints in battle"
          poison_faint: "Pikachu faints outside battle from poison damage"
          careless: "Pikachu faints against an opponent 30+ levels higher"
          trade: "Pikachu is traded away to another player"
        potion:
          title: "THE POTION TRICK"
          text_html: "An HP-restoring item counts <b>even when it does nothing</b>. Use a Potion on a full-health Pikachu and friendship still goes up. Buy a stack at the Mart and tap your way from 90 to 147 in a few minutes."
        why:
          title: "WHY IT MATTERS"
          text_html: "Mostly a novelty: Pikachu's mood just changes its overworld face. The one real payoff is here in Cerulean, where Melanie only hands over Bulbasaur at <b>147 or higher</b>. Keep Pikachu out of the PC until then."
      locations:
        pallet_town:
          note: "Get Pikachu from Prof. Oak. No wild grass here."
          intro: "Home. Grab your partner Pikachu, settle the first rival battle, and head north."
          trivia:
            title: "This battle decides your rival's Eevee"
            intro: "The outcome of this battle, plus an optional rematch on Route 22, locks in which evolution your rival's Eevee takes. Play it how you like, but here's the recipe for each."
            note: "// The Route 22 rematch only matters if you win here first; lose, and it's Vaporeon regardless."
            cards:
              vaporeon:
                this: "Lose this battle"
                rt22: "Route 22 result ignored"
              jolteon:
                this: "Win this battle"
                rt22: "Win the Route 22 battle too"
              flareon:
                this: "Win this battle"
                rt22: "Skip the Route 22 battle"
          steps:
            "1":
              title: "Withdraw the free Potion"
              text: "In your upstairs bedroom, check the PC and withdraw the free Potion, then head downstairs and out the front door."
              items:
                potion: "Upstairs bedroom, inside the PC."
            "2":
              title: "Get Pikachu from Oak"
              text: "Head for the north exit. The moment you step into the Route 1 grass, Oak stops you and walks you back to his lab, where he hands you Pikachu. From here it walks beside you instead of riding in a Ball."
            "3":
              title: "Beat your rival"
              text_html: "Blue grabs an Eevee and battles you in the lab. It is Lv 5 with Tackle and Tail Whip; lead with Pikachu and use ThunderShock. Win for <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dollar\"></span><span class=\"pn-money-value__n\">175</span></span>. Heads up: this result is half of what decides <a href=\"%{href}\">which evolution his Eevee takes</a>, so pick your outcome on purpose."
            "4":
              title: "Head north to Route 1"
              text: "Leave Pallet by the north exit onto Route 1, and press on toward Viridian City."
          tips:
            pikachu: "Your forced partner and the only Pikachu in the game. It refuses the Thunder Stone, so it stays Pikachu."
        route_1:
          note: "First grass patch. Pidgey and Rattata."
          intro: "The short road north to Viridian. Your first wild grass. Level Pikachu on the way."
          steps:
            "1":
              title: "Sweep the tall grass"
              text: "Head north through the tall grass, battling wild Pidgey and Rattata to level Pikachu. You have no Poké Balls yet, so just battle them for now; you can catch a Pidgey and Rattata on the way back once you buy Balls at the Viridian Mart."
            "2":
              title: "Take the free Potion"
              text: "Near the north (Viridian) end, a man standing by the sign steps out to demo the shop and hands you a free Potion. Take it and keep north."
              items:
                potion: "From the man by the sign near the north (Viridian) exit."
            "3":
              title: "Enter Viridian City"
              text: "Continue north into Viridian City. On the way back later, hop down the ledges along the east side to skip the grass on the return trip."
          tips:
            pidgey: "Everywhere on Route 1. A reliable Normal/Flying that evolves all the way to Pidgeot."
            rattata: "Fast and common. Evolves into Raticate, a solid early attacker."
        viridian_city:
          mart:
            blurb: "The first Mart in the game. It only starts selling once you deliver Oak's Parcel from Pallet Town."
            buy: "Buy a handful of Poké Balls for Route 1–2 and Viridian Forest. Antidote covers the Weedle line's Poison Sting."
          note: "Catching tutorial, Oak's Parcel, stock up on Poké Balls."
          intro: "The gateway city. No wild grass. Run the errands, buy Poké Balls, then push into Route 2."
          later:
            tm42:
              where: "The Fisher who hands over TM42 (Dream Eater) sits on a fenced patch in the southwest corner, walled off by a cuttable tree and the pond. You can't cross to him on the first pass."
              after: "Chop the tree with HM01 Cut (from the S.S. Anne in Vermilion), or Surf across once you have HM03. Cut comes first."
          missable:
            title: "Five free Poké Balls"
            body_html: "Oak hands you <b>five Poké Balls</b> if you beat the Route 22 rival while carrying <b>none</b> and having caught <b>nothing but Pikachu</b>. Small prize, but if you want it, skip the Mart until after that fight."
            tip: "Pikachu goes in alone against his Spearow and Eevee, so grab a few levels in the Route 22 grass first."
          steps:
            "1":
              title: "Heal and collect Oak's Parcel"
              text: "You walk in from Route 1 to the first town with no wild grass, so there is nothing to catch here. Heal at the Poke Center in the top-left, then step into the Mart just northeast of it. The clerk stops you at the counter and hands over Oak's Parcel to carry back south. The road north out of town is blocked by an old man dozing on the path, so there is nothing more to do here for now."
            "2":
              title: "Deliver Oak's Parcel"
              text: "Carry the Parcel south to Oak's lab in Pallet Town. Hand it over and he finally gives you the Pokédex, the tool that logs every Pokémon you see and catch."
            "3":
              title: "Grab the Town Map"
              text: "While you are in Pallet for the Pokédex, step into Blue's house next door to the east. His sister Daisy stands by the table; talk to her and she hands you the Town Map, which lays out every route and town in Kanto."
            "4":
              title: "Stock up at the Mart"
              text: "Head back up to Viridian. Now that the Mart is stocking, buy a stack of Poke Balls plus a few Potions and Antidotes for Route 22, Route 2 and Viridian Forest. If you would rather claim Oak's five free Poke Balls, skip the balls here and buy them after the Route 22 rival (see the missable note)."
            "5":
              title: "Watch the catching demo"
              text: "The old man on the north road is awake now. Talk to him and sit through his catching demonstration; when it ends he steps aside and the path north finally opens."
            "6":
              title: "Grab the hidden Potion by the north exit"
              text: "With the road open, walk up toward the north exit at the top of town. A lone tree stands just west of the exit path. Stand on its left side, face right, and press A for a hidden Potion. Nothing appears on-screen until the item is yours."
              hidden:
                potion: "The lone tree just west of the north exit path, near the top of town. Stand to its left, face right, and press A. Nothing shows on-screen."
            "7":
              title: "Skip the Gym, head west to Route 22"
              text: "The Viridian Gym in the northeast stays locked until you hold the other seven badges, so leave it for the endgame. Take the west exit out to Route 22 for the best Brock-ready catches and your next rival battle; from there you loop back through Viridian and up to Route 2."
        route_22:
          note: "Optional west route. Nidoran♀/♂, Mankey, Spearow. Plus the first rival battle."
          intro: "A short detour west of Viridian. The best spot to catch answers for Brock before the forest."
          steps:
            "1":
              title: "Cross the grass"
              text: "Head west from Viridian into the grass. Catch Nidoran♂/♀ and Mankey here. They beat Brock's Rock types."
            "2":
              title: "Beat the rival"
              text_html: "Blue challenges you near the water with Spearow (Lv 9) and Eevee (Lv 8). Win for <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dollar\"></span><span class=\"pn-money-value__n\">280</span></span>. This is the other half of <a href=\"%{href}\">the Eevee recipe</a>: if you won in Pallet, winning here locks Jolteon and skipping this fight locks Flareon."
            "3":
              title: "Optional: Oak's five Poké Balls"
              text_html: "Still carrying no Poké Balls, with only Pikachu caught? Walk back to Oak's Lab in Pallet Town and talk to him for <b>five free Poké Balls</b>. See the <a href=\"#missable-poke-balls\">missable note</a>."
            "4":
              title: "Turn back to Viridian"
              text: "The League gate further west is blocked until you have all badges. Head back east and up to Route 2."
          tips:
            nidoranf: "Catch one. Its line (Nidoqueen) is strong and covers Brock with Ground moves."
            nidoranm: "Learns Low Kick early and evolves to Nidoking. A top Brock answer."
            mankey: "Low Kick is super-effective on Brock's Rock types. Grab one."
            rattata: "Common filler here. Evolves to Raticate."
            spearow: "Early Normal/Flying; evolves to Fearow. Aggressive and easy to find."
          oak:
            nidoranf: "Its line reaches Nidoqueen. Log the base once."
            nidoranm: "Evolves to Nidoking and helps vs Brock. Log one."
            mankey: "Only easy spot for a while. Grab it for Brock."
            spearow: "Early Normal/Flying, evolves to Fearow."
        route_2:
          note: "Short leg into the forest. Pidgey, Rattata and Nidoran."
          intro: "On this pass you only walk the western strip up to the forest gate, with the same catches as before plus wild Nidoran. Route 2 is much larger than that: its eastern half is sealed behind cuttable trees, so the map's east markers (the Moon Stone and HP Up, HM05 Flash, the Mr. Mime trade and the north exit of Diglett's Cave) all wait there until you have Cut, or loop back up through Diglett's Cave from Vermilion."
          later:
            moon_stone:
              where: "A Poké Ball low in the tree-walled plot on the eastern side of Route 2. Cuttable trees fence the whole east half off on your first pass, so you can't reach it yet."
              after: "Come back with HM01 Cut (from the S.S. Anne in Vermilion) to chop through, or drop into this side from the north exit of Diglett's Cave once you reach Vermilion."
            hp_up:
              where: "A second Poké Ball just north of the Moon Stone, in the same Cut-blocked eastern plot. Both sit behind the same wall of cuttable trees."
              after: "Same trip: bring HM01 Cut back to Route 2, or reach this side through Diglett's Cave from Vermilion."
            flash:
              where: "Prof. Oak's Aide hands over HM05 Flash inside the Route 2 gate, on the same Cut-blocked eastern side. He only gives it once you have caught at least 10 kinds of Pokémon (the count in your Pokédex, not how many you own)."
              after: "Get to the gate with HM01 Cut (or up through Diglett's Cave from Vermilion), and have 10 species caught. Flash is what lights Rock Tunnel later, so it is worth the detour."
          trades:
            mr_mime:
              npc: "SCIENTIST"
              title: "Mr. Mime"
              where: "The trade house on Route 2"
              note: "Yellow has no wild Mr. Mime, so this trade is the only way to add it. You need a spare Clefairy from Mt. Moon, so most players come back for it later."
          steps:
            "1":
              title: "Cross the south grass"
              text: "Walk north through the short grass from the Viridian City edge. Catch a wild Nidoran here if you skipped Route 22, and log a Pidgey or Rattata for the dex while you pass."
            "2":
              title: "Enter Viridian Forest"
              text: "Follow the western strip up to the forest gate at the top and step straight through. Everything on the tree-walled east side (the Moon Stone, the HP Up, HM05 Flash and the Mr. Mime trade) stays locked until you have Cut, so keep moving."
          tips:
            pidgey: "The same reliable flyer as Route 1 if you still need one."
            rattata: "Common again. Skip it if you already caught one."
            nidoranf: "A second shot at Nidoran♀ if you skipped Route 22."
            nidoranm: "A second shot at Nidoran♂. Grab it for the Brock fight."
          oak:
            pidgey: "Common in the grass here, and by now you have Poké Balls. Log one; it evolves all the way to Pidgeot."
            rattata: "Everywhere on Route 2. Grab one for the dex; it evolves into Raticate."
        viridian_forest:
          note: "Bug haven. Caterpie, Metapod, Pidgey. Hidden items inside. No wild Pikachu in Yellow."
          intro: "The maze of trees between Route 2 and Pewter. Sweep the grass, grab the hidden items, and pick up a Caterpie for Brock."
          steps:
            "1":
              title: "Enter from the Route 2 gate"
              text: "Step in through the south gate. Tall grass fills the whole maze, your only shot at Caterpie, Metapod and Pidgey. A Lass and a handful of Bug Catchers wait in the trees for easy Pikachu XP."
            "2":
              title: "Check the lone tree"
              text: "Just inside the south gate stands a single tree. Step up beside it, face the tree tile and press A for a hidden Antidote."
              hidden:
                antidote: "At the foot of the lone tree just inside the south gate. Face the tile and press A. Nothing shows on-screen."
            "3":
              title: "Raid the northwest dead-end"
              text: "Head northwest to the grassy dead-end, beating the Lass on the way for easy XP. A Poké Ball sits on the ground against the west wall at the very end of the path."
              items:
                pok-ball: "End of the grassy dead-end against the west wall, northwest of the south gate."
            "4":
              title: "Grab the central Potion"
              text: "Wind back toward the middle of the maze. A Potion waits on a ball just northwest of the sign about using an Antidote for poison."
              items:
                potion-12-29: "Center of the forest, on a ball just northwest of the antidote sign."
            "5":
              title: "Sweep the northeast"
              text: "Climb to the northeast corner, clearing the Bug Catchers for more Pikachu XP. Grab the Potion on a ball just northwest of the Trainer Tips sign."
              items:
                potion-25-11: "Northeast of the forest, just northwest of the Trainer Tips sign."
            "6":
              title: "Search the west wall"
              text: "Swing back to the west wall as you head for the north exit. One square west of the Bug Catcher there, stand on the tile just below the spot, face up and press A for a hidden Potion."
              hidden:
                potion: "One tile west of the Bug Catcher on the west wall (upper forest). Stand just below the spot, face up and press A. Nothing shows on-screen."
            "7":
              title: "Leave for Pewter City"
              text: "Catch a Caterpie or Metapod before you go; its Butterfree learns Confusion, a rare good answer to Brock. Exit through the north gate onto Route 2, then into Pewter City."
          tips:
            caterpie: "Everywhere in the grass. Evolves fast into Butterfree, whose Confusion dents Brock."
            metapod: "Or just evolve your Caterpie at Lv 7. Cheaper than hunting the 25% spawn."
            pidgey: "Common here too if you still need one for the dex."
            pidgeotto: "A rare 1% spawn. A free evolved flyer if you're patient."
          oak:
            caterpie: "The forest's new family. Evolves to Butterfree. Log the base once."
        pewter_city:
          mart:
            blurb: "Right beside the Pokémon Center. Restock here before Mt. Moon, a long cave with no shops inside."
            buy: "Poké Balls for Mt. Moon's Clefairy and a few Potions. An Escape Rope bails you out if you get lost."
          gym:
            intro: "A short, straight gym, no puzzle. Beat the lone Jr. Trainer on the way in, then Brock at the back. His Geodude (Lv 10) and Onix (Lv 12) shrug off Pikachu completely, so lead with Mankey's Low Kick, a Nidoran, or Butterfree's Confusion. When Onix uses Bide, stop attacking for two turns or it fires all the stored damage back at once."
          note: "Brock. The first Gym. Rock types; Electric does nothing."
          intro: "The first Gym city. Heal, prep a non-Electric attacker, and take the Boulder Badge from Brock."
          steps:
            "1":
              title: "Heal, prep, and enter the Gym"
              text: "Heal at the Poke Center and stock Potions at the Mart. Pikachu does nothing to Rock, so lead with Mankey, a Nidoran or Butterfree, then step into the Gym on the west side."
            "2":
              title: "Head east to Route 3"
              text: "With the Boulder Badge, the boy blocking the east exit steps aside. Head east onto Route 3 toward Mt. Moon."
          trivia:
            title: "Jigglypuff sings Pikachu to sleep"
            intro: "A Jigglypuff stands against the wall inside the Pewter City Poke Center. Talk to it and it breaks into its \"Puu pupuu!\" song, and if your Pikachu is out walking behind you the lullaby knocks it out cold, so it stops following you, just like being sung to sleep in a battle."
            note: "It only fires when Pikachu is your partner out following you and has no status condition. Any other time the Jigglypuff simply sings. A little wink at how its Sing move works in a real battle."
        route_3:
          note: "The climb to Mt. Moon. Spearow, Sandshrew and Mankey."
          intro: "The trainer gauntlet east of Pewter. Grab a Ground type for the caves ahead, then heal at the Mt. Moon center."
          steps:
            "1":
              title: "Fight east up the route"
              text: "Head east from Pewter, clearing the Bug Catchers, Youngsters and Lasses as you climb."
            "2":
              title: "Sweep the grass"
              text: "Catch Spearow, Sandshrew or Mankey in the tall grass. Sandshrew and Mankey both help in the caves, then follow the route to its end at the Mt. Moon Poké Center on Route 4."
          oak:
            sandshrew: "Ground type, evolves to Sandslash. Handy against the coming caves."
        route_4_mt_moon:
          note: "The Mt. Moon approach: heal, then into the cave."
          intro: "The west tip of Route 4, where Route 3 meets the Mt. Moon Poke Center. Heal, run any last errands, then head into the cave. The east half of Route 4 and its items come after you break through."
          steps:
            "1":
              title: "Heal at the Mt. Moon Poke Center"
              text: "Step off Route 3 onto the west tip of Route 4 and heal at the Mt. Moon Poke Center by the cave mouth. This is your last stop before the cave, so top up and stock Poke Balls."
            "2":
              title: "Enter Mt. Moon"
              text: "Head into Mt. Moon through the entrance beside the center. You come out on the east half of Route 4, covered on the next leg."
          trivia:
            title: "The man selling a Magikarp"
            intro: "Inside the Mt. Moon Poke Center a man will sell you a Magikarp for ¥500. On its own it just Splashes about, but it evolves into Gyarados, a real powerhouse. Buying it here is worth it if you want to start growing it immediately, since reaching Gyarados takes a good while."
            note: "If you only need it for the Pokédex there is no rush: Magikarp is catchable later on the Old Rod, so you can wait and save the money. He sells a single level 5 Magikarp and gives no refunds."
        mt_moon:
          note: "Cave crawl. Zubat, Geodude, rare Clefairy, and a fossil."
          intro: "A dark cave full of Rockets. Grab the Moon Stone, pick a fossil, and push through to Cerulean."
          steps:
            "1":
              title: "Enter Mt. Moon from Route 4"
              text: "Step in from the west tip of Route 4, right beside the Poke Center, into the dark of 1F. Zubat and Geodude swarm the rock, so keep a rested lead; a 1% Clefairy and a 5% Paras are the prizes worth hunting."
            "2":
              title: "Grab the Potion by the entrance"
              text: "A few steps in, south-center of 1F, a Potion sits in a ball just east of where you walked in. Scoop it up before you fan out across the cave."
              items:
                potion-20-33: "South-center of 1F, just east of the Route 4 entrance."
            "3":
              title: "Work the southeast for the Rare Candy"
              text: "Follow the bottom wall east to the southeast corner, where a Rare Candy waits in a ball. One free level for any Pokémon you like."
              items:
                rare-candy: "Southeast corner of 1F, hugging the bottom wall."
            "4":
              title: "Take the Escape Rope up the east wall"
              text: "Just north of the Rare Candy, tucked against the east wall, an Escape Rope sits in a ball. Handy if the cave chews through your Potions before you find the exit."
              items:
                escape-rope: "East wall of 1F, just north of the Rare Candy."
            "5":
              title: "Cross to the southwest for TM12"
              text: "Swing back west along the bottom to the southwest corner, where TM12 (Water Gun) rests in a ball. A cheap Water move for anything that can learn it."
              items:
                tm-water-gun: "Southwest corner of 1F."
            "6":
              title: "Climb the west wall for a second Potion"
              text: "Head up the far west wall to a second Potion sitting in a ball about halfway up. Grab it on your way to the top corner."
              items:
                potion-2-20: "Against the far west wall of 1F, mid-height."
            "7":
              title: "Claim the Moon Stone in the northwest"
              text: "In the very top-left corner of 1F, a Moon Stone sits in a ball. It evolves Clefairy, Nidorina, Nidorino and more, so pocket it and never sell it. The ladder down waits just beside it."
              items:
                moon-stone: "Top-left (northwest) corner of 1F."
            "8":
              title: "Descend through the maze to B2F"
              text: "Drop down the northwest ladder into B1F, a short connecting maze with no items, then take the next ladder to B2F, where the Rockets have dug in. Clear the Grunts as you go."
            "9":
              title: "Grab the HP Up on B2F"
              text: "In the south-center of B2F, an HP Up rests in a ball. It permanently boosts one Pokémon's HP, so save it for a keeper."
              items:
                hp-up: "South-center of B2F."
            "10":
              title: "Feel out the hidden Moon Stone"
              text: "A second Moon Stone hides in the boulders near the middle of B2F. Face the rock just south of the ladder as you cross and press A; nothing shows on-screen, but it drops into your bag."
              hidden:
                moon-stone: "Center of B2F, on the rock just south of the ladder. Press A; nothing shows on-screen."
            "11":
              title: "Take TM01 in the northeast"
              text: "Up in the northeast of B2F, TM01 (Mega Punch) sits in a ball. A heavy Normal move for a physical attacker."
              items:
                tm-mega-punch: "Northeast of B2F."
            "12":
              title: "Search the rock beside TM01 for Ether"
              text: "An Ether is tucked inside the large rock right beside TM01, in the northeast of B2F. Face the rock and press A; nothing shows on-screen, but the Ether is yours."
              hidden:
                ether: "Northeast of B2F, in the rock beside TM01. Press A; nothing shows on-screen."
            "13":
              title: "Beat Jessie & James, choose a fossil"
              text: "By the fossils in the north, the last Super Nerd guards the prize and Jessie & James block the way in Yellow. Beat them, then pick ONE fossil: Dome (becomes Kabuto) or Helix (becomes Omanyte). The one you leave is gone for good."
            "14":
              title: "Climb out to Route 4"
              text: "With the fossil in hand, take the northwest ladder back up to B1F and out the northeast exit onto the east half of Route 4, which drops toward Cerulean City."
          tips:
            clefairy: "A 1% cave spawn. Grab one, then a Moon Stone turns it into Clefable."
          oak:
            clefairy: "Rare Moon-cave catch. Evolve it with a Moon Stone into Clefable."
            geodude: "Everywhere in the rock. Evolves to Graveler, then Golem by trade."
        route_4:
          note: "Short drop to Cerulean. Same grass as Route 3."
          intro: "The ledge down from Mt. Moon into Cerulean City. A quick one."
          steps:
            "1":
              title: "Surface from Mt. Moon"
              text: "You step out onto the western tip of Route 4, right beside the Mt. Moon Poké Center at the cave mouth. Heal there if you skipped the one inside, then set off east along the high plateau toward Cerulean."
            "2":
              title: "Feel out the hidden Great Ball"
              text: "About halfway along the top of the route, a Great Ball is buried in the open ground against the north wall. Stand on the tile just below it and press A facing up. Nothing shows on-screen."
              hidden:
                great-ball: "Buried against the top wall near the middle of the route. Stand one tile south of it, face up, and press A. Nothing shows on-screen."
            "3":
              title: "Grab TM04 (Whirlwind)"
              text: "Farther east along the plateau, a Poké Ball sits out in the open with a Lass patrolling just beside it. Walk onto it to pocket TM04, Whirlwind."
              items:
                tm-whirlwind: "A Poké Ball on the plateau in the east half of the route, just west of the Lass. Walk onto it."
            "4":
              title: "Drop into Cerulean City"
              text: "Past the TM, hop down the ledges. They funnel east and pour straight out the far side into Cerulean City."
        cerulean_city:
          mart:
            blurb: "Cerulean's Mart adds Repel to the shelf, handy for the trainer-packed routes north to Bill."
            buy: "Poké Balls for Route 24–25 plus a Repel or two to walk the tall grass in peace."
          gym:
            intro: "One Swimmer, a Jr. Trainer, and open floor, then Misty. Her Staryu (Lv 18) and Starmie (Lv 21) hit hard with Water moves, and Starmie's Recover drags the fight out, so close fast with an Electric or Grass attacker. Pikachu's ThunderShock is ideal."
            notes:
              swimmer: "Do NOT beat this Trainer if you plan to run the Mew glitch. His Shellder's Attack stage sets Mew's level."
              misty: "Beating Misty locks the Swimmer behind her. Leave her standing until after your Mew run."
          note: "Misty's Gym. Cascade Badge. Free Bulbasaur too."
          intro: "A water-gym city. Beat Misty, and if Pikachu likes you, claim a free Bulbasaur."
          steps:
            "1":
              title: "Heal, shop, and enter the Gym"
              text: "Arrive from Route 4, heal at the Center and stock the Mart, then enter the Gym. Lead with Pikachu or a Grass type against Misty's Water team."
            "2":
              title: "Grab the hidden Rare Candy"
              text: "One free level, sitting in plain ground. A Rare Candy is buried on an open tile near the top of town. Line up on the square just below it and press A. Nothing shows on-screen."
              hidden:
                rare_candy: "On an open tile near the top of town. Stand just below it and press A, nothing shows on-screen."
            "3":
              title: "Grab the extras, then head north"
              text: "Take the free Bulbasaur from Melanie's house if Pikachu's friendship is high. The burgled house near the north stays sealed until later; when the officer moves on, chase the thief out its back for TM28 (Dig). Then head north onto Nugget Bridge (Route 24)."
          tips:
            bulbasaur: "Free from Melanie's house once Pikachu is happy. Evolves all the way to Venusaur."
          oak:
            bulbasaur: "Free gift from Melanie's house → Venusaur. One is enough."
          gifts:
            bulbasaur:
              from: "FROM MELANIE'S HOUSE"
              unlock: "Pikachu friendship 147 or higher"
        route_24:
          note: "Nugget Bridge. Oddish, Bellsprout, and a free Charmander."
          intro: "Your rival first, then five trainers back-to-back and a Rocket. And a free Charmander waiting at the end."
          steps:
            "1":
              title: "Beat your rival"
              text: "Leave Cerulean heading north and step onto Nugget Bridge. Blue ambushes you right at its foot, before a single bridge trainer. Beat his team (led by Eevee) and press on up the bridge."
            "2":
              title: "Cross Nugget Bridge"
              text: "Climb the bridge and take the five trainers lined up in a row, then the Rocket Grunt waiting at the top. He hands you a Nugget and asks you to join Team Rocket. Decline, and he battles you too."
            "3":
              title: "Take the free Charmander"
              text: "On the grassy hilltop past the bridge, a boy stands ready to hand you a free Charmander (Lv 10). Talk to him and take it: a strong Fire line all the way to Charizard, and a great answer to Erika later."
            "4":
              title: "Grab TM45 (Thunder Wave)"
              text: "A few steps east of the boy, a Poke Ball rests in the hilltop grass: TM45, Thunder Wave. Walk up and grab it, a cheap way to paralyze anything you want to catch."
              items:
                tm-thunder-wave: "In the grass at the top of the route, a few tiles east of the Charmander boy."
            "5":
              title: "Head east to Route 25"
              text: "With Charmander and the TM in hand, follow the path east off the hilltop into Route 25, the road that leads to Bill's cottage."
          tips:
            charmander: "Free from the boy here. A strong Fire line to Charizard, and a great answer to Erika later."
          oak:
            charmander: "Free gift → Charizard. Grab it for the dex and for Erika's grass gym."
            oddish: "Common in the grass. Evolves to Vileplume with a Leaf Stone."
            bellsprout: "The other 30% grass catch. Evolves to Victreebel with a Leaf Stone."
          gifts:
            charmander:
              from: "FROM THE HILLTOP BOY"
        route_25:
          note: "Bill's house. Same grass as Route 24."
          intro: "The path to Bill's cottage. Free him from his machine for the S.S. Anne ticket."
          steps:
            "1":
              title: "Arrive from Nugget Bridge"
              text: "Step in from the west, off the top of Nugget Bridge on Route 24. The trail runs east to Bill's Sea Cottage, lined with Hikers, Youngsters and Cooltrainers. Sweep the grass and catch a Venonat if you still need one."
            "2":
              title: "Sweep the west fence"
              text: "A short walk in from the west entrance, hug the top edge of the route. Face up and press A against the fence for a hidden Elixir. Nothing shows on-screen."
              hidden:
                elixir: "North edge near the west entrance, just in from Route 24. Face up and press A."
            "3":
              title: "Grab TM19 in the maze"
              text: "Wind through the fenced maze in the middle of the route, past the Youngsters and the Jr. Trainer. The Poke Ball tucked in the northeast corner holds TM19 (Seismic Toss)."
              items:
                tm-seismic-toss: "Northeast corner of the fenced maze, mid-route."
            "4":
              title: "Check the grass by the cottage"
              text: "On the final approach east, a short walk west of Bill's Sea Cottage door and on the same row, line up on the tile just below and press A facing up for a hidden Ether. Nothing shows on-screen."
              hidden:
                ether: "East end, due west of the cottage door on its row. Stand one tile south and press A up."
            "5":
              title: "Free Bill"
              text: "Enter the Sea Cottage at the far east and use Bill's machine to un-fuse him. He hands you the S.S. Ticket. Head back to Vermilion via Cerulean."
          oak:
            venonat: "A Bug/Poison catch → Venomoth. Log the base once."
        route_5:
          note: "South to Vermilion. Pidgey, Rattata and rare Abra."
          intro: "A short leg south of Cerulean. Catch an Abra here. It becomes one of the best Pokémon in the game."
          trades:
            machoke:
              npc: "LITTLE GIRL"
              title: "Machoke"
              where: "The Underground Path house at the north end of Route 5"
              note: "A fully evolved Machoke for a Cubone, and traded Pokémon earn boosted XP. Cubone comes from Pokémon Tower, so this is another return trip."
          steps:
            "1":
              title: "Head south"
              text: "Leave Cerulean south; drop a Pokémon at the Day Care if you want it leveled."
            "2":
              title: "Take the Underground Path"
              text: "Saffron's gates are blocked, so duck into the Underground Path building and tunnel south to Route 6. A hidden Full Restore and X Special lie along the tunnel floor."
          oak:
            abra: "Catch one fast (it only Teleports). Evolves to Kadabra, then Alakazam by trade."
        route_6:
          note: "Into Vermilion. Same grass as Route 5, plus fishing."
          intro: "The last stretch into Vermilion City. Fish the pond once you pick up a rod."
          steps:
            "1":
              title: "Leave the Underground Path"
              text: "Emerge at the north end and head south past the trainers."
            "2":
              title: "Enter Vermilion"
              text: "Continue south into Vermilion City."
        vermilion_city:
          mart:
            blurb: "Now stocking Super Potions. Load up before the S.S. Anne and Lt. Surge's gym."
            buy: "Super Potions carry you through the S.S. Anne. Repel keeps Diglett's Cave quiet on the way out."
          gym:
            intro: "The door to Lt. Surge is locked behind two switches hidden in the trash cans. Find both, then face Surge's lone Raichu (Lv 28), which hits the whole team hard and can paralyze. A Ground type using Dig shuts it down cleanly, so bring Diglett, Sandshrew or a Nidoran line."
            puzzle:
              "1": "Check the trash cans along the walls to find the first switch. Its position is random on every visit."
              "2": "The second switch is always in a can directly next to the first, up, down, left or right. Pick wrong and both reset, so search the neighbors."
              "3": "With both switches flipped, the door to Lt. Surge opens. Bring a Ground type to shut his Electric team down."
          note: "Lt. Surge. Thunder Badge. Free Squirtle after."
          intro: "A port city with a puzzle-box gym. Board the S.S. Anne first for Cut, then take on Surge."
          steps:
            "1":
              title: "Grab the goodies"
              text: "Heal at the Poke Center, then collect the Bike Voucher from the Pokémon Fan Club and the Old Rod from the Fishing Guru on the west side of town."
            "2":
              title: "Sweep the central plaza"
              text: "In the open square in the middle of town, tucked just northwest of the Pokémon Trade House (the small house between the Fan Club and the Poke Mart), an invisible Max Ether waits. Stand on that tile and press A, nothing shows on-screen."
              hidden:
                max-ether: "Center of town, one tile above and left of the Pokémon Trade House door. Press A; nothing appears."
            "3":
              title: "Board the S.S. Anne for Cut"
              text: "The gym's tree needs HM01 Cut. Board the ship at the south dock, clear the cabins, and cure the seasick Captain for Cut before you challenge Surge."
            "4":
              title: "Take the free Squirtle"
              text: "After the Thunder Badge, Officer Jenny hands you a free Squirtle. Then head east to Route 11 and Diglett's Cave."
          tips:
            squirtle: "Free from Officer Jenny after the Thunder Badge. The third Kanto starter, evolves to Blastoise."
          oak:
            squirtle: "Free gift after the badge → Blastoise. The last of the three starters."
          gifts:
            squirtle:
              from: "FROM OFFICER JENNY"
              unlock: "Beat Lt. Surge for the Thunder Badge"
        ss_anne:
          note: "The luxury liner. HM01 Cut, and a rival fight."
          intro: "A one-time boat. Sweep it for items, beat your rival, and get Cut before it sails away for good."
          steps:
            "1":
              title: "Clear the cabins for items"
              text: "Board at the south dock. The B1F cabins hold a Max Potion, an Ether and TM44 (Rest); on 1F grab TM08 (Body Slam) and check the kitchen's far trash can for a hidden Great Ball. Up on 2F, two cabins give a Max Ether and a Rare Candy. Battle the Sailors and Gentlemen as you sweep."
            "2":
              title: "Beat your rival"
              text: "Blue ambushes you by the stern stairs on 2F, just before the captain's room (Spearow Lv 19, Rattata Lv 16, Sandshrew Lv 18, Eevee Lv 20)."
            "3":
              title: "Get HM01 Cut"
              text: "Cure the seasick Captain in the stern cabin; he hands over HM01 Cut and TM24 (Thunderbolt). Teach Cut, then disembark. The instant you step off, the ship sails for good, so grab everything first."
        route_11:
          note: "East of Vermilion. Pidgey, Rattata, and Drowzee."
          intro: "A wide grass route east of Vermilion, with a cave shortcut back toward Pewter."
          trades:
            dugtrio:
              npc: "YOUNGSTER"
              title: "Dugtrio"
              where: "Upstairs in the Route 11 gate"
              note: "Hands you a Dugtrio so you can skip the 5% spawn in Diglett's Cave, and the trade gives it boosted XP."
          steps:
            "1":
              title: "Enter from Vermilion"
              text: "Step east out of Vermilion onto the wide grass of Route 11. The mouth of Diglett's Cave sits right here at the west end, marked by its sign, your shortcut back toward Pewter for later."
            "2":
              title: "Fight east"
              text: "Push east through the grass, clearing the Gamblers, Youngsters and Engineers as you go, and catch a Drowzee for a strong early Hypno."
            "3":
              title: "Search by the east gate"
              text: "Just before the east gate lies a hidden Escape Rope. Stop on the grass tile a few squares northwest of the gate door, face up, and press A. Nothing shows on-screen."
              hidden:
                escape-rope: "One tile west and three north of the east gate's door, out in the grass. Stand below it, face up, and press A. Nothing shows on-screen."
            "4":
              title: "Grab the Itemfinder"
              text: "At the east gate, talk to Oak's Aide for the Itemfinder (he only hands it over once you have caught 30+ species). Upstairs, a Youngster trades you a boosted Dugtrio for a Diglett."
            "5":
              title: "Take the Diglett's Cave shortcut"
              text: "Head back west to the mouth of Diglett's Cave and drop in, tunneling under the mountains for a quick way back toward Pewter."
          oak:
            drowzee: "The route's notable catch → Hypno, a strong early Psychic."
        digletts_cave:
          note: "A shortcut tunnel. Diglett and rare Dugtrio."
          intro: "A one-tunnel cave of Diglett. A great place to grab a Dugtrio and shortcut back to Pewter."
          steps:
            "1":
              title: "Enter from Route 11"
              text: "Take the south entrance near the west end of Route 11 and follow the single tunnel."
            "2":
              title: "Exit toward Pewter"
              text: "Catch a Diglett or the rare Dugtrio, then exit north onto Route 2 below Pewter."
          oak:
            diglett: "Everywhere here → Dugtrio, a fast Ground type. Grab the base."
        route_9:
          note: "East to Rock Tunnel. Nidoran hotspot."
          intro: "A long grass route east of Cerulean, thick with both Nidoran lines."
          steps:
            "1":
              title: "Cut in from Cerulean"
              text: "Route 9 runs east out of Cerulean, barred only by a lone tree you Cut through on the city's edge. Step onto the long grass, where both Nidoran lines skitter thick underfoot."
            "2":
              title: "Drop for TM30 Teleport"
              text: "Just inside the entrance, drop south into the sunken hollow in the southwest. The Poke Ball resting on the low grass is TM30, Teleport, tucked in beside the first Hiker."
              items:
                tm-teleport: "Southwest hollow just past the Cerulean entrance, on the low grass by the first Hiker."
            "3":
              title: "Check the lone tree"
              text: "Climb back north to the single tree standing in the northwest grass, just above the first Jr. Trainer. Stand on its east square and press A for a hidden Ether. Nothing shows on-screen."
              hidden:
                ether: "The lone tree in the northwest grass, north of the first Jr. Trainer; press A from its east side."
            "4":
              title: "Battle east to Route 10"
              text: "With both stashes in the bag, push east through the long grass, trading blows with the Bug Catchers, Jr. Trainers, and Hikers strung across the ridge. The path spills straight onto Route 10 and Rock Tunnel's doorstep."
        route_10:
          note: "Rock Tunnel's doorstep. Magnemite everywhere."
          intro: "A short route around Rock Tunnel's north mouth. Magnemite dominates the grass."
          steps:
            "1":
              title: "Heal at the Center"
              text: "Arrive from Route 9 into upper Route 10 and step into the Pokémon Center beside Rock Tunnel's north mouth. Top off, because the cave ahead is long and pitch-black."
            "2":
              title: "Catch a Magnemite"
              text: "Sweep the grass by the north mouth for Magnemite and the rare Machop, and take down the Jr Trainer patrolling just below the Center."
            "3":
              title: "Grab the hidden Super Potion"
              text: "One tile right of Rock Tunnel's north entrance, press A on the empty square beside the mouth for a hidden Super Potion. Nothing shows on-screen."
              hidden:
                super-potion: "One tile east of Rock Tunnel's north mouth; press A facing right. Nothing shows on-screen."
            "4":
              title: "Enter Rock Tunnel"
              text: "Teach a Pokémon HM05 Flash first, then step into the tunnel's north mouth."
            "5":
              title: "Sweep for the hidden Max Ether"
              text: "Out Rock Tunnel's south mouth onto lower Route 10, walk a few tiles east along the path and press A facing north for a hidden Max Ether. Nothing shows on-screen."
              hidden:
                max-ether: "East of Rock Tunnel's south mouth on lower Route 10; press A facing up. Nothing shows on-screen."
            "6":
              title: "Drop into Lavender Town"
              text: "Clear the Hikers and Pokémaniac down lower Route 10, then walk south into Lavender Town."
          oak:
            magnemite: "A 50% grass catch here → Magneton. Electric coverage for the dark tunnel."
        rock_tunnel:
          note: "Pitch-black cave. Needs Flash."
          intro: "A two-floor maze that's black without Flash. Onix, Machop and Geodude live inside."
          steps:
            "1":
              title: "Use Flash"
              text: "Teach HM05 Flash (Oak's Aide in the Route 2 gate) before entering, then light each screen inside."
            "2":
              title: "Wind down and back up"
              text: "Take the ladders to B1F, cross past the Hikers, and climb back to 1F on the far side."
            "3":
              title: "Exit to Lavender"
              text: "Leave the south mouth onto lower Route 10 and walk into Lavender Town."
          oak:
            machop: "Cave-common → Machoke, then Machamp by trade. A strong Fighter."
            onix: "Only appears on B1F. A bulky Rock/Ground catch worth the hunt."
        lavender_town:
          mart:
            blurb: "Lavender's Mart jumps to Great Balls and Revives, gear for the Pokémon Tower next door."
            buy: "Great Balls for the Tower's Gastly line and a couple of Revives. Super Repel thins the ghosts."
          note: "The ghost town. Pokémon Tower looms."
          intro: "A quiet town shadowed by Pokémon Tower. You'll need the Silph Scope before you can clear it."
          steps:
            "1":
              title: "Try the Tower"
              text: "Enter Pokémon Tower. You'll hit an unbeatable ghost on 6F and can't pass yet."
            "2":
              title: "Detour for the Silph Scope"
              text: "Head west via Route 8 to Celadon and take down the Rocket Hideout for the Silph Scope."
            "3":
              title: "Return for the Poké Flute"
              text: "Come back, clear the Tower, and free Mr. Fuji. He gives the Poké Flute to wake the sleeping Snorlax."
        route_8:
          note: "West to Celadon. Pidgey, Abra, Jigglypuff."
          intro: "The road from Lavender toward Saffron and Celadon. Another shot at Abra."
          steps:
            "1":
              title: "Head west"
              text: "Clear the Lass, Gambler and Super Nerd as you head west toward Saffron's east gate."
            "2":
              title: "Take the Underground Path"
              text: "The Saffron guards want a drink. Skip them by tunnelling west under the city to Route 7."
        route_7:
          note: "Gate route into Celadon. Pidgey and Abra."
          intro: "A tiny connector between Saffron and Celadon. In and out."
          steps:
            "1":
              title: "Cross to Celadon"
              text: "Emerge from the Underground Path and walk west."
            "2":
              title: "Enter Celadon"
              text: "Pass through the gate into Celadon City."
        celadon_city:
          store:
            blurb: "The biggest shop in Kanto: six floors of Poké Balls, TMs, evolution stones, vitamins and vending drinks. Ride the elevator to any floor to see what it sells and for how much."
            floors:
              "1F":
                name: "Service Counter"
                motto: '"Find what you need at the Celadon Dept. Store!"'
                note: "Reception and the store directory. The Poké Mart deliveryman waits here once you clear the Rocket Hideout. Nothing to buy on this floor, so take the elevator up."
              "2F":
                name: "Trainer's Market"
                motto: '"Top-Grade Items for Trainers!"'
                rec:
                  great_ball: "Cheap catch-rate upgrade, buy a stack for the mid-game routes."
                  super_potion: "Your main heal until Hyper Potions show up."
                  take_down: "Reliable physical STAB for a lot of early Pokémon."
              "3F":
                name: "TV Game Shop"
                motto: '"Video games on display, and a free TM."'
                note: "No sales counter, but the man behind the desk hands you a TM for free."
                gift_desc: "Teaches Counter: returns double the damage from a physical hit. A neat answer to Normal and Fighting attackers."
              "4F":
                name: "Wiseman Gifts"
                motto: '"Evolution special: every stone in stock!"'
                rec:
                  water_stone: "The only Water Stone shop in Kanto. Evolve your Eevee into Vaporeon here."
              "5F":
                name: "Pharmacy"
                motto: '"Boost your Pokémon to the max."'
              "ROOF":
                name: "Rooftop Square"
                motto: '"Vending machines and a very thirsty kid."'
                note: "Buy one of each drink for the thirsty girl and she trades each for a TM. Grab an extra Fresh Water for the Saffron gate guards while you are here."
                rec:
                  fresh_water: "Trade one to the girl for TM13 Ice Beam."
                  soda_pop: "Trade one for TM48 Rock Slide."
                  lemonade: "Trade one for TM49 Tri Attack."
          gym:
            intro: "A garden of small trees hiding several trainers, then Erika. Her Tangela (Lv 30), Weepinbell (Lv 32) and Gloom (Lv 32) fold to Fire, Flying, Psychic or Ice, so lead with one of those and carry status heals for their Sleep Powder and Stun Spore. Cut the small trees to reach her faster."
          note: "Erika's Gym. Rainbow Badge. Dept. Store, Eevee and the Game Corner."
          intro: "The big city. Shop the department store, grab an Eevee, beat Erika, and raid the Rocket Game Corner."
          steps:
            "1":
              title: "Arrive from Route 7"
              text: "Step in from the Route 7 gate on Celadon's east side, where the biggest city in Kanto opens up: a six-floor department store, a Game Corner, and Erika's Grass gym. Heal your team at the Pokémon Center just up the road before you dig in."
            "2":
              title: "Search the northeast trees"
              text: "Before you head into town, wade up through the tall grass that runs along the eastern edge, to its northeast corner. Stand at the very top of the strip, one tile below the lone tree, then face up and press A for a hidden PP Up. Nothing shows on-screen, so trust the tile."
              hidden:
                pp-up: "Top of the far-east tall-grass strip, at the tree capping its north end (just southeast of the Pokémon Center). Face up and press A; nothing appears."
            "3":
              title: "Shop the Dept. Store"
              text: "Head to the six-floor department store on the west side. Grab the free TM18 (Counter) from the clerk on 3F. Buy three drinks from the rooftop vending machines and give them to the girl up there for TM13 (Ice Beam), TM48 (Rock Slide) and TM49 (Tri Attack). Buy evolution stones on 4F, and keep one spare drink for Saffron's guards."
            "4":
              title: "Take the Eevee, then the Gym"
              text: "Pick up the gift Eevee on the top floor of the Celadon Mansion (behind the Poké Center) and the Coin Case from the man in the restaurant, then enter the Gym behind the trees. Fire, Flying or Psychic beats Erika's Grass and Poison; Cut the small trees inside to skip the maze."
            "5":
              title: "Hit the Game Corner"
              text: "Win coins for prizes like Porygon and Vulpix, then find the poster switch to enter the Rocket Hideout."
          tips:
            eevee: "Free in the Condominiums. Evolve it with a stone into Vaporeon, Jolteon or Flareon."
            porygon: "The only Porygon in the game. 9999 Game Corner coins, but nowhere else to get it."
            vulpix: "Trade-only in the wild in Yellow. The Game Corner (1000 coins) is your easy source."
          oak:
            eevee: "Gift → one of Vaporeon / Jolteon / Flareon. Register the base once."
            porygon: "Game Corner exclusive. The only Porygon you'll get. Grab one."
          gifts:
            eevee:
              from: "FROM THE MANSION ROOF"
        rocket_hideout:
          note: "Team Rocket's base. Get the Silph Scope."
          intro: "The maze under the Game Corner. Slide the spin tiles, beat Giovanni, and take the Silph Scope."
          steps:
            "1":
              title: "Open the stairs"
              text: "In the Celadon Game Corner, a man in black stands guard by the lone poster on the north wall. Beat him, press the switch hidden behind the poster, and the staircase down to B1F grinds open."
            "2":
              title: "Ride the spin tiles"
              text: "B1F is laced with arrow tiles that launch you in a straight line until a wall or stop tile catches you, so line up every spin before you step on. Rocket Grunts patrol the landings. Work the tiles to sweep the item balls scattered across the floor."
            "3":
              title: "Slide west for the Escape Rope"
              text: "Spin your way into the western half of B1F, where an Escape Rope sits on a ball. Pocket it now; it can whisk you straight out of the hideout if the maze ever gets the better of you."
              items:
                escape-rope: "West half of B1F. Step onto the ball at grid (11,14)."
            "4":
              title: "Grab the Hyper Potion"
              text: "Just southwest of the Escape Rope, another ball holds a Hyper Potion. Grab it for a hefty 200 HP heal to carry into the grunt fights below."
              items:
                hyper-potion: "West side of B1F, one row southwest of the Escape Rope ball."
            "5":
              title: "Feel for the hidden PP Up"
              text: "Back near the center of B1F, close to where you came in, stand on the tile at (20,15) and press A facing east. A hidden PP Up is buried on the square beside you, though nothing shows on-screen."
              hidden:
                pp-up: "Center of B1F. Press A facing east from grid (20,15). Nothing shows on-screen."
            "6":
              title: "Take the stairs to B2F"
              text: "Spin back toward the northeast corner of B1F and take the staircase down to B2F, the next ring of the spinner maze."
            "7":
              title: "Bag the Nugget"
              text: "Near the middle of B2F a ball holds a Nugget, a pricey lump worth a tidy sum at any shop. Line up the tiles and step to it from the west."
              items:
                nugget: "Center of B2F, on the ball at grid (16,8)."
            "8":
              title: "Pick up TM07 (Horn Drill)"
              text: "Slide to the western strip of B2F for TM07, Horn Drill, a one-hit KO move that only lands on slower foes. Grab the ball and tuck the TM away."
              items:
                tm-horn-drill: "West side of B2F, on the ball at grid (6,12)."
            "9":
              title: "Claim the Moon Stone"
              text: "In the far northwest corner of B2F sits a Moon Stone, the evolution stone for Nidoran, Clefairy and Jigglypuff. It hides easily against the wall, so make the trip for it."
              items:
                moon-stone: "Far northwest corner of B2F, on the ball at grid (1,11)."
            "10":
              title: "Grab the Super Potion"
              text: "Down in the southwest of B2F, one more ball holds a Super Potion. Snag it before you leave the floor."
              items:
                super-potion: "Southwest of B2F, on the ball at grid (3,21)."
            "11":
              title: "Drop to B3F"
              text: "Return to the north of B2F and take the stairs down to B3F. The Rockets here hit a little harder, so keep your lead healthy."
            "12":
              title: "Snag the Rare Candy"
              text: "A Rare Candy rests on a ball near the middle of B3F. One free level for any Pokémon; save it for whatever you are trying to push over an evolution or a gym."
              items:
                rare-candy: "Center of B3F, on the ball at grid (20,14)."
            "13":
              title: "Pick up TM10 (Double-Edge)"
              text: "Over on the east side of B3F, a ball holds TM10, Double-Edge, a heavy Normal hit that recoils a quarter of the damage back on you. Grab it."
              items:
                tm-double-edge: "East side of B3F, on the ball at grid (26,17)."
            "14":
              title: "Feel for the hidden Nugget"
              text: "One tile east of the Double-Edge ball, stand at (27,18) and press A facing up. A second hidden Nugget is buried right there, with nothing shown on-screen. Two Nuggets from this hideout is a nice payday."
              hidden:
                nugget: "East edge of B3F, one tile east of the TM10 ball. Press A facing up from (27,18). Nothing shows on-screen."
            "15":
              title: "Descend to B4F"
              text: "Take the last staircase down to B4F, the bottom of the hideout. Giovanni is somewhere down here, but a locked elevator stands between you and his office."
            "16":
              title: "Take the Lift Key from the grunt's room"
              text: "In the northwest room of B4F, a lone Rocket Grunt guards a ball. Beat him and grab the Lift Key, the switch that finally powers the elevator to Giovanni's office."
              items:
                lift-key: "Northwest room of B4F, on the ball at grid (10,2), beside the Rocket Grunt."
            "17":
              title: "Grab TM02 (Razor Wind)"
              text: "Two tiles south of the Lift Key, in the same northwest room, a ball holds TM02, Razor Wind, a two-turn Normal move. Scoop it up while you are here."
              items:
                tm-razor-wind: "Northwest room of B4F, on the ball at grid (9,4), just south of the Lift Key ball."
            "18":
              title: "Collect the HP Up"
              text: "Still in the western half of B4F, a little south of the Lift Key room, a ball holds an HP Up. A permanent HP boost for one Pokémon; grab it."
              items:
                hp-up: "West of B4F, on the ball at grid (10,12), south of the Lift Key room."
            "19":
              title: "Pick up the Iron"
              text: "Down in the south of B4F, a ball holds an Iron, the vitamin that permanently raises Defense. Work the tiles down to it before you head for the elevator."
              items:
                iron: "South of B4F, on the ball at grid (12,20)."
            "20":
              title: "Ride the elevator to Giovanni"
              text: "With the Lift Key, cross to the elevator in the east of B4F and ride it. It drops you into the sealed corridor where Jessie & James block the way. Clear the pair, then press on toward the office at the top."
            "21":
              title: "Beat Giovanni"
              text: "At the top of the corridor stands Giovanni himself: Onix (Lv 25), Rhyhorn (Lv 24) and Persian (Lv 29). Water or Grass melts the first two, and anything fast handles Persian. Down he goes, and the ball behind him is now yours to reach."
            "22":
              title: "Take the Silph Scope"
              text: "With Giovanni gone, step up and grab the ball on the tile he was guarding. Inside is the Silph Scope, the device that reveals the ghosts haunting Pokémon Tower in Lavender Town."
              items:
                silph-scope: "Top of Giovanni's corridor, northeast B4F, on the ball at grid (25,2)."
            "23":
              title: "Feel for the hidden Super Potion"
              text: "One more tile north of the Silph Scope, at the very top of the corridor, stand on the Silph Scope tile and press A facing up. A hidden Super Potion is stashed on the square above, with nothing shown on-screen."
              hidden:
                super-potion: "Very top of Giovanni's corridor. Stand on the Silph Scope tile (25,2) and press A facing up. Nothing shows on-screen."
            "24":
              title: "Leave for Pokémon Tower"
              text: "That is the whole hideout swept. Escape Rope out or ride the elevator back to B1F, and head for Lavender Town: the Silph Scope opens up Pokémon Tower next."
        pokemon_tower:
          note: "Lavender's haunted tower. Ghosts and the Poké Flute."
          intro: "Climb the tower with the Silph Scope to reveal the ghosts, beat your rival, and free Mr. Fuji."
          steps:
            "1":
              title: "Climb with the Silph Scope"
              text: "Step in from Lavender Town and start up. With the Silph Scope on, the wild Gastly, Haunter and Cubone that haunt every floor finally take shape, so you can battle them instead of fumbling in the dark."
            "2":
              title: "Beat your rival on 2F"
              text: "Blue ambushes you as you cross the second floor, his team around Lv 25. His Eevee has evolved to match the record you set in your earlier fights, so lead with a counter to whatever form it took, then take the west stairs up."
            "3":
              title: "Snag the Escape Rope on 3F"
              text: "On the third floor, a lone ball waits against the very top wall, dead center. Walk up to it for an Escape Rope, your instant bail-out if the ghosts wear you down."
              items:
                escape-rope: "Top-center of 3F, against the north wall; approach from below."
            "4":
              title: "Grab the Elixir on 4F"
              text: "Up on the fourth floor, the first of three balls sits near the middle of the room. Step to it from the right for an Elixir, which tops up the PP of every move at once."
              items:
                elixir: "Center of 4F, approached from the east."
            "5":
              title: "Drop south for the HP Up"
              text: "Just below the Elixir, tucked against the lower wall, a second ball holds an HP Up, a permanent boost to one Pokémon's max HP. Reach it from the left."
              items:
                hp-up: "South edge of 4F, directly below the Elixir."
            "6":
              title: "Pocket the Awakening"
              text: "A few steps west along the middle row, the last 4F ball is an Awakening, a one-shot cure for Sleep and handy against the Tower's drowsy ghosts. Then make for the west stairs."
              items:
                awakening: "Center-west of 4F, west of the Elixir, near the stairs up."
            "7":
              title: "Feel for the hidden Elixir on 5F"
              text: "Coming onto the fifth floor from the west stairs, step a couple of tiles in and face south. Press A on the empty tile just below you for a hidden Elixir; nothing shows on-screen, but it drops into your bag."
              hidden:
                elixir: "Just southeast of the 5F west stairs. Press A facing down on the empty tile; no ball is visible."
            "8":
              title: "Bag the Nugget"
              text: "A little further into the fifth floor, a ball sits low on the west side. Grab it from the right for a Nugget, worth a fat pile of cash at any shop."
              items:
                nugget: "West-south area of 5F, a few tiles past the hidden Elixir; approach from the right."
            "9":
              title: "Claim the Rare Candy on 6F"
              text: "The sixth floor's prize sits over on the west side, up near the top. Walk up to it for a Rare Candy, an instant level for whichever Pokémon needs it most."
              items:
                rare-candy: "West side of 6F, toward the top; approach from below."
            "10":
              title: "Grab the X Accuracy"
              text: "Back across to the southeast, the last Tower ball is an X Accuracy, a battle item that sharpens your next few hits. From here it is a short walk to the stairs the ghost guards."
              items:
                x-accuracy: "Southeast of 6F; approach from the right."
            "11":
              title: "Clear the ghost Marowak"
              text: "A Lv 30 ghost Marowak stands over the stairs up, mourning among the graves. The Silph Scope lets you see and fight it, so knock it out to clear the way. It can never be caught, only laid to rest."
            "12":
              title: "Free Mr. Fuji on 7F"
              text: "At the top, Team Rocket's Jessie & James block the way to Mr. Fuji. Beat the pair, then speak to the old man to free him. He hands you the Poké Flute, which wakes the sleeping Snorlax on Routes 12 and 16."
          tips:
            gastly: "The only Gengar line in the game. Evolve Gastly to Haunter, then Gengar by trade."
          oak:
            gastly: "Ghost-heavy floors → Haunter, then Gengar by trade. The only line in-game."
            cubone: "A rare Tower catch → Marowak, a strong Ground type."
        route_12:
          note: "Silence Bridge. Oddish, Bellsprout, and a Snorlax."
          intro: "A long fishing bridge blocked by a sleeping Snorlax. Wake it with the Poké Flute to pass."
          steps:
            "1":
              title: "Come down from Lavender"
              text: "Enter Route 12 from the north, straight out of Lavender Town. This is Silence Bridge, a long fishing pier laid over open water. Duck into the gate at the top and climb to 2F for a free TM39 (Swift) from the girl at the binoculars, then head south down the span, battling the Fishermen strung along the northern half."
            "2":
              title: "Wake the Snorlax"
              text: "Halfway down the bridge a Lv 30 Snorlax lies across the only path. Play the Poke Flute (from Mr. Fuji in Lavender Town) to rouse it, then battle or KO it to open the way south. It is one of just two Snorlax in the game, so throw a few balls if you want the catch."
            "3":
              title: "Search the west nook"
              text: "Just past the Snorlax, follow the narrow land bridge west into a walled dead-end nook. Stand on the westernmost floor tile and press A facing east for a hidden Hyper Potion. Nothing shows on-screen."
              hidden:
                hyper-potion: "The far-west dead-end nook off the Snorlax's land bridge. Face east from the westmost tile and press A. Nothing shows on-screen."
            "4":
              title: "Work down the bridge"
              text: "Continue south down the pier, taking the Rocker and the last Fisherman as the path lets you. Duck into the Fishing Guru's house on the way for the Super Rod, the best rod in the game."
            "5":
              title: "Grab the Iron alcove"
              text: "Near the south end, just past the last Fisherman, a Poke Ball sits in a walled alcove on the west side. Step in and grab the Iron, which permanently raises a Pokémon's Defense."
              items:
                iron: "West-side alcove near the south exit, beside the southern Fisherman. The Poke Ball tucked against the wall."
            "6":
              title: "Head to Route 13"
              text: "Clear the last Jr. Trainer and cross the tall grass at the bottom (Oddish, Bellsprout, and the rare Farfetch'd) to the south exit onto Route 13."
          tips:
            farfetchd: "A rare 5% grass catch. The only wild Farfetch'd around."
            snorlax: "One of just two Snorlax in the game. A Lv 30 wall. Sleep or paralyze, then throw balls."
          oak:
            slowpoke: "Surf the water for Slowpoke → Slowbro, a bulky Water/Psychic."
            farfetchd: "The rare duck of the grass. Grab the single wild Farfetch'd here."
        route_13:
          note: "Ledge maze south. Oddish, Bellsprout, Ditto."
          intro: "A winding fenced maze of ledges. Watch for a wild Ditto."
          steps:
            "1":
              title: "Wind down from Route 12"
              text: "Route 13 is a switchback of fences and clifftop ledges spilling down from Route 12. Follow the path as it snakes west and south, clearing the Bird Keepers, the pair of Beauties and the lone Biker, and watch the grass for a wild Ditto that Transforms into whatever it faces."
            "2":
              title: "Uncover the Calcium by the sign"
              text: "Along the southern fence, one square east of the first Trainer Tips sign, a Calcium hides in the grass. Stand on the tile to its east, face west, and press A to lift it. Nothing shows on-screen, so trust the Itemfinder's beep."
              hidden:
                calcium: "South fence, one tile east of the first Trainer Tips sign. Face west and press A; nothing shows on-screen."
            "3":
              title: "Dig out the corner PP Up"
              text: "Follow the fence all the way to the far southwest corner, the last patch before the gap into Route 14. A PP Up lies buried there. Line up on the square just above it, face down, and press A. Nothing shows on-screen."
              hidden:
                pp-up: "Far southwest corner, the bottom tile by the Route 14 exit. Stand above it, face down and press A; nothing shows on-screen."
            "4":
              title: "Slip out west to Route 14"
              text: "With both stat boosts pocketed, drop through the last run of ledges and leave west into Route 14."
          tips:
            ditto: "A 5% catch that Transforms into whatever it faces. Handy for the dex."
          oak:
            ditto: "Catch the Transforming blob here. A fun one and useful for breeding later gens."
        route_14:
          note: "Bird-and-biker row. Oddish, Bellsprout, Venonat."
          intro: "A long diagonal of Bird Keepers and Bikers. A rare Venomoth flies here."
          steps:
            "1":
              title: "Cut through the ledges"
              text: "Fight the Bird Keepers up top and the Bikers below. An Electric or Psychic type sweeps both."
            "2":
              title: "Head to Route 15"
              text: "Follow the ledges southwest down to Route 15."
        route_15:
          note: "West to Fuchsia. Oddish, Bellsprout, Venonat."
          intro: "The last leg into Fuchsia, through a fenced field of trainers."
          steps:
            "1":
              title: "Cross the fenced field"
              text: "Step onto Route 15 from the Route 14 gate in the east and head west across the fenced field. A double file of Bird Keepers, Beauties, Bikers and Jr. Trainers packs the lane, so top off your HP before wading in."
            "2":
              title: "Grab TM20 Rage in the NW pocket"
              text: "Near the western end of the field, break north off the main lane. A Poke Ball tucked into the northwest corner holds TM20 Rage, sitting just short of the gate to Fuchsia."
              items:
                tm-rage: "Northwest corner of the route, on the top row just east of the Fuchsia gate."
            "3":
              title: "Enter Fuchsia"
              text: "Drop back down to the main lane and cross west through the gate into Fuchsia City."
        fuchsia_city:
          mart:
            blurb: "Fuchsia sells Ultra Balls and Hyper Potions, the kit for the Safari Zone and Koga's gym."
            buy: "Ultra Balls raise your odds on rare late catches. Hyper Potions and a Revive see you through Koga."
          gym:
            intro: "The gym floor is a maze of invisible walls. Feel your way through, clearing the Jugglers and Tamers inside, then take on Koga. His three Venonat (Lv 44, 46, 48) and Venomoth (Lv 50) lean on Toxic and Double Team, so bring a fast Psychic attacker and carry Antidotes."
            puzzle:
              "1": "The whole room is blocked by invisible walls. Walk into open space until you hit one, then trace along it to find the gaps."
              "2": "Weave up and around the barriers toward the top of the room, taking each optional trainer as the path lets you reach them."
              "3": "The last opening leads to Koga. Bring a Psychic or Ground attacker and carry Antidotes for his Toxic."
          note: "Koga's Gym. Soul Badge. Safari Zone next door."
          intro: "Home of the Safari Zone. Beat Koga, then fetch Surf and Strength from the Safari."
          steps:
            "1":
              title: "Heal and enter the Gym"
              text: "Heal at the Center, then feel through the gym's invisible-wall maze to reach Koga. Bring a fast Psychic or Fire type and Antidotes for his Toxic."
            "2":
              title: "Fish the Warden's pond"
              text: "Super Rod the pond for a wild Gyarados, a Yellow-exclusive catch here."
            "3":
              title: "Raid the Safari Zone"
              text: "Head north into the Safari Zone for HM03 Surf and the Gold Teeth."
            "4":
              title: "Trade for Strength"
              text: "Return the Gold Teeth to the Warden for HM04 Strength; grab the Rare Candy inside once you have it."
          tips:
            gyarados: "Super Rod the Warden's pond for a wild Gyarados. No Magikarp grind needed."
          oak:
            gyarados: "Fish one straight out of the Warden's pond. A rare Yellow shortcut to Gyarados."
        safari_zone:
          note: "500-step catch park. Scyther, Pinsir, Chansey, Dratini and more."
          intro: "Pay in, get 30 Safari Balls, and grab the game's rarest catches. Plus HM03 Surf and the Gold Teeth."
          steps:
            "1":
              title: "Buy in at the gate"
              text: "Pay 500 at the Safari Zone gate for 30 Safari Balls and a 500-step clock. No trainers wait inside, and regular Poké Balls, HMs and fainting are all off the table until you leave, so the walk is yours to loop at will."
            "2":
              title: "Step in and learn the rules"
              text: "Walk up into the Center Area. Toss Bait to freeze a Pokémon in place or a Rock to sink its catch resistance (at the cost of it fleeing sooner), and remember nothing you throw a ball at can be worn down first. Sweep the four areas for Scyther, Pinsir, Kangaskhan, Tauros, Chansey and Tangela, and Super Rod the ponds for Dratini as you loop."
            "3":
              title: "Grab the Nugget"
              text: "Straight up the middle of the Center Area, in the grass north of the entrance, sits a lone ball holding a Nugget. Pocket it to sell for a tidy 5000 later."
              items:
                nugget: "Center Area, up the middle north of the gate."
            "4":
              title: "Cross into Area 1 for TM37"
              text: "Leave the Center Area by its east edge into Area 1 (East), arriving at the southwest corner. Push toward the middle of the field, where a ball waits with TM37 Egg Bomb."
              items:
                tm-egg-bomb: "Area 1 (East), center of the map."
            "5":
              title: "Sweep east for Carbos"
              text: "Head right toward the eastern trees and grab the Carbos ball, a permanent Speed boost for one of your team."
              items:
                carbos: "Area 1 (East), east of center."
            "6":
              title: "Snag the Full Restore"
              text: "A few tiles north of the Carbos sits another ball holding a Full Restore, a full-heal-plus-status you will want banked for tough fights."
              items:
                full-restore: "Area 1 (East), just north of the Carbos."
            "7":
              title: "Double back for the Max Potion"
              text: "Cross the top of the area back to the far west, where a lone ball near the north exit holds a Max Potion. Grab it, then slip out the northwest corner into Area 2."
              items:
                max-potion-3-7: "Area 1 (East), far west by the north exit."
            "8":
              title: "Climb Area 2 for Protein"
              text: "You arrive in Area 2 (North) at its southeast corner. Climb all the way to the top wall, where a ball tucked against the fence holds a Protein, a permanent Special boost."
              items:
                protein: "Area 2 (North), against the top wall."
            "9":
              title: "Grab TM40 on the way down"
              text: "Drop down and to the left from the Protein and pick up the ball holding TM40 Skull Bash. From here, make for the southwest corner to cross into Area 3."
              items:
                tm-skull-bash: "Area 2 (North), upper-center below the top wall."
            "10":
              title: "Enter Area 3 and find the Gold Teeth"
              text: "You land in Area 3 (West) along its top edge, where the Secret House waits. Head west across the upper band and grab the ball holding the Gold Teeth, the Warden's lost dentures."
              items:
                gold-teeth: "Area 3 (West), upper-center of the map."
            "11":
              title: "Bag TM32 Double Team"
              text: "Keep west along the same row and scoop up the ball holding TM32 Double Team before the ground opens toward the Secret House."
              items:
                tm-double-team: "Area 3 (West), upper-left, west of the Gold Teeth."
            "12":
              title: "Probe for the hidden Revive"
              text: "A couple of tiles west of the TM32 ball, stop and press A facing up on the empty patch of ground. Nothing shows on-screen, but you pocket a hidden Revive."
              hidden:
                revive: "Area 3 (West), two tiles west of the TM32 ball; press A facing up, nothing shows."
            "13":
              title: "Claim HM03 Surf at the Secret House"
              text: "Step into the Secret House in the far top-left corner. The old man inside hands you HM03 Surf, the whole reason to trek out here. Teach it later and half the map's water opens up."
            "14":
              title: "Drop south for a second Max Potion"
              text: "Leave the house and follow the west side down to the bottom of the area, where another ball holds a Max Potion."
              items:
                max-potion-8-20: "Area 3 (West), lower-left near the bottom wall."
            "15":
              title: "Cut east for the Max Revive"
              text: "Angle east across the lower field and grab the ball holding a Max Revive, the last prize before the exit."
              items:
                max-revive: "Area 3 (West), lower-center of the map."
            "16":
              title: "Loop back out and pay the Warden"
              text: "Slip out Area 3's east edge into the Center Area and back down through the gate. Before you forget, Super Rod the ponds for Dratini, then in Fuchsia hand the Gold Teeth to the Warden, who trades them for HM04 Strength."
          tips:
            scyther: "One of Yellow's two big bug bruisers, here alongside Pinsir. Bait, then Safari Balls."
            pinsir: "Yellow lets you catch both Pinsir and Scyther in the Safari. Grab this one too."
            kangaskhan: "A rare Safari-only Normal type. Patient bait-and-ball or nothing."
            chansey: "1% and flighty, but a huge EXP prize. Save a few balls for it."
            dratini: "The only easy Dratini. Super Rod the Safari ponds for the Dragonite line."
          oak:
            scyther: "Safari-exclusive bruiser. Grab one. No other easy source."
            pinsir: "The other Safari bug. Yellow lets you keep both Pinsir and Scyther."
            dratini: "Super Rod the ponds → Dragonair → Dragonite. Your one reliable shot."
            kangaskhan: "Rare and Safari-only. Bank one for the dex while you're here."
        route_16:
          note: "Cycling Road's top. Doduo and a Snorlax."
          intro: "The north gate of Cycling Road, blocked by a second Snorlax. Fly is hidden nearby."
          steps:
            "1":
              title: "Grab HM02 Fly"
              text: "Cut the tree in the NW to reach the house and pick up HM02 Fly."
            "2":
              title: "Wake the Snorlax"
              text: "Play the Poké Flute at the Snorlax on the path (Lv 30) and battle it to clear the gate."
            "3":
              title: "Mount Cycling Road"
              text: "Ride the Bike through the north gate onto Route 17."
          tips:
            snorlax: "The second and last Snorlax. Same Lv 30 wall. Sleep it, then throw balls."
          oak:
            doduo: "The route's common catch → Dodrio, a fast Normal/Flying."
            snorlax: "The last of two Snorlax. Wake with the Poké Flute and catch it now."
        route_17:
          note: "Cycling Road. Doduo, Ponyta, Fearow."
          intro: "A one-way downhill bike run lined with Bikers. Ponyta gallops in the grass strips."
          steps:
            "1":
              title: "Ride south down Cycling Road"
              text: "Enter from the north gate and mount the Bike; Cycling Road cannot be crossed on foot. Coast down the one-way slope, stopping in the grass strips for a shot at Ponyta while you beat the Bikers and Cue Balls lining the descent."
            "2":
              title: "Sweep the top lane"
              text: "Just past the north gate, the slope opens onto its first stretch. Hug the east lane and press A on the bare tile there for a hidden Rare Candy; nothing shows on-screen."
              hidden:
                rare-candy: "East lane, near the top by the north gate. Press A on the empty tile; nothing appears."
            "3":
              title: "Search the center strip"
              text: "About a third of the way down, drift to the center-left of the road. Press A on the plain tile there to dig out a hidden Full Restore; nothing shows on-screen."
              hidden:
                full-restore: "Center-left of the road, roughly a third down. Press A on the bare tile; nothing appears."
            "4":
              title: "Check the east fence"
              text: "Around the Trainer Tips sign, veer to the far east edge of the road. Press A against the fence tile for a hidden PP Up; nothing shows on-screen."
              hidden:
                pp-up: "Far east edge, level with the Trainer Tips sign. Press A on the fence tile; nothing appears."
            "5":
              title: "Comb the west lane"
              text: "Lower down, swing to the west lane near the Bikers guarding this stretch. Press A on the empty tile there for a hidden Max Revive; nothing shows on-screen."
              hidden:
                max-revive: "West lane, lower third of the road. Press A on the bare tile; nothing appears."
            "6":
              title: "Dig near the bottom"
              text: "Near the foot of the slope, before the Cycling Road Ends sign, stop center-left and press A for a hidden Max Elixir; nothing shows on-screen."
              hidden:
                max-elixir: "Center-left, near the bottom by the Cycling Road Ends sign. Press A; nothing appears."
            "7":
              title: "Exit to Route 18"
              text: "At the foot of the slope, past the Cycling Road Ends sign, roll through the south gate onto Route 18."
          oak:
            ponyta: "A fiery grass catch → Rapidash. One of few Fire types in Yellow."
        route_18:
          note: "East to Fuchsia. Spearow, Rattata, Doduo."
          intro: "A short strip of Bird Keepers bridging Cycling Road to Fuchsia."
          trades:
            parasect:
              npc: "COOK"
              title: "Parasect"
              where: "Upstairs in the Route 18 gate"
              note: "A ready-made Parasect that levels fast thanks to the traded-XP bonus. Tangela is a Safari Zone catch."
          steps:
            "1":
              title: "Cross east"
              text: "Beat the three Bird Keepers along the narrow land strip."
            "2":
              title: "Enter Fuchsia"
              text: "Continue east into Fuchsia City."
        saffron_city:
          mart:
            blurb: "Saffron's Mart stocks Max Repel and Full Heal, open once Team Rocket clears out of the city."
            buy: "Hyper Potions and a Full Heal ready you for Sabrina. Max Repel makes Silph Co.'s floors bearable."
          gym:
            intro: "Warp pads teleport you around the gym in a fixed loop. Take the right pads to reach Sabrina, whose Abra, Kadabra and Alakazam (all Lv 50) hit like a truck. Psychic has no true counter in Gen 1, so out-level her or lead with a strong Bug attacker like Pinsir or Scyther."
            puzzle:
              "1": "Step onto a warp pad and it flings you to another room. Each room has one trainer and two pads: one loops back, one moves you on."
              "2": "The fastest line: from the entrance take the southeast pad, then the northwest pad, then the southwest pad, and the southwest pad once more. Each hop drops you on one trainer to clear, and that sequence lands you in Sabrina's room."
              "3": "The final warp drops you beside Sabrina. Psychic has no counters in Gen 1, so out-level her or lead with a strong Bug attacker."
          note: "Sabrina's Gym. Marsh Badge. Silph Co. and the Dojo."
          intro: "A central city held by Rocket. Free Silph Co., beat Sabrina, and claim a fighter from the Dojo."
          steps:
            "1":
              title: "Bribe the guards"
              text: "Bring a drink from Celadon's Dept. Store to get past each blocked city gate."
            "2":
              title: "Free Silph Co. first"
              text: "The gym stays locked until you clear Rocket-held Silph Co. (see Silph Co.), then enter and solve the teleport-pad maze to Sabrina."
            "3":
              title: "Claim a fighter"
              text: "Beat the Karate Master at the Fighting Dojo to take a free Hitmonlee or Hitmonchan."
          oak:
            hitmonlee: "Free from the Dojo. Pick Hitmonlee or Hitmonchan (you only get one)."
        silph_co:
          note: "Rocket HQ takeover. Lapras and the Master Ball."
          intro: "An 11-floor warp maze. Grab the Card Key, rescue Lapras, and beat Giovanni for the Master Ball."
          steps:
            "1":
              title: "Enter the Rocket-held tower"
              text: "Team Rocket has seized all eleven floors of Silph Co., a warren of one-way warp tiles and Card Key doors. Your first job is to punch up to 5F for the Card Key, which unlocks every sealed item room, then work your way to the top."
            "2":
              title: "Sweep 3F for the Hyper Potion"
              text: "On the third floor, a Poke Ball waits in a room just west of center. Grab the Hyper Potion near its north wall."
              items:
                hyper-potion: "3F, room just west of center; the ball sits near the north wall."
            "3":
              title: "Grab the Max Revive"
              text: "Three Poke Balls sit together in the lower-left of 4F. The northernmost holds a Max Revive."
              items:
                max-revive: "4F, lower-left cluster, the northernmost of three balls."
            "4":
              title: "Pocket the Escape Rope"
              text: "Just southeast of the Max Revive, the middle ball of the trio holds an Escape Rope."
              items:
                escape-rope: "4F, just southeast of the Max Revive."
            "5":
              title: "Take the Full Heal"
              text: "The third ball of the cluster, tucked in the southwest, holds a Full Heal."
              items:
                full-heal: "4F, southwest of the same three-ball cluster."
            "6":
              title: "Seize the Card Key"
              text: "In the far southeast corner of 5F, past the Scientist and his Pokémon Report clipboards, a Poke Ball holds the Card Key. It opens every locked door in the building, so grab it before anything else."
              items:
                card-key: "5F, far southeast corner, past the clipboards."
            "7":
              title: "Bag the Protein"
              text: "In the upper-left room of 5F, a lone Poke Ball holds a Protein."
              items:
                protein: "5F, upper-left room."
            "8":
              title: "Grab TM Take Down"
              text: "Down in the lower-left corner of 5F sits TM Take Down."
              items:
                tm-take-down: "5F, lower-left corner."
            "9":
              title: "Feel out the hidden Elixir"
              text: "Along the north wall of 5F, near center, press A on an empty square for a hidden Elixir. Nothing shows on-screen."
              hidden:
                elixir: "5F, north wall near center; press A facing up. Nothing shows on-screen."
            "10":
              title: "Lift the HP Up"
              text: "In the lower-left corner of 6F, a Poke Ball holds an HP Up."
              items:
                hp-up: "6F, lower-left corner."
            "11":
              title: "Grab the X Accuracy"
              text: "Just south of the HP Up, in the corner of 6F, sits an X Accuracy."
              items:
                x-accuracy: "6F, lower-left corner, just south of the HP Up."
            "12":
              title: "Rescue Lapras and fight your rival"
              text: "On 7F a freed Silph employee hands you a Lapras, the only one in the game and a superb Water/Ice tank. Your rival ambushes you here by the elevator, so heal before you talk to the employee."
            "13":
              title: "Grab the Calcium"
              text: "Against the left wall of 7F, just below where your rival appears, a Poke Ball holds a Calcium."
              items:
                calcium: "7F, left wall, just south of the rival's spot."
            "14":
              title: "Fetch TM Swords Dance"
              text: "Across the floor on the far-right side of 7F sits TM Swords Dance."
              items:
                tm-swords-dance: "7F, far-right side."
            "15":
              title: "Feel out the hidden Max Potion"
              text: "9F has a healing nurse in the lower-left. Stand in the corner beside her and press A for a hidden Max Potion. Nothing shows on-screen."
              hidden:
                max-potion: "9F, lower-left corner by the nurse; press A facing up. Nothing shows on-screen."
            "16":
              title: "Grab TM Earthquake"
              text: "In the lower-left pocket of 10F sits TM Earthquake, one of the best TMs in the game."
              items:
                tm-earthquake: "10F, lower-left pocket."
            "17":
              title: "Pocket the Rare Candy"
              text: "Just southeast of TM Earthquake, a Poke Ball holds a Rare Candy."
              items:
                rare-candy: "10F, just southeast of TM Earthquake."
            "18":
              title: "Take the Carbos"
              text: "At the top of the same lower-left pocket on 10F sits a Carbos."
              items:
                carbos: "10F, top of the lower-left pocket."
            "19":
              title: "Beat Giovanni on 11F"
              text: "Work up to 11F and face Giovanni (Nidorino Lv 37, Rhyhorn Lv 37, Persian Lv 35, Nidoqueen Lv 41). Ground moves like Dig and Earthquake carry the fight. Beating him breaks the takeover."
            "20":
              title: "Take the Master Ball"
              text: "Talk to the Silph president in his office for the Master Ball. Save it for a legendary like Articuno, Zapdos, Moltres or Mewtwo."
          tips:
            lapras: "The only in-game Lapras. A superb Water/Ice tank. Don't miss it on 7F."
          oak:
            lapras: "Free on 7F → a top Water/Ice tank. The only Lapras you'll get in-game."
          gifts:
            lapras:
              from: "FROM A SILPH EMPLOYEE"
        route_19:
          note: "Water route south of Fuchsia. Needs Surf."
          intro: "Open water south of Fuchsia, thick with Tentacool and Swimmers. Surf required."
          steps:
            "1":
              title: "Surf out"
              text: "Surf south from Fuchsia, fishing or battling the Swimmers and Beauties."
            "2":
              title: "Head to Route 20"
              text: "Continue to the beach that leads west into Route 20."
        route_20:
          note: "Water route to Seafoam. Tentacool, Staryu, Shellder."
          intro: "The channel to Seafoam Islands. The only way west toward Cinnabar."
          steps:
            "1":
              title: "Surf west"
              text: "Clear the Swimmers on the east half as you Surf west."
            "2":
              title: "Enter Seafoam"
              text: "Dive into the Seafoam Islands cave in the middle of the route."
        seafoam_islands:
          note: "Boulder-puzzle cave. Wild Articuno inside."
          intro: "A current-filled cave. Push boulders with Strength to slow the water, then catch Articuno."
          steps:
            "1":
              title: "Enter with Surf and Strength"
              text: "Ride in off Route 20 and step into the cave. You need both HMs here: Surf to cross the water currents and Strength to shove the boulders that slow them. Wild Seel, Slowpoke, Shellder and Krabby prowl the floors."
            "2":
              title: "Dam the currents downward"
              text: "Work down through 1F and B1F, pushing each boulder into the current holes so the water below stops flowing. Every dammed current opens another stretch of Surf, carrying you steadily down to B2F."
            "3":
              title: "Pocket the hidden Nugget"
              text: "On B2F, cross to the open cave floor at the lower center of the map. Stand one square west of a plain-looking tile and press A facing east for a hidden Nugget, a pricey sell at any Mart."
              hidden:
                nugget: "B2F, on the open floor at the lower center. Face east and press A. Nothing shows on-screen."
            "4":
              title: "Dig out the Max Elixir"
              text: "Down on B3F, head to the cluster of boulders in the southwest corner. Just south of them, press A facing north on the bare floor for a hidden Max Elixir, which fully refills every move's PP for one Pokémon."
              hidden:
                max-elixir: "B3F, southwest corner just below the boulders. Face north and press A. Nothing shows on-screen."
            "5":
              title: "Catch Articuno"
              text: "B4F opens onto Articuno's chamber. Surf to the sleeping Ice bird perched in the northwest corner (Lv 50) and save before you touch it. Put it to sleep or paralyze it, then use the Master Ball or a long string of Ultra Balls."
            "6":
              title: "Sweep the corner Ultra Ball"
              text: "Before you climb back out, sweep the far southeast corner of B4F. Beside the boulders there, press A facing south for a hidden Ultra Ball to refill your throwing stock."
              hidden:
                ultra-ball: "B4F, far southeast corner beside the boulders. Face south and press A. Nothing shows on-screen."
            "7":
              title: "Exit toward Cinnabar"
              text: "With Articuno caught and the pockets full, ride out the far west mouth of the cave onto the open sea and Surf south to Cinnabar Island."
          tips:
            articuno: "A one-time Lv 50 legendary. Save first, sleep/paralyze it, and use the Master Ball or a lot of Ultra Balls."
          oak:
            seel: "A cave catch → Dewgong, a solid Water/Ice. Grab the base."
            articuno: "The Ice legendary of Seafoam. One shot only. Catch it now."
        power_plant:
          note: "Optional Surf detour. Electric mons, a rare Muk, and Zapdos."
          intro: "An abandoned plant off Route 10, reachable only by Surf. Electric and Poison types roam the floors, and the legendary Zapdos waits deep inside."
          steps:
            "1":
              title: "Surf in from Route 10"
              text: "Once you have Surf, ride the water south from the Rock Tunnel entrance on Route 10 to the plant's lone door and step inside. The floors hum with wild Electric and Poison types, so pack Repels if you only want the loot and Zapdos. Fair warning: many of the item balls scattered here are Voltorb or Electrode in disguise that burst to life and attack the moment you reach for one."
            "2":
              title: "Grab the Carbos on the west wall"
              text: "Head up the left side from the door. Tucked against the west wall, low in the plant, sits a real item ball: a Carbos to boost a Pokémon's Speed. Grab it facing east."
              items:
                carbos: "Against the west wall, low in the plant. Face east to take it."
            "3":
              title: "Poke the first fake ball"
              text: "Climb the corridor above the Carbos alcove. The ball waiting at left-center is your first disguised Voltorb (Lv 40); touch it and it snaps awake for a battle. Log it for the dex, then move on."
            "4":
              title: "Cross into the south-center room"
              text: "Wind east and down into the middle of the plant. A ball sits in the south-center room, and it is another Voltorb (Lv 40) playing dead. Take the fight or walk past it."
            "5":
              title: "Nudge the ball just below"
              text: "A short step east and down sits yet another fake ball, a Voltorb (Lv 40) in the lower-center. Same disguise, same jolt when you touch it."
            "6":
              title: "Bag TM33 Reflect"
              text: "Drop into the wide south room. Dead center sits a genuine ball holding TM33 (Reflect), which halves physical damage taken for a few turns. Grab it facing north."
              items:
                tm-reflect: "Center of the south room. Face north to take it."
            "7":
              title: "Check the ball on the south wall"
              text: "Just east of the TM, against the south wall, sits another ball. It is a Voltorb (Lv 40) in disguise, so face east and expect a scuffle."
            "8":
              title: "Bag TM25 Thunder"
              text: "East of center in the south room waits a real ball with TM25 (Thunder), the plant's signature 110-power Electric move. Grab it facing east."
              items:
                tm-thunder: "South room, east of center. Face east to take it."
            "9":
              title: "Sweep the south-east corner"
              text: "Push into the far south-east corner for the last ball down here. Another Voltorb (Lv 40) disguise; grab it facing west, then head back up."
            "10":
              title: "Feel for the hidden Max Elixir"
              text: "Back in the middle of the plant, stand on the open floor and press A on the tile just to your west, one square east of the little wall nub. A hidden Max Elixir is there even though nothing shows on-screen."
              hidden:
                max-elixir: "Dead center of the plant, one tile east of the wall nub. Press A facing west; nothing shows on-screen."
            "11":
              title: "Wake the Electrode ball"
              text: "A ball sits in the center of the plant, but this one is a tougher disguise: an Electrode (Lv 43). Grab it facing south and brace for a possible Selfdestruct."
            "12":
              title: "Check the east-center ball"
              text: "Slightly east sits one more ball, a Voltorb (Lv 40) in disguise. Grab it facing west before you climb toward the top of the plant."
            "13":
              title: "Grab the HP Up up top"
              text: "Climb the east side and follow the top row. Right of center sits a real ball with an HP Up to raise a Pokémon's max HP. Take it facing north."
              items:
                hp-up: "Top row, right of center. Face north to take it."
            "14":
              title: "Snag the Rare Candy"
              text: "In the top-right corner waits a genuine ball with a Rare Candy, a free level for any Pokémon. Grab it facing west."
              items:
                rare-candy: "Top-right corner. Face west to take it."
            "15":
              title: "Wake the last Electrode"
              text: "Sweep back west across the top. In the upper-center sits the second Electrode (Lv 43) disguise; grab it facing east and brace for another Selfdestruct."
            "16":
              title: "Feel for the hidden PP Up"
              text: "Near the top-left, walk up to the north wall left of center and press A facing up. A hidden PP Up sits against the wall, invisible until it lands in your bag."
              hidden:
                pp-up: "Against the north wall, left of center. Press A facing north; nothing shows on-screen."
            "17":
              title: "Catch Zapdos"
              text: "Drop down to the far north-west, near the plant's west door, where Zapdos (Lv 50) roosts. Save first, chip it with Rock or Ice, put it to sleep or paralyze it, then throw Ultra Balls or the Master Ball. You only get one shot at it."
            "18":
              title: "Surf back out to Route 10"
              text: "With Zapdos caught and the plant stripped clean, step out the south door and Surf back onto Route 10. From here it is on toward Rock Tunnel and Lavender Town."
          tips:
            zapdos: "The Electric legendary, a one-time Lv 50 static. Save before you touch it, then sleep or paralyze and ball it down."
          oak:
            zapdos: "The Electric bird of the Power Plant. One shot only. Catch it while you are here."
            voltorb: "All over the floors (and disguised as items) → Electrode. Grab one for the dex."
        cinnabar_island:
          mart:
            blurb: "The island Mart carries the full late-game shelf: Ultra Balls, Hyper Potions and Full Heals."
            buy: "Ultra Balls for the Mansion's rare spawns, plus Hyper Potions and Revives for Blaine's fire types."
          gym:
            intro: "Locked doors bar the way to Blaine, each opened by answering a quiz or beating the trainer behind it. His Ninetales (Lv 48), Rapidash (Lv 50) and Arcanine (Lv 54) hit hard and fast, so bring a Water, Rock or Ground attacker and pack Burn Heals."
            puzzle:
              "1": "Each door poses a yes or no Pokémon quiz. Answer correctly and it opens; answer wrong and you battle the trainer behind it, which opens it anyway."
              "2": "If you would rather not guess, the answers in order are yes, no, no, no, yes, no. Or skip the quizzes and fight every trainer instead; the doors open either way and both routes reach the back."
              "3": "The final door opens onto Blaine. A single strong Water, Rock or Ground move drops his Ninetales, Rapidash and Arcanine in a hurry."
          note: "Blaine's Gym. Volcano Badge. Fossil lab."
          intro: "A volcanic island. Revive your fossils at the lab, get the Secret Key from the Mansion, then beat Blaine."
          trades:
            muk:
              npc: "SCIENTIST"
              title: "Muk"
              where: "The fossil room of the Pokémon Lab"
              note: "A high-level Muk with no grinding. Kangaskhan is a Safari Zone catch."
            rhydon:
              npc: "OLD MAN"
              title: "Rhydon"
              where: "The trade room of the Pokémon Lab"
              note: "A traded Rhydon comes in strong and gains boosted XP."
            dewgong:
              npc: "BEAUTY"
              title: "Dewgong"
              where: "The trade room of the Pokémon Lab"
              note: "Dewgong for a Growlithe, plus the traded-XP bonus. Growlithe roams the Pokémon Mansion next door."
          steps:
            "1":
              title: "Clear the Mansion first"
              text: "Blaine's gym is locked. Cross the street to the Pokémon Mansion and fetch the Secret Key."
            "2":
              title: "Hand in a fossil, then the Gym"
              text: "Give a fossil to the scientist at the Lab, then open the gym with the Secret Key and work the quiz doors to Blaine. Water, Ground or Rock melts his Fire team."
            "3":
              title: "Collect your fossil and move on"
              text: "Return to the Lab later for the revived fossil Pokémon, then Surf out toward the last badge."
          tips:
            omanyte: "Revive the Helix Fossil here → Omanyte, then Omastar. A Rock/Water only found this way."
            kabuto: "Revive the Dome Fossil → Kabuto, then Kabutops. The other fossil line."
            aerodactyl: "Revive the Old Amber (Pewter museum) → Aerodactyl, a rare Rock/Flying."
          oak:
            omanyte: "Revive whichever fossil you chose in Mt. Moon. Helix → Omanyte."
            kabuto: "Dome Fossil → Kabuto. You can only revive the one fossil you kept."
            aerodactyl: "Old Amber from Pewter's museum → Aerodactyl. Register the single specimen."
        pokemon_mansion:
          note: "Burnt-out mansion. Fire types and the Secret Key."
          intro: "A statue-switch maze full of Fire and Poison mons. Find the Secret Key on B1F."
          steps:
            "1":
              title: "Enter the burned mansion"
              text: "Cross from the Cinnabar shore into the charred mansion. Inside it is a maze of barred paths, each one locked until you press the hidden switch inside a nearby statue, and the floors crawl with Fire and Poison mons (wild Vulpix, Growlithe and the rare Magmar). The prize is the Secret Key two floors down on B1F, so climb up flipping switches, then work back down."
            "2":
              title: "Grab the Carbos on 1F"
              text: "Just inside, sweep the east side of the ground floor. The Carbos (a Speed vitamin) sits in a ball on the east side, just south of the Scientist you battle on the way up."
              items:
                carbos: "East side of 1F, south of the Scientist trainer."
            "3":
              title: "Search the 1F pillars for a Moon Stone"
              text: "By the pillars in the west-central part of 1F, press A on the empty floor to turn up a hidden Moon Stone (it evolves Nidorina, Nidorino, Clefairy and Jigglypuff). Nothing shows on-screen, so trust the tile."
              hidden:
                moon-stone: "West-central 1F, on the floor beside the pillars. Press A; nothing is visible."
            "4":
              title: "Pick up the Escape Rope up north"
              text: "Follow the opened path to the far north wall of 1F, where an Escape Rope waits in a ball. It is a free instant exit from the mansion for later, so pocket it before taking the stairs up."
              items:
                escape-rope: "Far north edge of 1F, north-central."
            "5":
              title: "Flip the switches and climb to 2F"
              text: "Press A on the statues to trip the hidden switches, dropping the barriers that block the western staircase, then take the stairs up to 2F."
            "6":
              title: "Cross 2F for the Calcium"
              text: "On 2F, work east past the pacing Burglar to the far wall. The Calcium (a Special vitamin) sits in a ball in the northeast corner. Flip the 2F statue switch while you are here, then head up to 3F."
              items:
                calcium: "Northeast corner of 2F."
            "7":
              title: "Sweep 3F east for the Iron"
              text: "On the top floor you face a Burglar and a Scientist. Push to the northeast side, past the Scientist, and open the ball for the Iron (a Defense vitamin)."
              items:
                iron: "Northeast area of 3F, past the Scientist."
            "8":
              title: "Grab the Max Potion in the 3F southwest"
              text: "Backtrack all the way across 3F to the far southwest and grab the Max Potion in its ball against the west wall (a full HP heal)."
              items:
                max-potion: "Southwest corner of 3F, against the west wall."
            "9":
              title: "Check up the west wall for a hidden Max Revive"
              text: "Head up the west wall from that Max Potion and press A on the bare floor around mid-height to dig up a hidden Max Revive (revives with full HP and PP). Nothing shows on-screen, so trust the spot."
              hidden:
                max-revive: "West wall of 3F, a stretch north of the Max Potion. Press A; nothing appears."
            "10":
              title: "Work back down to B1F"
              text: "With the upper switches flipped, the barrier to the basement stairs on 1F is finally open. Retrace your way down through 3F and 2F to 1F, then take the newly cleared stairs in the southeast down to B1F."
            "11":
              title: "Bag TM14 Blizzard by the B1F stairs"
              text: "You land in the southeast of B1F. Just southwest of the stairs, open the ball for TM14 (Blizzard), a top-tier Ice attack worth teaching a strong Water type."
              items:
                tm-blizzard: "Southeast B1F, just southwest of the entrance stairs."
            "12":
              title: "Cross to the Full Restore in the southwest"
              text: "Wind west along the bottom of the basement to the far southwest corner, where a Full Restore (full HP heal plus status cure) sits in a ball."
              items:
                full-restore: "Southwest corner of B1F."
            "13":
              title: "Claim the Secret Key"
              text: "Head north into the small central chamber and open the ball holding the Secret Key. This is the whole reason for the trip: it unlocks Blaine's Gym across the street on Cinnabar Island."
              items:
                secret-key: "Center-west room of B1F, north of the Full Restore."
            "14":
              title: "Dig a hidden Rare Candy from the NW corner"
              text: "In the northwest of that same room, press A against the corner floor to turn up a hidden Rare Candy (one free level). Nothing shows on-screen, so check the empty tile."
              hidden:
                rare-candy: "Northwest corner of the B1F Secret Key room. Press A; nothing is visible."
            "15":
              title: "Grab TM22 SolarBeam in the northwest"
              text: "Continue north from that corner to the ball holding TM22 (SolarBeam), the strongest Grass move in the game."
              items:
                tm-solarbeam: "Northwest B1F, north of the hidden Rare Candy corner."
            "16":
              title: "Snag the last Rare Candy up top"
              text: "Just east along the north wall, open the final ball for a second Rare Candy. Save these to bump a slow-leveling favorite past a stubborn level gate, then head back to the stairs."
              items:
                rare-candy: "North edge of B1F, center, east of TM22."
            "17":
              title: "Leave and cross to Blaine's Gym"
              text: "With the Secret Key in hand and the basement cleared, use the Escape Rope (or walk out) back to Cinnabar Island. Cross the street and unlock Blaine's Gym for the Volcano Badge."
          tips:
            vulpix: "Yellow puts both Vulpix and Growlithe here. An easy wild Vulpix for once."
            growlithe: "The other Fire dog, here in the same mansion → Arcanine with a Fire Stone."
            magmar: "A rare Fire catch on the lower floors. One of few Magmar sources."
          oak:
            vulpix: "Wild here in Yellow (elsewhere trade-only) → Ninetales. Grab one."
            growlithe: "Also wild here → Arcanine with a Fire Stone. Log the base."
            magmar: "A rare mansion catch. A strong Fire attacker. Bank one."
        route_21:
          note: "Water route back to Pallet. Fishing plus a Pallet-side grass patch."
          intro: "The sea route between Cinnabar and Pallet. Surf and fish it on the way back to Viridian for the last gym; a small grass patch by Pallet holds land catches."
          steps:
            "1":
              title: "Surf north toward Pallet"
              text: "From Cinnabar, Surf north up the channel, clearing the Swimmers as you go. Tentacool fills the open water."
            "2":
              title: "Fish and sweep the grass"
              text: "Super Rod the water for Magikarp, Goldeen, Shellder and Staryu, then check the grass patch just south of Pallet for Pidgey and Rattata plus wild Pidgeotto and Raticate. Land at Pallet and head up to Viridian for the Earth Badge."
          tips:
            magikarp: "Fish one here and grind it to Lv 20; it becomes Gyarados, one of the strongest Water types in the game."
            goldeen: "A reliable Super Rod catch → Seaking. An easy spot to log the line."
          oak:
            magikarp: "Super Rod it here → Gyarados. Weak now, monstrous once it evolves."
            goldeen: "Fish one → Seaking. Register the base while you are fishing anyway."
        viridian_gym:
          gym:
            intro: "The last Kanto gym, a spinner-tile maze packed with eight trainers. Giovanni waits at the top with Dugtrio (Lv 50), Persian (Lv 53), Nidoqueen (Lv 53), Nidoking (Lv 55) and Rhydon (Lv 55). Dugtrio's Fissure and Rhydon's Horn Drill are one-hit KOs, so out-speed them and pack Water, Grass or Ice."
            puzzle:
              "1": "Spinner tiles fling you in a straight line until you hit a stop tile. Plan each launch so you land where you can reach the next trainer."
              "2": "Clear trainers to open the northern path, then ride the spinners north and west, correcting your line at each stop toward Giovanni."
              "3": "The final spinners drop you in front of Giovanni. Watch for Fissure and Horn Drill one-hit KOs and lead with a fast Water or Ice attacker."
          note: "Giovanni's Gym. Earth Badge. The 8th badge."
          intro: "The final Kanto gym, back in Viridian. Beat Giovanni's Ground team for the last badge."
          steps:
            "1":
              title: "Prep and enter the Gym"
              text: "Top off Potions and Revives before you step in, because there is no healing between the eight trainers. Enter from the south past the Gym Guide, and the floor turns into a maze of spinner tiles that fling you in a straight line until you hit a stop."
            "2":
              title: "Grab the Revive"
              text: "A Poke Ball rests on the east side of the maze, straight north up the column of the south entrance. Ride the spinners to line up on it and pocket the free Revive before you climb toward Giovanni."
              items:
                revive: "East side, straight north of the south door, about halfway up the gym."
            "3":
              title: "Ride the spinners to Giovanni"
              text: "Beat the trainers to open the northern path, then correct your launch at each stop tile as you spiral north and west. Giovanni waits at the top with his Ground team; watch Dugtrio's Fissure and Rhydon's Horn Drill, lead fast with Water, Grass or Ice, and take the Earth Badge, your eighth."
            "4":
              title: "On to Victory Road"
              text: "With the Earth Badge and all eight in hand, leave the gym and head back to Route 22, then push west into Victory Road."
        victory_road:
          note: "The League gate. Boulder puzzles and Moltres."
          intro: "A three-floor boulder maze that needs all 8 badges and Strength. Moltres roosts inside."
          steps:
            "1":
              title: "Step in with Strength ready"
              text: "Victory Road opens only for a Trainer holding all 8 badges. Bring Strength for the boulders, plus Surf and Flash to see and cross the dark. Walk in from the north end of Route 23; the cave climbs across three floors, and each one is locked by a boulder you shove onto a floor switch to drop its barrier."
            "2":
              title: "Grab the Rare Candy"
              text: "Head up from the entrance into 1F's upper chamber. A Poke Ball on the north ledge holds a Rare Candy, one free level for any teammate."
              items:
                rare-candy: "1F, north ledge of the upper chamber, just west of center."
            "3":
              title: "Bag TM43 Sky Attack"
              text: "A couple of tiles east, right against the top wall, another ball holds TM43 Sky Attack, a heavy two-turn Flying move."
              items:
                tm-sky-attack: "1F, against the top wall, a few steps east of the Rare Candy."
            "4":
              title: "Take the ladder to 2F"
              text: "With 1F cleared, cross to the northwest ladder and climb to the second floor, the tangled hub where Moltres roosts."
            "5":
              title: "Feel out the hidden Ultra Ball"
              text: "Step onto 2F and work to the northwest ledge. Press A on the empty square there for a hidden Ultra Ball; nothing shows on-screen, so trust the spot."
              hidden:
                ultra-ball: "2F, northwest ledge. Press A on the bare tile; no item is visible."
            "6":
              title: "Pick up the Guard Spec."
              text: "Just below the top wall, near the center of 2F, a ball holds a Guard Spec., which blocks stat drops for a few turns."
              items:
                guard-spec: "2F, top-center, against the north wall."
            "7":
              title: "Catch Moltres"
              text: "West of center, Moltres (Lv 50) is roosting on the rock. Save first, chip it down with Water, Electric or Rock, put it to sleep or paralyze it, then throw Ultra Balls. You get one shot at it."
            "8":
              title: "Grab TM05 Mega Kick"
              text: "Drop south to the lower center of 2F, where a ball holds TM05 Mega Kick, a strong Normal attack."
              items:
                tm-mega-kick: "2F, south-center of the floor."
            "9":
              title: "Pocket the Full Heal"
              text: "Cross east through the middle of 2F to a ball holding a Full Heal, which clears any status ailment."
              items:
                full-heal: "2F, middle of the floor, east of center."
            "10":
              title: "Sweep for the hidden Full Restore"
              text: "Push on toward the eastern ladders and press A on the empty square there for a hidden Full Restore. Nothing appears on-screen, so search the exact tile."
              hidden:
                full-restore: "2F, far east near the exit ladders. Press A on the bare tile; no item shows."
            "11":
              title: "Bag TM17 Submission"
              text: "In the northeast corner of 2F, a ball holds TM17 Submission, a recoil Fighting move."
              items:
                tm-submission: "2F, northeast corner."
            "12":
              title: "Climb to 3F"
              text: "Take the east ladder up to 3F and its four-boulder puzzle. Shove the boulders onto their switches to clear the path to the last two prizes."
            "13":
              title: "Grab the Max Revive"
              text: "Near where you arrive on 3F, on the east side, a ball holds a Max Revive, which fully restores a fainted Pokémon."
              items:
                max-revive: "3F, east side, close to the ladders up."
            "14":
              title: "Bag TM47 Explosion"
              text: "Work the boulders west across 3F to reach the far ball, TM47 Explosion, the game's strongest one-shot Normal move."
              items:
                tm-explosion: "3F, far west."
            "15":
              title: "Leave for Indigo Plateau"
              text: "With every prize collected and Moltres caught, drop back to 2F and step out the east exit onto the approach to the Indigo Plateau."
          tips:
            moltres: "The Fire legendary of Victory Road. A one-time Lv 50. Save first, then chip and ball it."
          oak:
            moltres: "The Fire bird roosting in Victory Road. One shot only. Catch it on the way through."
        route_23:
          note: "Badge checkpoints to the League. High-level grass."
          intro: "The gated road to the League. Every guard checks a badge. Wild mons here are strong."
          steps:
            "1":
              title: "Enter from the Route 22 gate"
              text: "Step in from the south, out of the Route 22 gate. Seven guard posts line the road to the League, and each one opens only if you carry the matching badge, so you need all 8 before Route 23 will wave you through. The grass runs high here, with level 33 to 45 Ditto, Sandslash and Nidos, so keep your heals topped off."
            "2":
              title: "Search the mid-channel ledge"
              text: "Past the lower guards the road opens into a wide channel, so Surf north across it. A small dry ledge breaks the water between the two Swimmers. Step onto it and press A facing north to turn up a hidden Max Ether. Nothing shows on-screen."
              hidden:
                max-ether: "On the little dry ledge in the middle of the water, between the two Swimmers. Press A facing north. Nothing shows on-screen."
            "3":
              title: "Sweep the northeast corner"
              text: "Surf out onto the north bank and cut east through the grass into the corner pocket. Walk to the far wall and press A against the east edge for a hidden Ultra Ball. Nothing shows on-screen."
              hidden:
                ultra-ball: "Far northeast corner of the grassy pocket just past the water, tight against the east wall. Press A facing east. Nothing shows on-screen."
            "4":
              title: "Comb the top clearing"
              text: "Wind up through the land maze to the grassy clearing near the north end. Stand in the grass and press A against the rock face to the west to dig out a hidden Full Restore. Nothing shows on-screen."
              hidden:
                full-restore: "In the grass near the top of the route, one square east of the rock wall. Press A facing west. Nothing shows on-screen."
            "5":
              title: "Enter Victory Road"
              text: "Follow the west side up past the last guard and step through the gate at the top into Victory Road, the final cave before the Pokémon League."
        indigo_plateau:
          note: "The Pokémon League. Elite Four and Champion Blue."
          intro: "The final five battles, back to back, with no healing between rooms. Stock up first."
          steps:
            "1":
              title: "Stock up"
              text: "Heal and buy Full Restores, status heals and Ultra Balls in the lobby before you enter."
            "2":
              title: "Beat the Elite Four"
              text: "Lorelei (Ice/Water), Bruno (Fighting/Rock), Agatha (Ghost/Poison), Lance (Dragon). Hit each with its weakness."
            "3":
              title: "Beat Champion Blue"
              text: "Your rival leads with Sandslash (Lv 61) and fields Alakazam, Exeggutor, a Magneton or Cloyster, Ninetales, and the Eeveelution his Eevee became (Lv 65). Alakazam carries Recover, so break it with physical moves. Win to enter the Hall of Fame."
        cerulean_cave:
          note: "Post-game dungeon. The strongest wilds. And Mewtwo."
          intro: "Unlocked after becoming Champion. The toughest wild Pokémon in Kanto, with Mewtwo waiting at the bottom."
          steps:
            "1":
              title: "Surf into the cave"
              text: "After the Hall of Fame, Surf northwest across the water from Cerulean City and step into the cave mouth. You land on 1F in the flooded southern chamber, surrounded by Kanto's toughest wilds (Lv 45-65 Rhydon, Chansey, Ditto, Kadabra and more)."
            "2":
              title: "Surf to the flooded corner"
              text: "From the entrance pool, Surf east to the far corner and grab the Rare Candy sitting alone on the water at the cave's southeast edge."
              items:
                rare-candy-29-16: "Southeast corner of 1F, out on the water past the entrance pool. Surf to reach it."
            "3":
              title: "Climb the east ledge"
              text: "Follow the east wall north out of the water onto the ledge and pick up the Max Revive at the right edge of 1F."
              items:
                max-revive-29-9: "Right (east) edge of 1F, on the ledge just north of the flooded corner."
            "4":
              title: "Feel around the center stair"
              text: "Work into the middle of 1F, to the up-staircase in the central chamber. Press A on the ground two squares north of that staircase for a hidden PP Up. Nothing shows on-screen."
              hidden:
                pp-up-18-7: "Center of 1F, two squares north of the central up-staircase. Press A; nothing shows on-screen."
            "5":
              title: "Reach the north shelf"
              text: "Head up from the center to the top of 1F and grab the Ultra Ball tucked against the north wall near the middle."
              items:
                ultra-ball-18-3: "Top-center of 1F, against the north wall."
            "6":
              title: "Sweep the west side"
              text: "Cross to the left side of 1F and collect the Max Elixir in the west-central chamber, by the lower staircases."
              items:
                max-elixir-7-11: "West-center of 1F, near the lower-left staircases."
            "7":
              title: "Climb to 2F"
              text: "Take one of the up-staircases to 2F, a dry rock maze with no water at all. Wind through its corridors to sweep four more prizes."
            "8":
              title: "Push to the far-west wall"
              text: "Follow the corridors out to the far-left edge of 2F and grab the Rare Candy pressed against the west wall."
              items:
                rare-candy-0-11: "Far-left (west) edge of 2F, mid-height, against the wall."
            "9":
              title: "Take the central ball"
              text: "Head back to the middle of 2F and pick up the Ultra Ball sitting in the central corridor."
              items:
                ultra-ball-16-7: "Center of 2F, in the middle corridor."
            "10":
              title: "Search straight below"
              text: "Drop south down the same column as the central Ultra Ball into the lower maze and press A on the ground for a hidden PP Up. Nothing shows on-screen."
              hidden:
                pp-up-16-13: "Center-south of 2F, straight down from the central Ultra Ball. Press A; nothing shows on-screen."
            "11":
              title: "Grab the mid ledge"
              text: "Just east of the hidden spot, collect the Max Revive in the lower-center of 2F."
              items:
                max-revive-19-11: "Lower-center of 2F, just east of the hidden PP Up."
            "12":
              title: "Clear the east chamber"
              text: "Wind to the right side of 2F and take the Full Restore near the east wall."
              items:
                full-restore: "Right (east) side of 2F, near the east wall."
            "13":
              title: "Drop to B1F"
              text: "Cut back down to 1F and cross to its far-left staircase on the west edge, which leads down to B1F, the bottom floor where Mewtwo waits. You arrive on the west side."
            "14":
              title: "Sweep the southwest nook"
              text: "From the arrival point, head down to the southwest and grab the Ultra Ball at the left edge, just above the bottom water."
              items:
                ultra-ball-2-13: "Southwest of B1F, at the left edge just above the bottom water."
            "15":
              title: "Grab its neighbor"
              text: "One square east of that Ultra Ball sits a Max Revive. Scoop it up too."
              items:
                max-revive-3-13: "Southwest of B1F, one square east of the Ultra Ball."
            "16":
              title: "Probe the south shore"
              text: "A little east along the bottom of B1F, press A on the ground at the water's edge for a hidden PP Up. Nothing shows on-screen."
              hidden:
                pp-up-8-14: "South edge of B1F, a few squares east of the Max Revive, at the water's edge. Press A; nothing shows on-screen."
            "17":
              title: "Reach the north-center"
              text: "Head up and across the middle of B1F to the north-center and take the Max Elixir there, near the top wall."
              items:
                max-elixir-15-3: "North-center of B1F, near the top wall."
            "18":
              title: "Corner the northeast ball"
              text: "Continue to the top-right corner of B1F and grab the last Ultra Ball against the north wall."
              items:
                ultra-ball-26-1: "Top-right (northeast) corner of B1F, against the north wall."
            "19":
              title: "Save before Mewtwo"
              text: "Work down to the southeast landmass and Surf across the water toward Mewtwo's platform. Before you step onto it, save your game: you get a single shot at this Lv 70 legend."
            "20":
              title: "Catch Mewtwo"
              text: "Mewtwo stands at the heart of the southeast island. It is Lv 70 and spams Recover, so put it to sleep or paralyze it, chip it low, then throw the Master Ball, or settle in with a big stack of Ultra Balls."
          tips:
            mewtwo: "The strongest Pokémon in the game, a Lv 70 static. The Master Ball is made for this. Or sleep it and pray."
          oak:
            mewtwo: "The post-game legendary at the bottom of the cave. Save the Master Ball for it."
            chansey: "Far more common here than the Safari. A great EXP catch while you're deep in the cave."
