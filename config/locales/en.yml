          lead: "Bring something with a sleep move. Any of these learn one by level-up and are catchable by Cerulean."
        moves:
          sleep_powder: "Sleep Powder"
          sing: "Sing"
        steps:
          eyebrow: "THE GLITCH · STEP BY STEP"
          h2: "Cerulean method, start to catch"
          lead: "Three phases. Save before the second one: if a step goes wrong, a reset is cheaper than a soft lock."
        phases:
          setup:
            label: "PHASE 1 · SETUP"
            title: "Clear the board"
            meta: "Nugget Bridge + an Abra"
            steps:
              route24:
                title: "Head north into Route 24"
                text: "Leave Cerulean north and beat your rival if you haven't already. Stay out of the tall grass to the west."
              bridge:
                title: "Clear Nugget Bridge, all six"
                text: "Beat the five bridge Trainers and the Rocket at the end. Do not touch the Jr. Trainer♂ standing in the grass to the left of the bridge."
                tag: "DO NOT BEAT"
                note_label: "WHY"
                note: "That grass Trainer is the whole glitch. If he's gone, so is your Mew."
              youngster:
                title: "Cross to Route 25, spare the Slowpoke kid"
                text: "Head over Nugget Bridge onto Route 25 and press on toward Bill. Near the start stands a Youngster with a single Slowpoke. Walk right past him."
                tag: "SECOND MEW"
                note_label: "WHY"
                note: "Only matters if you want a second Mew later. That Slowpoke kid is the substitute battle for a repeat run, so beating him now costs you the encore until you reset."
              abra:
                title: "Get an Abra with Teleport"
                text: "There is no wild Abra before Bill, so reach him first, then catch an Abra in the grass on Route 5. Come back to Cerulean once it knows Teleport."
                tag: "THE LONG WAIT"
                note_label: "COST"
                note: "Visiting Bill is what makes that police officer visible, and losable. Read the warning above."
          glitch:
            label: "PHASE 2 · THE GLITCH"
            title: "Break the encounter"
            meta: "Save before this phase"
            steps:
              center:
                title: "Save, then heal in Cerulean"
                text: "Save your game. Then use the Cerulean Poké Center so Teleport brings you back here."
              lineup:
                title: "Line up on the grass Trainer"
                text: "Line up in the Jr. Trainer♂'s column on Route 24, far enough north that his sprite sits just off the bottom of the screen. One step south would put you in his sight."
                note_label: "CHECK"
                note: "He must be offscreen. On screen, he simply walks over and battles you normally."
              start:
                title: "Step down holding START"
                text: "Hold the START Button as you step into his line of sight. The menu opens on the same frame the exclamation mark appears."
                tag: "TIMING"
              teleport:
                title: "Teleport away with Abra"
                text: "From the menu, pick POKéMON, then Abra, then Teleport. You warp to Cerulean before he takes a step."
                note_label: "EXPECTED"
                note: "Your menu and the A/B Buttons now do nothing outside a PC. Nothing has broken, keep walking."
              swimmer:
                title: "Beat the Swimmer in the Gym"
                text: "Go straight to Cerulean Gym and battle the Trainer on the right. Approach so he swims at least one tile toward you, then beat his Lv 16 Horsea and Shellder."
                tag: "SOFT LOCK RISK"
                note_label: "CAREFUL"
                note: "If he doesn't move before the battle starts, the game locks. Never talk to him from the right-hand side."
          catch:
            label: "PHASE 3 · CATCH"
            title: "Meet No. 151"
            meta: "No detours on the way back"
            steps:
              return:
                title: "Walk straight back to Route 24"
                text: "Leave the Gym and head north out of Cerulean. Do not enter any other area: every detour risks deleting something from it."
                tag: "NO DETOURS"
              encounter:
                title: "Close the menu that opens itself"
                text: "The moment you enter Route 24 the menu pops open on its own. Press B. A Lv 7 Mew appears."
              catch:
                title: "Put it to sleep, then throw"
                text: "Whittle the HP, land a sleep move, and start throwing. Mew's catch rate is poor and Poké Balls are all Cerulean sells, so bring twenty and be patient."
                note_label: "LEVEL"
                note: "Want a different level? Growl the Shellder in phase 2 first, see the calculator below."
        calc:
          eyebrow: "LEVEL CALCULATOR"
          h2: "Pick the Mew you want"
          lead: "Mew's level is read from the Attack stat stage of the last Pokémon you battled. The game stores stages as 1–13 instead of -6 to +6, so an untouched opponent gives Lv 7. Every Growl you land on that Shellder (or Slowpoke) drops Mew one level."
          caption: "ATTACK STAT STAGE OF THE LAST OPPONENT"
          spawns: "YOUR MEW SPAWNS AT"
          lv_label: "Lv"
          recipe:
            untouched: "> untouched opponent, no stat moves used"
            growl: "> land %{n}× Growl on the last opponent"
            growl_underflow: "> land %{n}× Growl on the last opponent, then underflow it to Lv 100"
            raised:
              one: "> the opponent's Attack must be raised %{count} stage, rare in practice"
              other: "> the opponent's Attack must be raised %{count} stages, rare in practice"
          internal: "// internal value %{value} = stage %{stage} → level %{level}"
          lv100:
            label: "THE LV 100 ROUTE"
            text: "Land six Growls to catch a Lv 1 Mew, then run the experience-underflow glitch on it to shoot straight to Lv 100. Keep a free party slot: withdrawing a Lv 1 Mew from the PC soft locks the game. It learns nothing by level-up afterwards, which barely matters: Mew can learn every TM in the game."
          vc:
            label: "VIRTUAL CONSOLE · LEGITIMACY"
            text: "Poké Transporter only accepts a Mew that looks like the Virtual Console event one. That means an Original Trainer of GF (or ゲーフリ) and Trainer ID 22796."
            ot_label: "OT NAME"
            tid_label: "TRAINER ID"
            foot: "You can name yourself GF at the start; the ID is random, so matching it means RNG manipulation, cheats, or a lot of resets. The event Mew also has 15 IVs across the board, pleasant but irrelevant to Transporter."
        second:
          eyebrow: "ENCORE · SECOND MEW"
          h2: "Run it again with the Slowpoke kid"
          note: "SAVE FIRST · SAME GRASS TRAINER"
          lead: "The Jr. Trainer♂ in the grass can start the glitch as many times as you like. Swap the Gym Swimmer for the Youngster with the lone Slowpoke on Route 25 and you get another Mew."
          "1":
            title: "Clear Route 25 partway"
            text: "Beat Trainers along Route 25 until you can reach the Youngster with the lone Slowpoke. Leave him standing."
          "2":
            title: "Save"
            text: "You already have one Mew. Save before risking anything."
          "3":
            title: "Trigger the grass Trainer again"
            text: "Same move as before: step into the Jr. Trainer♂'s sight on Route 24 while holding START."
          "4":
            title: "Teleport to Cerulean"
            text: "Abra warps you home and your buttons go dead again."
          "5":
            title: "Battle the Slowpoke kid"
            text: "Walk to him on Route 25 and make sure he takes at least one step toward you, or the game soft locks. His Slowpoke's Attack stage sets the level."
          "6":
            title: "Back to Route 24"
            text: "Walk back, press B on the menu that opens itself, and catch Mew number two."
        after:
          art_alt: "Red with Mew, art by Ken Sugimori"
          art_tag: "No. 151 · REGISTERED"
          eyebrow: "AFTERWORD"
          h2: "One Pokémon the game never meant to give you"
          text: "This is one flavour of the Trainer-Fly glitch, which can produce any Pokémon in the game. The Cerulean pair are just the earliest and safest. Other setups exist, with more moving parts and more ways to lose an NPC. Catch Mew here and your dex is complete without a single event ticket."
          back: "◀ BACK TO CERULEAN"
          credit: "art by Ken Sugimori · © Nintendo / Creatures / Game Freak"
        teaser:
          tag: "OPTIONAL · GLITCH"
          window: "EARLIEST WINDOW IN THE GAME"
          title_html: "Want <span class=\"pn-mew-teaser__word\" data-text=\"Mew\">Mew</span>? Don't beat this Gym yet."
          lead: "Mew is otherwise event-only, and Cerulean is the first place you can pull the infamous Mew glitch to get one in-game. You'll need to push most of the way through Route 24 first; we'll remind you when you're there. If you want it, leave the Swimmer and Misty standing for now."
          cta: "FULL MEW GLITCH GUIDE ▶"
          meta: "~15 min · costs one background NPC"
        index:
          kind: "GLITCH"
          where: "CERULEAN · PRE-MISTY"
          name: "The Mew glitch"
          note: "Catch #151 in-game. Full steps, warnings and a level calculator."
      pikachu_friendship:
        eyebrow: "MECHANIC · YELLOW ONLY"
        title: "How Pikachu's friendship works"
        show: "SHOW"
        hide: "HIDE"
        lead_html: "Yellow's starter Pikachu carries a hidden friendship value from <b>0 to 255</b>. It starts at <b>90</b> and moves as you play. The higher it climbs, the less each action is worth, so the cheap gains are cheapest early."
        meter_start: "START"
        meter_goal: "BULBASAUR"
        table_label: "FRIENDSHIP CHANGE BY CURRENT VALUE"
        col_action: "ACTION"
        band_lo: "0–99"
        band_mid: "100–199"
        band_hi: "200–255"
        rows:
          levelup: "Pikachu levels up while in your party"
          hp_item: "Use an HP-restoring item on Pikachu, even at full HP"
          x_item: "Use an X item on Pikachu in battle"
          gym_leader: "Challenge a Gym Leader with Pikachu in the party"
          tm_hm: "Teach Pikachu an HM or TM"
          walking: "Walk 256 steps with Pikachu in the party (50% chance)"
          deposit: "Deposit Pikachu in the PC"
          faint: "Pikachu faints in battle"
          poison_faint: "Pikachu faints outside battle from poison damage"
          careless: "Pikachu faints against an opponent 30+ levels higher"
          trade: "Pikachu is traded away to another player"
        potion:
          title: "THE POTION TRICK"
          text_html: "An HP-restoring item counts <b>even when it does nothing</b>. Use a Potion on a full-health Pikachu and friendship still goes up. Buy a stack at the Mart and tap your way from 90 to 147 in a few minutes."
        why:
          title: "WHY IT MATTERS"
          text_html: "Mostly a novelty: Pikachu's mood just changes its overworld face. The one real payoff is here in Cerulean, where Melanie only hands over Bulbasaur at <b>147 or higher</b>. Keep Pikachu out of the PC until then."
      exp_share:
        eyebrow: "TRIVIA · ITEM MECHANICS"
        title_html: "The Exp. All is <span class=\"pn-xa__hl\">quietly broken</span>"
        intro: "Worth knowing what it does before you carry it. Gen 1 pays the share out in two passes and feeds the second one the first one's leftovers, so unless you keep a single Pokémon in the fight, a slice of every knockout is handed to nobody at all."
        party: "PARTY"
        fighters: "SENT OUT"
        nobody: "nobody"
        handed_html: "%{pct}% of the pot lands somewhere"
        bar_label: "ONE KNOCKOUT · 100% OF THE EXPERIENCE"
        legend:
          fighters:
            label: "SENT OUT"
            any: "Half the pot is shared between the Pokémon that fought, and each of them also picks up a party slice."
          bench:
            label: "BENCH"
            some: "The party pass should have been the other half. Instead the game copies what one fighter just received and splits that across the whole party, bench included."
            none: "Nobody is sitting this one out, so the party pass tops the fighters up again. It still runs, and it is still the wrong size."
          lost:
            label: "NEVER PAID"
            some: "The rest of that second half is handed to nobody. Stat experience disappears with it."
            none: "With one fighter the copy is the same size as the missing half, so the whole pot is accounted for."
        verdict:
          solo: "One fighter is the only case the code gets right, because the slice it copies happens to be exactly half the pot. Lead with the Pokémon you are raising, never switch, and the bench rides along for free."
          switch: "A single switch costs you a quarter of the battle, and it costs you again on every knockout for the rest of the fight."
          crowd: "With that many sent out the copied slice has shrunk to a sliver and most of the experience lands nowhere at all. Deposit the item in the PC before battles like this."
        trivia:
          off_switch:
            tag: "NO OFF SWITCH"
            title: "The PC is the toggle"
            text: "It works simply by sitting in the Bag, with no menu option. Depositing it in the PC is the only way to stop it."
          one_only:
            tag: "ONE PER CARTRIDGE"
            title: "You can throw it away forever"
            text: "The game lets you toss it like any ordinary item, and no legitimate route hands you a second one."
          stat_exp:
            tag: "STAT EXPERIENCE"
            title: "The bar is your stats too"
            text: "The same halve-and-divide runs over the five base stats, so stat exp splits exactly like the pot above. Even at its best, a lone fighter carrying the item banks 58.3% of what it would have earned without it, and that is permanent points off its final stats."
      badge_guide:
        eyebrow: "TRIVIA · BADGE HOUSE"
        title: "Gym Badges, explained"
        intro: "The man in the northwest house explains what the eight badges actually do. Half of them raise a stat for every Pokémon you send out, the other half raise the level cap for traded Pokémon. The first five also unlock a field move."
        key_boost: "STAT BOOST"
        key_obey: "OBEDIENCE CAP"
        tag_boost: "BOOST"
        tag_obey: "OBEY"
        tag_field: "FIELD"
        field_none: "None"
        obey: "Traded Pokémon up to Lv %{level}"
        boost:
          attack: "Raises Attack"
          defense: "Raises Defense"
          speed: "Raises Speed"
          special: "Raises Special"
        rules:
          tag: "RULES YELLOW NEVER TELLS YOU"
          sub: "Four things the badge man leaves out."
          boost:
            label: "THE BOOST"
            title: "A boost is about 12.5%"
            text: "It applies in battle only, and to every Pokémon you send out, not just the one that earned the badge."
          stacking:
            label: "THE STACKING"
            title: "It stacks by accident"
            text: "The game re-applies the boost every time a stat is recalculated, so each X Attack or Growl piles on another 12.5%. Long battles inflate your numbers far past the intended value."
          caps:
            label: "THE CAPS"
            title: "Caps hit traded mons only"
            text: "In-game trades count. Anything you caught yourself obeys at any level, however few badges you hold."
          field_moves:
            label: "THE FIELD MOVES"
            title: "The HM is not enough"
            text: "Field moves need the matching badge too. Pick Cut from the menu without the Cascade Badge and the game answers 'No! A new BADGE is required.'"
      locations:
        pallet_town:
          note: "Get Pikachu from Prof. Oak. No wild grass here."
          intro: "A one-street town of two houses and Oak's lab, with no grass anywhere inside it. Every trainer in Kanto starts from this doorstep."
          trivia:
            title: "This battle decides your rival's Eevee"
            intro: "The outcome of this battle, plus an optional rematch on Route 22, locks in which evolution your rival's Eevee takes. Play it how you like, but here's the recipe for each."
            note: "// The Route 22 rematch only matters if you win here first; lose, and it's Vaporeon regardless."
            cards:
              vaporeon:
                this: "Lose this battle"
                rt22: "Route 22 result ignored"
              jolteon:
                this: "Win this battle"
                rt22: "Win the Route 22 battle too"
              flareon:
                this: "Win this battle"
                rt22: "Skip the Route 22 battle"
          steps:
            "1":
              title: "Withdraw the free Potion"
              text_html: "In your upstairs bedroom, check the PC and withdraw the free Potion, then head downstairs and out the front door %{home}."
              items:
                potion: "Upstairs bedroom, inside the PC."
            "2":
              title: "Get Pikachu from Oak"
              text_html: "Head for the north exit %{north}. The moment you step into the Route 1 grass, Oak stops you and walks you back to his lab %{lab} to hand over Pikachu, which follows you instead of riding in a Ball."
            "3":
              title: "Beat your rival"
              text_html: "Blue grabs an Eevee and battles you in the lab. It is Lv 5 with Tackle and Tail Whip; lead with Pikachu and use ThunderShock. Win for <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dollar\"></span><span class=\"pn-money-value__n\">175</span></span>. This is half of what decides <a href=\"%{href}\">which evolution his Eevee takes</a>."
            "4":
              title: "Head north to Route 1"
              text_html: "Leave Pallet by the north exit %{north} onto Route 1, and press on toward Viridian City."
          tips:
            pikachu: "Your forced partner and the only Pikachu in the game. It refuses the Thunder Stone, so it stays Pikachu."
        route_1:
          note: "First grass patch. Pidgey and Rattata."
          intro: "A short hop north to Viridian, all ledges and low grass. Pidgey and Rattata are the only two things living on it."
          steps:
            "1":
              title: "Sweep the tall grass"
              text: "Head north through the tall grass, battling wild Pidgey and Rattata to level Pikachu. You have no Poké Balls yet, so catch them on the way back once the Viridian Mart is stocked."
            "2":
              title: "Take the free Potion"
              text_html: "A Youngster %{man} on the west edge of the road works at the Viridian Poké Mart. Talk to him and he hands you a free sample Potion."
              items:
                potion: "From the man by the sign near the south (Pallet) exit."
            "3":
              title: "Enter Viridian City"
              text_html: "Continue north %{north} into Viridian City. On the way back later, hop down the ledges along the east side to skip the grass on the return trip."
          tips:
            pidgey: "Everywhere on Route 1. A reliable Normal/Flying that evolves all the way to Pidgeot."
            rattata: "Fast and common. Evolves into Raticate, a solid early attacker."
        viridian_city:
          mart:
            blurb: "The first Mart in the game. It only starts selling once you deliver Oak's Parcel from Pallet Town."
            buy: "Buy a handful of Poké Balls for Route 1–2 and Viridian Forest. Antidote covers the Weedle line's Poison Sting."
          note: "Catching tutorial, Oak's Parcel, stock up on Poké Balls."
          intro: "Where Kanto's roads meet: Pallet to the south, Route 2 north, Route 22 west. Its own gym stays shut until the other seven badges are yours."
          later:
            tm42:
              where: "The Fisher who hands over TM42 (Dream Eater) sits on a fenced patch in the southwest corner, walled off by a cuttable tree and the pond. You can't cross to him on the first pass."
              after: "Chop the tree with HM01 Cut (from the S.S. Anne in Vermilion). The guide swings back here at the end of the Diglett's Cave detour."
          missable:
            title: "Five free Poké Balls"
            body_html: "Oak hands you <b>five Poké Balls</b> if you beat the Route 22 rival while carrying <b>none</b> and having caught <b>nothing but Pikachu</b>. Small prize, but if you want it, skip the Mart until after that fight."
            tip: "Pikachu goes in alone against his Spearow and Eevee, so grab a few levels in the Route 22 grass first."
          steps:
            "1":
              title: "Heal and collect Oak's Parcel"
              text_html: "Heal at the Poke Center %{center} in the top-left if you need to, then step into the Mart %{mart} just northeast. Talk to the clerk at the counter and he hands over Oak's Parcel to carry back south."
              items:
                oaks_parcel: "From the clerk in the Viridian Mart; deliver it to Oak in Pallet Town."
            "2":
              title: "Deliver Oak's Parcel"
              text: "Carry the Parcel south to Oak's lab in Pallet Town. Hand it over and he finally gives you the Pokédex, the tool that logs every Pokémon you see and catch."
              items:
                pokedex: "Given by Prof. Oak once you deliver Oak's Parcel; it logs every Pokémon you see and catch."
            "3":
              title: "Grab the Town Map"
              text: "While in Pallet for the Pokédex, step into Blue's house to the east. Talk to his sister Daisy and she hands over the Town Map, which lays out every route and town in Kanto."
              items:
                town_map: "From Blue's sister Daisy, in the house just east of your own in Pallet Town."
            "4":
              title: "Stock up at the Mart"
              text: "Head back up to Viridian and stock the Mart: Poke Balls, plus Potions and Antidotes for Route 22, Route 2 and the Forest. To claim Oak's five free balls instead, buy yours after the Route 22 rival."
            "5":
              title: "Watch the catching demo"
              text: "The old man on the north road is awake now. Talk to him and sit through his catching demonstration; when it ends he steps aside and the path north finally opens."
            "6":
              title: "Grab the hidden Potion by the north exit"
              text_html: "With the road open, head up to the north exit %{north} at the top of town. A lone tree beside the exit path hides a Potion. Press A next to it; nothing shows on-screen."
              hidden:
                potion: "The lone tree beside the north exit path, at the top of town. Press A; nothing shows on-screen."
            "7":
              title: "Skip the Gym, head west to Route 22"
              text_html: "The Gym %{gym} in the northeast stays locked until you hold the other seven badges, so leave it. Take the west exit %{west} to Route 22 for the best Brock-ready catches and the next rival battle."
        route_22:
          note: "Optional west route. Nidoran♀/♂, Mankey, Spearow. Plus the first rival battle."
          intro: "A dead end west of Viridian that stops at the Pokémon League gate. Your rival picks a fight here now, and again on the road to Victory Road."
          steps:
            "1":
              title: "Cross the grass"
              text: "Head west from Viridian into the grass. Catch Nidoran♂/♀ and Mankey here. They beat Brock's Rock types."
            "2":
              title: "Beat the rival"
              text_html: "Blue challenges you near the water with Spearow (Lv 9) and Eevee (Lv 8). Win for <span class=\"pn-money-value\"><span class=\"pn-money\" role=\"img\" aria-label=\"Poké Dollar\"></span><span class=\"pn-money-value__n\">280</span></span>. This is the other half of <a href=\"%{href}\">the Eevee recipe</a>: win here after Pallet for Jolteon, skip it for Flareon."
            "3":
              title: "Optional: Oak's five Poké Balls"
              text_html: "Still carrying no Poké Balls, with only Pikachu caught? Walk back to Oak's Lab in Pallet Town and talk to him for <b>five free Poké Balls</b>. See the <a href=\"#missable-poke-balls\">missable note</a>."
            "4":
              title: "Turn back to Viridian"
              text: "The League gate further west is blocked until you have all badges. Head back east and up to Route 2."
          tips:
            nidoranf: "Catch one. Its line (Nidoqueen) is strong and covers Brock with Ground moves."
            nidoranm: "Learns Low Kick early and evolves to Nidoking. A top Brock answer."
            mankey: "Low Kick is super-effective on Brock's Rock types. Grab one."
            rattata: "Common filler here. Evolves to Raticate."
            spearow: "Early Normal/Flying; evolves to Fearow. Aggressive and easy to find."
          oak:
            nidoranf: "Its line reaches Nidoqueen. Log the base once."
            nidoranm: "Evolves to Nidoking and helps vs Brock. Log one."
            mankey: "Only easy spot for a while. Grab it for Brock."
            spearow: "Early Normal/Flying, evolves to Fearow."
        route_2:
          note: "Short leg into the forest. Pidgey, Rattata and Nidoran."
          intro: "A long north-south corridor with Viridian Forest bolted onto its western side. Cuttable trees split it lengthwise, so half its markers stay out of reach until you hold Cut."
          later:
            moon_stone:
              where: "A Poké Ball low in the tree-walled plot on the eastern side of Route 2. Cuttable trees fence the whole east half off on your first pass, so you can't reach it yet."
              after: "The guide comes back for it on the Diglett's Cave detour, up through the tunnel from Vermilion with Cut in the bag."
            hp_up:
              where: "A second Poké Ball just north of the Moon Stone, in the same Cut-blocked eastern plot. Both sit behind the same wall of cuttable trees."
              after: "Same trip, nine tiles up the strip: the Diglett's Cave detour, in through the tunnel's north exit."
            flash:
              where: "Prof. Oak's Aide hands over HM05 Flash inside the Route 2 gate, on the same Cut-blocked eastern side. He only gives it once you have caught at least 10 kinds of Pokémon (the count in your Pokédex, not how many you own)."
              after: "Same trip, with 10 species caught. Flash is what lights Rock Tunnel one leg later, so the Diglett's Cave detour pays for itself."
          trades:
            mr_mime:
              npc: "SCIENTIST"
              title: "Mr. Mime"
              where: "The trade house on Route 2"
              note: "Yellow has no wild Mr. Mime, so this trade is the only way to add it. The price is a spare Clefairy from Mt. Moon, so box one when you pass through."
          steps:
            "1":
              title: "Cross the south grass"
              text: "Walk north through the short grass from the Viridian City edge. Catch a wild Nidoran here if you skipped Route 22, and log a Pidgey or Rattata for the dex while you pass."
            "2":
              title: "Enter Viridian Forest"
              text_html: "Follow the western strip up to the forest gate %{gate} and step through. The tree-walled east side, with the Moon Stone, HP Up, HM05 Flash and the Mr. Mime trade, stays locked until you have Cut."
          tips:
            pidgey: "The same reliable flyer as Route 1 if you still need one."
            rattata: "Common again. Skip it if you already caught one."
            nidoranf: "A second shot at Nidoran♀ if you skipped Route 22."
            nidoranm: "A second shot at Nidoran♂. Grab it for the Brock fight."
          oak:
            pidgey: "Common in the grass here, and by now you have Poké Balls. Log one; it evolves all the way to Pidgeot."
            rattata: "Everywhere on Route 2. Grab one for the dex; it evolves into Raticate."
        viridian_forest:
          note: "Bug haven. Caterpie, Metapod, Pidgey. Hidden items inside. No wild Pikachu in Yellow."
          intro: "A lattice of tree walls between Route 2 and Pewter, patrolled by Bug Catchers. Caterpie lives here and nowhere else, and no wild Pikachu lives here at all."
          steps:
            "1":
              title: "Enter from the Route 2 gate"
              text_html: "Step in through the south gate. Tall grass fills the whole maze, your only shot at Caterpie, Metapod and Pidgey. Lass %{lass} and four Bug Catchers wait in the trees."
            "2":
              title: "Check the lone tree"
              text: "A single tree stands just inside the gate, a Youngster on the tile below it. Stand on its west side, face east and press A for a hidden Antidote."
              hidden:
                antidote: "The lone tree just inside the south gate. The Youngster holds the tile below it, so stand on the tree's west side, face east and press A. Nothing shows on-screen."
            "3":
              title: "Raid the western dead-end"
              text: "Head north from the tree, then west along the clearing and up into the grassy dead end. The Poké Ball sits at the far wall."
              items:
                pok-ball: "Against the west wall at the end of the grassy dead end, two clearings north of the gate."
            "4":
              title: "Climb the east side"
              text_html: "Back out to the entrance clearing and cross east; that gap is the forest's only way north. Climb past Bug Catchers %{low} and %{high} to a Potion in the narrow lane."
              items:
                potion-25-11: "Six steps up the two-wide lane north of the Pokédex-evaluation sign, in the forest's northeast."
            "5":
              title: "Loop round to the middle Potion"
              text_html: "Loop west across the top of the maze, past Bug Catcher %{middle}, then take the west path down. The Potion waits at the foot of a two-wide shrub gap."
              items:
                potion-12-29: "Foot of the two-wide shrub gap in mid-forest, across the trees from the Antidote sign. Only reachable from the north."
            "6":
              title: "Search the west wall"
              text_html: "Climb back out and follow the west wall north. Bug Catcher %{west} holds the right-hand lane; the tile beside him hides a Potion. Stand below it, face up and press A."
              hidden:
                potion: "One tile west of Bug Catcher C in the west-wall column. Stand just below the spot, face up and press A. Nothing shows on-screen."
            "7":
              title: "Leave for Pewter City"
              text_html: "Catch a Caterpie or Metapod before you go; its Butterfree learns Confusion, a rare good answer to Brock. Leave by exit %{north} onto Route 2, then into Pewter City."
          tips:
            caterpie: "Everywhere in the grass. Evolves fast into Butterfree, whose Confusion dents Brock."
            metapod: "A 25% spawn, so taking one straight is easy. A Caterpie also gets here at Lv 7."
            pidgey: "Common here too if you still need one for the dex."
            pidgeotto: "A rare 1% spawn. A free evolved flyer if you're patient."
          oak:
            caterpie: "The forest's new family. Evolves to Butterfree. Log the base once."
        pewter_city:
          mart:
            blurb: "Right beside the Pokémon Center. Restock here before Mt. Moon, a long cave with no shops inside."
            buy: "Poké Balls for Mt. Moon's Clefairy and a few Potions. An Escape Rope bails you out if you get lost."
          gym:
            intro: "A short, straight gym, no puzzle. Beat the lone Jr. Trainer on the way in, then Brock at the back. His Geodude (Lv 10) and Onix (Lv 12) shrug off Pikachu completely, so lead with Mankey's Low Kick, a Nidoran, or Butterfree's Confusion. When Onix uses Bide, stop attacking for two turns or it fires all the stored damage back at once."
          note: "Brock. The first Gym. Rock types; Electric does nothing."
          intro: "A grey mining town at the foot of Mt. Moon, built around its museum and Brock's rock gym. No grass grows inside the city walls."
          steps:
            "1":
              title: "Heal, prep, and enter the Gym"
              text_html: "Heal at the Poke Center %{center} and stock Potions at the Mart %{mart}. Pikachu does nothing to Rock, so lead with Mankey, a Nidoran or Butterfree, then step into the Gym %{gym} on the west side."
            "2":
              title: "Head east to Route 3"
              text_html: "With the Boulder Badge, the boy blocking the east exit %{east} steps aside. Head east onto Route 3 toward Mt. Moon."
          trivia:
            title: "Jigglypuff sings Pikachu to sleep"
            intro: "A Jigglypuff stands against the wall inside the Pewter City Poke Center. Talk to it and it breaks into its \"Puu pupuu!\" song, and if your Pikachu is out walking behind you the lullaby knocks it out cold, so it stops following you, just like being sung to sleep in a battle."
            note: "It only fires when Pikachu is your partner out following you and has no status condition. Any other time the Jigglypuff simply sings. A little wink at how its Sing move works in a real battle."
        route_3:
          note: "The climb to Mt. Moon. Spearow, Sandshrew and Mankey."
          intro: "A narrow climb east of Pewter carrying eight trainers, more than any road so far. It ends at the Pokémon Center outside Mt. Moon."
          steps:
            "1":
              title: "Fight east up the route"
              text: "Head east out of Pewter and climb the ledges, clearing the Bug Catchers, Youngsters and Lasses strung along the rise toward Mt. Moon."
            "2":
              title: "Sweep the grass"
              text_html: "Catch Spearow, Sandshrew or Mankey in the tall grass. Sandshrew and Mankey both help in the caves, then follow the route to its end and out onto Route 4 %{north}, where the Mt. Moon Poké Center waits."
          oak:
            sandshrew: "Ground type, evolves to Sandslash. Handy against the coming caves."
        route_4_mt_moon:
          note: "The Mt. Moon approach: heal, then into the cave."
          intro: "The west tip of Route 4: one ledge, one Pokémon Center, and the mouth of Mt. Moon. The rest of the route lies on the far side of the cave."
          steps:
            "1":
              title: "Heal at the Mt. Moon Poke Center"
              text_html: "Step off Route 3 onto the west tip of Route 4 and heal at the Mt. Moon Poke Center %{center} by the cave mouth. Your last stop before the cave, so top up and stock Poké Balls."
            "2":
              title: "Enter Mt. Moon"
              text_html: "Head into Mt. Moon through entrance %{cave}, right beside the Center. You come out on the east half of Route 4, covered on the next leg."
          trivia:
            title: "The man selling a Magikarp"
            intro: "Inside the Mt. Moon Poke Center a man will sell you a Magikarp for ¥500. On its own it just Splashes about, but it evolves into Gyarados, a real powerhouse. Buying it here is worth it if you want to start growing it immediately, since reaching Gyarados takes a good while."
            note: "If you only need it for the Pokédex there is no rush: Magikarp is catchable later on the Old Rod, so you can wait and save the money. He sells a single level 5 Magikarp and gives no refunds."
        mt_moon:
          note: "Cave crawl. Zubat, Geodude, rare Clefairy, and a fossil."
          intro: "Three floors of dark rock under Route 4, dug into by Team Rocket. Clefairy lives here and nowhere else, and two fossils sit at the bottom for you to keep exactly one."
          steps:
            "1":
              title: "Follow the west wall to TM12"
              text: "Follow the west wall around to the southwest corner, where a ball holds TM12 Water Gun, a cheap Water move for anything that can learn it."
              items:
                tm-water-gun: "Southwest corner of 1F, following the west wall round from the entrance."
            "2":
              title: "Keep north up the wall for a Potion"
              text: "Keep following the west wall north to a Potion resting on a ball about halfway up."
              items:
                potion-2-20: "Against the far west wall of 1F, mid-height."
            "3":
              title: "Down two ladders for the HP Up"
              text_html: "Follow the path east to ladder %{down}, then ladder %{lower} below it, down to B2F. Up the small plateau on your right is an HP Up, a permanent HP boost. Climb back to 1F the way you came."
              items:
                hp-up: "Up the small plateau on B2F, straight down the two ladders east of the entrance."
            "4":
              title: "South for the second Potion"
              text: "Back on 1F, head directly south. Check the southwest of that pocket for a second Potion on a ball."
              items:
                potion-20-33: "South-center of 1F, the southwest of the pocket below the first ladder down."
            "5":
              title: "Straight east to the Rare Candy"
              text: "From the Potion, head directly east to a Rare Candy. One free level for any Pokémon you like."
              items:
                rare-candy: "Southeast of 1F, directly east of the second Potion."
            "6":
              title: "Up the east wall for the Escape Rope"
              text: "Follow the easternmost wall of the cave north. An Escape Rope sits on a ball on the way up."
              items:
                escape-rope: "Against the easternmost wall of 1F, on the way north."
            "7":
              title: "Down the northeast ladders"
              text_html: "From the northeast corner head west, then follow the path left and south to ladder %{down}. Below it, a linear stretch of B1F runs west to ladder %{lower} and down into B2F."
            "8":
              title: "Up the plateau for TM01"
              text: "Head up the small plateau for TM01 Mega Punch, a heavy Normal move for a physical attacker."
              items:
                tm-mega-punch: "Up the small plateau on B2F, just past the ladder you came down."
            "9":
              title: "Examine the lone rock for Ether"
              text: "Examine the lone rock to the east for a hidden Ether; nothing shows on-screen. Then take the ladders back up to 1F."
              hidden:
                ether: "The lone rock east of TM01 on B2F. Press A; nothing shows on-screen."
            "10":
              title: "Claim the Moon Stone in the northwest"
              text: "Continue south along the path, then up to the northwest. A Moon Stone sits on a ball in the corner. Never sell it: it evolves Clefairy, Nidorina and Nidorino."
              items:
                moon-stone: "Top-left (northwest) corner of 1F."
            "11":
              title: "Down the northwest ladders"
              text_html: "Ladder %{down} stands a few steps east of the corner. Take it, follow the short path to ladder %{lower}, and drop into B2F."
            "12":
              title: "Search the dead end for a Moon Stone"
              text: "Take the east path down the stairs, then up the other set and follow the long path west. Before the stairs north, a thin dead end on the right hides a Moon Stone in its end wall."
              hidden:
                moon-stone: "The end wall of the thin dead end east of the fossils, on B2F. Press A; nothing shows on-screen."
            "13":
              title: "Choose a fossil"
              text: "Head north to the two fossils on the Super Nerd's table. Dome sits on the left and becomes Kabuto, Helix on the right and becomes Omanyte. Take ONE; the other is gone for good."
              items:
                fossil: "On the Super Nerd's table on B2F: Dome (Kabuto) is the left one, Helix (Omanyte) the right. Revive it at the Cinnabar Lab later; the other is lost for good."
            "14":
              title: "Out to Route 4"
              text_html: "Past the fossils and west, take ladder %{up} south to B1F, then the exit %{out} east and back outside onto Route 4."
          tips:
            clefairy: "Only 1% on 1F, but 10.5% down on B2F. Take two: a Moon Stone turns one into Clefable."
          oak:
            clefairy: "Rare Moon-cave catch. Evolve it with a Moon Stone into Clefable."
            geodude: "Everywhere in the rock. Evolves to Graveler, then Golem by trade."
        route_4:
          note: "Short drop to Cerulean. Same grass as Route 3."
          intro: "The long ledge east of Mt. Moon, dropping toward Cerulean in one-way steps. Once you jump down, the only way back up is through the cave."
          steps:
            "1":
              title: "Surface from Mt. Moon"
              text_html: "You come out on Mt. Moon's east side %{exit}. The Poké Center is walled off on the west face, so the next heal is Cerulean. Step down from the cave mouth and head east, grabbing two items on the way."
            "2":
              title: "Feel out the hidden Great Ball"
              text: "About halfway along the top of the route, a Great Ball is buried in the open ground against the north wall. Stand on the tile just below it and press A facing up. Nothing shows on-screen."
              hidden:
                great-ball: "Buried against the top wall near the middle of the route. Stand one tile south of it, face up, and press A. Nothing shows on-screen."
            "3":
              title: "Grab TM04 (Whirlwind)"
              text: "Farther east along the plateau, a Poké Ball sits out in the open with a Lass patrolling just beside it. Walk onto it to pocket TM04, Whirlwind."
              items:
                tm-whirlwind: "A Poké Ball on the plateau in the east half of the route, just west of the Lass. Walk onto it."
            "4":
              title: "Drop into Cerulean City"
              text_html: "Past the TM, hop down the ledges. They funnel east and pour straight out the far side %{east} into Cerulean City."
          trainers:
            lass:
              note: "You cannot reach this Lass on the way through. She stands on the east end of Route 4's upper plateau, and the one-way ledges drop you into Cerulean before you get to her. Note her for a later return."
        cerulean_city:
          mart:
            blurb: "Cerulean's Mart adds Repel to the shelf, handy for the trainer-packed routes north to Bill."
            buy: "Poké Balls for Route 24–25 plus a Repel or two to walk the tall grass in peace."
          gym:
            intro: "One Swimmer, a Jr. Trainer, and open floor, then Misty. Her Staryu (Lv 18) and Starmie (Lv 21) hit hard with Water moves, and Starmie's Recover drags the fight out, so close fast with an Electric or Grass attacker. Pikachu's ThunderShock is ideal."
            notes:
              swimmer: "Do NOT beat this Trainer if you plan to run the Mew glitch. His Shellder's Attack stage sets Mew's level."
              misty: "Beating Misty locks the Swimmer behind her. Leave her standing until after your Mew run."
          note: "Misty's Gym. Cascade Badge. Free Bulbasaur too."
          intro: "A lakeside city built around Misty's water gym. Team Rocket has already dug out the back wall of one house, and the bike shop takes only a voucher, never cash."
          steps:
            "1":
              title: "Heal and stock up"
              text_html: "Arrive from Route 4, heal at the Center %{center} and stock the Mart %{mart}. Leave the Gym %{gym} alone for now: everything north of town is worth doing first, and Misty closes this leg."
            "2":
              title: "Grab the hidden Rare Candy"
              text_html: "The strip along the top of town is fenced off. Go in the badge house %{door} on the west side and out its back door for a buried Rare Candy, one free level. Stand below it and press A facing up; nothing shows on-screen."
              hidden:
                rare_candy: "In the fenced strip at the top of town, reached through the badge house on the west side. Stand just below it and press A."
            "3":
              title: "Grab the extras, then head north"
              text_html: "Take the free Bulbasaur from Melanie's house %{house} if Pikachu's friendship is high, then head north %{north} onto Nugget Bridge. The burgled house stays sealed: Officer Jenny only steps aside once Bill hands you the S.S. Ticket, so TM28 Dig waits for that trip back."
              items:
                bicycle: "From the Bike Shop, once you trade in the Bike Voucher you earn in Vermilion. You will come back for it, then never walk again."
            "4":
              title: "Come back down for Misty"
              text: "With Bill's S.S. Ticket in your bag, walk back south into Cerulean. Heal, restock the Poké Balls the routes ate, then take the Gym: lead with Pikachu or a Grass type against Misty's Water team."
          tips:
            bulbasaur: "Free from Melanie's house once Pikachu is happy. Evolves all the way to Venusaur."
          oak:
            bulbasaur: "Free gift from Melanie's house → Venusaur. One is enough."
          gifts:
            bulbasaur:
              from: "FROM MELANIE'S HOUSE"
              unlock: "Pikachu friendship 147 or higher"
        route_24:
          note: "Nugget Bridge. Oddish, Bellsprout, and a free Charmander."
          intro: "Nugget Bridge: five trainers lined up nose to tail on one span, and the man waiting at the far end offers you a job with Team Rocket."
          steps:
            "1":
              title: "Beat your rival"
              text: "Leave Cerulean heading north and step onto Nugget Bridge. Blue ambushes you right at its foot, before a single bridge trainer. Beat his team (led by Eevee) and press on up the bridge."
            "2":
              title: "Cross Nugget Bridge"
              text: "Climb the bridge and take the five trainers lined up in a row, then the Rocket Grunt waiting at the top. He hands you a Nugget and asks you to join Team Rocket. Decline, and he battles you too."
            "3":
              title: "Take the free Charmander"
              text_html: "On the grassy hilltop past the bridge, a boy %{boy} hands over a free Charmander (Lv 10). Take it: a strong Fire line all the way to Charizard, and a great answer to Erika later."
            "4":
              title: "Grab TM45 (Thunder Wave)"
              text: "A few steps east of the boy, a Poke Ball rests in the hilltop grass: TM45, Thunder Wave. Walk up and grab it, a cheap way to paralyze anything you want to catch."
              items:
                tm-thunder-wave: "In the grass at the top of the route, a few tiles east of the Charmander boy."
            "5":
              title: "Head east to Route 25"
              text_html: "With Charmander and the TM in hand, follow the path east off the hilltop %{east} into Route 25, the road that leads to Bill's cottage."
          tips:
            charmander: "Free from the boy here. A strong Fire line to Charizard, and a great answer to Erika later."
          oak:
            charmander: "Free gift → Charizard. Grab it for the dex and for Erika's grass gym."
            oddish: "Common in the grass. Evolves to Vileplume with a Leaf Stone."
            bellsprout: "The other 30% grass catch. Evolves to Victreebel with a Leaf Stone."
          gifts:
            charmander:
              from: "FROM THE HILLTOP BOY"
        route_25:
          note: "Bill's house. Same grass as Route 24."
          intro: "The wooded cape path to Bill's cottage, nine trainers along its length. Bill is inside, stuck halfway through his own teleporter."
          steps:
            "1":
              title: "Arrive from Nugget Bridge"
              text: "Step in from the west, off the top of Nugget Bridge on Route 24. The trail runs east to Bill's Sea Cottage, lined with Hikers, Youngsters and Cooltrainers. Sweep the grass and catch a Venonat if you still need one."
            "2":
              title: "Sweep the west rock wall"
              text: "A short walk in from the west entrance, hug the top edge of the route. Face up and press A against the rock wall for a hidden Elixir. Nothing shows on-screen."
              hidden:
                elixir: "North edge near the west entrance, just in from Route 24. Face up and press A."
            "3":
              title: "Grab TM19 in the maze"
              text_html: "Jr. Trainer %{guard} plugs the one gap into the TM19 pocket. Trigger him from three tiles below so he walks down clear of it, then come at the gap from the west. Any closer and he parks on the way in."
              items:
                tm-seismic-toss: "Northeast pocket of the tree maze, mid-route. If the Jr. Trainer is still in the way, Cut the tree in the pocket's east wall instead."
            "4":
              title: "Check the grass by the cottage"
              text: "On the final approach east, a short walk west of Bill's Sea Cottage door and on the same row, line up on the tile just below and press A facing up for a hidden Ether. Nothing shows on-screen."
              hidden:
                ether: "East end, due west of the cottage door on its row. Stand one tile south and press A up."
            "5":
              title: "Free Bill"
              text_html: "Enter the Sea Cottage %{cottage} at the far east and use Bill's machine to un-fuse him. He hands you the S.S. Ticket, your way aboard the S.S. Anne when you reach Vermilion."
              items:
                s_s_ticket: "From Bill, after freeing him from his machine in the Sea Cottage. Your pass onto the S.S. Anne in Vermilion."
          oak:
            venonat: "A Bug/Poison catch → Venomoth. Log the base once."
        route_5:
          note: "South to Vermilion. Pidgey, Rattata and rare Abra."
          intro: "A short hillside south of Cerulean holding the Day-Care fence and the north mouth of the Underground Path. Saffron's west gate sits at the bottom."
          trades:
            machoke:
              npc: "LITTLE GIRL"
              title: "Machoke"
              where: "The Underground Path house at the north end of Route 5"
              note: "A fully evolved Machoke for a Cubone, and traded Pokémon earn boosted XP. Cubone comes from Pokémon Tower, so this is another return trip."
          steps:
            "1":
              title: "Head south"
              text_html: "Leave Cerulean south; drop a Pokémon at the Day Care %{daycare} if you want it leveled."
            "2":
              title: "Take the Underground Path"
              text_html: "Saffron's gates are blocked, so duck into the Underground Path house %{path} at the south end of the route. The stairs inside drop you into the tunnel to Route 6."
          oak:
            abra: "Catch one fast (it only Teleports). Evolves to Kadabra, then Alakazam by trade."
        underground_path:
          note: "The tunnel under Saffron. Two hidden items, nothing wild."
          intro: "One straight corridor beneath Saffron City, four tiles wide, with no trainers and no wild Pokémon. Two hidden items sit on its floor, and neither of them shows on-screen."
          steps:
            "1":
              title: "Down the stairs, then west for the Full Restore"
              text_html: "The Route 5 house drops you at stairs %{in}. Step one tile west, face west and press A: a hidden Full Restore, the earliest in the game, all HP plus any status cleared."
              hidden:
                full-restore: "Top row of the tunnel, two tiles west of the entry stairs. Stand next to it facing west and press A. Nothing shows on-screen."
            "2":
              title: "South for the X Special, then out to Route 6"
              text_html: "Walk south to eight tiles above the Route 6 stairs, second lane from the east wall. Press A facing down for a hidden X Special, one battle of sharper Special. Stairs %{out} are just below."
              hidden:
                x-special: "Second lane from the east wall, seven tiles north of the stairs down to Route 6. Stand one tile north of it and press A facing down. Nothing shows on-screen."
        route_6:
          note: "Into Vermilion. Same grass as Route 5, plus fishing."
          intro: "The last stretch down into Vermilion, ending at a pond that is the only water in Kanto where a Psyduck will bite."
          steps:
            "1":
              title: "Leave the Underground Path"
              text_html: "You surface %{path} at the north end of Route 6, on the path down to Vermilion. Head south past the Jr. Trainers and Bug Catchers lining the fences."
            "2":
              title: "Enter Vermilion"
              text_html: "Follow the road south across the last bridge and straight on %{south} into Vermilion City, where the S.S. Anne is docked."
        vermilion_city:
          mart:
            blurb: "Now stocking Super Potions. Load up before the S.S. Anne and Lt. Surge's gym."
            buy: "Super Potions carry you through the S.S. Anne. Repel keeps Diglett's Cave quiet on the way out."
          gym:
            intro: "The door to Lt. Surge is locked behind two switches hidden in the trash cans. Find both, then face Surge's lone Raichu (Lv 28), which hits the whole team hard and can paralyze. A Ground type using Dig shuts it down cleanly, so bring Diglett, Sandshrew or a Nidoran line."
            puzzle:
              "1": "Check the trash cans along the walls to find the first switch. Its position is random on every visit."
              "2": "The second switch is always in a can directly next to the first, up, down, left or right. Pick wrong and both reset, so search the neighbors."
              "3": "With both switches flipped, the door to Lt. Surge opens. Bring a Ground type to shut his Electric team down."
          note: "Bike Voucher and Old Rod. The gym waits on Cut."
          intro: "A working port on Kanto's south coast, its harbour taken up by the S.S. Anne. Cuttable trees fence the gym plaza off from the rest of town."
          steps:
            "1":
              title: "Grab the goodies"
              text_html: "Heal at the Poke Center %{center}, then collect the Bike Voucher from the Pokémon Fan Club %{club} and the Old Rod from the Fishing Guru %{guru} on the west side of town."
              items:
                bike_voucher: "From the chairman of the Pokémon Fan Club, west side of town. Trade it for a Bicycle at the Cerulean Bike Shop."
                old_rod: "From the Fishing Guru in the house on the west side of town. Fishes up Magikarp anywhere."
            "2":
              title: "Board the S.S. Anne for Cut"
              text_html: "Cuttable trees wall off the gym plaza %{gym}, so Surge waits. Board the ship at the south dock %{dock} and <a href=\"%{href}\">clear the S.S. Anne</a>: the seasick Captain hands over HM01 Cut."
          later:
            max_ether:
              where: "A hidden Max Ether sits at the top of the gap between the two buildings north of the Trade House, and the only tile you can face it from is open water."
              after: "Come back on Surf (HM03, from the Safari Zone), park on the water tile beside it and press A. Nothing shows on-screen."
          tips:
            squirtle: "Free from Officer Jenny after the Thunder Badge. The third Kanto starter, evolves to Blastoise."
          oak:
            squirtle: "Free gift after the badge → Blastoise. The last of the three starters."
          gifts:
            squirtle:
              from: "FROM OFFICER JENNY"
              unlock: "Beat Lt. Surge for the Thunder Badge"
        vermilion_city_return:
          note: "Lt. Surge. Thunder Badge. Free Squirtle after."
          intro: "The same port with the trees gone. Lt. Surge keeps his door shut behind two switches hidden in the gym's trash cans, and his Raichu answers Ground types with Mega Kick."
          steps:
            "1":
              title: "Cut through to the gym"
              text_html: "Cut either tree beside the gym %{gym} to open the plaza. Lead with a Ground type if you have one; Thunderbolt cannot touch it. If not, backtrack to Diglett's Cave at the west end of Route 11."
            "2":
              title: "Take the free Squirtle"
              text_html: "With the Thunder Badge in hand, Officer Jenny by the gym hands you a free Squirtle. Then head east %{east} again and take Diglett's Cave under the mountains."
        ss_anne:
          note: "The luxury liner. HM01 Cut, and a rival fight."
          intro: "A liner in dock for one visit only. Four decks, seventeen trainers, and a seasick captain who pays for a back rub with an HM."
          steps:
            "1":
              title: "Board and go straight below"
              text_html: "Show the S.S. Ticket at the dock and step aboard. Head east to the stairs %{down} in the far corner and drop to the crew deck. Five cabins run west from there; start with the nearest %{cabin}."
            "2":
              title: "Max Potion in the first cabin"
              text: "A ball sits against the far wall past the bunks. A Max Potion is a full heal for one Pokémon, worth holding for Surge."
              items:
                max-potion: "Against the far wall of the easternmost B1F cabin."
            "3":
              title: "Ether two doors along"
              text_html: "Carry on west to cabin %{cabin}. An Ether rests on the floor beside the bunk, ten PP back on a single move."
              items:
                ether: "On the floor of the third B1F cabin from the east, beside the bunk."
            "4":
              title: "TM44 Rest next door"
              text_html: "Next door west %{cabin} holds TM44 Rest. It knocks the user out for two turns and wakes it at full HP, a free heal in a pinch."
              items:
                tm-rest: "Beside the bed in the fourth B1F cabin from the east."
            "5":
              title: "Hyper Potion on the pillow"
              text_html: "The last cabin %{cabin} sits at the west end. Stand at the head of the bed and press A facing the pillow; nothing shows on-screen, but a Hyper Potion is there."
              hidden:
                hyper-potion: "On the pillow of the bed in the westernmost B1F cabin. Press A facing it from the left; nothing shows on-screen."
            "6":
              title: "Back up and sweep 1F stern to bow"
              text_html: "Take the stairs %{up} to 1F and clear its six cabins east to west, starting at the stern end. The second from the west %{cabin} holds TM08 Body Slam, a heavy Normal move that often paralyzes."
              items:
                tm-body-slam: "At the bottom of the 1F cabin, second door from the west end of the corridor."
            "7":
              title: "Great Ball in the kitchen bin"
              text_html: "Carry on west the length of the corridor and south through the gap %{kitchen}. In the kitchen, the lowest of the three bins on the east wall hides a Great Ball."
              hidden:
                great-ball: "The lowest of the three trash cans on the kitchen's east wall. Press A facing it; nothing shows on-screen."
            "8":
              title: "Climb straight to the bow deck"
              text_html: "Take the stairs %{up} to 2F, cross to %{down} and carry straight on to 3F, then west along that corridor and out onto the bow %{deck}."
            "9":
              title: "Clear the two Sailors"
              text: "Two Sailors hold the bow deck, free XP before the rival. Beat them both, then head back down to 2F and start on its cabins."
            "10":
              title: "Snorlax's dex entry on 2F"
              text_html: "Back in the 2F corridor, the first cabin %{cabin} holds no items, just a man who shows you Snorlax. Talking to him registers it as seen."
              catch_at_count: "2 TOTAL, BOTH LV 30"
              catch_at_html: "Catch it later on <b>Route 12</b> or <b>Route 16</b>, once the Poké Flute is yours."
            "11":
              title: "Max Ether next door"
              text_html: "The next cabin east %{cabin} has a ball at the back of the room: a Max Ether, which refills one move's PP completely."
              items:
                max-ether: "At the back of the second 2F cabin from the west."
            "12":
              title: "Rare Candy two doors on"
              text_html: "Skip one door and take the next %{cabin}. A Rare Candy waits against the west wall, one free level. That is the last item aboard."
              items:
                rare-candy: "Against the west wall of the fourth 2F cabin from the west."
            "13":
              title: "Heal before the rival"
              text: "Keep east down the corridor and the rival steps out for a fight. Top the team up with items first: there is no Center aboard, and this is the last fight on the ship."
            "14":
              title: "HM01 Cut from the Captain"
              text_html: "Take the stairs behind him %{stairs} up to the Captain's cabin and soothe his seasickness for HM01 Cut. Teach it and step off; the ship sails for good. Then head <a href=\"%{href}\">east to Route 11</a>."
              items:
                hm01_cut: "From the seasick Captain, up the stairs behind the rival at the 2F stern."
        route_11:
          note: "East of Vermilion. Pidgey, Rattata, and Drowzee."
          intro: "A wide grass field east of Vermilion with ten trainers spread over it. Drowzee spawns here and nowhere else, and Diglett's Cave opens at the west end."
          trades:
            dugtrio:
              npc: "YOUNGSTER"
              title: "Dugtrio"
              where: "Upstairs in the Route 11 gate"
              note: "He wants a Lickitung, and Yellow's only one lives in Cerulean Cave, so this is a postgame trade. For a Dugtrio now, evolve a Diglett at Lv 26 or catch the rare one in Diglett's Cave."
          steps:
            "1":
              title: "Enter from Vermilion"
              text_html: "Step east out of Vermilion onto the wide grass of Route 11. The mouth of Diglett's Cave %{cave} sits right here at the west end. Worth a detour for a Diglett, or the rare Dugtrio: Ground walls Surge's Raichu."
            "2":
              title: "Fight east"
              text: "Push east through the grass, clearing the Gamblers, Youngsters and Engineers as you go. Drowzee spawns here and nowhere else in the game, and it makes a strong early Hypno."
            "3":
              title: "Search by the east gate"
              text: "Just before the east gate lies a hidden Escape Rope. Stop on the grass tile a few squares northwest of the gate door, face up, and press A. Nothing shows on-screen."
              hidden:
                escape-rope: "One tile west and three north of the east gate's door, out in the grass. Stand below it, face up, and press A. Nothing shows on-screen."
            "4":
              title: "Grab the Itemfinder"
              text_html: "At the east gate %{gate}, talk to Oak's Aide for the Itemfinder (he only hands it over once you have caught 30+ species). Upstairs a Youngster wants a Lickitung for his Dugtrio, and Yellow's only Lickitung is in Cerulean Cave."
              items:
                itemfinder: "From Oak's Aide in the east gate house, once you have caught 30+ species. Points to nearby hidden items."
            "5":
              title: "Head back for the badge"
              text_html: "Walk back west %{west} into Vermilion with your Ground type in tow. <a href=\"%{href}\">Lt. Surge</a> is next; the tunnel under the mountains can wait until the badge is yours."
          oak:
            drowzee: "The route's notable catch → Hypno, a strong early Psychic."
        digletts_cave:
          note: "Diglett, rare Dugtrio, and the Cut detour on the far side."
          intro: "A single tunnel bored under the mountains between Route 11 and Route 2, crawling with Diglett and the odd Dugtrio. Its north door opens onto the half of Route 2 that Cut keeps shut."
          steps:
            "1":
              title: "Enter from Route 11"
              text_html: "Take the south entrance %{south} near the west end of Route 11. One tunnel runs the whole way through, with nothing branching off it."
            "2":
              title: "Catch a Diglett or Dugtrio"
              text: "Every step in here can spawn one: Diglett at 94%, Dugtrio at 6% and Lv 29 to 31. Nowhere else in Kanto has either of them."
            "3":
              title: "Surface on Route 2"
              text_html: "Climb out the north exit %{north}. You come up in a tree-walled pocket at the top of Route 2, below Pewter, on the side Cut kept you out of."
            "4":
              title: "Trade for Mr. Mime"
              text_html: "The trade house %{house} sits a few steps south, no Cut needed. The scientist inside swaps MILES the Mr. Mime for a spare Clefairy, the only one in Yellow."
            "5":
              title: "Cut south toward the gate"
              text_html: "A single cuttable tree stands below the house. Chop it, follow the east strip down and step into the Route 2 gate %{gate}."
            "6":
              title: "Take HM05 Flash"
              text: "Prof. Oak's Aide is waiting inside. He hands over HM05 Flash once your Pokédex shows 10 kinds caught, and Rock Tunnel is pitch black without it."
              items:
                flash: "From Prof. Oak's Aide inside the Route 2 gate, once you have caught 10 kinds of Pokémon."
            "7":
              title: "Grab the HP Up"
              text: "Out the gate's south door, the first Poké Ball down the strip holds an HP Up. It raises one Pokémon's HP for good, so save it for a keeper."
              items:
                hp-up: "First Poké Ball on the east strip, a few steps south of the Route 2 gate's lower door."
            "8":
              title: "Grab the Moon Stone"
              text: "Nine tiles further south, the second ball is a Moon Stone. It evolves Clefairy, Jigglypuff, Nidorina or Nidorino, and Yellow hands out very few."
              items:
                moon-stone: "Second Poké Ball on the east strip, nine tiles south of the HP Up."
            "9":
              title: "Cut west into Viridian"
              text_html: "Two tiles back north, another cuttable tree breaks the wall to the west. Chop through, cross to the main road and follow it south %{south} into Viridian City."
            "10":
              title: "Take TM42 Dream Eater"
              text_html: "One more tree fences off the plot in Viridian's southwest corner. Cut it and talk to the dozing Fisher %{fisher}; he hands over TM42, Dream Eater."
              items:
                tm42: "From the Fisher on the fenced plot in Viridian's southwest corner, past the cuttable tree on its east side."
            "11":
              title: "Cut the shortcut to Pewter"
              text: "Back up Route 2 and through the gate, then west along the low path under the cave mouth. Cut the tree at its end and you are on the road that runs straight up to Pewter, no forest in between."
            "12":
              title: "Cut in behind the Museum"
              text_html: "In Pewter, one tree fences off the ground east of the Museum. Cut it, follow the path west along the wall and go in the back door %{museum}, the only way into the east room."
            "13":
              title: "Take the Old Amber"
              text: "The scientist by the fossil cases hands over the Old Amber. Cinnabar's lab revives it into Aerodactyl, and this is the only one in the game, so do not sell it."
              items:
                old-amber: "From the scientist in the Museum's east room, reached through Pewter's back entrance past a cuttable tree."
            "14":
              title: "Back to Cerulean through Mt. Moon"
              text_html: "Out of Pewter east onto Route 3, straight through Mt. Moon and down Route 4 into Cerulean. From there it is east to <a href=\"%{href}\">Route 9</a> and Rock Tunnel."
          grind:
            title: "The best grinding spot yet"
            intro: "Two Pokémon live down here and nothing else does. Gen 1 pays base experience times level over seven, so both of them hand out more per knockout than anything else you can farm this early."
            formula: "base exp × level ÷ 7"
            tips:
              diglett: "Ten base HP, so almost any attack ends it in one. Dig and Growl are all it has, and Growl only stalls you."
              dugtrio: "It moves first at 120 Speed and Electric does nothing to it. Still only 35 base HP, so Water, Grass or Ice ends it fast."
            steps:
              "1":
                title: "Lead with a high level"
                body_html: "Repel blocks anything below your first party slot. Diglett stops at Lv 22, so a lead of at least <b>Lv %{level}</b> leaves nothing but Dugtrio."
              "2":
                title: "Spray, then walk"
                body_html: "One Repel covers 100 steps. Pace the tunnel end to end and re-spray the moment the message says it wore off."
              "3":
                title: "Bank %{exp} a fight"
                body_html: "Every roll left is a Lv 29 to 31 Dugtrio, about three Diglett of experience for the same two turns of work."
            warn: "Do not send in PIKACHU. Dugtrio is pure Ground, so Electric moves do nothing at all, and it swings first."
          oak:
            diglett: "Everywhere here → Dugtrio, a fast Ground type. Grab the base."
        route_9:
          note: "East to Rock Tunnel. Nidoran hotspot."
          intro: "A long grass route east of Cerulean, thick with both Nidoran lines. Nine trainers hold the ridge between here and Rock Tunnel."
          steps:
            "1":
              title: "Cut in from Cerulean"
              text: "Route 9 runs east out of Cerulean, barred only by a lone tree you Cut through on the city's edge. Step onto the long grass, where both Nidoran lines skitter thick underfoot."
            "2":
              title: "Drop for TM30 Teleport"
              text: "Just inside the entrance, drop south into the sunken hollow in the southwest. The Poke Ball resting on the low grass is TM30, Teleport, tucked in beside the first Hiker."
              items:
                tm-teleport: "Southwest hollow just past the Cerulean entrance, on the low grass by the first Hiker."
            "3":
              title: "Check the lone tree"
              text: "Climb back north to the single tree standing in the northwest grass, just above the first Jr. Trainer. Stand on its east square and press A for a hidden Ether. Nothing shows on-screen."
              hidden:
                ether: "The lone tree in the northwest grass, north of the first Jr. Trainer; press A from its east side."
            "4":
              title: "Battle east to Route 10"
              text_html: "With both stashes in the bag, push east through the long grass, trading blows with the Bug Catchers, Jr. Trainers, and Hikers strung across the ridge. The path spills straight out %{east} onto Route 10 and Rock Tunnel's doorstep."
        route_10:
          note: "Rock Tunnel's doorstep. Magnemite everywhere."
          intro: "The upper half of Route 10, above Rock Tunnel: a Pokémon Center at the north mouth and Magnemite owning the grass. The road to Lavender waits on the far side of the cave."
          steps:
            "1":
              title: "Heal at the Center"
              text_html: "Arrive from Route 9 into upper Route 10 and step into the Pokémon Center %{center} beside Rock Tunnel's north mouth %{north}. Top off, because the cave ahead is long and pitch-black."
            "2":
              title: "Grab the hidden Super Potion"
              text: "Cut the tree one tile south of Rock Tunnel's north mouth and step onto its stump. Press A facing up for a hidden Super Potion; nothing shows on-screen."
              hidden:
                super-potion: "Under the cliff beside Rock Tunnel's north mouth. Cut the tree below it, stand on that tile and press A facing up. Nothing shows on-screen."
            "3":
              title: "Note the Power Plant for later"
              text: "Water walls off the middle of Route 10. The Power Plant's door and a lone Pokémaniac sit past it, and nothing gets you across until Surf. Come back once you have it."
            "4":
              title: "Enter Rock Tunnel"
              text_html: "Teach a Pokémon HM05 Flash before you go in: the tunnel is pitch black without it. Magnemite learns Flash and is half this grass, so catch one if nobody else can. Then take the north mouth %{north}."
          trainers:
            pokemaniac:
              note: "You cannot reach this Pokémaniac yet. He stands on Route 10's middle strip, past the water and beside the Power Plant's door, and only Surf gets you over to him. Note him for a later return."
          oak:
            magnemite: "A 50% grass catch here → Magneton. Electric coverage for the dark tunnel."
        route_10_south:
          note: "Out the south mouth. Hikers all the way down."
          intro: "Route 10 picks up where Rock Tunnel spits you out and runs straight down to Lavender Town. Four trainers hold the path, and a Max Ether is buried near the mouth."
          steps:
            "1":
              title: "Sweep for the hidden Max Ether"
              text_html: "Out Rock Tunnel's south mouth %{south} onto lower Route 10, walk a few tiles east along the path and press A facing north for a hidden Max Ether. Nothing shows on-screen."
              hidden:
                max-ether: "East of Rock Tunnel's south mouth on lower Route 10; press A facing up. Nothing shows on-screen."
            "2":
              title: "Drop into Lavender Town"
              text_html: "Clear the Hikers and the Pokémaniac down lower Route 10, then walk south %{lavender} into Lavender Town."
        rock_tunnel:
          note: "Pitch-black cave. Needs Flash."
          intro: "Two unlit floors under the ridge, holding fifteen trainers and not one item ball. Without Flash the screen stays black."
          steps:
            "1":
              title: "Bring Flash before you go in"
              text: "Rock Tunnel is pitch black without it. Teach HM05 Flash to a Pokémon first (Oak's Aide hands it over in the Route 2 gate), then light each screen as you enter from northern Route 10."
            "2":
              title: "Cross 1F to the northeast ladder"
              text_html: "From the north mouth drop south, then run east along the passage and up into the northeast corner. Ladder %{down} waits there. The other two 1F ladders lead to a pocket holding nothing."
            "3":
              title: "Cross B1F to the far west ladder"
              text_html: "You land in the southeast. Work west along the bottom, then climb the west side to ladder %{up} in the top-left corner, and take it back up to 1F."
            "4":
              title: "Leave for Lavender Town"
              text: "You surface on the east side of 1F, in the stretch that owns the south mouth. Head down and west to it, out onto lower Route 10, and straight on into Lavender Town."
          oak:
            machop: "Cave-common → Machoke, then Machamp by trade. A strong Fighter."
            onix: "Only appears on B1F. A bulky Rock/Ground catch worth the hunt."
        lavender_town:
          mart:
            blurb: "Lavender's Mart jumps to Great Balls and Revives, gear for the Pokémon Tower next door."
            buy: "Great Balls for the Tower's Gastly line and a couple of Revives. Super Repel thins the ghosts."
          note: "The ghost town. Pokémon Tower looms."
          intro: "Kanto's smallest town, and its graveyard. Pokémon Tower stands over a handful of houses, with Team Rocket somewhere inside it."
          trivia:
            tag: "NAME RATER"
            title: "The Name Rater lives here"
            intro_html: "Lavender holds the one man in Kanto who will change a Pokémon's nickname. His house %{house} sits on the west side, between the Cubone girl's place and the Mart. Show him a Pokémon, he reads its name back with a verdict, then lets you type a new one."
            note: "Not to be confused with Viridian's nickname house: that one is a tip house with a pet Spearow called SPEARY. The renaming happens here."
            warning:
              title: "Traded Pokémon can't be renamed"
              body: "He checks the original trainer's name and ID against yours, and a Pokémon from a trade fails on both. Instead of renaming it he calls the name truly impeccable and hands it back, so the one it arrived with is the one it keeps."
              specimen: "Route 2 trade · Mr. Mime"
          steps:
            "1":
              title: "Try the Tower"
              text_html: "Enter Pokémon Tower %{tower} on the east side of town. Blue waits a few steps onto 2F, his team around Lv 25. Beat him and climb on, until a ghost you cannot fight blocks 6F."
            "2":
              title: "Take the road west"
              text_html: "Head west %{west} out of town onto Route 8. Bring a Pokémon that knows Cut: the tall grass there is fenced in behind a tree, and Kadabra turns up in it and nowhere else."
        route_8:
          note: "West to Celadon. Pidgey, Abra, Jigglypuff."
          intro: "The road west from Lavender to Saffron's east gate, nine trainers along it. Wild Kadabra turns up here and nowhere else."
          steps:
            "1":
              title: "Head west"
              text_html: "Clear the Lass, Gambler and Super Nerd as you head west toward Saffron's east gate %{gate}."
            "2":
              title: "Take the Underground Path"
              text_html: "The Saffron guards want a drink. Skip them by tunnelling west %{path} under the city to Route 7."
        underground_path_west_east:
          note: "The second Saffron tunnel. A Nugget and an Elixir on the floor."
          intro: "The other corridor under Saffron City, running west from Route 8 to Route 7. No trainers, nothing wild, and two hidden items lying on the floor that show nothing on-screen."
          steps:
            "1":
              title: "Hug the bottom wall west"
              text_html: "Stairs %{in} from the Route 8 house drop you on the second lane. Drop to the bottom wall and follow it west, pressing A facing west about halfway along: a hidden Elixir, full PP on every move."
              hidden:
                elixir: "On the bottom wall, roughly the middle of the tunnel. Walk the wall west and press A facing west. Nothing shows on-screen."
            "2":
              title: "Climb back up for the Nugget"
              text_html: "Walk nine tiles west and three lanes up from there, back on the lane you came in on. Press A facing west again for a hidden Nugget, ¥5000 at any counter. Stairs %{out} are below."
              hidden:
                nugget: "On the lane you walk in on, three above the bottom wall, near the Route 7 end. Press A facing west. Nothing shows on-screen."
        route_7:
          note: "Short strip into Celadon. Pidgey and Abra."
          intro: "One screen of road between Saffron and Celadon, with a patch of tall grass across the top. No trainers, and nothing lying on the ground."
          steps:
            "1":
              title: "Cross to Celadon"
              text_html: "Tall grass fills the top of the strip: step in if you still want a Pidgey, Abra or Jigglypuff. Otherwise head straight west %{west} into Celadon, the biggest city in Kanto."
        celadon_city:
          store:
            trades:
              ice_beam: "The best Ice attack in the game and it can freeze. Give it to a Water type and it covers Grass, Ground, Flying and Dragon."
              rock_slide: "Rock coverage most Ground and Rock types can learn, and the answer to the Flying and Bug types that laugh at them."
              tri_attack: "A Normal special attack with no drawback. Handy on Porygon, Dodrio or Chansey, none of which learn much else."
            blurb: "The biggest shop in Kanto: five floors of Poké Balls, TMs, evolution stones and vitamins, with a vending rooftop above them. The lift serves 1F to 5F; the roof is up the stairs from 5F."
            floors:
              "1F":
                name: "Service Counter"
                motto: '"Find what you need at the Celadon Dept. Store!"'
                note: "Reception and the store directory. The Poké Mart deliveryman waits here once you clear the Rocket Hideout. Nothing to buy on this floor, so take the elevator up."
              "2F":
                name: "Trainer's Market"
                motto: '"Top-Grade Items for Trainers!"'
                rec:
                  great_ball: "Cheap catch-rate upgrade, buy a stack for the mid-game routes."
                  super_potion: "Your main heal until Hyper Potions show up."
                  take_down: "Reliable physical STAB for a lot of early Pokémon."
              "3F":
                name: "TV Game Shop"
                motto: '"Video games on display, and a free TM."'
                note: "No sales counter, but the man behind the desk hands you a TM for free."
                gift_desc: "Teaches Counter: returns double the damage from a physical hit. A neat answer to Normal and Fighting attackers."
              "4F":
                name: "Wiseman Gifts"
                motto: '"Evolution special: every stone in stock!"'
                rec:
                  poke_doll: "The only counter in Kanto that sells one. The Copycat in Saffron hands over TM31 Mimic for it, so buy the doll now and the TM costs you a knock on her door."
              "5F":
                name: "Pharmacy"
                motto: '"Boost your Pokémon to the max."'
              "ROOF":
                name: "Rooftop Square"
                motto: '"Vending machines and a very thirsty kid."'
                note: "Three vending machines and a girl who wants what they sell. One of each drink buys one of each TM from her, and any fourth drink gets you past the Saffron gate guards."
                rec:
                  fresh_water: "Trade one to the girl for TM13 Ice Beam."
                  soda_pop: "Trade one for TM48 Rock Slide."
                  lemonade: "Trade one for TM49 Tri Attack."
          gym:
            intro: "A garden of small trees hiding several trainers, then Erika. Her Tangela (Lv 30), Weepinbell (Lv 32) and Gloom (Lv 32) fold to Fire, Flying, Psychic or Ice, so lead with one of those and carry status heals for their Sleep Powder and Stun Spore."
            needs: "Erika and three of the seven trainers sit behind hedges that only Cut opens. Without a Pokémon that knows it you can fight the other four and nothing else."
          note: "Erika's Gym. Rainbow Badge. Dept. Store, Eevee and the Game Corner."
          intro: "Kanto's biggest city: a six-floor department store, Erika's greenhouse gym, and a Game Corner with Team Rocket's hideout underneath it."
          steps:
            "1":
              title: "Sweep the east lane for a PP Up"
              text: "Follow the street past the Game Corner east to the town's edge, then north up the one-tile lane of tall grass. It dead-ends at a tree: stand below it, face up and press A for a hidden PP Up."
              hidden:
                pp-up: "At the top of the one-tile grass lane on the far east edge, southeast of the Pokémon Center, facing the tree that caps it. Face up and press A; nothing appears."
            "2":
              title: "Take the Eevee off the roof"
              text_html: "Take the Celadon Mansion's back door %{mansion}, not the front: only the rear stairwell reaches the roof. Three flights up, a house holds a Poké Ball with an Eevee at Lv 25, ready for any stone."
            "3":
              title: "Collect the Coin Case"
              text_html: "The restaurant %{diner} is south of the arcade. A man slumped at the far table lost everything at the slots and gives you his Coin Case; without it the Game Corner will not sell you a coin."
              items:
                coin_case: "From the man slumped at the far table of the Celadon restaurant, south of the Game Corner. Holds the coins you win at the slots."
            "4":
              title: "Shop the Dept. Store"
              text_html: "Head into the department store %{store} on the west side. The lift runs 1F to 5F: 4F sells the evolution stones and a Poké Doll, which the Copycat in Saffron trades TM31 Mimic for."
            "5":
              title: "Take the free TM18 from the 3F clerk"
              text: "The clerk behind the desk on 3F hands TM18 Counter over for nothing, once. Counter returns double the damage of the last physical hit that landed on its user, which answers Normal and Fighting leads."
              items:
                tm18_counter: "From the clerk behind the desk on the TV Game Shop floor. He gives it once, then only talks about it."
            "6":
              title: "Buy the roof drinks and trade them"
              text: "Ride to 5F, take the stairs to the roof and buy four drinks. The girl west of the machines trades one each for TM13 Ice Beam, TM48 Rock Slide and TM49 Tri Attack; the fourth is for Saffron's guards."
            "7":
              title: "Open Saffron with a drink"
              text: "Walk east to the Route 7 gate and hand the guard a Fresh Water. Any of the three drinks works, but Fresh Water is the cheapest at ¥200. One drink opens all four Saffron gates for good."
            "8":
              title: "Find the Game Corner"
              text_html: "The Game Corner %{corner} stands mid-town, a few doors up the street from the restaurant. Walk in through the front."
          tips:
            eevee: "Free in the Condominiums. Evolve it with a stone into Vaporeon, Jolteon or Flareon."
          oak:
            eevee: "Gift → one of Vaporeon / Jolteon / Flareon. Register the base once."
          gifts:
            eevee:
              from: "FROM THE MANSION ROOF"
        celadon_city_return:
          note: "Back for Erika. Rainbow Badge and TM21 Mega Drain."
          intro: "Second time through Celadon, with the hideout emptied and the Silph Scope in your bag. The greenhouse gym is all that is left in town, and Fly waits one route west."
          steps:
            "1":
              title: "Cut into the greenhouse"
              text_html: "The Gym %{gym} sits in the southwest corner of town. Inside is a hedge maze, and Cut is the only way through it, so put a Pokémon that knows it in your party first."
            "2":
              title: "Bank the badge and head west"
              text_html: "The Rainbow Badge makes traded Pokémon obey up to Lv 50 and lets one use Strength outside battle, plus TM21 Mega Drain. Keep your Cut user and take the west road %{west} to Route 16, where Fly waits."
        route_16_fly:
          note: "One route west of Celadon. HM02 Fly."
          intro: "The road west out of Celadon, with a Snorlax asleep across it. This trip reaches exactly one thing past the tree: the lone house above the gate, where a girl hands over Fly."
          steps:
            "1":
              title: "Cut in and cross to the house"
              text_html: "You come in from Celadon %{east} on the lower path. Cut the small tree five tiles along; the grass past it holds Doduo. Head west into the gatehouse %{gate}, out its far door %{out}, on to the house %{house}."
            "2":
              title: "Take HM02 Fly from the girl"
              text: "The girl inside calls the place her secret retreat and gives you HM02 for keeping quiet. Fly drops you at any town you have already visited, and the Thunder Badge already allows it."
              items:
                hm02_fly: "From the girl in the house at the top of Route 16, past a Cut tree. Teaches Fly between towns."
            "3":
              title: "Fly straight to Lavender"
              text: "Teach Fly to anything with wings and use it here. The road south is shut until the Poké Flute wakes the Snorlax, and Lavender's tower is next with the Silph Scope in your bag."
        rocket_hideout:
          oak:
            porygon: "Game Corner exclusive. The only Porygon you'll get. Grab one."
          tips:
            porygon: "The only Porygon in the game. 9999 Game Corner coins, but nowhere else to get it."
            vulpix: "Trade-only in the wild in Yellow. The Game Corner (1000 coins) is your easy source."
          prizes:
            note_vulpix: "The only Vulpix in Yellow. It never shows up in the wild, so this counter is the one shot at the dex slot."
            note_porygon: "The only Porygon in the game, at the steepest price in the room. Nothing else fills this dex slot."
            note_hyper_beam: "The strongest attack in Gen 1, and it skips its recharge turn entirely if it faints the target."
          note: "Team Rocket's base. Get the Silph Scope."
          intro: "Four basement floors under the Game Corner, tiled with arrows that shove you along until a wall stops you. Giovanni runs the place."
          steps:
            "1":
              title: "Sweep the arcade floor for coins"
              text_html: "Twelve piles between the machines pay 240 coins in all, one of them 100. Press A on each; nothing shows on-screen. Three players hand over 50 more: %{guru}, %{man} and %{fisher}."
            "2":
              title: "Beat the Rocket, then read the poster"
              text_html: "The Rocket %{rocket} stands in front of the poster %{poster} on the back wall. Beat him, then press A on it: the switch behind opens a stairway in the wall to the right %{stairs}."
            "3":
              title: "Feel for the hidden PP Up"
              text: "On B1F, walk south down the aisle between the two columns of potted plants. From the tile beside the bottom-right pot, press A facing it: a hidden PP Up, nothing shown on-screen."
              hidden:
                pp-up: "B1F, the bottom pot in the right-hand plant column. Stand in the aisle beside it, face east and press A. Nothing shows on-screen."
            "4":
              title: "Take the west Rocket and the Escape Rope"
              text_html: "Back at the entrance, follow the top corridor west to the Rocket %{west}. The room below him holds an Escape Rope: pocket it and the maze downstairs can never strand you."
              items:
                escape-rope: "West room of B1F, below the first Rocket. On the ball at the foot of the crates, against the room's south wall."
            "5":
              title: "Clear the east Rocket and drop to B2F"
              text_html: "A second Rocket %{east} holds the doorway on the east side. Beat him, then come back to the entrance and take the right-hand stairway %{down} down to B2F."
            "6":
              title: "Loop past the B2F Rocket"
              text_html: "Leave the arrow maze on the west alone. Follow the corridor round to the one Rocket %{rocket} on this floor, then take the staircase %{down} just above him down to B3F."
            "7":
              title: "Beat the guard, take TM10 (Double-Edge)"
              text_html: "A Rocket %{guard} stands a few tiles below the stairs. Past him the path winds down the east wall to TM10, Double-Edge: heavy Normal damage with a quarter of it recoiled back at you."
              items:
                tm-double-edge: "East side of B3F, on the room's bottom row, at the foot of the narrow path down from the Rocket."
            "8":
              title: "Feel for the hidden Nugget"
              text: "One tile east of the Double-Edge ball is an empty square. Stand below it, face up and press A: a Nugget, with nothing shown on-screen. It sells for ¥5000."
              hidden:
                nugget: "East edge of B3F, one tile east of the TM10 ball. Stand one tile south of it, face up and press A. Nothing shows on-screen."
            "9":
              title: "Ride the arrows to the Rare Candy"
              text: "West of the staircase this same floor turns to arrow tiles: each slides you where it points until a wall or a stop tile catches you. Ride the downward one; the Rare Candy sits in the alcove east of you."
              items:
                rare-candy: "Centre of B3F, in the one-tile alcove above the maze's lower row. The downward arrow drops you three tiles west of it."
            "10":
              title: "Take the west Rocket and drop to B4F"
              text_html: "Ride the upward arrow out of the alcove and work west across the maze to the Rocket %{west}. The gap south leads round to the staircase %{down} down to B4F."
            "11":
              title: "Collect the HP Up"
              text: "From the B4F stairs go a little south, then west. An HP Up waits on the table there, a permanent HP boost for whichever Pokémon you feed it to."
              items:
                hp-up: "West half of B4F, on the table in the room southwest of the staircase."
            "12":
              title: "Grab TM02 (Razor Wind)"
              text: "Back past the staircase and north into the small room. West of the tables sits TM02, Razor Wind, a Normal move that charges one turn and strikes on the next."
              items:
                tm-razor-wind: "Northwest room of B4F, west of the tables."
            "13":
              title: "Beat the grunt for the Lift Key"
              text_html: "Loop around the tables to the Rocket %{grunt} at the top of the room. Beat him and take the Lift Key off the ball beside him: it is what powers the elevator."
              items:
                lift-key: "Northwest room of B4F, on the ball beside the Rocket."
            "14":
              title: "Climb back up to B2F"
              text_html: "Take the staircase %{up} to B3F. Ride the upward arrow, then the second upward arrow northwest of it; from that stop tile head northeast to the staircase %{above} up to B2F."
            "15":
              title: "Claim the Moon Stone"
              text: "Enter B2F's maze on the lower of the two leftward arrows. From the stop tile, loop a little south for a Moon Stone, the evolution stone for Nidoran, Clefairy and Jigglypuff."
              items:
                moon-stone: "Far northwest corner of B2F, in the one-tile nook against the west wall. Step up into it from below."
            "16":
              title: "Bag the Nugget"
              text: "Return to that stop tile and follow the north wall east. A Nugget sits at the end of the run, another ¥5000 the next time you pass a shop."
              items:
                nugget: "North side of B2F, in the pillar row under the top corridor. Drop down from the corridor and take one step east."
            "17":
              title: "Pick up TM07 (Horn Drill)"
              text: "Back to the stop tile once more, then take the rightward arrow just below it. You come to rest beside TM07, Horn Drill, a one-hit KO that only lands on slower foes."
              items:
                tm-horn-drill: "West side of B2F, in the alcove below the row the rightward arrow throws you along. Walk back west two and step down."
            "18":
              title: "Take the Super Potion"
              text: "Work the arrows south and west to the far corner of the maze. A Super Potion sits on the ball there, 50 HP a go."
              items:
                super-potion: "Southwest corner of B2F, at the end of the maze."
            "19":
              title: "Ride out east to B1F"
              text_html: "The arrows run east out of the maze from here. Ride them to the far side and take the staircase %{up} up to B1F."
            "20":
              title: "Walk the sealed room anticlockwise"
              text_html: "This corner of B1F touches nothing else on the floor. Drop to the bottom run and go west: a Rocket %{lower} is waiting halfway along it."
            "21":
              title: "Grab the Hyper Potion"
              text: "Carry on west, up the left-hand run and into the top-left corner. A Hyper Potion is on the ball there, 200 HP in one go and the best heal you own."
              items:
                hyper-potion: "Top-left corner of B1F's sealed southwest room."
            "22":
              title: "Close the loop on the second Rocket"
              text_html: "Head east along the top run to the Rocket %{upper} standing on it. Beat him and drop down the right-hand side back to the staircase %{back} to B2F."
            "23":
              title: "Ride the lift to B4F"
              text_html: "With the Lift Key in your bag, cross B2F to the elevator %{lift} on the east side and press B4F. It lands you on the far side of the gate."
            "24":
              title: "Jessie & James jump the lift"
              text: "The doors open onto Jessie & James: Koffing, Meowth and Ekans, all Lv 25. Ground or Psychic clears the poison pair in a hit each; Meowth is only a nuisance."
            "25":
              title: "Pick up the Iron"
              text: "Head west from the lift and down into the south room. An Iron sits on the table there, a permanent Defense boost. Then double back to the lift."
              items:
                iron: "South room of B4F, on the table west of the elevator."
            "26":
              title: "Beat Giovanni"
              text_html: "Giovanni %{giovanni} waits at the top of the office: Onix (Lv 25), Rhyhorn (Lv 24), Persian (Lv 29). Water or Grass melts the first two; anything fast handles Persian."
            "27":
              title: "Take the Silph Scope"
              text: "Step onto the ball on the tile behind him. The Silph Scope is inside, and it is the only thing that makes the ghosts in Lavender's Pokémon Tower solid enough to fight."
              items:
                silph-scope: "Top of Giovanni's office, northeast B4F, on the tile he was guarding."
            "28":
              title: "Feel behind the machine"
              text: "Stand on the tile the Silph Scope ball was on and press A facing up. A hidden Super Potion is tucked into the machine above, with nothing shown on-screen."
              hidden:
                super-potion: "Top of Giovanni's office. Stand where the Silph Scope ball was, face up and press A. Nothing shows on-screen."
            "29":
              title: "Open the gate on the way out"
              text_html: "Ride the lift %{lift} up to B1F. One last Rocket %{last} stands beside it, and beating him opens the shutter north of the lift, the only way back to the stairs."
            "30":
              title: "Head for the Gym"
              text_html: "North through the shutter, west along the corridor and up the left staircase to the arcade, then out %{out}. Heal, buy status cures, and bring a Cut user to the Gym."
        pokemon_tower:
          note: "Lavender's haunted tower. Ghosts and the Poké Flute."
          intro: "Seven floors of graves above Lavender Town, most landings held by a Channeler. Gastly haunts this tower and nowhere else in Kanto."
          steps:
            "1":
              title: "Climb through 1F and 2F"
              text_html: "Nothing on the ground floor needs you. Take the staircase %{up} on the right up to 2F, where you already beat Blue, then cross to the west staircase %{west} and climb to 3F."
            "2":
              title: "Start up 3F and take the Escape Rope"
              text_html: "Wild Pokémon appear from this floor up, and only the Silph Scope makes them fightable. Head north to the first Channeler %{first}; two tiles past her, a ball holds an Escape Rope. The next Channeler %{south} holds the bottom row."
              items:
                escape-rope: "Top of 3F, two tiles north of the first Channeler, against the north wall. Approach from below."
            "3":
              title: "Clear 3F and climb into 4F"
              text_html: "The last Channeler %{last} on 3F stands a few rows above her. Beat her and take the east staircase %{up} to 4F, where two more, %{near} and %{below}, wait just left of the door."
            "4":
              title: "Grab the Elixir"
              text: "Past the pair, a ball sits out in the middle of the floor. It holds an Elixir, which restores the PP of every move a Pokémon knows."
              items:
                elixir: "Middle of 4F, west of the two Channelers by the east stairs."
            "5":
              title: "Pocket the Awakening"
              text: "A few tiles west along the same row is an Awakening. It wakes one Pokémon from Sleep, the status that costs you whole turns on a climb this long."
              items:
                awakening: "Middle row of 4F, a few tiles west of the Elixir."
            "6":
              title: "Drop south for the HP Up"
              text: "Come back to the Elixir's column and follow it straight down into the notch at the floor's south edge. The ball there is an HP Up, a permanent lift to one Pokémon's max HP."
              items:
                hp-up: "South edge of 4F, in the notch directly below the Elixir."
            "7":
              title: "Clear 4F and feel for the hidden Elixir"
              text_html: "Beat 4F's last Channeler %{west} on the west side and take the staircase %{up} up to 5F. Drop south into the walled alcove below it, face the bottom wall and press A: a hidden Elixir, nothing shown on-screen."
              hidden:
                elixir: "5F, in the alcove south of the west stairs. Face the bottom wall and press A. Nothing shows on-screen."
            "8":
              title: "Heal free, then clear the top of 5F"
              text_html: "Four pale tiles %{heal} mid-floor heal your party in full, free and unlimited; the Channeler %{quiet} beside them never fights. Healed up, take the northernmost Channeler %{north}, then the one %{east} on the east wall."
            "9":
              title: "Sweep west for the Nugget"
              text_html: "Cross back west past the healing tiles for the Channeler %{west}. A ball below her holds a Nugget, ¥5000 at any counter, with a last Channeler %{guard} standing over it. Then east to the stairs %{up}."
              items:
                nugget: "West side of 5F, on the ball just below the third Channeler. Approach from the right."
            "10":
              title: "Step onto 6F and take the X Accuracy"
              text_html: "A Channeler %{first} waits to your left as you arrive. Beat her, then drop south to the ball behind her for an X Accuracy, which sharpens your hits for one battle."
              items:
                x-accuracy: "Southeast of 6F, a short drop south of the floor's first Channeler."
            "11":
              title: "Round 6F and take the Rare Candy"
              text_html: "Climb back north for the Channeler %{north}, then round the rows to the last one %{across}. Just past her a Rare Candy plugs the only gap through: take it for the free level, and to open the path south."
              items:
                rare-candy: "West side of 6F, past the last Channeler. Its ball plugs the gap through to the stairs."
            "12":
              title: "Lay the ghost Marowak to rest"
              text_html: "Approach the staircase %{up} and a Lv 30 Marowak attacks. Only the Silph Scope makes it fightable. It has one attacking move and folds to Water, Ice or Grass. It can never be caught."
            "13":
              title: "Beat Jessie & James on 7F"
              text: "The pair are waiting at the top, Lv 27 across a Meowth, an Arbok and a Weezing. Beat them and the back of the room is clear."
            "14":
              title: "Free Mr. Fuji"
              text: "Speak to the old man at the top of the room. He hands over the Poké Flute and walks you home to his house in Lavender Town."
              items:
                poke_flute: "From Mr. Fuji atop the tower, once the ghost Marowak is laid to rest. Wakes the Snorlax blocking Routes 12 and 16."
            "15":
              title: "Head south for Route 12"
              text: "Leave Lavender by the south road onto Route 12. The Poké Flute wakes the Snorlax sleeping across the pier there, and the fishing routes run all the way down to Fuchsia."
          tips:
            gastly: "The only Gengar line in the game. Evolve Gastly to Haunter, then Gengar by trade."
            cubone: "5F and 6F only, and the tower is its one home in Kanto. Catch a spare: Ricky, in the Route 5 Underground Path house, trades a Machoke for one."
          oak:
            gastly: "Ghost-heavy floors → Haunter, then Gengar by trade. The only line in-game."
            cubone: "A rare Tower catch → Marowak, a strong Ground type."
        route_12:
          note: "Silence Bridge. Oddish, Bellsprout, and a Snorlax."
          intro: "A fishing pier down Kanto's east coast, most of its length out over open water. A Snorlax sleeps across the planks halfway along."
          later:
            tm_pay_day:
              where: "A Poké Ball out on a slip of pier in the northern half of Silence Bridge. Open water rings it, so nothing on foot reaches it on this pass."
              after: "Come back on Surf (HM03, from the Safari Zone) and paddle east off the boards. Pay Day scatters coins you pocket after the battle."
          steps:
            "1":
              title: "Come down from Lavender"
              text_html: "Enter from the north onto Silence Bridge, a fishing pier over open water. Climb the gate %{gate} to 2F for a free TM39 Swift. Bring a Pokémon with Cut, and leave TM16 Pay Day: it needs Surf."
              items:
                tm_swift: "From the girl on 2F of the Route 12 gate, up the stairs inside. Swift never misses: it ignores accuracy drops and Double Team."
            "2":
              title: "Wake the Snorlax"
              text: "Halfway down, a Lv 30 Snorlax lies across the only path. Play the Poké Flute to rouse it, then battle or KO it to open the way south. It is one of just two in the game, so bring balls."
            "3":
              title: "Search the west nook"
              text: "Just past the Snorlax, follow the narrow land bridge west into a walled dead-end nook. Stand on the westernmost floor tile and press A facing east for a hidden Hyper Potion. Nothing shows on-screen."
              hidden:
                hyper-potion: "The far-west dead-end nook off the Snorlax's land bridge. Face east from the westmost tile and press A. Nothing shows on-screen."
            "4":
              title: "Work down the bridge"
              text_html: "Continue south down the pier, taking the Rocker and the last Fisherman as the path lets you. Duck into the Fishing Guru's house %{guru} for the Super Rod: say YES when he asks if you like to fish."
              items:
                super_rod: "From the Fishing Guru in his house partway down Silence Bridge. The best rod, it pulls the widest range of Water Pokémon."
            "5":
              title: "Grab the Iron alcove"
              text: "Near the south end, just past the last Fisherman, a cuttable tree seals a walled alcove on the west side. Cut it, step in and grab the Iron, which permanently raises a Pokémon's Defense."
              items:
                iron: "West-side alcove near the south exit, beside the southern Fisherman. A cuttable tree is the only way in."
            "6":
              title: "Head to Route 13"
              text_html: "Clear the last Jr. Trainer and cross the tall grass at the bottom (Oddish, Bellsprout, and the rare Farfetch'd) to the south exit %{south} onto Route 13."
          tips:
            farfetchd: "A rare 5% grass catch. The only wild Farfetch'd around."
            snorlax: "One of just two Snorlax in the game. A Lv 30 wall. Sleep or paralyze, then throw balls."
          oak:
            slowpoke: "Surf the water for Slowpoke → Slowbro, a bulky Water/Psychic."
            farfetchd: "The rare duck of the grass. Grab the single wild Farfetch'd here."
        route_13:
          note: "Ledge maze south. Oddish, Bellsprout, Ditto."
          intro: "A fenced maze of ledges and hedges south of the pier, ten trainers deep. A wild Ditto turns up in its grass."
          steps:
            "1":
              title: "Wind down from Route 12"
              text: "Route 13 is a switchback of fences and clifftop ledges below Route 12. Follow it west and south, and watch the grass for a wild Ditto that Transforms into whatever it faces."
            "2":
              title: "Uncover the Calcium by the sign"
              text: "Along the southern fence, one square east of the first Trainer Tips sign, a Calcium hides in the grass. Stand east of it, face west and press A. Nothing shows on-screen."
              hidden:
                calcium: "South fence, one tile east of the first Trainer Tips sign. Face west and press A; nothing shows on-screen."
            "3":
              title: "Dig out the corner PP Up"
              text: "Follow the fence to the far southwest corner, the last patch before Route 14. A PP Up lies buried there: stand on the square just above it, face down and press A."
              hidden:
                pp-up: "Far southwest corner, the bottom tile by the Route 14 exit. Stand above it, face down and press A; nothing shows on-screen."
            "4":
              title: "Slip out west to Route 14"
              text_html: "With both stat boosts pocketed, drop through the last run of ledges and leave west %{west} into Route 14."
          tips:
          oak:
            ditto: "Catch the Transforming blob here. A fun one and useful for breeding later gens."
        route_14:
          note: "Bird-and-biker row. Oddish, Bellsprout, Venonat."
          intro: "A long diagonal of hedge-lined lanes worked by Bird Keepers and Bikers. Venomoth flies here, rare enough that a Repel is worth carrying."
          steps:
            "1":
              title: "Cut through the ledges"
              text: "Fight the Bird Keepers up top and the Bikers below. An Electric or Psychic type sweeps both."
            "2":
              title: "Head to Route 15"
              text_html: "Follow the one-way ledges southwest as they step down the cliffs, and carry on %{west} into Route 15 at the bottom."
        route_15:
          note: "West to Fuchsia. Oddish, Bellsprout, Venonat."
          intro: "The last road into Fuchsia, a fenced field of hedges with ten trainers strung across it."
          steps:
            "1":
              title: "Take the top lane for TM20 Rage"
              text_html: "In from Route 14 %{east} along the upper lane and follow it west, taking the Jr. Trainer on the way. A Poké Ball at the far end holds TM20 Rage, which raises Attack every time its user is hit."
              items:
                tm-rage: "Far west end of the upper lane, level with the Fuchsia gate. The lane is entered from the Route 14 end: the ledges below it only drop one way."
            "2":
              title: "Come back and sweep the bottom"
              text: "Backtrack east along the top, drop over the ledge, and work the lower lane right to left. Bikers, Beauties, Bird Keepers and Jr. Trainers stand in pairs down it, so heal before you start."
            "3":
              title: "Through the gate into Fuchsia"
              text_html: "Leave by the gate %{gate} at the west end. Oak's Aide waits on its 2F with the Exp. All once you have caught 50 species, then it is straight out into Fuchsia City %{west}."
              items:
                exp_all: "From Oak's Aide on the gate's 2F, once you have caught 50 species. Splits battle EXP across your whole party."
        fuchsia_city:
          mart:
            blurb: "Fuchsia sells Ultra Balls and Hyper Potions, the kit for the Safari Zone and Koga's gym."
            buy: "Ultra Balls raise your odds on rare late catches. Hyper Potions and a Revive see you through Koga."
          gym:
            intro: "The gym floor is a maze of invisible walls. Feel your way through, clearing the Jugglers and Tamers inside, then take on Koga. His three Venonat (Lv 44, 46, 48) and Venomoth (Lv 50) lean on Toxic and Double Team, so bring a fast Psychic attacker and carry Antidotes."
            puzzle:
              "1": "The whole room is blocked by invisible walls. Walk into open space until you hit one, then trace along it to find the gaps."
              "2": "Weave up and around the barriers toward the top of the room, taking each optional trainer as the path lets you reach them."
              "3": "The last opening leads to Koga. Bring a Psychic or Ground attacker and carry Antidotes for his Toxic."
          note: "Koga's Gym. Soul Badge. Safari Zone next door."
          intro: "A town of low fences wrapped around the Safari Zone's front gate. Koga's gym hides behind invisible walls, and the Warden cannot speak without his teeth."
          steps:
            "1":
              title: "Heal and stock up"
              text_html: "Arrive from Route 15, heal at the Center %{center} and stock the Mart %{mart}. Leave the Gym %{gym} alone for now: the Safari Zone next door comes before Koga."
            "2":
              title: "Take the Good Rod and fish the pond"
              text_html: "The house on the east edge %{rod} holds the Fishing Guru's older brother: answer YES and the Good Rod is yours. His back door %{back} opens into the fenced pond, so Super Rod it there for a wild Gyarados."
              items:
                good_rod: "From the Fishing Guru's older brother, in the house on Fuchsia's east edge. Reels in better catches than the Old Rod."
            "3":
              title: "Raid the Safari Zone"
              text_html: "Head north into the Safari Zone %{safari}. Its prize room holds HM03 Surf, and the Gold Teeth you find inside buy HM04 Strength from the Warden."
          tips:
            gyarados: "Super Rod the fenced pond behind the rod house for a wild Gyarados. No Magikarp grind needed."
          oak:
            gyarados: "Fish one straight out of the pond behind the rod house. No Magikarp to raise first."
        fuchsia_city_return:
          note: "Back for Koga. Soul Badge and TM06 Toxic."
          intro: "Fuchsia again, Gold Teeth in your bag. The Warden trades them for Strength, and Koga's maze of invisible walls is the last thing left in town."
          steps:
            "1":
              title: "Trade the Gold Teeth for Strength"
              text_html: "Hand the Gold Teeth to the Warden %{warden} and he gives you HM04 Strength. Teach it, then shove the boulder in his back room aside for the Rare Candy behind it. The Gym %{gym} is next."
              items:
                hm04_strength: "From the Safari Zone Warden, after you return the Gold Teeth. Teaches Strength to push boulders."
            "2":
              title: "Bank the Soul Badge and Fly out"
              text_html: "The Soul Badge raises Defense and lets a Pokémon Surf outside battle, plus TM06 Toxic. Heal at the Center %{center}, then Fly to Saffron: Silph Co. is under Rocket occupation."
        safari_zone:
          note: "500-step catch park. Scyther, Pinsir, Chansey, Dratini and more."
          intro: "Four fenced areas with no trainers and no ordinary Poké Balls. Entry buys thirty Safari Balls and exactly 502 steps, and Kangaskhan, Tauros, Scyther, Pinsir and Dratini live nowhere else."
          steps:
            "1":
              title: "Buy in at the gate"
              text: "Pay 500 at the gate for 30 Safari Balls and a 500-step clock. No trainers inside, and regular Poké Balls, HMs and fainting are all off the table until you leave."
            "2":
              title: "Step in and learn the rules"
              text: "Walk up into the Center Area. Bait freezes a Pokémon in place; a Rock sinks its catch resistance but makes it flee sooner. Nothing here can be worn down first, so those two are your only tools."
            "3":
              title: "Grab the Nugget"
              text: "Straight up the middle of the Center Area, in the grass north of the entrance, sits a lone ball holding a Nugget. Pocket it to sell for a tidy 5000 later."
              items:
                nugget: "Center Area, up the middle north of the gate."
            "4":
              title: "Cross into Area 1 for TM37"
              text: "Leave the Center Area by its east edge into Area 1 (East), arriving at the southwest corner. Push toward the middle of the field, where a ball waits with TM37 Egg Bomb."
              items:
                tm-egg-bomb: "Area 1 (East), center of the map."
            "5":
              title: "Sweep east for Carbos"
              text: "Head right toward the eastern trees and grab the Carbos ball, a permanent Speed boost for one of your team."
              items:
                carbos: "Area 1 (East), east of center."
            "6":
              title: "Snag the Full Restore"
              text: "A few tiles north of the Carbos sits another ball holding a Full Restore, a full-heal-plus-status you will want banked for tough fights."
              items:
                full-restore: "Area 1 (East), just north of the Carbos."
            "7":
              title: "Double back for the Max Potion"
              text: "Cross the top of the area back to the far west, where a lone ball near the north exit holds a Max Potion. Grab it, then slip out the northwest corner into Area 2."
              items:
                max-potion-3-7: "Area 1 (East), far west by the north exit."
            "8":
              title: "Climb Area 2 for Protein"
              text: "You arrive in Area 2 (North) at its southeast corner. Climb all the way to the top wall, where a ball tucked against the fence holds a Protein, a permanent Special boost."
              items:
                protein: "Area 2 (North), against the top wall."
            "9":
              title: "Grab TM40 on the way down"
              text: "Drop down and to the left from the Protein and pick up the ball holding TM40 Skull Bash. From here, make for the southwest corner to cross into Area 3."
              items:
                tm-skull-bash: "Area 2 (North), upper-center below the top wall."
            "10":
              title: "Enter Area 3 and find the Gold Teeth"
              text: "You land in Area 3 (West) along its top edge, where the Secret House waits. Head west across the upper band and grab the ball holding the Gold Teeth, the Warden's lost dentures."
              items:
                gold-teeth: "Area 3 (West), upper-center of the map."
            "11":
              title: "Bag TM32 Double Team"
              text: "Keep west along the same row and scoop up the ball holding TM32 Double Team before the ground opens toward the Secret House."
              items:
                tm-double-team: "Area 3 (West), upper-left, west of the Gold Teeth."
            "12":
              title: "Probe for the hidden Revive"
              text: "A couple of tiles west of the TM32 ball, stop and press A facing up on the empty patch of ground. Nothing shows on-screen, but you pocket a hidden Revive."
              hidden:
                revive: "Area 3 (West), two tiles west of the TM32 ball; press A facing up, nothing shows."
            "13":
              title: "Claim HM03 Surf at the Secret House"
              text: "Step into the Secret House in the far top-left corner. The old man inside hands you HM03 Surf, the whole reason to trek out here. Teach it later and half the map's water opens up."
              items:
                hm03_surf: "From the old man in the Secret House, far corner of Safari Zone Area 3. Teaches Surf across open water."
            "14":
              title: "Drop south for a second Max Potion"
              text: "Leave the house and follow the west side down to the bottom of the area, where another ball holds a Max Potion."
              items:
                max-potion-8-20: "Area 3 (West), lower-left near the bottom wall."
            "15":
              title: "Cut east for the Max Revive"
              text: "Angle east across the lower field and grab the ball holding a Max Revive, the last prize before the exit."
              items:
                max-revive: "Area 3 (West), lower-center of the map."
            "16":
              title: "Loop back out and pay the Warden"
              text: "Slip out Area 3's east edge into the Center Area and back through the gate. Super Rod the ponds for Dratini first, then hand the Gold Teeth to Fuchsia's Warden for HM04 Strength."
          tips:
            scyther: "One of Yellow's two big bug bruisers, here alongside Pinsir. Bait, then Safari Balls."
            pinsir: "Yellow lets you catch both Pinsir and Scyther in the Safari. Grab this one too."
            kangaskhan: "A rare Safari-only Normal type. Patient bait-and-ball or nothing."
            chansey: "1% and flighty, but a huge EXP prize. Save a few balls for it."
            dratini: "The only easy Dratini. Super Rod the Safari ponds for the Dragonite line."
          oak:
            scyther: "Safari-exclusive bruiser. Grab one. No other easy source."
            pinsir: "The other Safari bug. Yellow lets you keep both Pinsir and Scyther."
            dratini: "Super Rod the ponds → Dragonair → Dragonite. Your one reliable shot."
            kangaskhan: "Rare and Safari-only. Bank one for the dex while you're here."
        route_16:
          note: "Cycling Road's top. Doduo and a Snorlax."
          intro: "The north gate of Cycling Road, with a second Snorlax asleep in the doorway. Past it the road runs one way only, downhill."
          steps:
            "1":
              title: "Wake the Snorlax"
              text_html: "Play the Poké Flute at the Snorlax on the path (Lv 30) and battle it to clear the gate %{gate}."
            "2":
              title: "Mount Cycling Road"
              text_html: "Ride the Bicycle through the north gate %{gate} onto Route 17 %{south}, the Cycling Road. You cannot walk it, so the Bike is not optional here."
          tips:
            snorlax: "The second and last Snorlax. Same Lv 30 wall. Sleep it, then throw balls."
          oak:
            doduo: "The route's common catch → Dodrio, a fast Normal/Flying."
            snorlax: "The last of two Snorlax. Wake with the Poké Flute and catch it now."
        route_17:
          note: "Cycling Road. Doduo, Ponyta, Fearow."
          intro: "Cycling Road: a long downhill run you can only take on the Bike, walled by ledges that stop you turning back. Ten Bikers and five hidden items line it."
          steps:
            "1":
              title: "Ride south down Cycling Road"
              text_html: "Enter from the north gate %{north} and mount the Bike, since Cycling Road cannot be crossed on foot. Coast down the one-way slope, stopping in the grass strips for a shot at Ponyta."
            "2":
              title: "Sweep the top lane"
              text: "Just past the north gate, the slope opens onto its first stretch. Hug the east lane and press A on the bare tile there for a hidden Rare Candy; nothing shows on-screen."
              hidden:
                rare-candy: "East lane, near the top by the north gate. Press A on the empty tile; nothing appears."
            "3":
              title: "Search the center strip"
              text: "About a third of the way down, drift to the center-left of the road. Press A on the plain tile there to dig out a hidden Full Restore; nothing shows on-screen."
              hidden:
                full-restore: "Center-left of the road, roughly a third down. Press A on the bare tile; nothing appears."
            "4":
              title: "Check the east fence"
              text: "Around the Trainer Tips sign, veer to the far east edge of the road. Press A against the fence tile for a hidden PP Up; nothing shows on-screen."
              hidden:
                pp-up: "Far east edge, level with the Trainer Tips sign. Press A on the fence tile; nothing appears."
            "5":
              title: "Comb the west lane"
              text: "Lower down, swing to the west lane near the Bikers guarding this stretch. Press A on the empty tile there for a hidden Max Revive; nothing shows on-screen."
              hidden:
                max-revive: "West lane, lower third of the road. Press A on the bare tile; nothing appears."
            "6":
              title: "Dig near the bottom"
              text: "Near the foot of the slope, before the Cycling Road Ends sign, stop center-left and press A for a hidden Max Elixir; nothing shows on-screen."
              hidden:
                max-elixir: "Center-left, near the bottom by the Cycling Road Ends sign. Press A; nothing appears."
            "7":
              title: "Exit to Route 18"
              text_html: "At the foot of the slope, past the Cycling Road Ends sign, roll through the south gate %{south} onto Route 18."
          oak:
            ponyta: "A fiery grass catch → Rapidash. One of few Fire types in Yellow."
        route_18:
          note: "East to Fuchsia. Spearow, Rattata, Doduo."
          intro: "A short strip between the foot of Cycling Road and Fuchsia, three Bird Keepers on it and a gate house at either end."
          trades:
            parasect:
              npc: "COOK"
              title: "Parasect"
              where: "Upstairs in the Route 18 gate"
              note: "A ready-made Parasect that levels fast thanks to the traded-XP bonus. Tangela is a Safari Zone catch."
          steps:
            "1":
              title: "Cross east"
              text: "Beat the three Bird Keepers strung along the narrow strip of land at the foot of the Cycling Road, where the route pinches between the water."
            "2":
              title: "Enter Fuchsia"
              text_html: "Carry on east through the gate %{gate} and into Fuchsia City %{east}, home of the Safari Zone and Koga's gym."
        saffron_city:
          mart:
            blurb: "Saffron's Mart stocks Max Repel and Full Heal, open once Team Rocket clears out of the city."
            buy: "Hyper Potions and a Full Heal ready you for Sabrina. Max Repel makes Silph Co.'s floors bearable."
          gym:
            intro: "Warp pads teleport you around the gym in a fixed loop. Take the right pads to reach Sabrina, whose Abra, Kadabra and Alakazam (all Lv 50) hit like a truck. Psychic has no true counter in Gen 1, so out-level her or lead with a strong Bug attacker like Pinsir or Scyther."
            puzzle:
              "1": "Step onto a warp pad and it flings you to another room. Each room has one trainer and two pads: one loops back, one moves you on."
              "2": "The fastest line: from the entrance take the southeast pad, then the northwest pad, then the southwest pad, and the southwest pad once more. Each hop drops you on one trainer to clear, and that sequence lands you in Sabrina's room."
              "3": "The final warp drops you beside Sabrina. Psychic has no counters in Gen 1, so out-level her or lead with a strong Bug attacker."
          note: "Sabrina's Gym. Marsh Badge. Silph Co. and the Dojo."
          intro: "Kanto's capital under Rocket occupation, a guard on every gate. Silph Co. stands in the middle, and the city keeps two fighting halls: Sabrina's gym and the Dojo."
          steps:
            "1":
              title: "Free Silph Co. first"
              text_html: "The gym %{gym} stays locked until you clear Rocket-held Silph Co. %{silph} (see Silph Co.), then enter and solve the teleport-pad maze to Sabrina."
            "2":
              title: "Claim a fighter"
              text_html: "Beat the Karate Master at the Fighting Dojo %{dojo} to take a free Hitmonlee or Hitmonchan."
          oak:
            hitmonlee: "Free from the Dojo. Pick Hitmonlee or Hitmonchan (you only get one)."
        silph_co:
          note: "Rocket HQ takeover. Lapras and the Master Ball."
          intro: "Eleven floors of offices wired together by teleport pads, with thirty-one Rockets inside. One Card Key opens every locked door in the building."
          steps:
            "1":
              title: "Enter the Rocket-held tower"
              text: "Team Rocket holds all eleven floors, a warren of one-way warp tiles and Card Key doors. Punch up to 5F for the Card Key, which unlocks every sealed item room, then work to the top."
            "2":
              title: "Sweep 3F for the Hyper Potion"
              text: "On the third floor, a Poke Ball waits in a room just west of center. Grab the Hyper Potion near its north wall."
              items:
                hyper-potion: "3F, room just west of center; the ball sits near the north wall."
            "3":
              title: "Grab the Max Revive"
              text: "Three Poke Balls sit together in the lower-left of 4F. The northernmost holds a Max Revive."
              items:
                max-revive: "4F, lower-left cluster, the northernmost of three balls."
            "4":
              title: "Pocket the Escape Rope"
              text: "Just southeast of the Max Revive, the middle ball of the trio holds an Escape Rope."
              items:
                escape-rope: "4F, just southeast of the Max Revive."
            "5":
              title: "Take the Full Heal"
              text: "The third ball of the cluster sits in the southwest and holds a Full Heal, which clears any status ailment in one use."
              items:
                full-heal: "4F, southwest of the same three-ball cluster."
            "6":
              title: "Seize the Card Key"
              text: "In the far southeast corner of 5F, past the Scientist and his Pokémon Report clipboards, a Poke Ball holds the Card Key. It opens every locked door in the building, so grab it before anything else."
              items:
                card-key: "5F, far southeast corner, past the clipboards."
            "7":
              title: "Bag the Protein"
              text: "With the Card Key in hand, open the upper-left room of 5F. A lone Poke Ball there holds a Protein, a permanent Attack boost."
              items:
                protein: "5F, upper-left room."
            "8":
              title: "Grab TM Take Down"
              text: "Drop to the lower-left corner of the same floor, where a ball holds TM Take Down, a heavy Normal move that hurts the user too."
              items:
                tm-take-down: "5F, lower-left corner."
            "9":
              title: "Feel out the hidden Elixir"
              text: "Along the north wall of 5F, near center, press A on an empty square for a hidden Elixir. Nothing shows on-screen."
              hidden:
                elixir: "5F, north wall near center; press A facing up. Nothing shows on-screen."
            "10":
              title: "Lift the HP Up"
              text: "Warp up to 6F and cross to its lower-left corner, where a Poke Ball holds an HP Up, a permanent HP boost for one Pokémon."
              items:
                hp-up: "6F, lower-left corner."
            "11":
              title: "Grab the X Accuracy"
              text: "Just south of the HP Up, in the corner of 6F, sits an X Accuracy."
              items:
                x-accuracy: "6F, lower-left corner, just south of the HP Up."
            "12":
              title: "Rescue Lapras and fight your rival"
              text: "On 7F a freed Silph employee hands you a Lapras, the only one in the game and a superb Water/Ice tank. Your rival ambushes you here by the elevator, so heal before you talk to the employee."
            "13":
              title: "Grab the Calcium"
              text: "Against the left wall of 7F, just below where your rival appears, a Poke Ball holds a Calcium."
              items:
                calcium: "7F, left wall, just south of the rival's spot."
            "14":
              title: "Fetch TM Swords Dance"
              text: "Cross 7F to its far-right side for TM Swords Dance, which sharply raises Attack and turns a physical sweeper loose."
              items:
                tm-swords-dance: "7F, far-right side."
            "15":
              title: "Feel out the hidden Max Potion"
              text: "9F has a healing nurse in the lower-left. Stand in the corner beside her and press A for a hidden Max Potion. Nothing shows on-screen."
              hidden:
                max-potion: "9F, lower-left corner by the nurse; press A facing up. Nothing shows on-screen."
            "16":
              title: "Grab TM Earthquake"
              text: "In the lower-left pocket of 10F sits TM Earthquake, one of the best TMs in the game."
              items:
                tm-earthquake: "10F, lower-left pocket."
            "17":
              title: "Pocket the Rare Candy"
              text: "Just southeast of the TM, another Poke Ball holds a Rare Candy, one free level for whoever needs it most."
              items:
                rare-candy: "10F, just southeast of TM Earthquake."
            "18":
              title: "Take the Carbos"
              text: "At the top of that same lower-left pocket on 10F sits a Carbos, a permanent Speed boost. That clears the floors below Giovanni."
              items:
                carbos: "10F, top of the lower-left pocket."
            "19":
              title: "Beat Giovanni on 11F"
              text: "Work up to 11F and face Giovanni (Nidorino Lv 37, Rhyhorn Lv 37, Persian Lv 35, Nidoqueen Lv 41). Ground moves like Dig and Earthquake carry the fight. Beating him breaks the takeover."
            "20":
              title: "Take the Master Ball"
              text: "Talk to the Silph president in his office for the Master Ball. Save it for a legendary like Articuno, Zapdos, Moltres or Mewtwo."
          tips:
            lapras: "The only in-game Lapras. A superb Water/Ice tank. Don't miss it on 7F."
          oak:
            lapras: "Free on 7F → a top Water/Ice tank. The only Lapras you'll get in-game."
          gifts:
            lapras:
              from: "FROM A SILPH EMPLOYEE"
        route_19:
          note: "Water route south of Fuchsia. Needs Surf."
          intro: "Open sea south of Fuchsia, nothing but water once you leave the beach. Ten Swimmers float in the way, and Tentacool is almost all that bites."
          steps:
            "1":
              title: "Surf out"
              text: "Surf south out of Fuchsia along the Seafoam approach, fishing or battling the Swimmers and Beauties spread across the open water."
            "2":
              title: "Head to Route 20"
              text_html: "Carry on south to the little beach at the bottom, which opens west %{west} into Route 20 and the Seafoam Islands."
        route_20:
          note: "Water route to Seafoam. Tentacool, Staryu, Shellder."
          intro: "The long channel west toward Cinnabar, with the Seafoam Islands sitting in the middle of it. Nothing gets past except through the cave or around it."
          steps:
            "1":
              title: "Surf west"
              text: "Clear the Swimmers strung across the east half of the water as you Surf west along the channel toward the islands."
            "2":
              title: "Enter Seafoam"
              text_html: "The Seafoam Islands cave breaks the water in the middle of the route. Step in from the eastern mouth %{east} to start the boulder puzzle."
        seafoam_islands:
          note: "Boulder-puzzle cave. Wild Articuno inside."
          intro: "Five floors of sea cave with currents running through the lower ones. No trainers at all, one boulder puzzle, and Articuno at the bottom."
          steps:
            "1":
              title: "Enter with Surf and Strength"
              text: "Ride in off Route 20 with both HMs: Surf to cross the currents, Strength to shove the boulders that slow them. Seel, Slowpoke, Shellder and Krabby prowl the floors."
            "2":
              title: "Dam the currents downward"
              text: "Work down through 1F and B1F, pushing each boulder into the current holes so the water below stops flowing. Every dammed current opens another stretch of Surf, carrying you steadily down to B2F."
            "3":
              title: "Pocket the hidden Nugget"
              text: "On B2F, cross to the open cave floor at the lower center of the map. Stand one square west of a plain-looking tile and press A facing east for a hidden Nugget, a pricey sell at any Mart."
              hidden:
                nugget: "B2F, on the open floor at the lower center. Face east and press A. Nothing shows on-screen."
            "4":
              title: "Dig out the Max Elixir"
              text: "Down on B3F, head to the cluster of boulders in the southwest corner. Just south of them, press A facing north on the bare floor for a hidden Max Elixir, which fully refills every move's PP for one Pokémon."
              hidden:
                max-elixir: "B3F, southwest corner just below the boulders. Face north and press A. Nothing shows on-screen."
            "5":
              title: "Catch Articuno"
              text: "B4F opens onto Articuno's chamber. Surf to the Ice bird in the northwest corner (Lv 50) and save before you touch it. Sleep or paralyze it, then throw Ultra Balls."
            "6":
              title: "Sweep the corner Ultra Ball"
              text: "Before you climb back out, sweep the far southeast corner of B4F. Beside the boulders there, press A facing south for a hidden Ultra Ball to refill your throwing stock."
              hidden:
                ultra-ball: "B4F, far southeast corner beside the boulders. Face south and press A. Nothing shows on-screen."
            "7":
              title: "Exit toward Cinnabar"
              text: "With Articuno caught and the pockets full, ride out the far west mouth of the cave onto the open sea and Surf south to Cinnabar Island."
          tips:
            articuno: "A one-time Lv 50 legendary. Save first, sleep/paralyze it, and use the Master Ball or a lot of Ultra Balls."
          oak:
            seel: "A cave catch → Dewgong, a solid Water/Ice. Grab the base."
            articuno: "The Ice legendary of Seafoam. One shot only. Catch it now."
        power_plant:
          note: "Optional Surf detour. Electric mons, a rare Muk, and Zapdos."
          intro: "An abandoned plant off Route 10, reachable only by Surf. Thirteen Poké Balls lie on its floors and eight are Voltorb in disguise; Zapdos roosts at the back."
          steps:
            "1":
              title: "Surf in from Route 10"
              text_html: "With Surf, ride south from the Rock Tunnel entrance on Route 10 to the plant's lone door %{door}. Wild Electric and Poison types hum through the floors, so pack Repels if you only want the loot and Zapdos."
            "2":
              title: "Grab the Carbos on the west wall"
              text: "Head up the left side from the door. Eight of the balls on these floors are Voltorb or Electrode that wake and attack, but the one low against the west wall is real: a Carbos, a Speed boost."
              items:
                carbos: "Against the west wall, low in the plant. Face east to take it."
            "3":
              title: "Poke the first fake ball"
              text: "Climb the corridor above the Carbos alcove. The ball waiting at left-center is your first disguised Voltorb (Lv 40); touch it and it snaps awake for a battle. Log it for the dex, then move on."
            "4":
              title: "Cross into the south-center room"
              text: "Wind east and down into the middle of the plant. A ball sits in the south-center room, and it is another Voltorb (Lv 40) playing dead. Take the fight or walk past it."
            "5":
              title: "Nudge the ball just below"
              text: "A short step east and down sits yet another fake ball, a Voltorb (Lv 40) in the lower-center. Same disguise, same jolt when you touch it."
            "6":
              title: "Bag TM33 Reflect"
              text: "Drop into the wide south room. Dead center sits a genuine ball holding TM33 (Reflect), which halves physical damage taken for a few turns. Grab it facing north."
              items:
                tm-reflect: "Center of the south room. Face north to take it."
            "7":
              title: "Check the ball on the south wall"
              text: "Just east of the TM, against the south wall, sits another ball. It is a Voltorb (Lv 40) in disguise, so face east and expect a scuffle."
            "8":
              title: "Bag TM25 Thunder"
              text: "East of center in the south room waits a real ball with TM25 (Thunder), the plant's signature 110-power Electric move. Grab it facing east."
              items:
                tm-thunder: "South room, east of center. Face east to take it."
            "9":
              title: "Sweep the south-east corner"
              text: "Push into the far south-east corner for the last ball down here. Another Voltorb (Lv 40) disguise; grab it facing west, then head back up."
            "10":
              title: "Feel for the hidden Max Elixir"
              text: "Back in the middle of the plant, stand one square east of the little wall nub and press A facing west. A hidden Max Elixir is there, with nothing shown on-screen."
              hidden:
                max-elixir: "Dead center of the plant, one tile east of the wall nub. Press A facing west; nothing shows on-screen."
            "11":
              title: "Wake the Electrode ball"
              text: "A ball sits in the center of the plant, but this one is a tougher disguise: an Electrode (Lv 43). Grab it facing south and brace for a possible Selfdestruct."
            "12":
              title: "Check the east-center ball"
              text: "Slightly east sits one more ball, a Voltorb (Lv 40) in disguise. Grab it facing west before you climb toward the top of the plant."
            "13":
              title: "Grab the HP Up up top"
              text: "Climb the east side and follow the top row. Right of center sits a real ball with an HP Up to raise a Pokémon's max HP. Take it facing north."
              items:
                hp-up: "Top row, right of center. Face north to take it."
            "14":
              title: "Snag the Rare Candy"
              text: "In the top-right corner waits a genuine ball with a Rare Candy, a free level for any Pokémon. Grab it facing west."
              items:
                rare-candy: "Top-right corner. Face west to take it."
            "15":
              title: "Wake the last Electrode"
              text: "Sweep back west across the top. In the upper-center sits the second Electrode (Lv 43) disguise; grab it facing east and brace for another Selfdestruct."
            "16":
              title: "Feel for the hidden PP Up"
              text: "Near the top-left, walk up to the north wall left of center and press A facing up. A hidden PP Up sits against the wall, invisible until it lands in your bag."
              hidden:
                pp-up: "Against the north wall, left of center. Press A facing north; nothing shows on-screen."
            "17":
              title: "Catch Zapdos"
              text: "Zapdos (Lv 50) roosts in the far northwest, near the plant's west door. Save first, chip it with Rock or Ice, sleep or paralyze it, then throw Ultra Balls. You get one shot."
            "18":
              title: "Surf back out to Route 10"
              text: "With Zapdos caught and the plant stripped clean, step out the south door and Surf back onto Route 10. From here it is on toward Rock Tunnel and Lavender Town."
          tips:
            zapdos: "The Electric legendary, a one-time Lv 50 static. Save before you touch it, then sleep or paralyze and ball it down."
          oak:
            zapdos: "The Electric bird of the Power Plant. One shot only. Catch it while you are here."
            voltorb: "All over the floors (and disguised as items) → Electrode. Grab one for the dex."
        cinnabar_island:
          mart:
            blurb: "The island Mart carries the full late-game shelf: Ultra Balls, Hyper Potions and Full Heals."
            buy: "Ultra Balls for the Mansion's rare spawns, plus Hyper Potions and Revives for Blaine's fire types."
          gym:
            intro: "Locked doors bar the way to Blaine, each opened by answering a quiz or beating the trainer behind it. His Ninetales (Lv 48), Rapidash (Lv 50) and Arcanine (Lv 54) hit hard and fast, so bring a Water, Rock or Ground attacker and pack Burn Heals."
            puzzle:
              "1": "Each door poses a yes or no Pokémon quiz. Answer correctly and it opens; answer wrong and you battle the trainer behind it, which opens it anyway."
              "2": "If you would rather not guess, the answers in order are yes, no, no, no, yes, no. Or skip the quizzes and fight every trainer instead; the doors open either way and both routes reach the back."
              "3": "The final door opens onto Blaine. A single strong Water, Rock or Ground move drops his Ninetales, Rapidash and Arcanine in a hurry."
          note: "Blaine's Gym. Volcano Badge. Fossil lab."
          intro: "A volcanic island one street long: a lab that revives fossils, a burnt-out mansion, and a gym whose key is somewhere inside it."
          trades:
            muk:
              npc: "SCIENTIST"
              title: "Muk"
              where: "The fossil room of the Pokémon Lab"
              note: "A high-level Muk with no grinding. Kangaskhan is a Safari Zone catch."
            rhydon:
              npc: "OLD MAN"
              title: "Rhydon"
              where: "The trade room of the Pokémon Lab"
              note: "A traded Rhydon comes in strong and gains boosted XP."
            dewgong:
              npc: "BEAUTY"
              title: "Dewgong"
              where: "The trade room of the Pokémon Lab"
              note: "Dewgong for a Growlithe, plus the traded-XP bonus. Growlithe roams the Pokémon Mansion next door."
          steps:
            "1":
              title: "Clear the Mansion first"
              text_html: "Blaine's gym %{gym} is locked. Cross the street to the Pokémon Mansion %{mansion} and fetch the Secret Key."
            "2":
              title: "Hand in a fossil, then the Gym"
              text_html: "Give a fossil to the scientist at the Lab %{lab}, then open the gym with the Secret Key and work the quiz doors to Blaine. Water, Ground or Rock melts his Fire team."
            "3":
              title: "Collect your fossil and move on"
              text: "Return to the Lab later for the revived fossil Pokémon, then Surf out toward the last badge."
          tips:
            omanyte: "Revive the Helix Fossil here → Omanyte, then Omastar. A Rock/Water only found this way."
            kabuto: "Revive the Dome Fossil → Kabuto, then Kabutops. The other fossil line."
            aerodactyl: "Revive the Old Amber (Pewter museum) → Aerodactyl, a rare Rock/Flying."
          oak:
            omanyte: "Revive whichever fossil you chose in Mt. Moon. Helix → Omanyte."
            kabuto: "Dome Fossil → Kabuto. You can only revive the one fossil you kept."
            aerodactyl: "Old Amber from Pewter's museum → Aerodactyl. Register the single specimen."
        pokemon_mansion:
          note: "Burnt-out mansion. Fire types and the Secret Key."
          intro: "A burnt-out mansion of hidden staircases opened by statue switches. Its abandoned diary is where Mewtwo's story is written down."
          steps:
            "1":
              title: "Enter the burned mansion"
              text: "Cross from the Cinnabar shore into the charred mansion, a maze of barred paths that open only when you press the hidden switch inside a nearby statue. The prize is the Secret Key, down on B1F."
            "2":
              title: "Grab the Carbos on 1F"
              text: "Just inside, sweep the east side of the ground floor. The Carbos (a Speed vitamin) sits in a ball on the east side, just south of the Scientist you battle on the way up."
              items:
                carbos: "East side of 1F, south of the Scientist trainer."
            "3":
              title: "Search the 1F pillars for a Moon Stone"
              text: "By the pillars in the west-central part of 1F, press A on the empty floor to turn up a hidden Moon Stone (it evolves Nidorina, Nidorino, Clefairy and Jigglypuff). Nothing shows on-screen, so trust the tile."
              hidden:
                moon-stone: "West-central 1F, on the floor beside the pillars. Press A; nothing is visible."
            "4":
              title: "Pick up the Escape Rope up north"
              text: "Follow the opened path to the far north wall of 1F, where an Escape Rope waits in a ball. It is a free instant exit from the mansion for later, so pocket it before taking the stairs up."
              items:
                escape-rope: "Far north edge of 1F, north-central."
            "5":
              title: "Flip the switches and climb to 2F"
              text_html: "Press A on the statues to trip the hidden switches, dropping the barriers around the western staircase, stairs %{up}, then climb to 2F."
            "6":
              title: "Cross 2F for the Calcium"
              text_html: "On 2F, work east to the far wall, where a ball holds the Calcium, a Special vitamin. Flip the 2F statue switch while you are here, then take stairs %{up} up to 3F."
              items:
                calcium: "Northeast corner of 2F."
            "7":
              title: "Sweep 3F east for the Iron"
              text: "On the top floor you face a Burglar and a Scientist. Push to the northeast side, past the Scientist, and open the ball for the Iron (a Defense vitamin)."
              items:
                iron: "Northeast area of 3F, past the Scientist."
            "8":
              title: "Grab the Max Potion in the 3F southwest"
              text: "Backtrack all the way across 3F to the far southwest and grab the Max Potion in its ball against the west wall (a full HP heal)."
              items:
                max-potion: "Southwest corner of 3F, against the west wall."
            "9":
              title: "Check up the west wall for a hidden Max Revive"
              text: "Head up the west wall from that Max Potion and press A on the bare floor around mid-height to dig up a hidden Max Revive (revives with full HP and PP). Nothing shows on-screen, so trust the spot."
              hidden:
                max-revive: "West wall of 3F, a stretch north of the Max Potion. Press A; nothing appears."
            "10":
              title: "Work back down to B1F"
              text_html: "The upper switches have opened the barrier around 1F's basement stairs. Retrace your way down through 3F and 2F, then take the cleared southeast stairs %{down} down to B1F."
            "11":
              title: "Bag TM14 Blizzard by the B1F stairs"
              text: "You land in the southeast of B1F. Just southwest of the stairs, open the ball for TM14 (Blizzard), a top-tier Ice attack worth teaching a strong Water type."
              items:
                tm-blizzard: "Southeast B1F, just southwest of the entrance stairs."
            "12":
              title: "Cross to the Full Restore in the southwest"
              text: "Wind west along the bottom of the basement to the far southwest corner, where a Full Restore (full HP heal plus status cure) sits in a ball."
              items:
                full-restore: "Southwest corner of B1F."
            "13":
              title: "Claim the Secret Key"
              text: "Head north into the small central chamber and open the ball holding the Secret Key. This is the whole reason for the trip: it unlocks Blaine's Gym across the street on Cinnabar Island."
              items:
                secret-key: "Center-west room of B1F, north of the Full Restore."
            "14":
              title: "Dig a hidden Rare Candy from the NW corner"
              text: "In the northwest of that same room, press A against the corner floor to turn up a hidden Rare Candy (one free level). Nothing shows on-screen, so check the empty tile."
              hidden:
                rare-candy: "Northwest corner of the B1F Secret Key room. Press A; nothing is visible."
            "15":
              title: "Grab TM22 SolarBeam in the northwest"
              text: "Continue north from that corner to the ball holding TM22 (SolarBeam), the strongest Grass move in the game."
              items:
                tm-solarbeam: "Northwest B1F, north of the hidden Rare Candy corner."
            "16":
              title: "Snag the last Rare Candy up top"
              text: "Just east along the north wall, open the final ball for a second Rare Candy. Save these to bump a slow-leveling favorite past a stubborn level gate, then head back to the stairs."
              items:
                rare-candy: "North edge of B1F, center, east of TM22."
            "17":
              title: "Leave and cross to Blaine's Gym"
              text: "With the Secret Key in hand and the basement cleared, use the Escape Rope (or walk out) back to Cinnabar Island. Cross the street and unlock Blaine's Gym for the Volcano Badge."
          tips:
            growlithe: "The other Fire dog, here in the same mansion → Arcanine with a Fire Stone."
          oak:
            vulpix: "Wild here in Yellow (elsewhere trade-only) → Ninetales. Grab one."
            growlithe: "Also wild here → Arcanine with a Fire Stone. Log the base."
            magmar: "A rare mansion catch. A strong Fire attacker. Bank one."
        route_21:
          note: "Water route back to Pallet. Fishing plus a Pallet-side grass patch."
          intro: "The sea between Cinnabar and Pallet, nine Swimmers and Fishermen strung down it. A strip of grass at the Pallet end is the only land on the route."
          steps:
            "1":
              title: "Surf north toward Pallet"
              text: "From Cinnabar, Surf north up the channel, clearing the Swimmers as you go. Tentacool fills the open water."
            "2":
              title: "Fish and sweep the grass"
              text: "Super Rod the water for Magikarp, Goldeen, Shellder and Staryu, then check the grass patch just south of Pallet for Pidgey and Rattata plus wild Pidgeotto and Raticate. Land at Pallet and head up to Viridian for the Earth Badge."
          tips:
            magikarp: "Fish one here and grind it to Lv 20; it becomes Gyarados, one of the strongest Water types in the game."
            goldeen: "A reliable Super Rod catch → Seaking. An easy spot to log the line."
          oak:
            magikarp: "Super Rod it here → Gyarados. Weak now, monstrous once it evolves."
            goldeen: "Fish one → Seaking. Register the base while you are fishing anyway."
        viridian_gym:
          gym:
            intro: "The last Kanto gym, a spinner-tile maze packed with eight trainers. Giovanni waits at the top with Dugtrio (Lv 50), Persian (Lv 53), Nidoqueen (Lv 53), Nidoking (Lv 55) and Rhydon (Lv 55). Dugtrio's Fissure and Rhydon's Horn Drill are one-hit KOs, so out-speed them and pack Water, Grass or Ice."
            puzzle:
              "1": "Spinner tiles fling you in a straight line until you hit a stop tile. Plan each launch so you land where you can reach the next trainer."
              "2": "Clear trainers to open the northern path, then ride the spinners north and west, correcting your line at each stop toward Giovanni."
              "3": "The final spinners drop you in front of Giovanni. Watch for Fissure and Horn Drill one-hit KOs and lead with a fast Water or Ice attacker."
          note: "Giovanni's Gym. Earth Badge. The 8th badge."
          intro: "The gym that stayed shut all game. Giovanni runs it, with eight trainers and a floor of spinning arrow tiles between the door and him."
          steps:
            "1":
              title: "Prep and enter the Gym"
              text: "Top off Potions and Revives first: there is no healing between the eight trainers. Enter from the south, and the floor turns into spinner tiles that fling you straight until you hit a stop."
            "2":
              title: "Grab the Revive"
              text: "A Poke Ball rests on the east side of the maze, straight north up the column of the south entrance. Ride the spinners to line up on it and pocket the free Revive before you climb toward Giovanni."
              items:
                revive: "East side, straight north of the south door, about halfway up the gym."
            "3":
              title: "Ride the spinners to Giovanni"
              text: "Beat the trainers to open the northern path, correcting your launch at each stop tile. Giovanni waits at the top: watch Dugtrio's Fissure and Rhydon's Horn Drill, and lead fast with Water, Grass or Ice."
            "4":
              title: "On to Victory Road"
              text_html: "With the Earth Badge and all eight in hand, leave the gym %{out} and head back to Route 22, then push west into Victory Road."
        victory_road:
          note: "The League gate. Boulder puzzles and Moltres."
          intro: "Three floors of boulder puzzles between Route 23 and the League, every door held by a switch that needs a rock sat on it. Moltres roosts on the way up."
          steps:
            "1":
              title: "Step in with Strength ready"
              text: "Victory Road opens only with all 8 badges. Bring Strength, Surf and Flash. Each of its three floors is locked by a boulder you shove onto a floor switch to drop the barrier."
            "2":
              title: "Grab the Rare Candy"
              text: "Head up from the entrance into 1F's upper chamber. A Poke Ball on the north ledge holds a Rare Candy, one free level for any teammate."
              items:
                rare-candy: "1F, north ledge of the upper chamber, just west of center."
            "3":
              title: "Bag TM43 Sky Attack"
              text: "A couple of tiles east, right against the top wall, another ball holds TM43 Sky Attack, a heavy two-turn Flying move."
              items:
                tm-sky-attack: "1F, against the top wall, a few steps east of the Rare Candy."
            "4":
              title: "Take the ladder to 2F"
              text_html: "With 1F cleared, cross to the northwest ladder %{up}, the floor's only way up, and climb to 2F, the tangled hub where Moltres roosts."
            "5":
              title: "Feel out the hidden Ultra Ball"
              text: "Step onto 2F and work to the northwest ledge. Press A on the empty square there for a hidden Ultra Ball; nothing shows on-screen, so trust the spot."
              hidden:
                ultra-ball: "2F, northwest ledge. Press A on the bare tile; no item is visible."
            "6":
              title: "Pick up the Guard Spec."
              text: "Just below the top wall, near the center of 2F, a ball holds a Guard Spec., which blocks stat drops for a few turns."
              items:
                guard-spec: "2F, top-center, against the north wall."
            "7":
              title: "Catch Moltres"
              text: "West of center, Moltres (Lv 50) is roosting on the rock. Save first, chip it down with Water, Electric or Rock, put it to sleep or paralyze it, then throw Ultra Balls. You get one shot at it."
            "8":
              title: "Grab TM05 Mega Kick"
              text: "Drop south to the lower center of 2F, where a ball holds TM05 Mega Kick, a strong Normal attack."
              items:
                tm-mega-kick: "2F, south-center of the floor."
            "9":
              title: "Pocket the Full Heal"
              text: "Cross east through the middle of 2F to a ball holding a Full Heal, which clears any status ailment."
              items:
                full-heal: "2F, middle of the floor, east of center."
            "10":
              title: "Sweep for the hidden Full Restore"
              text: "Push on toward the eastern ladders and press A on the empty square there for a hidden Full Restore. Nothing appears on-screen, so search the exact tile."
              hidden:
                full-restore: "2F, far east near the exit ladders. Press A on the bare tile; no item shows."
            "11":
              title: "Bag TM17 Submission"
              text: "In the northeast corner of 2F, a ball holds TM17 Submission, a recoil Fighting move."
              items:
                tm-submission: "2F, northeast corner."
            "12":
              title: "Climb to 3F"
              text_html: "Take the east ladder %{up} up to 3F and its four-boulder puzzle. Shove each boulder onto its switch to clear the path to the last two prizes."
            "13":
              title: "Grab the Max Revive"
              text: "Near where you arrive on 3F, on the east side, a ball holds a Max Revive, which fully restores a fainted Pokémon."
              items:
                max-revive: "3F, east side, close to the ladders up."
            "14":
              title: "Bag TM47 Explosion"
              text: "Work the boulders west across 3F to reach the far ball, TM47 Explosion, the game's strongest one-shot Normal move."
              items:
                tm-explosion: "3F, far west."
            "15":
              title: "Leave for Indigo Plateau"
              text_html: "With every prize collected and Moltres caught, drop back down ladder %{down} to 2F and step out the east exit %{out}, onto the approach to the Indigo Plateau."
          tips:
            moltres: "The Fire legendary of Victory Road. A one-time Lv 50. Save first, then chip and ball it."
          oak:
            moltres: "The Fire bird roosting in Victory Road. One shot only. Catch it on the way through."
        route_23:
          note: "Badge checkpoints to the League. High-level grass."
          intro: "The badge-gated approach to the League, a line of checkpoints where each guard asks for another badge. Its wild Pokémon are the strongest outside Cerulean Cave."
          steps:
            "1":
              title: "Enter from the Route 22 gate"
              text_html: "Step in from the south %{gate}, out of the Route 22 gate. Seven guard posts line the road, and each opens only for its matching badge, so you need all 8. The grass runs Lv 33-45."
            "2":
              title: "Search the mid-channel ledge"
              text: "Past the lower guards the road opens into a wide channel. Surf north to the small dry ledge between the two Swimmers, and press A facing north for a hidden Max Ether."
              hidden:
                max-ether: "On the little dry ledge in the middle of the water, between the two Swimmers. Press A facing north. Nothing shows on-screen."
            "3":
              title: "Sweep the northeast corner"
              text: "Surf out onto the north bank and cut east through the grass into the corner pocket. Walk to the far wall and press A against the east edge for a hidden Ultra Ball. Nothing shows on-screen."
              hidden:
                ultra-ball: "Far northeast corner of the grassy pocket just past the water, tight against the east wall. Press A facing east. Nothing shows on-screen."
            "4":
              title: "Comb the top clearing"
              text: "Wind up through the land maze to the grassy clearing near the north end. Stand in the grass and press A against the rock face to the west to dig out a hidden Full Restore. Nothing shows on-screen."
              hidden:
                full-restore: "In the grass near the top of the route, one square east of the rock wall. Press A facing west. Nothing shows on-screen."
            "5":
              title: "Enter Victory Road"
              text_html: "Follow the west side up past the last guard and step through the gate at the top %{victory} into Victory Road, the final cave before the Pokémon League."
        indigo_plateau:
          note: "The Pokémon League. Elite Four and Champion Blue."
          intro: "The League building: five rooms in a row, the Elite Four and then the Champion. Once the first door shuts there is no way back and nothing to heal with."
          steps:
            "1":
              title: "Stock up"
              text: "Heal and buy Full Restores, status heals and Ultra Balls in the lobby before you enter."
            "2":
              title: "Beat the Elite Four"
              text: "Lorelei (Ice/Water), Bruno (Fighting/Rock), Agatha (Ghost/Poison) and Lance (Dragon), back to back with no healing between. Hit each with its weakness and bring plenty of Full Restores."
            "3":
              title: "Beat Champion Blue"
              text: "Your rival leads with Sandslash (Lv 61) and fields Alakazam, Exeggutor, a Magneton or Cloyster, Ninetales, and the Eeveelution his Eevee became (Lv 65). Alakazam carries Recover, so break it with physical moves. Win to enter the Hall of Fame."
        cerulean_cave:
          note: "Post-game dungeon. The strongest wilds. And Mewtwo."
          intro: "The cave the guard only opens for a Champion. Three floors of the strongest wild Pokémon in Kanto, with Mewtwo alone at the bottom."
          steps:
            "1":
              title: "Surf into the cave"
              text: "After the Hall of Fame, Surf northwest from Cerulean City into the cave mouth. You land in 1F's flooded southern chamber, among Kanto's toughest wilds at Lv 45-65."
            "2":
              title: "Surf to the flooded corner"
              text: "From the entrance pool, Surf east to the far corner and grab the Rare Candy sitting alone on the water at the cave's southeast edge."
              items:
                rare-candy-29-16: "Southeast corner of 1F, out on the water past the entrance pool. Surf to reach it."
            "3":
              title: "Climb the east ledge"
              text: "Follow the east wall north out of the water onto the ledge and pick up the Max Revive at the right edge of 1F."
              items:
                max-revive-29-9: "Right (east) edge of 1F, on the ledge just north of the flooded corner."
            "4":
              title: "Feel around the center stair"
              text: "Work into the middle of 1F, to the up-staircase in the central chamber. Press A on the ground two squares north of that staircase for a hidden PP Up. Nothing shows on-screen."
              hidden:
                pp-up-18-7: "Center of 1F, two squares north of the central up-staircase. Press A; nothing shows on-screen."
            "5":
              title: "Reach the north shelf"
              text: "Head up from the center to the top of 1F and grab the Ultra Ball tucked against the north wall near the middle."
              items:
                ultra-ball-18-3: "Top-center of 1F, against the north wall."
            "6":
              title: "Sweep the west side"
              text: "Cross to the left side of 1F and collect the Max Elixir in the west-central chamber, by the lower staircases."
              items:
                max-elixir-7-11: "West-center of 1F, near the lower-left staircases."
            "7":
              title: "Climb to 2F"
              text_html: "Take the far-west staircase, ladder %{up}, up to 2F: a dry rock maze with no water at all. You arrive against its west wall, beside the first prize."
            "8":
              title: "Push to the far-west wall"
              text: "Follow the corridors out to the far-left edge of 2F and grab the Rare Candy pressed against the west wall."
              items:
                rare-candy-0-11: "Far-left (west) edge of 2F, mid-height, against the wall."
            "9":
              title: "Take the central ball"
              text: "Head back to the middle of 2F and pick up the Ultra Ball sitting in the central corridor."
              items:
                ultra-ball-16-7: "Center of 2F, in the middle corridor."
            "10":
              title: "Search straight below"
              text: "Drop south down the same column as the central Ultra Ball into the lower maze and press A on the ground for a hidden PP Up. Nothing shows on-screen."
              hidden:
                pp-up-16-13: "Center-south of 2F, straight down from the central Ultra Ball. Press A; nothing shows on-screen."
            "11":
              title: "Grab the mid ledge"
              text: "Just east of the hidden spot, collect the Max Revive in the lower-center of 2F."
              items:
                max-revive-19-11: "Lower-center of 2F, just east of the hidden PP Up."
            "12":
              title: "Clear the east chamber"
              text: "Wind to the right side of 2F and take the Full Restore near the east wall."
              items:
                full-restore: "Right (east) side of 2F, near the east wall."
            "13":
              title: "Drop to B1F"
              text_html: "Come back down ladder %{down} to 1F, then cross to the far-left staircase on the west edge, ladder %{lower}. It drops to B1F, the bottom floor, where you arrive on the west side."
            "14":
              title: "Sweep the southwest nook"
              text: "From the arrival point, head down to the southwest and grab the Ultra Ball at the left edge, just above the bottom water."
              items:
                ultra-ball-2-13: "Southwest of B1F, at the left edge just above the bottom water."
            "15":
              title: "Grab its neighbor"
              text: "One square east of that Ultra Ball sits a Max Revive. Scoop it up too."
              items:
                max-revive-3-13: "Southwest of B1F, one square east of the Ultra Ball."
            "16":
              title: "Probe the south shore"
              text: "A little east along the bottom of B1F, press A on the ground at the water's edge for a hidden PP Up. Nothing shows on-screen."
              hidden:
                pp-up-8-14: "South edge of B1F, a few squares east of the Max Revive, at the water's edge. Press A; nothing shows on-screen."
            "17":
              title: "Reach the north-center"
              text: "Head up and across the middle of B1F to the north-center and take the Max Elixir there, near the top wall."
              items:
                max-elixir-15-3: "North-center of B1F, near the top wall."
            "18":
              title: "Corner the northeast ball"
              text: "Continue to the top-right corner of B1F and grab the last Ultra Ball against the north wall."
              items:
                ultra-ball-26-1: "Top-right (northeast) corner of B1F, against the north wall."
            "19":
              title: "Save before Mewtwo"
              text: "Work down to the southeast landmass and Surf across the water toward Mewtwo's platform. Before you step onto it, save your game: you get a single shot at this Lv 70 legend."
            "20":
              title: "Catch Mewtwo"
              text: "Mewtwo stands at the heart of the southeast island. It is Lv 70 and spams Recover, so sleep or paralyze it, chip it low, then throw the Master Ball."
          tips:
            mewtwo: "The strongest Pokémon in the game, a Lv 70 static. The Master Ball is made for this. Or sleep it and pray."
            lickitung: "The bottom floor is the only place in the game with a wild Lickitung. Miss it here and the dex slot stays empty."
          oak:
            mewtwo: "The post-game legendary at the bottom of the cave. Save the Master Ball for it."
            chansey: "Far more common here than the Safari. A great EXP catch while you're deep in the cave."
